# 로컬 개발 인프라: PostgreSQL(논리 복제) + Kafka(KRaft) + Kafka Connect(Debezium) + Redis + Zipkin
# 실행: docker compose -f deploy/local/docker-compose.yml up -d
# 커넥터 등록: connector-registrar 컨테이너가 자동으로(서비스 첫 기동 후 10초 내). 설정 갱신은 register-connector.sh <service-name> <db-name>
# 비밀정보는 로컬 개발 전용 고정값. 운영에서는 Secret Manager.
# 예외: s3(SeaweedFS) 자격 증명은 고정값 없이 deploy/local/.env(Git 제외)의 S3_ACCESS_KEY/S3_SECRET_KEY 가 필요하다(README 참조).
name: pmart-local

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=20", "-c", "max_replication_slots=20"]
    environment:
      POSTGRES_USER: pmart
      POSTGRES_PASSWORD: pmart-local
      POSTGRES_DB: pmart
    # 호스트 포트 15432: 개발 PC에 설치된 PostgreSQL(5432)과 충돌 방지. 컨테이너 내부·Debezium 은 postgres:5432 그대로.
    ports: ["15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmart"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: pmart-local-cluster-0000000001
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  connect:
    image: quay.io/debezium/connect:3.7
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: pmart-connect
      CONFIG_STORAGE_TOPIC: _connect.configs
      OFFSET_STORAGE_TOPIC: _connect.offsets
      STATUS_STORAGE_TOPIC: _connect.status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  connector-registrar:
    # Outbox 커넥터 자동 등록: 서비스가 처음 기동해 publication pmart_outbox 가 생기면 커넥터를 만든다(connector-registrar.sh).
    image: postgres:17-alpine
    depends_on:
      connect: { condition: service_healthy }
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/registrar/connector-registrar.sh"]
    environment:
      CONNECT_URL: http://connect:8083
      DB_HOST: postgres
      DB_USER: pmart
      DB_PASSWORD: pmart-local
      INTERVAL: "10"
    volumes:
      - ./connector-registrar.sh:/registrar/connector-registrar.sh:ro
      - ./connectors:/connectors:ro
    restart: unless-stopped

  redis:
    # delivery-tracking-service(라이더 위치 최신값 캐시) 용. 원장 용도 금지(service-architecture.md).
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  zipkin:
    image: openzipkin/zipkin:3
    ports: ["9411:9411"]

  s3:
    # 상품 이미지 저장소(S3 호환, ADR-0016). 수집 저장소(code-and-pick/product-data)와 같은 이미지·mini 모드.
    # 자격 증명은 postgres(pmart-local)처럼 로컬 전용 고정값이 기본이고 S3_ACCESS_KEY/S3_SECRET_KEY 로 바꿀 수 있다. 시작 시 파일로 쓴다.
    # LAN·운영 값은 .secrets/ 에서만 받는다(ADR-0016).
    # 호스트에서 bootRun 하는 서비스용으로 127.0.0.1:8333 만 연다. 버킷은 비공개(product-content-service 가 대신 읽어 준다).
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pmart-local-s3}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-pmart-local-s3-secret}
    entrypoint:
      - sh
      - -c
      - >-
        umask 077 &&
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        chown seaweed /tmp/s3.json &&
        exec /entrypoint.sh mini -dir=/data -s3.config=/tmp/s3.json -admin.ui=false
        -s3.port.iceberg=0 -s3.port.lance=0 -bucket=pmart-product-content,pmart-customer,pmart-delivery-evidence,pmart-review
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    # 상품 검색 색인(search-service 는 조회만, ADR-0031). 단일 노드·보안 끔(로컬 전용). nori 는 시작 때 없으면 설치(인터넷 필요).
    # 색인은 es-init 이 만들고 Logstash 가 채운다(자동 생성 금지 — 매핑 없는 색인 방지). 호스트 bootRun 용으로 127.0.0.1:9200 만 연다.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    command: ["sh", "-c", "bin/elasticsearch-plugin list | grep -q analysis-nori || bin/elasticsearch-plugin install --batch analysis-nori; exec /usr/local/bin/docker-entrypoint.sh eswrapper"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      action.auto_create_index: "+pmart-logs-*,+.*,-*"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:9200:9200"]
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:9200/"]
      interval: 5s
      timeout: 3s
      retries: 120

  es-init:
    # 검색 색인(products-v5·sku-prices-v1)을 search-service 의 정의 파일로 만든다(LAN 과 같은 스크립트, Kibana 단계는 건너뜀)
    # 별칭은 없을 때만 붙인다. 이전 esdata 볼륨이 남아 있으면 products 별칭이 옛 색인(v2·v3)을 가리킨 채로 남는다 —
    # v2 면 새 Logstash 설정(filters·saleStateRowVersion)의 쓰기가 strict 매핑에 막히고, v3 면 띄어쓰기 필드(name.compact)가 없다
    # → 볼륨을 지우고 새로 띄운다
    # (docker compose -f deploy/local/docker-compose.yml down -v 는 다른 볼륨도 지운다 — esdata 만: docker volume rm <프로젝트>_esdata)
    image: curlimages/curl:8.14.1
    restart: "no"
    entrypoint: ["sh", "/init/es-init.sh"]
    environment:
      PMART_KIBANA_WAIT: "0"
      PMART_KIBANA_URL: http://kibana-absent:1
    volumes:
      - ../lan/elastic/es-init.sh:/init/es-init.sh:ro
      - ../../services/search-service/src/main/resources/elasticsearch:/init/indices:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  logstash:
    # 상품 검색 색인 파이프라인만(search-service 소유 search-index.conf). 콘텐츠 카드는 호스트의 product-content-service(bootRun 8102)
    image: docker.elastic.co/logstash/logstash:8.18.0
    command: ["logstash", "-f", "/usr/share/logstash/pipeline/search-index.conf", "--pipeline.workers", "1", "--pipeline.batch.size", "1"]
    environment:
      PMART_KAFKA_BOOTSTRAP: kafka:19092
      PMART_ES_URL: http://elasticsearch:9200
      PMART_CONTENT_BASE_URL: http://host.docker.internal:8102
      XPACK_MONITORING_ENABLED: "false"
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ../../services/search-service/src/main/logstash/search-index.conf:/usr/share/logstash/pipeline/search-index.conf:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      kafka: { condition: service_healthy }
      es-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  kafkadata:
  s3data:
  esdata:
