# PMart 직원 로그인 화면(2026-11-15 사용자 "a안으로 해줘") — Keycloak 기본 로그인 테마(keycloak.v2)를 그대로 쓰고 스크립트 하나만 더한다.
# 아이디에 @ 가 없으면 제출할 때 @pmart.com 을 붙인다(인사 등록 계정은 username = 사내 메일, ADR-0056 결정 7).
parent=keycloak.v2
import=common/keycloak
scripts=js/pmart-username.js
# 겉모습(2026-11-21 사용자 "키클록 UI 바꾸자" → CSS 로 브랜드, 백오피스 웹과 맞추기). 부모(keycloak.v2)의 css/styles.css 를 그대로 읽고 그 뒤에 pmart.css 로 덮는다.
styles=css/styles.css css/pmart.css
