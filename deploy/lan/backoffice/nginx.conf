# 백오피스(React SPA, pmart-clients web/backoffice) · 인사팀 백오피스(web/hr-backoffice) 정적 서빙 — PC 4. 두 앱이 이 설정을 같이 쓴다.
# 포트: 백오피스 80(HTTP)·443(HTTPS), 인사팀 8081(HTTP)·8444(HTTPS) — compose 가 호스트 포트를 나눈다. HTTP 는 클라이언트가 HTTPS 로
# 옮길 때까지 둘 다(ADR-0057 T3). 인증서 = 이 PC 서버 인증서(LAN 사설 CA, ./tls — render.sh).
# API 는 브라우저가 게이트웨이(http://…:8080·https://…:8443)를 직접 부른다(게이트웨이 CORS 허용 출처).
#
# 보안 헤더(2026-11-13): CSP 는 같은 출처 스크립트·스타일만(인라인 스크립트·eval·인라인 스타일 없음 — 빌드 확인), API·이미지는 게이트웨이,
# 다른 사이트가 틀(frame)에 넣지 못하게. nginx 는 location 에 add_header 가 있으면 server 의 것을 물려받지 않아 location 마다 둔다.
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;

    ssl_certificate     /etc/pmart-tls/cert.pem;
    ssl_certificate_key /etc/pmart-tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 해시가 붙은 빌드 산출물은 내용이 바뀌면 이름이 바뀐다 → 길게 캐시
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 그 밖(라우터 경로 포함)은 index.html — 새 배포가 바로 보이도록 캐시하지 않는다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: http://192.168.0.40:8080 https://192.168.0.40:8443 http://d603-16:8080 https://d603-16:8443; font-src 'self' data:; connect-src 'self' http://192.168.0.40:8080 https://192.168.0.40:8443 http://d603-16:8080 https://d603-16:8443; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
