# 임시 백오피스(React SPA, pmart-clients/web/backoffice `npm run build:lan`) 정적 서빙 — PC4(D603-16) 80.
# API 는 브라우저가 게이트웨이(http://D603-16:8080/api/v1)를 직접 부른다(게이트웨이 CORS 허용 출처 http://d603-16).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 해시가 붙은 빌드 산출물은 내용이 바뀌면 이름이 바뀐다 → 길게 캐시
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 그 밖(라우터 경로 포함)은 index.html — 새 배포가 바로 보이도록 캐시하지 않는다
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
