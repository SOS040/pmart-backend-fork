# 로그 파이프라인(ADR-0031): Filebeat(5044) → Elasticsearch pmart-logs-YYYY.MM.DD(UTC 날짜).
# 거르기·초당 상한은 Filebeat 에서(앱 JSON 로그만, 500건/초). 보존: ILM 3일 + log-janitor(색인 1GB·전체 4GB)
input {
  beats { port => 5044 }
}
filter {
  mutate { remove_field => ["agent", "ecs", "input", "event"] }
}
output {
  elasticsearch {
    hosts => ["${PMART_ES_URL}"]
    index => "pmart-logs-%{+YYYY.MM.dd}"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
