# Prometheus 알림 규칙 (ADR-0030). render.sh 가 build/<pc>/monitoring/ 으로 복사한다.
# 전송 채널은 아직 없다(Alertmanager·Grafana 화면에서 본다). 라벨 job = 서비스 이름.
groups:
  - name: pmart-apps
    rules:
      - alert: AppDown
        expr: up{job!="prometheus"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} 응답 없음 ({{ $labels.instance }})"
          description: "2분 넘게 /actuator/prometheus 를 읽지 못했다. lan.sh status / logs 로 확인."

      - alert: Http5xxRateHigh
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5..", uri!~"/actuator.*"}[5m]))
            / clamp_min(sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])), 0.001) > 0.05
          and sum by (job) (rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} 5xx 비율 {{ $value | humanizePercentage }}"

  - name: pmart-messaging
    rules:
      - alert: DeadLetterOpen
        # 재시도를 다 쓰고 처리하지 못한 메시지가 남아 있다(서비스 DB dead_letter, 상태 OPEN)
        expr: max by (job, topic) (pmart_messaging_dead_letters_open) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} 미처리 메시지 {{ $value }}건 ({{ $labels.topic }})"
          description: "GET /api/v1/internal/dead-letters?status=OPEN 으로 원인 확인 → 고친 뒤 재처리(POST …/replays) 또는 사유와 함께 폐기."

      - alert: ConsumerLagHigh
        expr: max by (job, client_id, topic) (kafka_consumer_fetch_manager_records_lag_max) > 500
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.job }} 소비 지연 {{ $value }}건 ({{ $labels.topic }})"

  - name: pmart-host
    rules:
      # Elasticsearch(검색·로그, ADR-0031) — es-exporter. 검색 색인 신선도는 search-service GET /api/v1/internal/index-status
      # exporter v1.10.0 에는 elasticsearch_cluster_health_up 이 없다. ES 가 멈추면 cluster_health_status 가 사라지고
      # scrape_success 가 0 이 된다(clusterinfo_up 은 1 로 남는다 — 2026-11-03 재현). exporter 자체가 멈추면 AppDown 이 잡는다
      - alert: ElasticsearchUnreachable
        expr: absent(elasticsearch_cluster_health_status{color=~"green|yellow"} == 1) or elasticsearch_scrape_success == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Elasticsearch 응답 없음 ({{ $labels.instance }})"
          description: "상품 검색·로그 수집이 멈춘다. lan.sh logs pc4 elasticsearch."
      - alert: ElasticsearchClusterRed
        expr: elasticsearch_cluster_health_status{color="red"} == 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Elasticsearch 클러스터 RED"
          description: "주 샤드가 없는 색인이 있다(검색 결과 누락). 단일 노드라 YELLOW 는 정상(복제본 없음)."
      - alert: ElasticsearchHeapHigh
        expr: |
          elasticsearch_jvm_memory_used_bytes{area="heap"} / elasticsearch_jvm_memory_max_bytes{area="heap"} > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Elasticsearch 힙 {{ $value | humanizePercentage }}"
          description: "로그 색인이 커졌는지(log-janitor 상한) 확인."

      # Kafka 이벤트 이력 토픽(ADR-0034 — commerce.product.v1·commerce.pricing.v1 두 개만 무제한 보관). 지표는 watch.sh(PC 1)가
      # Kafka PC 의 host-disk textfile 로 낸다. 크기는 커지는 게 정상이라 고정 크기 경보는 두지 않고, 풀림·삭제·급증·멈춤만 본다
      - alert: KafkaEventRetentionNotUnlimited
        expr: pmart_kafka_topic_retention_unlimited == 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.topic }} 무제한 보관이 풀렸다"
          description: "Kafka 를 새로 만들었거나 설정이 바뀌었다. lan.sh deploy <Kafka PC> 가 topics-init 을 다시 적용한다. 두면 7일 뒤 이력이 지워져 전체 재생 재색인이 불가능해진다."
      - alert: KafkaEventHistoryTruncated
        expr: pmart_kafka_topic_start_offset > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.topic }} 앞 사건이 지워졌다(시작 오프셋 {{ $value }})"
          description: "이력만으로 검색 색인을 다시 만들 수 없다. deploy/lan/kafka/README.md 의 백업·복원 절차를 본다."
      - alert: SearchIndexDeadLetter
        # 검색 색인 파이프라인이 재시도 뒤에도 처리하지 못한 사건을 search-index.DLT 에 남겼다(콘텐츠 카드 보강 실패 등, 2026-11-04)
        expr: delta(pmart_kafka_topic_end_offset{topic="search-index.DLT"}[30m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "검색 색인 미처리 사건 {{ $value }}건(search-index.DLT)"
          description: "해당 상품은 검색에 이름·이미지가 빠졌을 수 있다. DLT 레코드의 pmartDeadLetter(topic·partition·offset·tags)로 원인 확인 → 고친 뒤 deploy/lan/elastic/REINDEX.md '부분 재처리'."
      # 검색 색인 파이프라인(Logstash) 감시(2026-11-04). 지표는 watch.sh(PC 1, 5분마다)가 만들어 Kafka PC host-disk 가 내보낸다:
      #   소비 지연 = kafka_topics.prom(topic-metrics.sh), Logstash·마지막 반영 시각 = search_index.prom(elastic/search-index-metrics.py)
      - alert: SearchIndexStalled
        # 사건이 쌓였는데(지연 > 0) 색인에 15분 넘게 아무것도 반영되지 않았다. 조용해서 반영이 없는 것(지연 0)과 구분된다
        expr: |
          sum(pmart_search_index_consumer_lag) > 0
          and on() (time() - max(pmart_search_index_last_applied_timestamp_seconds)) > 900
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "검색 색인이 멈췄다(소비 지연 {{ $value }}건, 15분 넘게 반영 없음)"
          description: "상품·가격·판매 상태 변경이 검색에 반영되지 않는다. lan.sh logs pc4 logstash, ES 상태, product-content 카드 API 확인."
      - alert: SearchIndexQueueBacklog
        # 영구 큐에 사건이 남아 있다 — Kafka 에서는 읽었지만 ES 에 쓰지 못하고 있다(오프셋은 이미 커밋돼 지연 지표로는 안 보인다)
        expr: pmart_logstash_queue_events{pipeline="search-index"} > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Logstash 영구 큐에 {{ $value }}건이 15분 넘게 남아 있다"
          description: "ES 쓰기 지연·거절 또는 콘텐츠 카드 API 응답 지연. lan.sh logs pc4 logstash 로 원인 확인."
      - alert: SearchIndexLogstashDown
        expr: pmart_logstash_up{pipeline="search-index"} == 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Logstash search-index 파이프라인 통계를 읽지 못한다"
          description: "Logstash 컨테이너가 멈췄거나 파이프라인이 뜨지 않았다(설정 오류면 lan.sh logs pc4 logstash 에 Expected one of …). 검색 색인이 갱신되지 않는다."
      - alert: SearchIndexRejectedByElasticsearch
        # ES 가 문서를 거절했다(예: strict 매핑에 없는 필드 — 새 색인 없이 Logstash 설정만 바꾼 경우). 거절된 문서는 Logstash DLQ 로 간다
        expr: |
          delta(pmart_logstash_dlq_bytes{pipeline="search-index"}[30m]) > 0
          or increase(pmart_logstash_es_failures_total{pipeline="search-index"}[30m]) > 0
          or pmart_logstash_dlq_dropped_events{pipeline="search-index"} > 0
        labels: { severity: warning }
        annotations:
          summary: "Elasticsearch 가 검색 색인 문서를 거절했다"
          description: "그 상품은 검색에 반영되지 않았다. lan.sh logs pc4 logstash 의 오류(매핑·필드)를 보고, 매핑 문제면 새 색인 + deploy/lan/elastic/REINDEX.md."
      - alert: SearchIndexMetricsStale
        expr: time() - pmart_search_index_metrics_timestamp_seconds > 1800 or absent(pmart_search_index_metrics_timestamp_seconds)
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "검색 색인 지표가 갱신되지 않는다"
          description: "PC 1 의 'PMart LAN Watch'(watch.sh)가 멈췄거나 python·pc4 접속 실패. ~/.pmart-lan-watch/watch.log 확인."
      - alert: KafkaEventBurst
        expr: delta(pmart_kafka_topic_end_offset[1h]) > 5000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.topic }} 1시간에 사건 {{ $value | humanize }}건"
          description: "상품 400개 대량 등록이 약 1,600건이다. 그보다 훨씬 많으면 발행 반복(재처리 폭주·버그)을 의심한다."
      - alert: KafkaEventTopicGrowthFast
        expr: delta(pmart_kafka_topic_size_bytes[24h]) > 200 * 1024 * 1024
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.topic }} 하루 {{ $value | humanize1024 }}B 증가"
          description: "예상은 상품 1만 개 기준 하루 수 MB. 무제한 보관이라 이 속도가 이어지면 Kafka PC 디스크를 압박한다."
      - alert: KafkaTopicMetricsStale
        expr: time() - pmart_kafka_topic_metrics_timestamp_seconds > 1800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Kafka 토픽 지표가 {{ $value | humanizeDuration }} 째 갱신되지 않는다"
          description: "PC 1 의 'PMart LAN Watch' 예약 작업(watch.sh)이 멈췄거나 Kafka PC 접속 실패. ~/.pmart-lan-watch/watch.log 확인."
      - alert: KafkaTopicMetricsMissing
        expr: absent(pmart_kafka_topic_metrics_timestamp_seconds)
        for: 2h
        labels: { severity: warning }
        annotations:
          summary: "Kafka 토픽 지표가 없다"
          description: "Kafka PC 의 host-disk 가 textfile 수집기 없이 떠 있거나(lan.sh deploy <Kafka PC> host-disk 필요) watch.sh 가 한 번도 쓰지 못했다."
      - alert: HostDiskFillPredicted
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="host-disk", mountpoint="/host/windows-c"}[6h], 7 * 86400) < 10 * 1024 * 1024 * 1024
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pc }} C: 가 지금 속도면 7일 안에 10GB 아래로"
          description: "Docker 가상디스크(docker_data.vhdx)는 안에서 지워도 줄지 않는다 — 정리 후에도 C: 가 안 늘면 vhdx 압축(Docker 정지 필요)."

      # Windows C: 실제 여유(host-disk = node-exporter, Docker Desktop 마운트). Docker 가상 디스크와 모든 컨테이너 데이터가 C: 에 있다.
      # Elasticsearch·컨테이너 안의 df 는 1TB 가상 디스크라 믿지 않는다(ADR-0030). 2026-10-25 pc3 디스크 고갈 재발 방지
      - alert: HostDiskLow
        expr: |
          node_filesystem_avail_bytes{job="host-disk", mountpoint="/host/windows-c"}
            / node_filesystem_size_bytes{job="host-disk", mountpoint="/host/windows-c"} < 0.15
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.pc }} C: 여유 {{ $value | humanizePercentage }}"
          description: "Docker 가상 디스크(docker_data.vhdx)는 안에서 지워도 줄지 않는다. 로그·볼륨 정리 후 필요하면 Docker 정지 뒤 vhdx 압축."
      - alert: HostDiskCritical
        expr: |
          node_filesystem_avail_bytes{job="host-disk", mountpoint="/host/windows-c"} < 10 * 1024 * 1024 * 1024
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.pc }} C: 여유 {{ $value | humanize1024 }}B — 곧 Docker 가 멈춘다"
