# PC 마다 하나: Docker 컨테이너 로그(json-file) → OpenSearch pmart-logs-YYYY.MM.DD (ADR-0030).
# 앱은 stdout 에 JSON 한 줄(logstash-logback-encoder: timestamp·level·message·serviceName·traceId …)을 낸다. 그 필드를 그대로 펼친다.
# 디스크 보호(2026-10-25 pc3 Connect 로그 142GB 사고 교훈 — docs/worklog/2026-10-27.md):
# - 앱 JSON 로그(serviceName 필드가 있는 것)만 보낸다. kafka·connect·opensearch·이 수집기 자신의 로그는 docker logs(20MB×3)로만 본다
#   → 장애 때 인프라 로그 폭주가 OpenSearch 로 들어가지 않고, OpenSearch 오류 로그가 다시 OpenSearch 로 가는 순환이 없다.
# - 초당 평균 500건(5초 창)을 넘으면 버린다(원본은 docker logs 에 남는다).
# - OpenSearch 가 멈추면 보내지 못한 로그를 디스크에 쌓되 500MB 를 넘으면 오래된 것부터 버린다. 재시도는 10회까지.
[SERVICE]
    Flush             5
    Log_Level         warn
    Parsers_File      parsers.conf
    storage.path      /fluent-bit/state/buffer
    HTTP_Server       Off

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Path_Key          log_file
    Parser            docker
    Tag               docker.*
    DB                /fluent-bit/state/tail.db
    Mem_Buf_Limit     32MB
    storage.type      filesystem
    Skip_Long_Lines   On
    Refresh_Interval  10
    Read_from_Head    Off

[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            app_json
    Reserve_Data      On

[FILTER]
    Name              grep
    Match             docker.*
    Regex             serviceName .+

[FILTER]
    Name              throttle
    Match             docker.*
    Rate              500
    Window            5
    Interval          1s

[FILTER]
    Name              modify
    Match             docker.*
    Add               pc ${PMART_PC}
    Rename            message msg

[OUTPUT]
    Name               opensearch
    Match              docker.*
    Host               ${PMART_OPENSEARCH_HOST}
    Port               9200
    Logstash_Format    On
    Logstash_Prefix    pmart-logs
    Logstash_DateFormat %Y.%m.%d
    Suppress_Type_Name On
    Replace_Dots       On
    Generate_ID        On
    Retry_Limit        10
    storage.total_limit_size 500M
    Buffer_Size        2MB
    Trace_Error        Off
