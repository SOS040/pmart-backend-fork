# Roundcube 를 HTTPS 로(ADR-0057 — LAN 사설 CA). 이미지의 Apache(80)는 그대로 두고 443 을 더한다. LAN 에는 443 만 연다(8190:443).
LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
Listen 443
<VirtualHost *:443>
    # Roundcube 1.7 부터 공개 폴더는 public_html(이미지의 80 사이트 000-default.conf 와 같게)
    DocumentRoot /var/www/html/public_html
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/pmart-tls/cert.pem
    SSLCertificateKeyFile /etc/pmart-tls/key.pem
</VirtualHost>
