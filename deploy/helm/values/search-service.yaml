# 생성 파일(deploy/helm/gen-values.sh). 환경 공통 값은 common.yaml.
name: search-service
port: 8105
image:
  repository: docker.io/heeji4445/pmart-search-service
# 상품 검색(Elasticsearch 8.18 + nori, ADR-0031 — 색인은 Logstash). 클러스터 안에 둘지 관리형(Elastic Cloud)으로 쓸지는 플랫폼 결정 [팀 확인 필요].
env:
  PMART_SEARCH_ELASTICSEARCHURL: http://elasticsearch:9200
