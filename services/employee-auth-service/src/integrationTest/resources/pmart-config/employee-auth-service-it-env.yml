# 시험 전용: 환경 자리표시자 — 시험은 Testcontainers·각 시험 properties 가 덮는다
spring:
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP:localhost:9092}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
pmart:
  employee-auth:
    issuer: ${PMART_EMPLOYEE_AUTH_ISSUER:http://employee-auth-service:8511}
    signing:
      ephemeral: true
    apps:
      backoffice:
        return-uris: ['http://backoffice.test/auth/callback']
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
