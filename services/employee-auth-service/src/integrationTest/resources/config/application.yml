# 시험 전용(ADR-0029). 시험은 config-server 없이 돈다 — pmart-config 정본의 사본(pmart-config/)을 읽는다.
# 정본을 바꾸면 deploy/lan/config-copies.sh sync. DB 는 Testcontainers, Keycloak 은 컨테이너(EmployeeLoginIT).
spring:
  cloud:
    config:
      enabled: false
  config:
    import: "classpath:pmart-config/application.yml,classpath:pmart-config/employee-auth-service.yml,classpath:pmart-config/employee-auth-service-it-env.yml"
