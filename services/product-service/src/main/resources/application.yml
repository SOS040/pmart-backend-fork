spring:
  application:
    name: product-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  servlet:
    multipart:
      max-file-size: 300MB # seed-v1 묶음(이미지 포함). 이 서비스는 product.json 만 읽는다
      max-request-size: 300MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8101
pmart:
  messaging:
    domain: commerce
  web:
    # 구매 상한 검증은 상태를 바꾸지 않는 조회성 POST — 계약에 Idempotency-Key 가 없다(cart·order 가 헤더 없이 부른다)
    excluded-paths:
      - /api/v1/internal/purchase-limit-checks
  security:
    # 계약 security: [] 작업(비회원 둘러보기). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 두 경로 모두 GET 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/categories/tree
      - /api/v1/categories/*/filters
  product:
    # 구매 상한: 같은 기초상품 Σ 수량×구성 낱개 수 (Commerce 2장 [확정] 기본 10). 비우면 CONFIG_REQUIRED
    purchase-limit-units: 10
    # 전사 판매 상태를 바꿀 수 있는 운영자 역할(사용자 결정 2026-10-30). 판매중지는 PRODUCT 승인도 필요
    sale-state-change-role: MD
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
