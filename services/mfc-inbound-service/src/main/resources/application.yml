spring:
  application:
    name: mfc-inbound-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8306
pmart:
  messaging:
    domain: mfc
  security:
    # mfc-inventory 내부 ConfirmReceipt 호출용 서비스 신원 토큰(ADR-0011). secret 은 Secret Manager(PMART_SERVICE_CLIENT_SECRET)
    service-token:
      token-uri: ${PMART_SERVICE_TOKEN_URI:http://auth-service:8501/api/v1/internal/service-tokens}
      client-secret: ${PMART_SERVICE_CLIENT_SECRET}
  inbound:
    # 초기 보유 반입 전기 대상(INITIAL_STOCK 승인 → ConfirmReceipt)
    mfc-inventory-base-url: ${PMART_MFC_INVENTORY_BASE_URL:http://mfc-inventory-service:8301}
    # PENDING 반입 전기·재시도 주기
    post-interval: PT3S
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
