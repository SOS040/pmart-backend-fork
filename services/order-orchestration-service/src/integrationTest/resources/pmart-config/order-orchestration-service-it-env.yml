# 시험 전용: 옮기기 전 application.yml 의 환경 자리표시자(기본값 포함) 그대로 — 시험은 Testcontainers·각 시험 properties 가 덮는다
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
pmart:
  orchestration:
    mfc-inventory-base-url: ${PMART_MFC_INVENTORY_BASE_URL:http://mfc-inventory-service:8301}
    mfc-capacity-base-url: ${PMART_MFC_CAPACITY_BASE_URL:http://mfc-capacity-service:8303}
    delivery-capacity-base-url: ${PMART_DELIVERY_CAPACITY_BASE_URL:http://delivery-capacity-service:8402}
    payment-base-url: ${PMART_PAYMENT_BASE_URL:http://payment-service:8205}
    order-base-url: ${PMART_ORDER_BASE_URL:http://order-service:8201}
    mfc-fulfillment-base-url: ${PMART_MFC_FULFILLMENT_BASE_URL:http://mfc-fulfillment-service:8302}
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
