spring:
  # Config 서버(ADR-0027): 기본 꺼짐. LAN 은 SPRING_CLOUD_CONFIG_ENABLED=true·URI·fail-fast 를 환경변수로 켠다
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  application:
    name: order-orchestration-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8202
pmart:
  messaging:
    domain: order
  orchestration:
    mfc-inventory-base-url: ${PMART_MFC_INVENTORY_BASE_URL:http://mfc-inventory-service:8301}
    mfc-capacity-base-url: ${PMART_MFC_CAPACITY_BASE_URL:http://mfc-capacity-service:8303}
    delivery-capacity-base-url: ${PMART_DELIVERY_CAPACITY_BASE_URL:http://delivery-capacity-service:8402}
    payment-base-url: ${PMART_PAYMENT_BASE_URL:http://payment-service:8205}
    order-base-url: ${PMART_ORDER_BASE_URL:http://order-service:8201} # 주문 확정(S1 h)
    mfc-fulfillment-base-url: ${PMART_MFC_FULFILLMENT_BASE_URL:http://mfc-fulfillment-service:8302} # 작업 중지(S3 a)
    stuck-after: PT30S # RUNNING·COMPENSATING 이 이만큼 멈추면 sweep 이 같은 키로 이어서 진행
    sweep-interval: PT10S
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
