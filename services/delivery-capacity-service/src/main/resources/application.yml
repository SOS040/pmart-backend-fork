spring:
  application:
    name: delivery-capacity-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8402
pmart:
  messaging:
    domain: delivery
  security:
    # 비회원 토큰(typ=GUEST)도 슬롯 조회는 된다(읽기 전용, 비회원 장바구니·배송 안내)
    guest-paths:
      - /api/v1/slots
  capacity:
    # 1시간 슬롯당 정원(승인 정책값 — 운영 입력). 비우면 슬롯은 CONFIG_REQUIRED. LAN 시험값은 env PMART_CAPACITY_SLOTCAPACITY
    slot-capacity: ${PMART_CAPACITY_SLOTCAPACITY:}
    center-master-base-url: ${PMART_CENTER_MASTER_BASE_URL:http://center-master-service:8507}
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
