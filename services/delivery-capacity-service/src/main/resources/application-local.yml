# 로컬 개발 프로파일 (deploy/local/docker-compose.yml). 로컬 컨테이너 전용 고정값이며 운영은 Secret Manager.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI:http://localhost:8501/api/v1/internal/jwks}
  datasource:
    url: jdbc:postgresql://localhost:15432/delivery_capacity_service
    username: pmart
    password: ${PMART_DB_PASSWORD:pmart-local}
  kafka:
    bootstrap-servers: localhost:9092
logging:
  level:
    com.pmart: DEBUG
