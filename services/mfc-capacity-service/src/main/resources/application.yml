spring:
  application:
    name: mfc-capacity-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8303
pmart:
  messaging:
    domain: mfc
  capacity:
    # (MFC, 1시간 창)당 수용 단위(정책값). 주문 1건 = 1 단위(시험 정책 2026-10-30). 비우면 Hold·스냅샷은 CONFIG_REQUIRED.
    # LAN 시험값 30 은 env PMART_CAPACITY_UNITSPERHOUR
    units-per-hour: ${PMART_CAPACITY_UNITSPERHOUR:}
    expiry-interval: ${PMART_CAPACITY_EXPIRYINTERVAL:PT30S} # TTL 지난 HELD 정리 주기
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
