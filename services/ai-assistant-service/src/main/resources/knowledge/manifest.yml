# ai-assistant-service 색인 대상 명시 목록 (ADR-0036). 여기에 없는 파일은 색인하지 않는다.
# 2026-11-20 사용자: 운영자용 RAG 는 docs/rag/rag-docs 아래 모든 문서(고객용 customer_app 포함)를 참고한다. README 는 색인하지 않는다.
#   옛 색인 문서 52개(업무 원문·상담 대본·흐름·상태표·ADR)는 목록에서 뺐다 — 그 문서들의 직원용 내용은 rag-docs 로 옮겨 정리했다
#   (결정된 내용만, 2026-11-20 "운영자용 RAG 문서 정비"). 정해지지 않은 내용은 rag-docs 에 넣지 않았으므로 지위는 모두 CONFIRMED 로 둔다.
# 새 문서를 rag-docs 에 더하면 여기에도 한 줄 넣는다 — RealDocumentsIngestTest 가 rag-docs 의 README 밖 .md 가 모두 목록에 있는지 본다.
