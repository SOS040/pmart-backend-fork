# 검색 기준선 평가 질문(ADR-0036). 실제 저장소 문서(knowledge/manifest.yml)를 해시 임베딩으로 색인하고 recall@5·MRR 을 잰다.
# expected: 정답 근거로 인정하는 문서 경로(앞부분 일치). 하나라도 상위 5 안에 있으면 적중 — "문서 경로 기준" 지표(retrieval-baseline.md).
# sections: 정답 절 [경로 앞부분, 절 제목 앞부분] — "절 기준" 지표(retrieval-section.md, 2026-11-05 추가).
#   정하는 규칙: 검색 결과를 보지 않고 원문을 읽어, 그 질문의 답을 직접 적은 절만 고른다. expected 문서 안에서만 고른다(문서를 넓히지 않는다).
#   절 제목은 청크 section 의 한 단계(" > " 로 나뉜 조각)가 이 값으로 시작하면 적중. 정책 문서는 맨 위 "# 제목" 이 절 경로에 들어가지 않고
#   "## 제N조 (…)" 가 첫 단계이므로 조 제목 앞부분을 괄호까지("제7조 (봉투값") 적는다 — "제1조" 만 쓰면 "제10조" 도 맞는다.
# 2026-11-15: 운영자 RAG 에서 기술 ADR 을 뺌(manifest 주석) — 그 ADR 만 정답이던 기술 질문(Q07·Q08·Q15·Q16·Q17·Q19·Q20)은 범위 밖이라 뺐다.
# 2026-11-20: 사용자 "운영자용 RAG 는 docs/rag/rag-docs 만" — manifest 가 docs/rag/rag-docs/**/[0-9]*.md(README 제외)만 색인하고
#   옛 문서(docs/business/*, ADR, flows, 상태 문서)는 더 이상 색인하지 않는다. 그래서 정답을 새 문서로 다시 맞췄다(검색 결과가 아니라 문서를 읽고 정함).
#   - 새 문서에도 답이 있는 질문은 id·질문을 그대로 두고 expected·sections 만 바꿨다(R1~R4, Q01~Q06, Q18, Q21~Q23).
#   - 답이 없어진 질문은 뺐다: R5(카테고리 단계 수 — 새 문서에 단계 수가 없음), Q09~Q11(서비스 소유·단일 작성자 — 기술 경계),
#     Q12~Q14(사가 타이머·사가 흐름·Transit 대사 — 기술 흐름). 그 자리에 직원이 실제로 물을 업무 질문 N01~N10 을 새로 넣었다.
#   - 문서끼리 다르게 적힌 곳(여기 적어 둠): Q04 자동 완료 — rider_app/03 제3조·delivery/04 제3조는 "픽업 뒤 5시간 지나면 자동 완료",
#     customer_app/09 제6조는 "시간이 지났다는 이유로 완료로 바뀌지 않음"(정답 절은 앞의 둘). Q06 주류 — order_claim/01 제12조는
#     "결제사 결제 인증으로 확인", customer_app/06 제8조는 "주류 구매 불가·성인 인증 절차 없음"(둘 다 정답 절).
# 이 결과는 "기준선(어휘 겹침)"일 뿐 의미 검색 품질이 아니다 — 실제 모델 평가 전까지 의미 검색·생성 품질은 미검증.
