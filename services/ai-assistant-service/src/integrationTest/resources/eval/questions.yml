# 검색 기준선 평가 질문(ADR-0036). 실제 저장소 문서(knowledge/manifest.yml)를 해시 임베딩으로 색인하고 recall@5·MRR 을 잰다.
# expected: 정답 근거로 인정하는 문서 경로(앞부분 일치). 하나라도 상위 5 안에 있으면 적중 — "문서 경로 기준" 지표(retrieval-baseline.md).
# sections: 정답 절 [경로 앞부분, 절 제목 앞부분] — "절 기준" 지표(retrieval-section.md, 2026-11-05 추가).
#   정하는 규칙: 검색 결과를 보지 않고 원문을 읽어, 그 질문의 답을 직접 적은 절만 고른다. expected 문서 안에서만 고른다(문서를 넓히지 않는다).
#   절 제목은 청크 section 의 한 단계(" > " 로 나뉜 조각)가 이 값으로 시작하면 적중. ADR 은 "결정" 절과 제목(ADR-NNNN) 청크.
#   일부러 뺀 것: Q04 Delivery 6.4(5시간 자동 완료 — domain-map 이 폐기한 옛 규칙), Q05 ADR-0002(누가 쓰는지만, 차감 시점 없음),
#   부록 C(1차 제외)·검증 시나리오·화면 명세(규칙 원문이 아님).
# 2026-11-15: 운영자 RAG 에서 기술 ADR 을 뺌(manifest 주석) — 그 ADR 만 정답이던 기술 질문(Q07·Q08·Q15·Q16·Q17·Q19·Q20)은 범위 밖이라 뺐고, R3(서비스 간 호출)은
#   업무 질문(상품준비 뒤 고객센터 취소, ADR-0060)으로 바꿨다. Q05·Q09·Q10·Q11 은 업무 문서 정답만 남김.
# 이 결과는 "기준선(어휘 겹침)"일 뿐 의미 검색 품질이 아니다 — 실제 모델 평가 전까지 의미 검색·생성 품질은 미검증.
