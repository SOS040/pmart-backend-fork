spring:
  application:
    name: payment-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8205
pmart:
  messaging:
    domain: order
  web:
    # 토스 웹훅은 PG 가 보내는 요청이라 Idempotency-Key·X-Source-System 이 없다(계약에도 없음). 중복은 본문 해시로 거른다
    excluded-paths:
      - /api/v1/webhooks/toss
  payment:
    reconcile-interval: PT15S # 불명 재조회·만료 정리 주기
    # 토스페이먼츠 결제위젯(결제 명세 §7). 키는 Secret Manager·환경변수로만. 비어 있으면 결제 시작은 CONFIG_REQUIRED
    toss:
      base-url: ${PMART_TOSS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${PMART_TOSS_SECRET_KEY:}
      client-key: ${PMART_TOSS_CLIENT_KEY:}
      allow-live-keys: ${PMART_TOSS_ALLOW_LIVE_KEYS:false} # 운영만 true. false 인데 live_ 키면 기동 거부
      connect-timeout: PT3S
      read-timeout: PT15S
      webhook-secret: ${PMART_TOSS_WEBHOOK_SECRET:} # 비면 웹훅을 모두 401(대사는 재조회 작업이 맡음)
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/webhooks/toss
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
