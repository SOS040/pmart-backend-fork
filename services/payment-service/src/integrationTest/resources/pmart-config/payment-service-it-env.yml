# 시험 전용: 옮기기 전 application.yml 의 환경 자리표시자(기본값 포함) 그대로 — 시험은 Testcontainers·각 시험 properties 가 덮는다
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
pmart:
  payment:
    toss:
      base-url: ${PMART_TOSS_BASE_URL:https://api.tosspayments.com}
      secret-key: ${PMART_TOSS_SECRET_KEY:}
      client-key: ${PMART_TOSS_CLIENT_KEY:}
      allow-live-keys: ${PMART_TOSS_ALLOW_LIVE_KEYS:false}
      webhook-secret: ${PMART_TOSS_WEBHOOK_SECRET:}
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
