# 시험 전용: 환경 자리표시자 — 시험은 Testcontainers(pgvector)·각 시험 properties 가 덮는다
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI:http://localhost:1/jwks}
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
