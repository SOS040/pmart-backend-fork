# customer-assistant-service 색인 대상 명시 목록(ADR-0051). 여기에 없는 파일은 색인하지 않는다.
# 2026-11-20 사용자: 고객용 RAG 는 docs/rag/rag-docs/customer_app 의 문서만 참고한다(README 제외 — README 는 작성 규칙이라 색인하지 않는다).
#   customer_app 문서는 사용자 승인(2026-11-20 "새 문서 기준으로 대답을 작성한다"). 업무 문서·ADR·운영자 문서는 넣지 않는다.
# domain customer-faq 문서(docs/business/customer-faq, 2026-11-09 승인판)는 고객앱 FAQ 목록 화면 전용 — AI 답변 근거(청크)로는 쓰지 않는다
#   (사용자 2026-11-20 "FAQ 는 옛 FAQ 문서에서", KnowledgeIngestor.buildChunks 가 건너뜀, FaqExtractor 만 읽음).
# 문서를 더하거나 고치면 사용자 승인 뒤 여기에 넣고 재색인(lan.sh rag-ingest-customer).
# 지위·우선순위 가중은 설정에서 0 — 승인된 고객 안내는 모두 같은 지위로 본다.
