spring:
  # Config 서버(ADR-0027): 기본 꺼짐. LAN 은 SPRING_CLOUD_CONFIG_ENABLED=true·URI·fail-fast 를 환경변수로 켠다
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  application:
    name: customer-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8103
pmart:
  messaging:
    domain: commerce
  customer:
    # 주소록 최대 건수(프로젝트 설계값, 운영 입력으로 바꾼다). 비우면 주소 추가는 CONFIG_REQUIRED.
    address-limit: 20
    serviceability-base-url: ${PMART_SERVICEABILITY_BASE_URL:http://delivery-serviceability-service:8401}
    # 로그인 제공자 프로필 사진의 우리 사본(ADR-0024). 기술 설정값(업무 정책 아님). 받는 곳은 허용 호스트의 https 만
    profile-image:
      allowed-host-suffixes: googleusercontent.com
      size-px: 256
      max-bytes: 1048576
  storage:
    # 프로필 사진 사본 저장소(S3 호환, ADR-0016·0024). 버킷을 비우면 사본 기능만 꺼진다. 자격 증명은 환경변수(LAN 은 config-server {cipher}, ADR-0027)로만.
    s3:
      endpoint: ${PMART_S3_ENDPOINT:}
      region: ${PMART_S3_REGION:us-east-1}
      bucket: ${PMART_S3_BUCKET:}
      access-key: ${PMART_S3_ACCESS_KEY:}
      secret-key: ${PMART_S3_SECRET_KEY:}
      path-style: ${PMART_S3_PATH_STYLE:true}
      create-bucket: ${PMART_S3_CREATE_BUCKET:false}
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/guest-delivery-addresses
      - /api/v1/guest-delivery-addresses/*
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
