# 로컬 개발 프로파일 (deploy/local/docker-compose.yml). 로컬 컨테이너 전용 고정값이며 운영은 Secret Manager.
spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/auth_service
    username: pmart
    password: ${PMART_DB_PASSWORD:pmart-local}
  kafka:
    bootstrap-servers: localhost:9092
logging:
  level:
    com.pmart: DEBUG
pmart:
  auth:
    issuer: http://localhost:8501
    signing:
      ephemeral: true # 로컬 전용 임시 키. 재시작하면 기존 토큰 무효
    # 로컬 전용 첫 관리자: admin / pmart-local (해시만 둔다. 첫 로그인 뒤 비밀번호 변경 표시가 켜져 있다)
    operator:
      bootstrap:
        login-id: admin
        display-name: 로컬 관리자
        password-hash: "{bcrypt}$2a$10$Qut13u4vwUA83/mKRLIfwOJFI5P5ZJWUVbSYxzWim244YpORIaYKG"
