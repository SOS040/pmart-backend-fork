spring:
  application:
    name: auth-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8501
pmart:
  messaging:
    domain: platform
  web:
    # OAuth 2.0 토큰 발급(RFC 6749)은 Idempotency-Key 가 없는 표준 프로토콜이고 상태를 바꾸지 않는다(계약에도 헤더 없음).
    excluded-paths:
      - /api/v1/internal/service-tokens
  security:
    # JWT 검증은 자기 서명키로(KeyConfig 의 JwtDecoder) — jwk-set-uri 를 두지 않는다.
    # 공개키·서비스 토큰 발급은 토큰 없이 접근(발급 엔드포인트는 Basic 클라이언트 인증). 둘 다 /internal 이라 게이트웨이로는 노출되지 않는다.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/internal/jwks
      - /api/v1/internal/service-tokens
      # 계약 security: [] 작업(로그인·토큰 발급). 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
      - /api/v1/auth/social-logins
      - /api/v1/auth/social-logins/*
      - /api/v1/auth/social-logins/*/completions
      - /api/v1/auth/tokens
  auth:
    issuer: ${PMART_AUTH_ISSUER:http://auth-service:8501}
    service-token:
      ttl: PT5M
    # signing.keys[n].kid / private-key, service-clients[n].client-id / secret-hash 는 Secret Manager 에서 환경변수로 주입한다
    # (PMART_AUTH_SIGNING_KEYS_0_KID, PMART_AUTH_SIGNING_KEYS_0_PRIVATEKEY, PMART_AUTH_SERVICECLIENTS_0_CLIENTID ...). 키가 없으면 기동 실패.
management:
  zipkin:
    tracing:
      endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
