spring:
  application:
    name: claim-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8204
pmart:
  messaging:
    domain: order
  claim:
    order-base-url: ${PMART_ORDER_BASE_URL:http://order-service:8201} # 주문 원장(심사·환불 근거)
    payment-base-url: ${PMART_PAYMENT_BASE_URL:http://payment-service:8205} # 환불 실행
    refund-retry-after: PT30S # 실행 대기·PG 결과 대기·불명 환불 재실행·원거래 조회
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
