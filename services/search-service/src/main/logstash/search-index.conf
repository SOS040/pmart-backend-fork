# 상품 검색 색인 파이프라인 (ADR-0031). search-service 소유 — 배포가 Logstash 의 pipeline/ 로 복사한다.
# 도메인 이벤트(commerce.product.v1·commerce.pricing.v1) → Elasticsearch products·sku-prices. 업무 DB 는 읽지 않는다(절대 규칙).
#
# 갱신 규칙(이전 search-service SearchIndexer 를 그대로 옮김, ADR-0021 결정 4~7):
# - 문서마다 버전·시각을 비교하는 Painless 스크립트 — 같은 사건 재전달·늦게 온 옛 사건은 아무것도 바꾸지 않는다(멱등·순서 안전)
# - ProductVersionPublished: 카테고리 조상 범위(p09-c01-l01 → p09, p09-c01, p09-c01-l01), 대표 SKU 가격이 먼저 와 있으면 붙인다
# - ProductContentPublished: 사건에 이름·이미지가 없어 product-content 공개 카드 API 로 보강(게시본만, 없으면 건너뜀)
# - ProductSaleStateChanged: 시각이 같거나 늦은 것만(TEMP_OUT→TEMPORARILY_SOLD_OUT, DISCONTINUED→SALE_STOPPED)
# - PriceVersionEffective: SKU 가격 문서 + 그 SKU 를 대표로 둔 상품(update_by_query)
# 순서: 이 파이프라인은 작업자 1·배치 1(pipelines.yml) — 사건 하나를 필터·출력까지 끝낸 뒤 다음 사건(가격·상품 경합 방지).
# 환경: PMART_KAFKA_BOOTSTRAP, PMART_ES_URL(http://elasticsearch:9200), PMART_CONTENT_BASE_URL(http://product-content-service:8102)

input {
  kafka {
    bootstrap_servers => "${PMART_KAFKA_BOOTSTRAP}"
    topics => ["commerce.product.v1", "commerce.pricing.v1"]
    group_id => "search-index-logstash"
    client_id => "search-index-logstash"
    auto_offset_reset => "earliest"
    isolation_level => "read_committed"
    consumer_threads => 1
    codec => json
  }
}

filter {
  ruby {
    code => '
      require "time"
      t = event.get("eventType")
      p = event.get("payload") || {}
      now = (Time.now.to_f * 1000).to_i
      ms = lambda do |k|
        v = p[k]
        v = event.get("occurredAt") if v.nil? || v.to_s.empty?
        v.nil? ? now : (Time.iso8601(v.to_s).to_f * 1000).to_i
      end
      case t
      when "ProductVersionPublished"
        cats = (p["categoryIds"] || []).compact.map(&:to_s).reject(&:empty?)
        scope = []
        cats.each do |id|
          parts = id.split("-")
          (1..parts.size).each { |n| s = parts[0, n].join("-"); scope << s unless scope.include?(s) }
        end
        first = (p["skus"] || [])[0]
        sku = first ? first["sku"] : nil
        event.set("p", { "productId" => p["productId"], "v" => p["version"].to_i, "categoryIds" => cats, "scope" => scope,
                         "primary" => p["primaryCategoryId"], "sku" => sku, "saleState" => (p["saleState"] || "ON_SALE"),
                         "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "product")
        event.set("[@metadata][id]", p["productId"].to_s)
        event.set("[@metadata][sku]", sku.to_s)
      when "ProductContentPublished"
        event.set("p", { "productId" => p["productId"], "cv" => p["contentVersion"].to_i, "atMs" => ms.call("publishedAt"), "now" => now })
        event.set("[@metadata][op]", "content")
        event.set("[@metadata][id]", p["productId"].to_s)
      when "ProductSaleStateChanged"
        st = { "TEMP_OUT" => "TEMPORARILY_SOLD_OUT", "DISCONTINUED" => "SALE_STOPPED" }.fetch(p["state"].to_s, "ON_SALE")
        event.set("p", { "productId" => p["productId"], "state" => st, "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "sale")
        event.set("[@metadata][id]", p["productId"].to_s)
      when "PriceVersionEffective"
        event.set("p", { "sku" => p["sku"], "price" => p["price"].to_i, "pv" => p["priceVersion"].to_i, "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "price")
        event.set("[@metadata][id]", p["sku"].to_s)
      else
        event.cancel  # 이 색인이 쓰지 않는 사건(SkuIssued·CategoryChanged 등)
      end
    '
  }

  # 상품: 대표 SKU 가격이 먼저 와 있으면 붙인다(_mget 은 실시간 — 방금 쓴 가격도 보인다. 없어도 200 이라 실패로 치지 않는다)
  if [@metadata][op] == "product" and [@metadata][sku] != "" {
    http {
      url => "${PMART_ES_URL}/sku-prices/_mget"
      verb => "POST"
      body_format => "json"
      body => { "ids" => ["%{[@metadata][sku]}"] }
      target_body => "[@metadata][skuDocs]"
      target_headers => "[@metadata][skuHeaders]"
    }
    ruby {
      code => '
        docs = event.get("[@metadata][skuDocs]")
        d = docs.is_a?(Hash) ? (docs["docs"] || [])[0] : nil
        if d.is_a?(Hash) && d["found"] && d["_source"]
          event.set("[p][price]", d["_source"]["price"].to_i)
          event.set("[p][pv]", d["_source"]["priceVersion"].to_i)
          event.set("[@metadata][hasPrice]", "true")
        end
      '
    }
  }

  # 콘텐츠: 공개 카드 API 로 이름·대표 이미지·콘텐츠 버전(게시본만)
  if [@metadata][op] == "content" {
    http {
      url => "${PMART_CONTENT_BASE_URL}/api/v1/product-contents?productIds=%{[@metadata][id]}"
      verb => "GET"
      target_body => "[@metadata][cards]"
      target_headers => "[@metadata][cardHeaders]"
    }
    ruby {
      code => '
        cards = event.get("[@metadata][cards]")
        id = event.get("[@metadata][id]")
        card = cards.is_a?(Hash) ? (cards["items"] || []).find { |c| c["productId"] == id && c["name"] } : nil
        if card.nil?
          event.tag("pmart_content_card_missing")
        else
          event.set("[p][name]", card["name"])
          img = card["mainImage"].is_a?(Hash) ? card["mainImage"]["url"] : nil
          event.set("[p][imageUrl]", img)
          event.set("[p][cv]", [card["contentVersion"].to_i, event.get("[p][cv]").to_i].max)
        end
      '
    }
  }

  # 가격: 방금 쓴 상품도 보이게 새로고침한 뒤, 이 SKU 를 대표로 둔 상품의 가격을 버전 비교로 갱신
  if [@metadata][op] == "price" {
    http {
      url => "${PMART_ES_URL}/products/_refresh"
      verb => "POST"
      target_body => "[@metadata][refresh]"
      target_headers => "[@metadata][refreshHeaders]"
    }
    http {
      url => "${PMART_ES_URL}/products/_update_by_query?refresh=true&conflicts=proceed"
      verb => "POST"
      body_format => "json"
      body => {
        "query" => { "term" => { "representativeSku" => "%{[p][sku]}" } }
        "script" => {
          "lang" => "painless"
          "source" => "def s = ctx._source; long pv = Long.parseLong(params.pv); if (s.priceVersion == null || pv > s.priceVersion) { s.basePrice = Long.parseLong(params.price); s.priceVersion = (int) pv; s.updatedAtMs = Long.parseLong(params.now); } else { ctx.op = 'noop'; }"
          "params" => { "price" => "%{[p][price]}" "pv" => "%{[p][pv]}" "now" => "%{[p][now]}" }
        }
      }
      target_body => "[@metadata][ubq]"
      target_headers => "[@metadata][ubqHeaders]"
    }
  }
}

output {
  if "_httprequestfailure" in [tags] or "pmart_content_card_missing" in [tags] {
    # 보강·연결 실패는 색인하지 않고 남긴다(재처리 = 소비 그룹 오프셋 되돌림 — 사건은 Kafka 에 남아 있다)
    stdout { codec => line { format => "search-index skip op=%{[@metadata][op]} id=%{[@metadata][id]} tags=%{tags}" } }
  } else if [@metadata][op] == "product" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "products"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.productVersion == null || p.v > s.productVersion) { s.productId = p.productId; s.productVersion = p.v; s.categoryIds = p.categoryIds; s.categoryScope = p.scope; s.primaryCategoryId = p.primary; s.representativeSku = p.sku; if (s.saleStateAtMs == null || p.atMs >= s.saleStateAtMs) { s.saleState = p.saleState; s.saleStateAtMs = p.atMs; } s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
    if [@metadata][hasPrice] == "true" {
      elasticsearch {
        hosts => ["${PMART_ES_URL}"]
        index => "products"
        action => "update"
        document_id => "%{[@metadata][id]}"
        scripted_upsert => true
        script_type => "inline"
        script_lang => "painless"
        script_var_name => "event"
        script => "def p = params.event.p; def s = ctx._source; if (s.priceVersion == null || p.pv > s.priceVersion) { s.basePrice = p.price; s.priceVersion = p.pv; s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
        manage_template => false
        ilm_enabled => false
        data_stream => false
      }
    }
  } else if [@metadata][op] == "content" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "products"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.contentVersion == null || p.cv > s.contentVersion) { s.productId = p.productId; s.contentVersion = p.cv; s.name = p.name; s.imageUrl = p.imageUrl; if (s.contentPublishedAtMs == null) { s.contentPublishedAtMs = p.atMs; } s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "sale" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "products"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.saleStateAtMs == null || p.atMs >= s.saleStateAtMs) { s.productId = p.productId; s.saleState = p.state; s.saleStateAtMs = p.atMs; s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "price" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "sku-prices"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.priceVersion == null || p.pv > s.priceVersion) { s.sku = p.sku; s.price = p.price; s.priceVersion = p.pv; s.effectiveAtMs = p.atMs; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  }
}
