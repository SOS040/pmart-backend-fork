# 상품 검색 색인 파이프라인 (ADR-0031). search-service 소유 — 배포가 Logstash 의 pipeline/ 로 복사한다.
# 도메인 이벤트(commerce.product.v1·commerce.pricing.v1·mfc.sku-handling.v1·commerce.sku-display-discount.v1) → Elasticsearch products·sku-prices·sku-handlings·sku-discounts.
# 업무 DB 는 읽지 않는다(절대 규칙).
#
# 갱신 규칙(이전 search-service SearchIndexer 를 그대로 옮김, ADR-0021 결정 4~7):
# - 문서마다 버전·시각을 비교하는 Painless 스크립트 — 같은 사건 재전달·늦게 온 옛 사건은 아무것도 바꾸지 않는다(멱등·순서 안전)
# - ProductVersionPublished: 카테고리 조상 범위(p09-c01-l01 → p09, p09-c01, p09-c01-l01), 대표 SKU 가격이 먼저 와 있으면 붙인다
# - ProductContentPublished: 사건에 이름·이미지가 없어 product-content 공개 카드 API 로 보강(게시본만). products-v8 부터 include=search 로
#   원산지 구분(originType)·원산지 글(originText)·설명(description)도 — 영양은 싣지 않는다(2026-11-22 사용자). 실패·카드 없음은 두 번 더
#   시도한 뒤 search-index.DLT 토픽으로(조용히 건너뛰지 않는다, 2026-11-04)
# - 판매 상태(PVP·ProductSaleStateChanged): 상품 행 버전(PVP rowVersion·PSSC version)이 큰 것만. 행 버전 없는 옛 사건은 아직 행 버전
#   기준 상태가 없을 때만 시각 비교(재생 호환, 2026-11-04 — 시계 차이로 판매중이 일시품절이 되던 버그). TEMP_OUT→TEMPORARILY_SOLD_OUT, DISCONTINUED→SALE_STOPPED
# - PriceVersionEffective: SKU 가격 문서 + 그 SKU 를 대표로 둔 상품(update_by_query)
# - SkuHandlingChanged(2026-11-05): SKU 취급 문서(센터별 버전 비교, 켠 센터 목록 carriedMfcIds) → 그 SKU 를 대표로 둔 상품의
#   carriedMfcIds(update_by_query). 상품 사건이 먼저 와도 SKU 취급 문서를 찾아 붙인다(가격과 같은 방식 — 재생 순서 무관)
# - 상품명 초성(nameChosung, 2026-11-05): 콘텐츠 카드의 이름에서 한글 음절마다 초성(ㄱ~ㅎ), 그 밖의 글자는 공백
# 순서: 이 파이프라인은 작업자 1·배치 1(pipelines.yml) — 사건 하나를 필터·출력까지 끝낸 뒤 다음 사건(가격·상품 경합 방지).
# 환경: PMART_KAFKA_BOOTSTRAP, PMART_ES_URL(LAN http://es-search:9200, ADR-0038), PMART_CONTENT_BASE_URL(http://product-content-service:8102)
#       PMART_SEARCH_GROUP_ID(기본 search-index-logstash)·PMART_SEARCH_PRODUCTS_INDEX(기본 별칭 products)·PMART_SEARCH_PRICES_INDEX(기본 sku-prices)
#       ·PMART_SEARCH_HANDLINGS_INDEX(기본 sku-handlings)
#       — 재색인 때 새 소비 그룹이 새 색인을 직접 채우게(deploy/lan/elastic/REINDEX.md)

input {
  kafka {
    bootstrap_servers => "${PMART_KAFKA_BOOTSTRAP}"
    topics => ["commerce.product.v1", "commerce.pricing.v1", "mfc.sku-handling.v1", "commerce.product-ranking.v1", "commerce.sku-display-discount.v1"]
    group_id => "${PMART_SEARCH_GROUP_ID:search-index-logstash}"
    client_id => "search-index-logstash"
    auto_offset_reset => "earliest"
    isolation_level => "read_committed"
    consumer_threads => 1
    codec => json
    decorate_events => "basic" # [@metadata][kafka][topic/partition/offset] — DLT 에 원래 위치를 남긴다
  }
}

filter {
  ruby {
    code => '
      require "time"
      require "json"
      t = event.get("eventType")
      p = event.get("payload") || {}
      now = (Time.now.to_f * 1000).to_i
      ms = lambda do |k|
        v = p[k]
        v = event.get("occurredAt") if v.nil? || v.to_s.empty?
        v.nil? ? now : (Time.iso8601(v.to_s).to_f * 1000).to_i
      end
      case t
      when "ProductVersionPublished"
        cats = (p["categoryIds"] || []).compact.map(&:to_s).reject(&:empty?)
        scope = []
        cats.each do |id|
          parts = id.split("-")
          (1..parts.size).each { |n| s = parts[0, n].join("-"); scope << s unless scope.include?(s) }
        end
        first = (p["skus"] || [])[0]
        sku = first ? first["sku"] : nil
        # 승인 속성 필터 "그룹id.옵션" (검색 filters 파라미터 형식, 2026-11-04). 옛 사건에는 없다 → 빈 목록
        filters = (p["filterOptions"] || []).map { |o| o["filterGroupId"].to_s + "." + o["option"].to_s }.uniq
        event.set("p", { "productId" => p["productId"], "v" => p["version"].to_i, "categoryIds" => cats, "scope" => scope,
                         "primary" => p["primaryCategoryId"], "sku" => sku, "saleState" => (p["saleState"] || "ON_SALE"),
                         "rv" => (p["rowVersion"].nil? ? nil : p["rowVersion"].to_i), "filters" => filters,
                         "carried" => [], "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "product")
        event.set("[@metadata][id]", p["productId"].to_s)
        event.set("[@metadata][sku]", sku.to_s)
      when "ProductContentPublished"
        event.set("p", { "productId" => p["productId"], "cv" => p["contentVersion"].to_i, "atMs" => ms.call("publishedAt"), "now" => now })
        event.set("[@metadata][op]", "content")
        event.set("[@metadata][id]", p["productId"].to_s)
      when "ProductSaleStateChanged"
        st = { "TEMP_OUT" => "TEMPORARILY_SOLD_OUT", "DISCONTINUED" => "SALE_STOPPED" }.fetch(p["state"].to_s, "ON_SALE")
        event.set("p", { "productId" => p["productId"], "state" => st,
                         "rv" => (p["version"].nil? ? nil : p["version"].to_i),
                         "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "sale")
        event.set("[@metadata][id]", p["productId"].to_s)
      when "ProductRankingSignalsChanged"
        # 순위 신호(2026-11-19 ADR-0072 — storefront 가 셈): 별점·리뷰 수·베이지안 점수·최근 판매. version 이 큰 것만
        event.set("p", { "productId" => p["productId"], "sv" => p["version"].to_i, "rc" => p["ratingCount"].to_i,
                         "ra" => p["ratingAverage"], "rs" => p["ratingScore"], "sales" => p["salesWindow"].to_i, "now" => now })
        event.set("[@metadata][op]", "ranking")
        event.set("[@metadata][id]", p["productId"].to_s)
      when "PriceVersionEffective"
        event.set("p", { "sku" => p["sku"], "price" => p["price"].to_i, "pv" => p["priceVersion"].to_i, "atMs" => ms.call("effectiveAt"), "now" => now })
        event.set("[@metadata][op]", "price")
        event.set("[@metadata][id]", p["sku"].to_s)
      when "SkuDisplayDiscountChanged"
        # 표시 할인(2026-11-21 ADR-0082 4단계): SKU 할인 문서만(상품 문서는 그대로 — 검색 서비스가 결과 대표 SKU 로 붙인다). seq 큰 것만
        ends = p["endsAt"]
        event.set("p", { "sku" => p["sku"], "seq" => p["seq"].to_i, "pv" => p["priceVersion"].to_i, "unit" => p["unitDiscount"].to_i,
                         "sale" => p["salePrice"].to_i, "rate" => p["ratePercent"].to_i, "name" => p["promotionName"],
                         "endsMs" => ((ends.nil? || ends.to_s.empty?) ? nil : (Time.iso8601(ends.to_s).to_f * 1000).to_i), "now" => now })
        event.set("[@metadata][op]", "discount")
        event.set("[@metadata][id]", p["sku"].to_s)
      when "SkuHandlingChanged"
        sku = p["sku"].to_s
        upd = { "scripted_upsert" => true, "upsert" => {},
                "script" => { "lang" => "painless",
                  "source" => "def s = ctx._source; if (s.centers == null) { s.centers = new HashMap(); } def c = s.centers.get(params.mfc); if (c == null || params.v > c.v) { s.sku = params.sku; s.centers.put(params.mfc, [\"e\": params.e, \"v\": params.v]); def l = new ArrayList(); for (def k : s.centers.keySet()) { if (s.centers.get(k).e == true) { l.add(k); } } Collections.sort(l); s.carriedMfcIds = l; s.updatedAtMs = params.now; } else { ctx.op = \"none\"; }",
                  "params" => { "sku" => sku, "mfc" => p["mfcId"].to_s, "e" => (p["handlingEnabled"] == true), "v" => p["version"].to_i, "now" => now } } }
        event.set("[@metadata][hupdate]", upd.to_json)
        event.set("[@metadata][op]", "handling")
        event.set("[@metadata][id]", sku)
        event.set("[@metadata][sku]", sku)
        event.set("[@metadata][now]", now.to_s)
      else
        event.cancel  # 이 색인이 쓰지 않는 사건(SkuIssued·CategoryChanged 등)
      end
    '
  }

  # 상품: 대표 SKU 가격이 먼저 와 있으면 붙인다(_mget 은 실시간 — 방금 쓴 가격도 보인다. 없어도 200 이라 실패로 치지 않는다)
  if [@metadata][op] == "product" and [@metadata][sku] != "" {
    http {
      url => "${PMART_ES_URL}/${PMART_SEARCH_PRICES_INDEX:sku-prices}/_mget"
      verb => "POST"
      body_format => "json"
      body => { "ids" => ["%{[@metadata][sku]}"] }
      target_body => "[@metadata][skuDocs]"
      target_headers => "[@metadata][skuHeaders]"
    }
    ruby {
      code => '
        docs = event.get("[@metadata][skuDocs]")
        d = docs.is_a?(Hash) ? (docs["docs"] || [])[0] : nil
        if d.is_a?(Hash) && d["found"] && d["_source"]
          event.set("[p][price]", d["_source"]["price"].to_i)
          event.set("[p][pv]", d["_source"]["priceVersion"].to_i)
          event.set("[@metadata][hasPrice]", "true")
        end
      '
    }
    # 대표 SKU 를 취급하는 센터 목록(SKU 취급 문서가 없으면 빈 목록 = 어느 센터도 켜지 않음)
    http {
      url => "${PMART_ES_URL}/${PMART_SEARCH_HANDLINGS_INDEX:sku-handlings}/_mget"
      verb => "POST"
      body_format => "json"
      body => { "ids" => ["%{[@metadata][sku]}"] }
      target_body => "[@metadata][handlingDocs]"
      target_headers => "[@metadata][handlingHeaders]"
    }
    ruby {
      code => '
        docs = event.get("[@metadata][handlingDocs]")
        d = docs.is_a?(Hash) ? (docs["docs"] || [])[0] : nil
        if d.is_a?(Hash) && d["found"] && d["_source"]
          event.set("[p][carried]", (d["_source"]["carriedMfcIds"] || []))
        end
      '
    }
  }

  # 콘텐츠: 공개 카드 API 로 이름·대표 이미지·콘텐츠 버전(게시본만). 실패·카드 없음이면 2초 간격으로 두 번 더 시도하고(게시 직후
  # 반영 지연·일시 장애), 그래도 안 되면 색인하지 않고 search-index.DLT 로 보낸다(아래 output) — 조용히 건너뛰지 않는다(2026-11-04)
  if [@metadata][op] == "content" {
    http {
      url => "${PMART_CONTENT_BASE_URL}/api/v1/product-contents?productIds=%{[@metadata][id]}&include=search"
      verb => "GET"
      automatic_retries => 2
      target_body => "[@metadata][cards]"
      target_headers => "[@metadata][cardHeaders]"
    }
    ruby {
      code => '
        cards = event.get("[@metadata][cards]")
        id = event.get("[@metadata][id]")
        card = cards.is_a?(Hash) ? (cards["items"] || []).find { |c| c["productId"] == id && c["name"] } : nil
        if card.nil?
          event.tag("pmart_content_card_missing")
        else
          event.set("[p][name]", card["name"])
          img = card["mainImage"].is_a?(Hash) ? card["mainImage"]["url"] : nil
          event.set("[p][imageUrl]", img)
          event.set("[p][cv]", [card["contentVersion"].to_i, event.get("[p][cv]").to_i].max)
          sf = card["search"].is_a?(Hash) ? card["search"] : {}
          event.set("[p][originType]", sf["originType"])
          event.set("[p][originText]", sf["originText"])
          event.set("[p][description]", sf["description"])
        end
      '
    }
    if "pmart_content_card_missing" in [tags] or "_httprequestfailure" in [tags] {
      sleep { time => "2" }
      mutate { remove_tag => ["pmart_content_card_missing", "_httprequestfailure"] add_field => { "[@metadata][retried]" => "true" } }
      http {
        url => "${PMART_CONTENT_BASE_URL}/api/v1/product-contents?productIds=%{[@metadata][id]}&include=search"
        verb => "GET"
        automatic_retries => 2
        target_body => "[@metadata][cards]"
        target_headers => "[@metadata][cardHeaders]"
      }
      ruby {
        code => '
          cards = event.get("[@metadata][cards]")
          id = event.get("[@metadata][id]")
          card = cards.is_a?(Hash) ? (cards["items"] || []).find { |c| c["productId"] == id && c["name"] } : nil
          if card.nil?
            event.tag("pmart_content_card_missing")
          else
            event.set("[p][name]", card["name"])
            img = card["mainImage"].is_a?(Hash) ? card["mainImage"]["url"] : nil
            event.set("[p][imageUrl]", img)
            event.set("[p][cv]", [card["contentVersion"].to_i, event.get("[p][cv]").to_i].max)
          sf = card["search"].is_a?(Hash) ? card["search"] : {}
          event.set("[p][originType]", sf["originType"])
          event.set("[p][originText]", sf["originText"])
          event.set("[p][description]", sf["description"])
          end
        '
      }
    }
    if "pmart_content_card_missing" in [tags] or "_httprequestfailure" in [tags] {
      sleep { time => "2" }
      mutate { remove_tag => ["pmart_content_card_missing", "_httprequestfailure"] add_field => { "[@metadata][retried]" => "true" } }
      http {
        url => "${PMART_CONTENT_BASE_URL}/api/v1/product-contents?productIds=%{[@metadata][id]}&include=search"
        verb => "GET"
        automatic_retries => 2
        target_body => "[@metadata][cards]"
        target_headers => "[@metadata][cardHeaders]"
      }
      ruby {
        code => '
          cards = event.get("[@metadata][cards]")
          id = event.get("[@metadata][id]")
          card = cards.is_a?(Hash) ? (cards["items"] || []).find { |c| c["productId"] == id && c["name"] } : nil
          if card.nil?
            event.tag("pmart_content_card_missing")
          else
            event.set("[p][name]", card["name"])
            img = card["mainImage"].is_a?(Hash) ? card["mainImage"]["url"] : nil
            event.set("[p][imageUrl]", img)
            event.set("[p][cv]", [card["contentVersion"].to_i, event.get("[p][cv]").to_i].max)
          sf = card["search"].is_a?(Hash) ? card["search"] : {}
          event.set("[p][originType]", sf["originType"])
          event.set("[p][originText]", sf["originText"])
          event.set("[p][description]", sf["description"])
          end
        '
      }
    }
  }

  # 상품명 초성(검색어가 초성으로만 된 경우 search-service 가 이 필드를 찾는다). 한글 음절 → 초성, ㄱ~ㅎ 은 그대로, 나머지는 공백
  if [@metadata][op] == "content" and [p][name] {
    ruby {
      code => '
        cho = %w(ㄱ ㄲ ㄴ ㄷ ㄸ ㄹ ㅁ ㅂ ㅃ ㅅ ㅆ ㅇ ㅈ ㅉ ㅊ ㅋ ㅌ ㅍ ㅎ)
        out = event.get("[p][name]").to_s.each_char.map do |ch|
          o = ch.ord
          if o >= 0xAC00 && o <= 0xD7A3
            cho[(o - 0xAC00) / 588]
          elsif o >= 0x3131 && o <= 0x314E
            ch
          else
            " "
          end
        end
        event.set("[p][chosung]", out.join.squeeze(" ").strip)
      '
    }
  }

  # 취급: SKU 취급 문서를 센터별 버전 비교로 갱신하고(같은 버전 재전달·재발행은 바뀌지 않음), 지금 켠 센터 목록을 읽어
  # 이 SKU 를 대표로 둔 상품에 붙인다. 상품이 아직 없으면 아무것도 바뀌지 않고, 상품 사건이 올 때 위에서 SKU 취급 문서를 찾아 붙인다
  if [@metadata][op] == "handling" {
    http {
      url => "${PMART_ES_URL}/${PMART_SEARCH_HANDLINGS_INDEX:sku-handlings}/_update/%{[@metadata][sku]}?refresh=true"
      verb => "POST"
      body_format => "text"
      headers => { "Content-Type" => "application/json" }
      body => "%{[@metadata][hupdate]}"
      target_body => "[@metadata][hres]"
      target_headers => "[@metadata][hresHeaders]"
    }
    if "_httprequestfailure" not in [tags] {
      http {
        url => "${PMART_ES_URL}/${PMART_SEARCH_HANDLINGS_INDEX:sku-handlings}/_doc/%{[@metadata][sku]}"
        verb => "GET"
        target_body => "[@metadata][hdoc]"
        target_headers => "[@metadata][hdocHeaders]"
      }
    }
    if "_httprequestfailure" not in [tags] {
      ruby {
        code => '
          require "json"
          d = event.get("[@metadata][hdoc]")
          carried = (d.is_a?(Hash) && d["_source"]) ? (d["_source"]["carriedMfcIds"] || []) : []
          body = { "query" => { "term" => { "representativeSku" => event.get("[@metadata][sku]") } },
                   "script" => { "lang" => "painless",
                     "source" => "if (ctx._source.carriedMfcIds == params.c) { ctx.op = \"noop\"; } else { ctx._source.carriedMfcIds = params.c; ctx._source.updatedAtMs = params.now; }",
                     "params" => { "c" => carried, "now" => event.get("[@metadata][now]").to_i } } }
          event.set("[@metadata][ubqBody]", body.to_json)
        '
      }
      http {
        url => "${PMART_ES_URL}/${PMART_SEARCH_PRODUCTS_INDEX:products}/_refresh"
        verb => "POST"
        target_body => "[@metadata][refresh]"
        target_headers => "[@metadata][refreshHeaders]"
      }
      http {
        url => "${PMART_ES_URL}/${PMART_SEARCH_PRODUCTS_INDEX:products}/_update_by_query?refresh=true&conflicts=proceed"
        verb => "POST"
        body_format => "text"
        headers => { "Content-Type" => "application/json" }
        body => "%{[@metadata][ubqBody]}"
        target_body => "[@metadata][ubq]"
        target_headers => "[@metadata][ubqHeaders]"
      }
    }
  }

  # 가격: 방금 쓴 상품도 보이게 새로고침한 뒤, 이 SKU 를 대표로 둔 상품의 가격을 버전 비교로 갱신
  if [@metadata][op] == "price" {
    http {
      url => "${PMART_ES_URL}/${PMART_SEARCH_PRODUCTS_INDEX:products}/_refresh"
      verb => "POST"
      target_body => "[@metadata][refresh]"
      target_headers => "[@metadata][refreshHeaders]"
    }
    http {
      url => "${PMART_ES_URL}/${PMART_SEARCH_PRODUCTS_INDEX:products}/_update_by_query?refresh=true&conflicts=proceed"
      verb => "POST"
      body_format => "json"
      body => {
        "query" => { "term" => { "representativeSku" => "%{[p][sku]}" } }
        "script" => {
          "lang" => "painless"
          "source" => "def s = ctx._source; long pv = Long.parseLong(params.pv); if (s.priceVersion == null || pv > s.priceVersion) { s.basePrice = Long.parseLong(params.price); s.priceVersion = (int) pv; s.updatedAtMs = Long.parseLong(params.now); } else { ctx.op = 'noop'; }"
          "params" => { "price" => "%{[p][price]}" "pv" => "%{[p][pv]}" "now" => "%{[p][now]}" }
        }
      }
      target_body => "[@metadata][ubq]"
      target_headers => "[@metadata][ubqHeaders]"
    }
  }

  # 재시도 뒤에도 실패한 사건 → DLT 레코드에 원래 위치(토픽·파티션·오프셋)·사유를 붙인다(출력은 아래 kafka)
  if "_httprequestfailure" in [tags] or "pmart_content_card_missing" in [tags] {
    ruby {
      code => '
        require "time"
        k = event.get("[@metadata][kafka]") || {}
        event.set("pmartDeadLetter", { "op" => event.get("[@metadata][op]"), "id" => event.get("[@metadata][id]"),
          "tags" => event.get("tags"), "topic" => k["topic"], "partition" => k["partition"], "offset" => k["offset"],
          "at" => Time.now.utc.iso8601 })
      '
    }
  }
}

output {
  if "_httprequestfailure" in [tags] or "pmart_content_card_missing" in [tags] {
    # 재시도 뒤에도 보강·연결 실패 → 색인하지 않고 DLT 토픽에 원래 위치와 함께 남긴다(경보 SearchIndexDeadLetter).
    # 재처리: 원인을 고친 뒤 소비 그룹 오프셋을 그 위치로 되돌리거나 재색인(deploy/lan/elastic/REINDEX.md) — 사건 원본은 원래 토픽에 무제한 보관
    stdout { codec => line { format => "search-index skip op=%{[@metadata][op]} id=%{[@metadata][id]} tags=%{tags}" } }
    kafka {
      bootstrap_servers => "${PMART_KAFKA_BOOTSTRAP}"
      topic_id => "${PMART_SEARCH_DLT_TOPIC:search-index.DLT}"
      client_id => "search-index-logstash-dlt"
      codec => json
      message_key => "%{[@metadata][id]}"
    }
  } else if [@metadata][op] == "product" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_PRODUCTS_INDEX:products}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.productVersion == null || p.v > s.productVersion) { s.productId = p.productId; s.productVersion = p.v; s.categoryIds = p.categoryIds; s.categoryScope = p.scope; s.primaryCategoryId = p.primary; s.representativeSku = p.sku; s.filters = p.filters; s.carriedMfcIds = p.carried; if (p.rv != null ? (s.saleStateRowVersion == null || p.rv > s.saleStateRowVersion) : (s.saleStateRowVersion == null && (s.saleStateAtMs == null || p.atMs >= s.saleStateAtMs))) { s.saleState = p.saleState; s.saleStateAtMs = p.atMs; if (p.rv != null) { s.saleStateRowVersion = p.rv; } } s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
    if [@metadata][hasPrice] == "true" {
      elasticsearch {
        hosts => ["${PMART_ES_URL}"]
        index => "${PMART_SEARCH_PRODUCTS_INDEX:products}"
        action => "update"
        document_id => "%{[@metadata][id]}"
        scripted_upsert => true
        script_type => "inline"
        script_lang => "painless"
        script_var_name => "event"
        script => "def p = params.event.p; def s = ctx._source; if (s.priceVersion == null || p.pv > s.priceVersion) { s.basePrice = p.price; s.priceVersion = p.pv; s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
        manage_template => false
        ilm_enabled => false
        data_stream => false
      }
    }
  } else if [@metadata][op] == "content" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_PRODUCTS_INDEX:products}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.contentVersion == null || p.cv > s.contentVersion) { s.productId = p.productId; s.contentVersion = p.cv; s.name = p.name; s.nameChosung = p.chosung; s.imageUrl = p.imageUrl; s.originType = p.originType; s.originText = p.originText; s.description = p.description; if (s.contentPublishedAtMs == null) { s.contentPublishedAtMs = p.atMs; } s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "sale" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_PRODUCTS_INDEX:products}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (p.rv != null ? (s.saleStateRowVersion == null || p.rv > s.saleStateRowVersion) : (s.saleStateRowVersion == null && (s.saleStateAtMs == null || p.atMs >= s.saleStateAtMs))) { s.productId = p.productId; s.saleState = p.state; s.saleStateAtMs = p.atMs; if (p.rv != null) { s.saleStateRowVersion = p.rv; } s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "ranking" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_PRODUCTS_INDEX:products}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.signalsVersion == null || p.sv > s.signalsVersion) { s.productId = p.productId; s.ratingCount = p.rc; s.ratingAverage = p.ra; s.ratingScore = p.rs; s.salesWindow = p.sales; s.signalsVersion = p.sv; s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "discount" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_DISCOUNTS_INDEX:sku-discounts}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.seq == null || p.seq > s.seq) { s.sku = p.sku; s.seq = p.seq; s.priceVersion = p.pv; s.unitDiscount = p.unit; s.salePrice = p.sale; s.ratePercent = p.rate; s.promotionName = p.name; s.endsAtMs = p.endsMs; s.updatedAtMs = p.now; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  } else if [@metadata][op] == "price" {
    elasticsearch {
      hosts => ["${PMART_ES_URL}"]
      index => "${PMART_SEARCH_PRICES_INDEX:sku-prices}"
      action => "update"
      document_id => "%{[@metadata][id]}"
      scripted_upsert => true
      script_type => "inline"
      script_lang => "painless"
      script_var_name => "event"
      script => "def p = params.event.p; def s = ctx._source; if (s.priceVersion == null || p.pv > s.priceVersion) { s.sku = p.sku; s.price = p.price; s.priceVersion = p.pv; s.effectiveAtMs = p.atMs; } else { ctx.op = 'none'; }"
      manage_template => false
      ilm_enabled => false
      data_stream => false
    }
  }
}
