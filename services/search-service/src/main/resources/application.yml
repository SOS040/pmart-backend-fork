spring:
  # Config 서버(ADR-0027): 기본 꺼짐. LAN 은 SPRING_CLOUD_CONFIG_ENABLED=true·URI·fail-fast 를 환경변수로 켠다
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  application:
    name: search-service
  autoconfigure:
    # 상태를 갖지 않는 서비스(DB 없음). common-messaging 이 spring-jdbc 를 끌어와 DataSource 자동구성이 켜지므로 끈다.
    # DB(색인·inbox 등)가 생기면 이 제외를 지우고 PMART_DB_* 를 받는다.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8105
pmart:
  messaging:
    domain: commerce
  search:
    # 상품 검색 색인(OpenSearch, tech-stack 선택적 스택). 색인 이름은 별칭(products) → 실제 인덱스 products-v1
    opensearch-url: ${PMART_OPENSEARCH_URL}
    # 콘텐츠 사건에 상품명·이미지가 없어 공개 카드 API 로 보강한다(product-content-service, Service DNS)
    content-base-url: ${PMART_PRODUCT_CONTENT_BASE_URL:http://product-content-service:8102}
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/search/products
      - /api/v1/search/suggestions
      - /api/v1/search/filters
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
