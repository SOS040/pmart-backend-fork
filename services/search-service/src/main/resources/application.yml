spring:
  application:
    name: search-service
  autoconfigure:
    # 상태를 갖지 않는 서비스(DB 없음). common-messaging 이 spring-jdbc 를 끌어와 DataSource 자동구성이 켜지므로 끈다.
    # DB(색인·inbox 등)가 생기면 이 제외를 지우고 PMART_DB_* 를 받는다.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8105
pmart:
  messaging:
    domain: commerce
  security:
    # 계약 security: [] 작업(익명). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 경로마다 메서드가 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/search/products
      - /api/v1/search/suggestions
      - /api/v1/search/filters
management:
  zipkin:
    tracing:
      endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
