spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8201
pmart:
  messaging:
    domain: order
  security:
    # 비회원 토큰(typ=GUEST)도 배송 방식 안내는 된다(주문 초안은 회원만)
    guest-paths:
      - /api/v1/delivery-options
    # customer·product·pricing·center-master 내부 API 호출용 서비스 신원 토큰(ADR-0011). secret 은 Secret Manager
    service-token:
      token-uri: ${PMART_SERVICE_TOKEN_URI:http://auth-service:8501/api/v1/internal/service-tokens}
      client-secret: ${PMART_SERVICE_CLIENT_SECRET}
  order:
    customer-base-url: ${PMART_CUSTOMER_BASE_URL:http://customer-service:8103}
    product-base-url: ${PMART_PRODUCT_BASE_URL:http://product-service:8101}
    pricing-base-url: ${PMART_PRICING_BASE_URL:http://pricing-service:8107}
    center-master-base-url: ${PMART_CENTER_MASTER_BASE_URL:http://center-master-service:8507}
    capacity-base-url: ${PMART_CAPACITY_BASE_URL:http://delivery-capacity-service:8402}
    orchestration-base-url: ${PMART_ORCHESTRATION_BASE_URL:http://order-orchestration-service:8202} # 결제 진입 사가(내부, 서비스 토큰)
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
