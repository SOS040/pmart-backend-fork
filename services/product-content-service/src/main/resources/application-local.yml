# 로컬 개발 프로파일 (deploy/local/docker-compose.yml). 로컬 컨테이너 전용 고정값이며 운영은 Secret Manager.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI:http://localhost:8501/api/v1/internal/jwks}
  datasource:
    url: jdbc:postgresql://localhost:15432/product_content_service
    username: pmart
    password: ${PMART_DB_PASSWORD:pmart-local}
  kafka:
    bootstrap-servers: localhost:9092
pmart:
  storage:
    s3:
      # deploy/local 의 s3(SeaweedFS). 버킷은 compose 가 -bucket= 으로 만든다.
      # deploy/local compose 의 로컬 전용 기본 자격 증명(postgres pmart-local 과 같은 취급). 바꿨으면 환경변수로 덮어쓴다.
      endpoint: ${PMART_S3_ENDPOINT:http://localhost:8333}
      bucket: ${PMART_S3_BUCKET:pmart-product-content}
      access-key: ${PMART_S3_ACCESS_KEY:pmart-local-s3}
      secret-key: ${PMART_S3_SECRET_KEY:pmart-local-s3-secret}
logging:
  level:
    com.pmart: DEBUG
