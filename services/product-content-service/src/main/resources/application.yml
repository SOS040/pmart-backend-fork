spring:
  application:
    name: product-content-service
  mvc:
    problemdetails:
      enabled: true # Spring MVC 자체 예외도 RFC 9457
  servlet:
    multipart:
      max-file-size: 300MB # seed-v1 묶음(이미지 포함). 이미지 1장 상한은 ContentRules.MAX_IMAGE_BYTES
      max-request-size: 300MB
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PMART_JWKS_URI}
  datasource:
    url: ${PMART_DB_URL}
    username: ${PMART_DB_USERNAME}
    password: ${PMART_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway 만 (service-architecture.md)
  flyway:
    locations: classpath:db/migration # common-messaging 이 classpath:db/migration/common 을 추가한다
  kafka:
    bootstrap-servers: ${PMART_KAFKA_BOOTSTRAP}
server:
  port: 8102
pmart:
  messaging:
    domain: commerce
  security:
    # 계약 security: [] 작업(비회원 둘러보기, 게시본만). 기본 목록을 덮어쓰므로 actuator·error 도 다시 적는다. 세 경로 모두 GET 하나뿐이라 경로 단위 허용이 계약과 일치.
    permit-paths:
      - /actuator/health/**
      - /actuator/info
      - /actuator/prometheus
      - /error
      - /api/v1/product-contents
      - /api/v1/product-contents/*
      - /api/v1/content-images/*
  storage:
    # 상품 이미지 저장소(S3 호환, ADR-0016). 값은 환경변수로만 — 자격 증명을 이 파일·이미지에 넣지 않는다.
    s3:
      endpoint: ${PMART_S3_ENDPOINT:}          # 비우면 AWS 기본. SeaweedFS 는 http://<host>:8333
      region: ${PMART_S3_REGION:us-east-1}
      bucket: ${PMART_S3_BUCKET}
      access-key: ${PMART_S3_ACCESS_KEY}
      secret-key: ${PMART_S3_SECRET_KEY}
      path-style: ${PMART_S3_PATH_STYLE:true}
      create-bucket: ${PMART_S3_CREATE_BUCKET:false}
management:
  tracing:
    export:
      zipkin:
        endpoint: ${PMART_ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
