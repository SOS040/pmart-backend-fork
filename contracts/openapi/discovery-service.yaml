openapi: 3.1.0
info:
  title: discovery-service
  version: 0.1.0
  description: |
    서비스 등록·조회(서비스 레지스트리). 업무 정책값·업무 데이터 없음, 정본 아님. (docs/architecture/service-map.md §8)
    등록·갱신은 클라이언트 라이브러리가 수행하며 이 문서는 조회·헬스 경로만 정의한다.
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - { name: ops, description: 레지스트리 운영 정보 }

paths:
  /actuator/health:
    get:
      tags: [ops]
      summary: 레지스트리 헬스 (인증 불필요)
      operationId: getDiscoveryHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE] }

  /registry/services:
    get:
      tags: [ops]
      summary: 등록 서비스 목록 (서비스 토큰)
      operationId: listRegisteredServices
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        serviceId: { type: string, example: order-service }
                        instances:
                          type: array
                          items:
                            type: object
                            properties:
                              instanceId: { type: string }
                              host: { type: string }
                              port: { type: integer }
                              status: { type: string, enum: [UP, DOWN, STARTING, OUT_OF_SERVICE, UNKNOWN] }
                              lastHeartbeatAt: { type: string, format: date-time }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
