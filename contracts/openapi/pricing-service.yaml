openapi: 3.1.0
info:
  title: pricing-service
  version: 0.1.0
  description: |
    SKU별 기본 판매가격 버전(전사 동일, 센터 예외 없음)·효력일과 견적 계산의 정본. (docs/architecture/service-map.md §1)
    견적 순서는 기본가 → 선택 오퍼 → 기간 프로모션 → 상품쿠폰 → 장바구니쿠폰이나 1차는 기본가만 적용한다(promotion 비활성).
    비정본: 최종 청구액·가격 동결(order 초안), 배달팁·봉투값·최소주문(order), 할인 권리(promotion).
    발행: PriceVersionEffective. 구독: ApprovalDecided(가격 승인 BO-04).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: prices, description: 현재 유효 가격·가격 버전 조회(표시용) }
  - { name: price-versions, description: 가격 버전 반영 명령(승인 결과 참조) }
  - { name: internal, description: 서비스 간 견적·가격 조회(서비스 토큰) }

paths:
  /prices/{sku}:
    get:
      tags: [prices]
      summary: SKU 현재 유효 가격 조회 (표시용. 견적 확정은 order 초안)
      operationId: getPrice
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: at, in: query, description: 기준 시각. 생략 시 현재, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '404':
          description: PRICE_NOT_SET (유효 가격 버전 없음. 0원이 아니며 판매 불가로 취급)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /prices:
    get:
      tags: [prices]
      summary: SKU 일괄 가격 조회 (최대 100건)
      operationId: listPrices
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK (가격 미설정 SKU는 items에서 제외하고 notSet에 나열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  notSet: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /price-versions/{sku}:
    get:
      tags: [prices]
      summary: SKU 가격 버전 이력 (효력일 순)
      operationId: listPriceVersions
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PriceVersion' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /price-version-applications:
    post:
      tags: [price-versions]
      summary: 가격 버전 반영 (approval BO-04 승인 결과 참조)
      description: |
        승인된 가격 변경(approvalId)을 SKU별 새 가격 버전으로 등록한다. 효력 시각 도달 시 PriceVersionEffective 발행.
        승인 범위(SKU·금액·효력일)와 요청이 다르면 APPROVAL_SCOPE_MISMATCH. 같은 approvalId 재전송은 기존 결과 반환.
      operationId: applyPriceVersion
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, items]
              properties:
                approvalId: { type: string }
                changeRequestId: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, basePrice, effectiveFrom]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
                      effectiveFrom: { type: string, format: date-time }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / APPROVAL_SCOPE_MISMATCH / EFFECTIVE_FROM_IN_PAST
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /price-version-applications/{requestId}:
    get:
      tags: [price-versions]
      summary: 가격 버전 반영 결과 조회 (SKU별 발급 버전)
      operationId: getPriceVersionApplication
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  approvalId: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                        priceVersion: { type: integer }
                        state: { type: string, enum: [SCHEDULED, EFFECTIVE, SUPERSEDED, REJECTED] }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  # ---------- internal (서비스 토큰) ----------
  /internal/quotes:
    post:
      tags: [internal]
      summary: '[order→pricing] 견적 계산 (품목 금액·할인 안분. 1차는 기본가만)'
      description: |
        요청 품목의 기준 시각 유효 가격으로 품목 금액을 계산한다. 결과는 quoteId로 보존되어 order 초안이 priceVersion과 함께 스냅샷한다.
        배달팁·봉투값·최소주문 판정은 포함하지 않는다(order 책임). 가격 미설정 SKU가 하나라도 있으면 PRICE_NOT_SET으로 전체 거절.
      operationId: createQuote
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: 견적 계산 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PRICE_NOT_SET (SKU별 nextAction=RE_QUOTE 불가. 품목 제거 필요) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quotes/{quoteId}:
    get:
      tags: [internal]
      summary: '[order→pricing] 견적 결과 재조회 (응답 유실 시 동일 quoteId로 해소)'
      operationId: getQuote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/prices:
    get:
      tags: [internal]
      summary: '[cart/storefront/content→pricing] 표시 가격 일괄 조회 (최대 200건)'
      operationId: listPricesInternal
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 200
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  notSet: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    Price:
      type: object
      required: [sku, basePrice, priceVersion, effectiveFrom]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
        priceVersion: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        nextChange:
          type: object
          description: 예약된 다음 버전이 있으면 표시
          properties:
            basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
            effectiveFrom: { type: string, format: date-time }
    PriceVersion:
      type: object
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        priceVersion: { type: integer }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        approvalId: { type: string }
        state: { type: string, enum: [SCHEDULED, EFFECTIVE, SUPERSEDED] }
    QuoteRequest:
      type: object
      required: [items]
      properties:
        accountId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId', description: 1차는 센터 예외 없음. 로그 용도 }
        at: { type: string, format: date-time, description: 가격 기준 시각. 생략 시 현재 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineRef, sku, quantity]
            properties:
              lineRef: { type: string, description: 호출자 품목 참조 (cartItemId 등) }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
              offerId: { type: string, description: 3차. 1차는 무시 }
        couponIds: { type: array, items: { type: string }, description: 3차. 1차는 무시 }
    QuoteLine:
      type: object
      properties:
        lineRef: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        quantity: { type: integer }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        priceVersion: { type: integer }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money', description: unitPrice × quantity }
        discountShare: { $ref: '_common.yaml#/components/schemas/Money', description: 할인 안분. 1차는 0 }
        netAmount: { $ref: '_common.yaml#/components/schemas/Money' }
    Quote:
      type: object
      required: [quoteId, lines, itemAmount, calculatedAt]
      properties:
        quoteId: { type: string }
        requestId: { type: string }
        priceVersion: { type: integer, description: 견적에 쓰인 가격 버전 집합의 대표 버전(최대값) }
        lines: { type: array, items: { $ref: '#/components/schemas/QuoteLine' } }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 오퍼·프로모션 후·쿠폰 전 상품액 }
        discountTotal: { $ref: '_common.yaml#/components/schemas/Money' }
        appliedStages:
          type: array
          description: 적용된 계산 단계. 1차는 BASE만
          items: { type: string, enum: [BASE, OFFER, PROMOTION, PRODUCT_COUPON, CART_COUPON] }
        calculatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
