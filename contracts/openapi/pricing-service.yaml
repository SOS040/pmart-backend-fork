openapi: 3.1.0
info:
  title: pricing-service
  version: 0.4.0
  description: |
    0.4.0(2026-11-26, ADR-0090 수량 행사 1+1·2+1): 견적 품목 `quantity` 는 **유상 수량**(고객이 고른 수). 그 SKU 에 수량 행사가 걸리면(promotion `/internal/quantity-offers`)
      무료 수량 = ⌊유상 ÷ buy⌋ × free 를 더해, 줄 `quantity` = **총 수량**(유상 + 무료 — 재고·피킹은 이 수), `paidQuantity`·`freeQuantity` 따로, 줄 금액 = 기본가 × 총 수량,
      무료분(기본가 × 무료 수량)을 `promotionDiscount` 로 뺀다. 수량 행사가 걸린 SKU 에는 기간 할인을 적용하지 않는다(A5). 쿠폰은 그 뒤 금액에 안분. 단계 `QUANTITY_OFFER`.
    0.3.0(2026-11-21, ADR-0082 4단계 할인가 표시): 표시용 가격 조회(`/prices`·`/prices/{sku}`)에 지금(또는 at) 기간 할인 `discount`
    (promotion-service 와 같은 계산 — 가장 큰 1개, 정률 원 미만 버림)와 `discountAvailable`. promotion 을 못 읽으면 정가만 + `discountAvailable=false`
    (표시용이라 거절하지 않는다 — 결제 금액은 견적이 정하고 그때는 503). 내부 `/internal/prices` 는 할인을 붙이지 않는다.
    0.2.0(2026-11-21, ADR-0082 쿠폰·기간 할인 2단계 — 사용자 "응"): 견적이 **기간 할인(PROMOTION)·장바구니 쿠폰(CART_COUPON)** 을 적용한다(promotion-service 내부 조회).
    순서 기본가 → 기간 할인(SKU 마다 가장 큰 1개, 개당) → 장바구니 쿠폰(1장, `couponIds[0]` + `accountId`). `itemAmount` = 기간 할인 뒤·쿠폰 전 상품액(최소 주문·무료 배달 판정용),
    `couponDiscount` 는 따로. 품목 `discountShare` = 기간 할인 + 쿠폰 안분(대상 금액 비례, 원 미만 버림, 남은 원은 금액 큰 품목 — 같으면 앞 품목), `netAmount` = lineAmount − discountShare.
    쿠폰을 쓸 수 없으면 거절하지 않고 `coupon.applicable=false`·`reason` 으로 알려 주고 쿠폰 없이 계산한다. promotion 을 못 읽으면 503(할인 없이 정가로 계산하지 않는다).
    SKU별 기본 판매가격 버전(전사 동일, 센터 예외 없음)·효력일과 견적 계산의 정본. (docs/architecture/service-map.md §1)
    견적 순서는 기본가 → 선택 오퍼 → 기간 프로모션 → 상품쿠폰 → 장바구니쿠폰이나 1차는 기본가만 적용한다(promotion 비활성).
    비정본: 최종 청구액·가격 동결(order 초안), 배달팁·봉투값·최소주문(order), 할인 권리(promotion).
    발행: PriceVersionEffective. 구독: ApprovalDecided(가격 승인 BO-04).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: prices, description: 현재 유효 가격·가격 버전 조회(표시용) }
  - { name: price-versions, description: 가격 버전 반영 명령(승인 결과 참조) }
  - { name: internal, description: 서비스 간 견적·가격 조회(서비스 토큰) }
  - { name: registration, description: 임시 백오피스 가격 일괄 등록(seed-v1 기준파일 basePrice → PRICE 승인 요청) }

paths:
  /prices/{sku}:
    get:
      tags: [prices]
      summary: SKU 현재 유효 가격 조회 (표시용. 견적 확정은 order 초안)
      operationId: getPrice
      security: []   # 비회원 둘러보기(Commerce 비회원 조회 허용). 게시·발효된 것만 보인다
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: at, in: query, description: 기준 시각. 생략 시 현재, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Price' }
        '404':
          description: PRICE_NOT_SET (유효 가격 버전 없음. 0원이 아니며 판매 불가로 취급)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /prices:
    get:
      tags: [prices]
      summary: SKU 일괄 가격 조회 (최대 100건)
      operationId: listPrices
      security: []   # 비회원 둘러보기(Commerce 비회원 조회 허용). 게시·발효된 것만 보인다
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK (가격 미설정 SKU는 items에서 제외하고 notSet에 나열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  notSet: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /price-versions/{sku}:
    get:
      tags: [prices]
      summary: SKU 가격 버전 이력 (효력일 순)
      operationId: listPriceVersions
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 코드에 호출자 검사 없음. 가격 버전 이력은 백오피스 화면용으로 봄"
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PriceVersion' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /price-version-applications:
    post:
      tags: [price-versions]
      summary: 가격 버전 반영 (approval BO-04 승인 결과 참조)
      description: |
        가격 버전은 ApprovalDecided(PRICE) 수신 때 SKU별로 만들어진다(효력 시각 도달 시 PriceVersionEffective 발행).
        이 명령은 요청이 그 승인 범위(SKU·금액·효력일)와 같은지 대조하고 반영 결과를 requestId 로 묶는다.
        다르면 APPROVAL_SCOPE_MISMATCH, 승인을 아직 받지 못했거나 반려된 승인이면 APPROVAL_REQUIRED(같은 키로 재시도 가능).
      operationId: applyPriceVersion
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approvalId, items]
              properties:
                approvalId: { type: string }
                changeRequestId: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, basePrice, effectiveFrom]
                    properties:
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
                      effectiveFrom: { type: string, format: date-time }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / APPROVAL_SCOPE_MISMATCH / EFFECTIVE_FROM_IN_PAST
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /price-version-applications/{requestId}:
    get:
      tags: [price-versions]
      summary: 가격 버전 반영 결과 조회 (SKU별 발급 버전)
      operationId: getPriceVersionApplication
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  approvalId: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                        priceVersion: { type: integer }
                        state: { type: string, enum: [SCHEDULED, EFFECTIVE, SUPERSEDED, REJECTED] }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  # ---------- 가격 일괄 등록 (운영자) ----------
  /price-import-batches:
    post:
      tags: [registration]
      summary: 가격 일괄 등록 — seed-v1 묶음(zip) 업로드
      description: |
        products/*/product.json 의 product.seedProductId·product.internalName(없으면 content.name)·price.basePrice·source.system 만 읽는다(이미지는 건너뛴다).
        원천 키(sourceSystem, seedProductId)로 product-service 에서 SKU 를 찾고(상품 승인 전이면 SKU_NOT_FOUND), 현재 유효 가격과 비교해
        행을 만든다: 가격이 없던 SKU = NEW, 현재 가격과 다른 SKU = CHANGE, 같으면 UNCHANGED(제출에서 빠진다).
        basePrice 는 묶음 값으로 미리 채우고 운영자가 행마다 고치거나 뺄 수 있다(PUT …/lines/{seedProductId}).
      operationId: uploadPriceImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: seed-v1.zip (상품·콘텐츠 일괄 등록과 같은 파일) }
      responses:
        '201':
          description: 업로드·대조 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceImportBatch' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: BUNDLE_INVALID (zip 아님·product.json 없음·형식 다름·상품 2000개 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /price-import-batches/{batchId}:
    get:
      tags: [registration]
      summary: 배치 상태·행별 결과 (승인 뒤에는 행별 반영 결과 포함)
      operationId: getPriceImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceImportBatch' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /price-import-batches/{batchId}/lines/{seedProductId}:
    put:
      tags: [registration]
      summary: 행 설정 — 가격 고치기·빼기 (DRAFT 배치만)
      description: |
        basePrice 는 1 이상 KRW 정수(0원 허용은 미정이라 받지 않는다). null 이면 묶음 값으로 되돌린다.
        excluded=true 면 제출에서 뺀다. 고친 가격이 현재 가격과 같아지면 그 행은 UNCHANGED 로 바뀌어 제출에서 빠진다.
      operationId: updatePriceImportLine
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - { name: seedProductId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceImportLineUpdate' }
      responses:
        '200':
          description: OK (배치 전체를 돌려준다, version +1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceImportBatch' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: VERSION_CONFLICT / BATCH_LOCKED (이미 제출됨)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /price-import-batches/{batchId}/refreshes:
    post:
      tags: [registration]
      summary: SKU·현재 가격 다시 대조 (상품 승인 뒤 SKU_NOT_FOUND 행을 풀 때, DRAFT 배치만)
      description: 운영자가 고친 가격·뺀 행은 그대로 둔다.
      operationId: refreshPriceImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: OK (version +1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceImportBatch' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: BATCH_LOCKED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /price-import-batches/{batchId}/submissions:
    post:
      tags: [registration]
      summary: 제출 — 다시 대조한 뒤 NEW·CHANGE 행을 잠그고 PRICE 승인 요청 본문(한 건)을 돌려준다
      description: |
        제출 직전에 SKU·현재 가격을 다시 대조한다(그 사이 바뀐 가격 반영). 대상 = 빼지 않은 NEW·CHANGE 행.
        응답의 approvalRequest 를 그대로 approval-service POST /change-requests 본문으로 보내고 PRICE 승인을 받는다.
        승인되면 행마다 가격 버전이 생기고(ApprovalDecided) 배치 GET 에 행별 결과가 보인다. 반려되면 배치는 REJECTED — 새로 올린다.
        effectiveFrom 을 비우면 승인 반영 즉시, 넣으면 그 시각(지난 시각은 거절)에 효력.
      operationId: submitPriceImportBatch
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PriceImportSubmissionRequest' }
      responses:
        '200':
          description: 잠금 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceImportSubmissionResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: VERSION_CONFLICT / BATCH_LOCKED / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: NOTHING_TO_SUBMIT (NEW·CHANGE 행 없음) / EFFECTIVE_FROM_IN_PAST
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  # ---------- internal (서비스 토큰) ----------
  /internal/quotes:
    post:
      tags: [internal]
      summary: '[order→pricing] 견적 계산 (품목 금액·할인 안분. 1차는 기본가만)'
      description: |
        요청 품목의 기준 시각 유효 가격으로 품목 금액을 계산한다. 결과는 quoteId로 보존되어 order 초안이 priceVersion과 함께 스냅샷한다.
        배달팁·봉투값·최소주문 판정은 포함하지 않는다(order 책임). 가격 미설정 SKU가 하나라도 있으면 PRICE_NOT_SET으로 전체 거절.
      operationId: createQuote
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
      responses:
        '200':
          description: 견적 계산 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PRICE_NOT_SET (SKU별 nextAction=RE_QUOTE 불가. 품목 제거 필요) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quotes/{quoteId}:
    get:
      tags: [internal]
      summary: '[order→pricing] 견적 결과 재조회 (응답 유실 시 동일 quoteId로 해소)'
      operationId: getQuote
      parameters:
        - { name: quoteId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/prices:
    get:
      tags: [internal]
      summary: '[cart/storefront/content→pricing] 표시 가격 일괄 조회 (최대 200건)'
      operationId: listPricesInternal
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 200
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Price' } }
                  notSet: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    Price:
      type: object
      required: [sku, basePrice, priceVersion, effectiveFrom]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
        priceVersion: { type: integer }
        effectiveFrom: { type: string, format: date-time }
        discount: { $ref: '#/components/schemas/DisplayDiscount' }
        discountAvailable:
          type: boolean
          description: '(0.3.0) false = promotion 을 읽지 못해 할인을 모름(정가만 보임). 내부 조회에는 없다'
        nextChange:
          type: object
          description: 예약된 다음 버전이 있으면 표시
          properties:
            basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
            effectiveFrom: { type: string, format: date-time }
    DisplayDiscount:
      type: object
      description: '(0.3.0 ADR-0082 4단계) 화면 표시용 기간 할인(개당). 결제 금액은 견적(order 주문서)이 정한다'
      required: [promotionId, name, unitDiscount, salePrice, ratePercent, endsAt]
      properties:
        promotionId: { type: string }
        name: { type: string, description: 행사 이름 }
        unitDiscount: { $ref: '_common.yaml#/components/schemas/Money' }
        salePrice: { $ref: '_common.yaml#/components/schemas/Money', description: 할인가 = basePrice − unitDiscount }
        ratePercent: { type: integer, description: '할인율(내림, %)' }
        endsAt: { type: string, format: date-time, description: 행사 끝(조기 종료 반영) }
    PriceVersion:
      type: object
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        priceVersion: { type: integer }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money' }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        approvalId: { type: string }
        state: { type: string, enum: [SCHEDULED, EFFECTIVE, SUPERSEDED] }
    QuoteRequest:
      type: object
      required: [items]
      properties:
        accountId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId', description: 1차는 센터 예외 없음. 로그 용도 }
        at: { type: string, format: date-time, description: 가격 기준 시각. 생략 시 현재 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [lineRef, sku, quantity]
            properties:
              lineRef: { type: string, description: 호출자 품목 참조 (cartItemId 등) }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
              offerId: { type: string, description: 3차. 1차는 무시 }
        couponIds: { type: array, maxItems: 1, items: { type: string }, description: '0.2.0 — 장바구니 쿠폰 1장(accountId 필요). 비우면 쿠폰 없음' }
    QuoteLine:
      type: object
      properties:
        lineRef: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        quantity: { type: integer }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        priceVersion: { type: integer }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money', description: unitPrice × quantity }
        discountShare: { $ref: '_common.yaml#/components/schemas/Money', description: '할인 합(기간 할인 × 수량 + 쿠폰 안분)' }
        netAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        promotionDiscount: { $ref: '_common.yaml#/components/schemas/Money', description: '0.2.0 — 기간 할인(개당 × 수량)' }
        couponShare: { $ref: '_common.yaml#/components/schemas/Money', description: '0.2.0 — 쿠폰 할인 안분' }
        promotionId: { type: [string, 'null'], description: '0.2.0 — 걸린 기간 할인 행사(0.4.0: 무료 수량이 생긴 수량 행사도)' }
        paidQuantity: { type: integer, x-added-in: '2026-11-26', description: '0.4.0 — 유상 수량(요청 quantity). quantity = paidQuantity + freeQuantity' }
        freeQuantity: { type: integer, x-added-in: '2026-11-26', description: '0.4.0 — 수량 행사 무료 수량(없으면 0)' }
        offerPromotionId: { type: [string, 'null'], x-added-in: '2026-11-26', description: '0.4.0 — 걸린 수량 행사(무료 수량이 아직 0 이어도 — "1개 더 담으면 1개 무료" 안내용)' }
        offerName: { type: [string, 'null'], x-added-in: '2026-11-26' }
        offerBuyQuantity: { type: integer, x-added-in: '2026-11-26', description: '0.4.0 — 수량 행사 N(없으면 0)' }
        offerFreeQuantity: { type: integer, x-added-in: '2026-11-26', description: '0.4.0 — 수량 행사 M(없으면 0)' }
    Quote:
      type: object
      required: [quoteId, lines, itemAmount, calculatedAt]
      properties:
        quoteId: { type: string }
        requestId: { type: string }
        priceVersion: { type: integer, description: 견적에 쓰인 가격 버전 집합의 대표 버전(최대값) }
        lines: { type: array, items: { $ref: '#/components/schemas/QuoteLine' } }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 오퍼·프로모션 후·쿠폰 전 상품액 }
        discountTotal: { $ref: '_common.yaml#/components/schemas/Money', description: '기간 할인 + 쿠폰 할인' }
        baseItemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: '0.2.0 — 정가 상품액(기본가 × 수량 합)' }
        promotionDiscount: { $ref: '_common.yaml#/components/schemas/Money', description: '0.2.0 — 기간 할인 합' }
        couponDiscount: { $ref: '_common.yaml#/components/schemas/Money', description: '0.2.0 — 쿠폰 할인(itemAmount 에서 뺀다)' }
        coupon:
          description: '0.2.0 — 요청한 쿠폰 결과(요청에 없으면 null)'
          oneOf:
            - type: 'null'
            - type: object
              required: [couponId, applicable]
              properties:
                couponId: { type: string }
                applicable: { type: boolean }
                reason: { type: [string, 'null'], description: 'NOT_FOUND·NOT_OWNER·EXPIRED·HELD·USED·MIN_ORDER_NOT_MET' }
                discountAmount: { type: integer }
                promotionId: { type: [string, 'null'] }
                name: { type: [string, 'null'] }
        appliedStages:
          type: array
          description: 적용된 계산 단계(BASE·QUANTITY_OFFER(0.4.0)·PROMOTION·CART_COUPON)
          items: { type: string, enum: [BASE, OFFER, QUANTITY_OFFER, PROMOTION, PRODUCT_COUPON, CART_COUPON] }
        calculatedAt: { type: string, format: date-time }
    PriceImportBatch:
      type: object
      required: [batchId, state, version, lineCount, submittableCount, lines]
      properties:
        batchId: { type: string, description: 'PB-…' }
        format: { type: string, enum: [SEED_V1] }
        sourceSystem: { type: string, description: 묶음 source.system (예 bmart-capture) }
        sourceName: { type: [string, 'null'], description: 올린 파일 이름 }
        state:
          type: string
          enum: [DRAFT, SUBMITTED, APPLIED, PARTIALLY_APPLIED, REJECTED]
          description: 'DRAFT(설정 중) → SUBMITTED(승인 대기, 잠김) → APPLIED / PARTIALLY_APPLIED(일부 행 반영 거절) / REJECTED(승인 반려)'
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        lineCount: { type: integer }
        submittableCount: { type: integer, description: 지금 제출하면 들어갈 행 수(빼지 않은 NEW·CHANGE) }
        effectiveFrom: { type: [string, 'null'], format: date-time, description: 제출 때 정한 효력 시각(null = 승인 반영 즉시) }
        approvalTargetRef: { type: [string, 'null'], description: '제출 뒤 priceImportBatch:{batchId}' }
        approvalId: { type: [string, 'null'], description: 승인 결과를 받은 뒤 채워진다 }
        approvalRequest:
          description: '제출 뒤 승인 대기(SUBMITTED) 동안만. 제출 응답과 같은 본문을 잠긴 행으로 다시 만든다 — 화면을 떠났다 와도 승인 요청을 이어서 올릴 수 있게(BR-41, 2026-11-03). 승인 ID 는 approval-service GET /approvals?targetRef=… (targetRef priceImportBatch:{batchId})'
          allOf: [{ $ref: '#/components/schemas/PriceApprovalRequestBody' }]
        checkedAt: { type: string, format: date-time, description: SKU·현재 가격을 마지막으로 대조한 시각 }
        lines: { type: array, items: { $ref: '#/components/schemas/PriceImportLine' } }
        createdAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
    PriceImportLine:
      type: object
      required: [seedProductId, status, excluded, edited]
      properties:
        seedProductId: { type: string }
        productName: { type: [string, 'null'], description: 묶음 product.internalName, 없으면 content.name (표시용) }
        productId: { type: [string, 'null'] }
        sku: { type: [string, 'null'], description: 원천 키로 찾은 SKU. 상품 승인 전이면 null }
        bundlePrice: { type: [integer, 'null'], minimum: 0, description: 묶음 price.basePrice 원래 값 }
        basePrice: { type: [integer, 'null'], minimum: 0, description: 제출할 가격(운영자가 고쳤으면 그 값, 아니면 bundlePrice) }
        currentPrice: { type: [integer, 'null'], minimum: 0, description: 대조 시각의 유효 가격(없으면 null) }
        changeType: { type: string, enum: [NEW, CHANGE, UNCHANGED], description: 'SKU·가격이 정해진 행만(그 밖에는 없음). NEW = 가격 없던 SKU, CHANGE = 현재와 다름, UNCHANGED = 같음(제출 제외)' }
        status:
          type: string
          enum: [READY, EXCLUDED, UNCHANGED, SKU_NOT_FOUND, PRICE_REQUIRED, DUPLICATE_SKU]
          description: 'READY = 제출 대상. PRICE_REQUIRED = 가격 없음·0 이하. DUPLICATE_SKU = 같은 SKU 가 앞 행에 있음(앞 행만 쓴다)'
        excluded: { type: boolean }
        edited: { type: boolean, description: 운영자가 가격을 고쳤는가 }
        result:
          type: object
          description: 승인 반영 결과(승인 뒤에만 있음)
          properties:
            state: { type: string, enum: [APPLIED, REJECTED] }
            reasonCode: { type: [string, 'null'], description: 'APPROVAL_REJECTED / SKU_NOT_FOUND / PRICE_SCHEDULE_CONFLICT 등' }
            priceVersion: { type: [integer, 'null'] }
    PriceImportLineUpdate:
      type: object
      properties:
        basePrice: { type: [integer, 'null'], minimum: 1, description: 'null = 묶음 값으로 되돌림' }
        excluded: { type: boolean, default: false }
    PriceImportSubmissionRequest:
      type: object
      properties:
        effectiveFrom: { type: [string, 'null'], format: date-time, description: '공통 효력 시각. 비우면 승인 반영 즉시' }
    PriceImportSubmissionResult:
      type: object
      required: [batch, approvalRequest]
      properties:
        batch: { $ref: '#/components/schemas/PriceImportBatch' }
        approvalRequest: { $ref: '#/components/schemas/PriceApprovalRequestBody' }
    PriceApprovalRequestBody:
      type: object
      description: approval-service ChangeRequestBody 와 같은 모양. 그대로 POST /change-requests 본문으로 쓴다.
      required: [type, targetService, targetRef, allowedActions, summary, lines]
      properties:
        type: { type: string, enum: [PRICE] }
        targetService: { type: string, enum: [pricing-service] }
        targetRef: { type: string, description: 'priceImportBatch:{batchId}' }
        allowedActions: { type: array, items: { type: string } }
        summary: { type: string }
        requestedEffectiveFrom: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [lineKey, requestedAmount, attributes]
            properties:
              lineKey: { type: string, description: SKU }
              requestedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
              attributes:
                type: object
                additionalProperties: true
                description: '{sku, basePrice, effectiveFrom?, previousPrice, changeType, seedProductId, productName} — 승인자가 보는 이전·새 가격'
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
