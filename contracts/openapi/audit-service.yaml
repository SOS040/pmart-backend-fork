openapi: 3.1.0
info:
  title: audit-service
  version: 0.2.0
  description: |
    감사 사건(운영자 명령·사유·전후 값·대상·실행·보상 결과)과 개인정보 열람·다운로드 기록(BO-25)의 정본. (docs/architecture/service-map.md §8)
    추가만 허용, 수정·삭제 없음. 보존 정책은 결정 필요. 각 도메인 정본은 소유 서비스에 있으며 여기 값은 기록 시점 사본이다.
    0.2.0(2026-11-15): 개인정보 열람 기록 기록·조회 구현(order-service 직원 주문 상세 원문 보기가 첫 호출자). Actor.roles·PiiAccessLogInput.subjectType 추가,
    기록 재생 200·조회 응답에 sourceSystem·requestId 추가. 감사 사건(audit-entries)은 아직 501.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: audit-entries, description: 감사 사건 조회 }
  - { name: internal, description: 서비스 간 기록(서비스 토큰) }

paths:
  /internal/audit-entries:
    post:
      tags: [internal]
      summary: '[전 서비스→audit] 감사 사건 기록 (추가만; 멱등)'
      description: 같은 Idempotency-Key·같은 본문은 기존 auditEntryId 반환. 기록 실패가 원명령을 막지 않도록 호출자는 Outbox 이벤트(AuditEntryRecorded)를 기본으로 하고 이 API는 동기 보조.
      operationId: recordAuditEntry
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuditEntryInput' }
      responses:
        '201':
          description: 기록됨 (auditEntryId 발급)
          content:
            application/json:
              schema:
                type: object
                properties:
                  auditEntryId: { type: string }
                  recordedAt: { type: string, format: date-time }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /audit-entries:
    get:
      tags: [audit-entries]
      summary: 감사 사건 목록 (행위자·대상·명령·기간 필터)
      operationId: listAuditEntries
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: actorId, in: query, schema: { type: string } }
        - { name: targetType, in: query, schema: { type: string } }
        - { name: targetId, in: query, schema: { type: string } }
        - { name: sourceSystem, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: outcome, in: query, schema: { $ref: '#/components/schemas/AuditOutcome' } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: traceId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /audit-entries/{auditEntryId}:
    get:
      tags: [audit-entries]
      summary: 감사 사건 상세 (전후 값 포함)
      operationId: getAuditEntry
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: auditEntryId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEntry' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/pii-access-logs:
    post:
      tags: [internal]
      summary: '[order/bff/customer/claim→audit] 개인정보 열람·다운로드 기록 (BO-25; 추가만; 멱등)'
      x-added-in: '2026-11-15'
      description: |
        원문을 보여 주기 **전에** 호출자가 동기로 부른다 — 기록이 안 되면(503·응답 불명) 호출자는 원문을 주지 않는다(BO-25 §3).
        멱등: (X-Source-System, Idempotency-Key). 같은 키·같은 본문이면 처음 기록을 200 으로 돌려준다(새 기록 없음). 본문 비교에서 occurredAt·traceId 는 빼고
        (재시도마다 달라지는 시도 정보), 그 밖이 다르면 409 IDEMPOTENCY_CONFLICT. purpose 는 비어 있으면 400.
        본문에 개인정보 원문(이름·연락처·주소 값)을 넣지 않는다 — subjectRef 는 계정 ID 같은 참조, fields 는 항목 코드만. 이 서비스는 purpose 를 로그에 남기지 않는다.
        수정·삭제 API 는 없고 표도 UPDATE·DELETE 를 거부한다(추가 전용).
      operationId: recordPiiAccessLog
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PiiAccessLogInput' }
      responses:
        '200':
          description: 같은 키·같은 본문의 재요청 — 처음 기록을 돌려준다(새 기록 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PiiAccessLogRecorded' }
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PiiAccessLogRecorded' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/pii-access-logs/{piiAccessLogId}:
    get:
      tags: [internal]
      summary: 개인정보 접근 기록 조회 (기록 요청의 짝 조회 — 응답 불명 뒤 원결과 확인)
      x-added-in: '2026-11-15'
      description: 서비스 간 경로(게이트웨이 밖). 직원용 열람 기록 조회 화면 API 는 아직 없다(누가 볼 수 있는지 결정 필요). 없으면 404 PII_ACCESS_LOG_NOT_FOUND.
      operationId: getPiiAccessLog
      parameters:
        - { name: piiAccessLogId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PiiAccessLog' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    AuditOutcome:
      type: string
      description: 명령 결과 사본. UNKNOWN_RESULT도 그대로 기록한다.
      enum: [ACCEPTED, APPLIED, REJECTED, UNKNOWN_RESULT, COMPENSATED, COMPENSATION_FAILED]
    Actor:
      type: object
      required: [actorId, actorType]
      properties:
        actorId: { type: string }
        actorType: { type: string, enum: [OPERATOR, SERVICE, CUSTOMER, RIDER, DRIVER, SYSTEM] }
        onBehalfOf: { type: [string, 'null'], description: 대행(Delegation) 시 원권한자 }
        roleGrantRef: { type: [string, 'null'], description: auth RoleGrant/긴급권한 참조 }
        roles: { type: array, items: { type: string }, description: '기록 시점 역할 사본(예 CS_AGENT). 0.2.0' }
        centerScope: { type: array, items: { type: string } }
    AuditEntryInput:
      type: object
      required: [occurredAt, actor, action, target, outcome, sourceSystem]
      properties:
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/Actor' }
        action: { type: string, description: 예 approval.decide / inventory.adjust / delivery.correct-status }
        sourceSystem: { type: string }
        target:
          type: object
          required: [targetType, targetId]
          properties:
            targetType: { type: string }
            targetId: { type: string }
            versionBefore: { type: [integer, 'null'] }
            versionAfter: { type: [integer, 'null'] }
            centerId: { type: [string, 'null'] }
        reason: { type: string, maxLength: 1000 }
        approvalRef: { type: [string, 'null'], description: 승인 근거(approval-service dossier) }
        requestId: { type: string, description: 원명령 Idempotency-Key }
        traceId: { type: string }
        outcome: { $ref: '#/components/schemas/AuditOutcome' }
        before: { type: object, additionalProperties: true, description: 변경 전 값 사본 }
        after: { type: object, additionalProperties: true, description: 변경 후 값 사본 }
        compensation:
          type: object
          properties:
            attempted: { type: boolean }
            outcome: { type: string }
            ref: { type: string }
        evidenceRefs: { type: array, items: { type: string } }
    AuditEntry:
      allOf:
        - $ref: '#/components/schemas/AuditEntryInput'
        - type: object
          required: [auditEntryId, recordedAt]
          properties:
            auditEntryId: { type: string }
            recordedAt: { type: string, format: date-time }
            sequence: { type: integer, description: 추가 전용 단조 증가 번호 }
    PiiAccessLogInput:
      type: object
      required: [occurredAt, actor, subjectRef, accessType, fields, purpose]
      properties:
        occurredAt: { type: string, format: date-time }
        actor: { $ref: '#/components/schemas/Actor' }
        subjectType:
          type: string
          enum: [CUSTOMER, RIDER, DRIVER, OPERATOR]
          default: CUSTOMER
          description: 정보주체 종류(BO-25 — 고객·라이더·간선 기사·운영자 계정을 따로 구분). 0.2.0, 없으면 CUSTOMER
        subjectRef: { type: string, minLength: 1, maxLength: 128, description: 정보주체 참조(고객 ID 등; 원문 PII 금지) }
        accessType: { type: string, enum: [VIEW, DOWNLOAD, EXPORT, SEARCH] }
        fields: { type: array, minItems: 1, maxItems: 30, items: { type: string, maxLength: 40 }, description: 열람 항목 코드(PHONE / ADDRESS / NAME / ENTRANCE …) }
        purpose: { type: string, minLength: 1, maxLength: 500, description: 열람 사유(직원 입력). 로그 금지 }
        screen: { type: string, maxLength: 120, description: 백오피스 화면 식별자 }
        caseRef: { type: [string, 'null'], maxLength: 128, description: '담당 사건·주문 참조(예 ORDER:ORD-…)' }
        recordCount: { type: integer, minimum: 1, default: 1 }
        traceId: { type: string }
    PiiAccessLogRecorded:
      type: object
      required: [piiAccessLogId, recordedAt]
      properties:
        piiAccessLogId: { type: string }
        recordedAt: { type: string, format: date-time }
    PiiAccessLog:
      allOf:
        - $ref: '#/components/schemas/PiiAccessLogInput'
        - type: object
          required: [piiAccessLogId, recordedAt, sourceSystem, requestId]
          properties:
            piiAccessLogId: { type: string }
            recordedAt: { type: string, format: date-time }
            sourceSystem: { type: string, description: 기록을 요청한 서비스(X-Source-System) }
            requestId: { type: string, description: 기록 요청의 Idempotency-Key }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
