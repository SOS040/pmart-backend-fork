openapi: 3.1.0
info:
  title: hr-service
  version: 0.7.0
  description: |
    직원 등록·인사 정보·계정 발급(ADR-0056 결정 5·7·8·10·12·16). 인사팀(HR_ADMIN)이 한 화면에서 기본 정보와 요청 권한을 받아 직원을 등록하면
    hr-service 가 사서함(@pmart.com, mail-provisioner) → Keycloak 계정(hr-provisioner, Admin API) → 비밀번호 설정 메일(Keycloak) 순서로
    계정을 발급하고(뒤에서 — 진행 상태를 조회), 끝나면 `EmployeeRegistered` 를 발행한다(employee-auth-service 가 로그인 상태로 반영).
    정본: 직원 신원·고용 정보(운영자 ID OP-…, 사번 P<연도>-<5자리>, 이름, 메일 ID, 고용 형태, 소속, 근무 시작일·계약 종료일, 재직 상태), 계정 발급 진행 상태.
    비정본: 로그인·토큰·**직원 권한의 효력**(employee-auth-service — 등록 화면의 요청 권한은 approval 에 올릴 뿐, ADR-0056 결정 4), 비밀번호(Keycloak·메일 서버 —
    hr-service 는 받지도 저장하지도 않는다), MFC 작업 자격(mfc-capacity).
    권한: 조회·명령 모두 HR_ADMIN(본인 조회 /hr/employees/me 만 모든 직원).
    409 code(Problem Details `code`): MAIL_ID_TAKEN(메일 ID 사용 중·퇴사자 포함), VERSION_CONFLICT(X-Expected-Version 이 지금 버전과 다름 — 다시 조회),
    INVALID_STATE(지금 상태에서 할 수 없는 명령 — 퇴사자 정지, 발급 실패가 아닌데 재시도, Keycloak 계정이 없거나 재직 중이 아닌데 안내 메일, 사서함이 없거나 퇴사자인데
    사서함 비밀번호), KEYCLOAK_<HTTP 상태>·MAILBOX_<HTTP 상태>(Keycloak·메일 서버가 거절). 이미 그 상태인 복귀·퇴사는 바꾸지 않고 200.
    503 DEPENDENCY_UNAVAILABLE(Keycloak·메일 서버 응답 없음 — 잠시 뒤 다시).
    0.2.0(2026-11-15): 본사 부서 코드 목록 GET /hr/departments, 표시 이름 PUT /hr/departments/{code}. 소속 코드는 지금처럼 아무 값이나 받고
    처음 보는 본사 부서 코드는 등록·소속 변경 때 목록에 더한다(이름 없음).
    0.5.0(2026-11-17): 내부 이름 조회 GET /internal/employee-names(employee-auth-service 가 승인자·회수자 이름을 붙이려고 — 토큰 없는 서비스 간 호출).
    0.6.0(2026-11-17, HR-2 권한 요청 검사 — 사용자 수락): 등록 requestedGrants 와 POST /hr/employees/{operatorId}/grant-requests 의 grants 를 검사한다.
    역할 목록·센터 지정(centerScoped)과 지금 권한은 employee-auth-service 가 정본이라 그 서비스 내부 조회(GET /internal/roles·/internal/employees/{id}/grants)로 읽는다.
    - 400 VALIDATION_FAILED: 한 요청 안에 같은 역할이 두 줄(details[].field = grants 또는 requestedGrants — 센터는 한 줄에 모은다),
      모르는 역할(field grants[i].role), 센터 지정 역할(MFC_SUPERVISOR·MFC_WORKER)에 센터 없음·센터가 필요 없는 역할에 센터 있음(field grants[i].centers —
      등록은 requestedGrants[i].…).
    - 409 GRANT_ALREADY_ACTIVE(권한 추가·변경 요청만): 이미 유효하거나 시작 전인 같은 권한이 있음 — 역할이 같고, 센터가 겹치고(센터가 필요 없는 역할은 센터와 상관없이,
      둘 다 센터 없음도 겹침), 기간이 지금 이후로 겹침. details[] 한 줄 = 겹친 기존 권한 하나: field = grants[i],
      reason = `existingGrantId=<id>;role=<역할>;centers=<A,B>;validFrom=<시각>;validUntil=<시각|none>;extension=<true|false>`(시각은 UTC ISO-8601,
      validUntil 은 이 시각부터 무효). 기존 권한이 끝난 뒤(validUntil 이후 날짜)부터 시작하는 요청은 받는다.
      기간 연장(겹치면서 더 늦게 끝나는 요청 — extension=true)도 지금은 409 — 연장을 새 요청으로 받을지 "연장" 요청으로 나눌지 결정 대기, 별도 기능 없음.
    - 503 DEPENDENCY_UNAVAILABLE: employee-auth-service 를 읽지 못함(검사 없이 받지 않는다 — 잠시 뒤 다시).

    0.7.0(2026-11-18, 역할·센터 섞임 — permissions.md §9 큰 것 2): 직원 토큰은 역할과 센터를 따로 모아 싣는다(A 센터 관리자 + B 센터 작업자면 B 에서도 관리자).
    그래서 같은 때 유효한 권한들 안에서 센터 지정 역할(MFC_SUPERVISOR·MFC_WORKER) 하나하나의 센터가 센터 전체와 같아야 한다. 요청 행마다 기간이 지금 이후로 겹치는
    지금 권한·같은 요청의 다른 행과 묶어 본다(관리자@A + 관리자@B, 관리자@A + 작업자@A 는 괜찮음. 관리자@A + 작업자@B, 관리자@{A,B} + 작업자@A 는 섞임).
    - 409 CENTER_ROLE_MIX(권한 추가·변경 요청): 지금 권한과 섞임. details[0]: field = grants[i], reason = `existingGrantId=<id>;role=<역할>;centers=<A,B>`.
    - 400 VALIDATION_FAILED: 같은 요청의 행끼리 섞임(field grants[i] 또는 requestedGrants[i]).
    계정에 직접 둔 역할·센터(이전 계정·관리 경로)는 여기서 보지 않는다 — employee-auth-service 가 반영 때 같은 규칙으로 거른다(반영 회신 REJECTED CENTER_ROLE_MIX).
    employee-auth-service 도 승인 반영 때 같은 겹침이면 새 권한 줄을 만들지 않는다(안전망).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: employees, description: 직원 등록·조회·소속 변경 }
  - { name: employment, description: 정지·복귀·퇴사 }
  - { name: provisioning, description: 계정 발급(사서함·Keycloak·안내 메일) 진행·재시도 }
  - { name: self, description: 본인 조회 }
  - { name: departments, description: 본사 부서 코드 목록(소속 HQ_DEPARTMENT 고르기용) }
  - { name: internal, description: "(0.5.0) 서비스 간 전용 — 게이트웨이가 막는다(토큰 없는 내부 호출, ADR-0026)" }

paths:
  /hr/employees:
    post:
      tags: [employees]
      summary: 직원 등록 (기본 정보 즉시 효력 + 요청 권한은 승인 요청으로 — 계정 발급은 뒤에서)
      description: |
        같은 메일 ID 가 있으면(퇴사자 포함 — 다시 쓰지 않는다) 409 MAIL_ID_TAKEN. 운영자 ID(OP-<UUID>)와 사번(P<등록 연도>-<5자리>, 연도별 순번)을 매긴다.
        계정 발급(provisioning)은 응답 뒤에 진행된다 — GET /hr/employees/{operatorId} 의 provisioning 으로 본다.
        사서함 초기 비밀번호는 이 응답에 없다(요청 재전송 대비로 응답이 저장되므로) — POST /hr/employees/{operatorId}/mailbox-password-resets 로 받는다.
        요청 권한(requestedGrants)은 계정 발급이 끝날 때 approval-service 에 권한 요청(GrantRequested)으로 올라간다(PENDING → SUBMITTED).
        소속 센터의 MFC_WORKER 는 자동 승인, 나머지는 승인자 심사 — 결과가 오면 APPROVED·REJECTED. 효력은 employee-auth-service 가 승인 뒤 정한다(ADR-0056 5-4).
        비운 기간은 근무 기간(시작일 ~ 계약 종료일).
        (0.6.0) requestedGrants 검사 — 같은 역할 두 줄·모르는 역할·센터 규칙(centerScoped)은 400(field requestedGrants·requestedGrants[i].role·requestedGrants[i].centers),
        역할 목록을 employee-auth-service 에서 읽지 못하면 503 DEPENDENCY_UNAVAILABLE(직원도 만들지 않는다). 새 직원이라 이미 가진 권한 검사(409)는 없다.
      operationId: registerEmployee
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeRegistration' }
      responses:
        '201':
          description: 등록됨(계정 발급 진행 중)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [employees]
      summary: 직원 목록 (상태·소속·검색어 — 이름·메일 ID·사번)
      operationId: listEmployees
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/EmploymentStatus' } }
        - { name: affiliationCode, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 60 }, description: 이름·메일 ID·사번 앞부분 }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeePage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /hr/employees/me:
    get:
      tags: [self]
      summary: 본인 인사 정보 (이름·사번·메일·소속 — 모든 직원)
      description: 토큰의 운영자 ID 로 찾는다. 인사 기록이 없는 운영자(이전 전 계정 등)는 404.
      operationId: getMyEmployee
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeSelf' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /hr/employees/{operatorId}:
    parameters:
      - $ref: '#/components/parameters/OperatorId'
    get:
      tags: [employees]
      summary: 직원 조회 (계정 발급 진행 포함)
      operationId: getEmployee
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /hr/employees/{operatorId}/affiliation-changes:
    post:
      tags: [employees]
      summary: 소속 변경 (이전 센터 권한은 다음 날 00:00 자동 종료 — 새 센터 권한은 따로 요청, BO-01)
      description: |
        0.4.0(2026-11-16 BO-01 사용자 결정 — 실서비스 추천안): 계정 발급이 끝난 직원의 소속이 실제로 바뀌면 EmployeeAffiliationChanged 를 낸다.
        이전 소속이 센터면 그 센터가 들어 있는 승인 권한(grant)을 employee-auth-service 가 **바뀐 날 다음 날 00:00(Asia/Seoul)** 에 끝낸다 — 그날 안에 진행 중인 일을 인계.
        새 센터 권한은 자동으로 주지 않는다(grant-requests 로 요청 → 승인, 자기 센터 MFC_WORKER 는 자동 승인 규칙). 같은 소속이면 사건 없음.
      operationId: changeAffiliation
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [affiliation, reason]
              properties:
                affiliation: { $ref: '#/components/schemas/Affiliation' }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /hr/employees/{operatorId}/grant-requests:
    post:
      tags: [employment]
      summary: 권한 추가·변경 요청 (BO-01 — 재직 중·계정 발급이 끝난 직원, approval 승인 뒤 효력, 0.3.0)
      description: |
        2026-11-15 사용자 결정(BO-01): 추가·변경은 등록 때와 같이 approval-service 승인을 거친다(GrantRequested → 승인함 → employee-auth-service 가 적용).
        회수(줄이기)는 이 API 가 아니라 employee-auth-service `POST /employee-auth/employees/{operatorId}/grant-revocations`(승인 없이 즉시).
        변경 = 새 권한 요청 + 필요하면 예전 권한 회수.
        기간을 비우면 시작 = 근무 시작일, 끝 = 계약 종료일(정규직은 없음 — 근무 기간까지).
        거절: 자기 권한 요청 403, 재직 중이 아니거나 계정 발급 전 409 INVALID_STATE, 아직 결정되지 않은 권한 요청이 있으면 409 GRANT_REQUEST_PENDING(승인 하나씩).
        (0.6.0, HR-2) 검사 순서: 같은 역할 두 줄 400(field grants) → 역할 목록(employee-auth-service)으로 모르는 역할 400(grants[i].role)·센터 규칙 400(grants[i].centers —
        centerScoped 역할은 센터 1개 이상, 아닌 역할은 센터 없음) → 위 403·409 → 이미 유효하거나 시작 전인 같은 권한 409 GRANT_ALREADY_ACTIVE
        (역할 같음 + 센터 겹침 + 기간이 지금 이후로 겹침 — details 형식은 info.description 0.6.0). 기존 권한이 끝난 뒤부터 시작하는 요청은 받는다.
        기간 연장(겹치면서 더 늦게 끝남)은 아직 별도 기능이 없어 409(결정 대기). employee-auth-service 를 읽지 못하면 503 DEPENDENCY_UNAVAILABLE.
      operationId: requestEmployeeGrants
      x-pmart-user-types: [OPERATOR]
      x-added-in: '2026-11-15'
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grants, reason]
              properties:
                grants: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/RequestedGrant' } }
                reason: { type: string, minLength: 1, maxLength: 500, description: 요청 사유(행마다 reason 이 없으면 이 값) }
      responses:
        '200':
          description: 요청 제출됨(requestedGrants 에 SUBMITTED 로 보임 — 승인 결과가 오면 APPROVED·REJECTED)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: 'INVALID_STATE / GRANT_REQUEST_PENDING / GRANT_ALREADY_ACTIVE(0.6.0 — 이미 유효·예정인 같은 권한, 기간 연장 포함) / CENTER_ROLE_MIX(0.7.0 — 센터마다 다른 MFC 역할) / VERSION_CONFLICT / IDEMPOTENCY_CONFLICT'
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /hr/employees/{operatorId}/suspensions:
    post:
      tags: [employment]
      summary: 정지 (Keycloak 계정 비활성·세션 로그아웃 → EmployeeSuspended → employee-auth-service 가 세션 종료·즉시 차단)
      operationId: suspendEmployee
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 정지됨(이미 정지면 그대로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /hr/employees/{operatorId}/reinstatements:
    post:
      tags: [employment]
      summary: 복귀·재입사 (같은 운영자 ID·사번·메일 ID 를 다시 활성 — 정지·퇴사 모두)
      operationId: reinstateEmployee
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                startDate: { type: string, format: date, description: 재입사 근무 시작일(생략하면 그대로) }
                endDate: { type: string, format: date, description: 새 계약 종료일(정규직은 비움) }
      responses:
        '200':
          description: 복귀됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /hr/employees/{operatorId}/departures:
    post:
      tags: [employment]
      summary: 퇴사 (계정·사서함은 지우지 않고 비활성 — 메일 ID 는 다시 쓰지 않는다, D7)
      operationId: departEmployee
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 퇴사 처리됨(이미 퇴사면 그대로)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /hr/employees/{operatorId}/invite-resends:
    post:
      tags: [provisioning]
      summary: 비밀번호 설정 메일 다시 보내기 (Keycloak execute-actions-email)
      operationId: resendInvite
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '202': { description: 보냄(메일 도착은 사서함에서 확인) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /hr/employees/{operatorId}/provisioning-retries:
    post:
      tags: [provisioning]
      summary: 실패한 계정 발급 다시 시도 (FAILED·COMPENSATED 일 때만 — 이미 끝난 단계는 건너뛴다. 그 밖은 409 INVALID_STATE)
      operationId: retryProvisioning
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '202':
          description: 다시 진행
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Employee' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /hr/employees/{operatorId}/mailbox-password-resets:
    post:
      tags: [provisioning]
      summary: 사서함(웹메일) 초기 비밀번호 발급 — 응답에 한 번만, 저장하지 않음
      description: |
        새 무작위 비밀번호로 사서함 비밀번호를 바꾸고 그 값을 이 응답에만 싣는다(Cache-Control no-store). hr-service 는 저장·로그하지 않는다 —
        잃어버리면 다시 발급한다. 같은 Idempotency-Key 재전송도 결과를 재생하지 않는다(새로 발급). 직원은 웹메일 첫 로그인 뒤 바꾼다.
        Keycloak(로그인) 비밀번호와 다르다 — 그쪽은 본인이 메일 링크로 정한다.
      operationId: resetMailboxPassword
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/OperatorId'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                required: [mailAddress, initialPassword]
                properties:
                  mailAddress: { type: string }
                  initialPassword: { type: string, description: 한 번만 보인다. 로그·저장 금지 }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /hr/departments:
    get:
      tags: [departments]
      summary: 본사 부서 코드 목록 (코드 오름차순 — 등록·소속 변경 화면에서 고르기용)
      description: |
        지금까지 소속(HQ_DEPARTMENT)으로 입력된 코드와 PUT 으로 만든 코드. 목록에 없는 코드도 등록·소속 변경에서 그대로 받고, 그때 목록에 더한다(이름 없음).
        employeeCount = 그 부서 소속 직원 중 퇴사하지 않은(ACTIVE·SUSPENDED) 수.
      operationId: listDepartments
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DepartmentList' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /hr/departments/{code}:
    put:
      tags: [departments]
      summary: 본사 부서 표시 이름 정하기 (없으면 만든다 — 멱등. name 을 비우면 이름 지움)
      operationId: putDepartment
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/DepartmentCode'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, description: '표시 이름(예 인사팀). 생략·빈 값이면 이름 없음' }
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Department' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /internal/employee-names:
    get:
      tags: [internal]
      summary: '[employee-auth→hr] 운영자 ID 여러 개 → 표시 이름 (토큰 없는 내부 호출, 0.5.0)'
      description: |
        2026-11-17 사용자 결정(인사팀 앱 권한 상세의 승인 칸이 이름 대신 OP-… 로 보임 → 백엔드가 이름을 붙인다): employee-auth-service 가
        직원 조회 응답의 승인자(approverId)·회수자(revokedBy) 이름을 한 번에 읽는다. 퇴사자도 이름을 돌려준다(지난 승인 기록 표시용).
        모르는 ID 는 items 에서 빠진다(오류 아님). 이름 외의 인사 정보(메일·사번·소속)는 싣지 않는다.
      x-added-in: '2026-11-17'
      operationId: getEmployeeNamesInternal
      parameters:
        - name: operatorIds
          in: query
          required: true
          description: '운영자 ID(반복 — ?operatorIds=OP-a&operatorIds=OP-b). 같은 값은 한 번만'
          schema:
            type: array
            minItems: 1
            maxItems: 200
            items: { type: string, pattern: '^[A-Za-z0-9_.:@-]{1,128}$' }
      responses:
        '200':
          description: OK — 아는 ID 만(순서 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeNameList' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  parameters:
    OperatorId:
      name: operatorId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
    DepartmentCode:
      name: code
      in: path
      required: true
      description: 본사 부서 코드(Affiliation.code 와 같은 형식)
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
  schemas:
    EmploymentType:
      type: string
      enum: [REGULAR, PART_TIME, DAILY]
      description: 정규직 / 파트타임(알바) / 일일크루 — mfc-capacity employmentType 과 같은 값
    EmploymentStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, LEFT]
    Affiliation:
      type: object
      required: [type, code]
      description: 소속(권한 범위가 아니다). 본사 부서 코드 또는 센터 코드(center-master)
      properties:
        type: { type: string, enum: [HQ_DEPARTMENT, CENTER] }
        code: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
    RequestedGrant:
      type: object
      required: [role]
      description: '(0.6.0) 한 요청 안에서 역할은 한 번만(여러 센터는 centers 에 모은다)'
      properties:
        role: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$', description: 'employee-auth-service 역할 목록(GET /employee-auth/roles) 안의 코드 — 밖이면 400(0.6.0)' }
        centers:
          type: array
          maxItems: 64
          items: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
          description: '권한 센터. 역할 목록의 centerScoped 가 true 인 역할(MFC_SUPERVISOR·MFC_WORKER)은 1개 이상 필수, false 인 역할은 비워야 한다 — 어기면 400(0.6.0)'
        validFrom: { type: string, format: date, description: 생략하면 근무 시작일 }
        validTo: { type: string, format: date, description: 생략하면 계약 종료일(정규직은 없음) }
        reason: { type: string, maxLength: 500 }
    EmployeeRegistration:
      type: object
      required: [name, mailId, employmentType, affiliation, startDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 60, description: '0.5.1(2026-11-17) — 로그인 계정(Keycloak) 이름 규칙상 쓸 수 없는 문자 < > & " $ % ! # ? § ; * ~ / \ | ^ = [ ] { } ( ) 가 있으면 400 VALIDATION_FAILED(field name). 전에는 등록은 되고 계정 발급이 KEYCLOAK_400 으로 실패했다' }
        mailId:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{1,30}[a-z0-9]$'
          description: '메일 ID — 주소는 <mailId>@pmart.com, Keycloak 로그인 아이디도 이 주소. 소문자·숫자·._- 3~32자. postmaster·no-reply 등 예약어 불가'
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        affiliation: { $ref: '#/components/schemas/Affiliation' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: 계약 종료일 — PART_TIME·DAILY 는 필수, REGULAR 는 비움. 이 날이 지나면 자동 정지 }
        requestedGrants: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/RequestedGrant' } }
    ProvisioningStep:
      type: string
      enum: [REQUESTED, MAILBOX_CREATED, IAM_CREATED, INVITE_SENT, DONE, FAILED, COMPENSATED]
      description: |
        REQUESTED → MAILBOX_CREATED(사서함이 메일을 받음) → IAM_CREATED(Keycloak 계정) → INVITE_SENT(비밀번호 설정 메일) → DONE(EmployeeRegistered 발행).
        재시도를 다 쓰면 FAILED(provisioning-retries 로 다시), 보상(만든 사서함 비활성)까지 했으면 COMPENSATED.
    Provisioning:
      type: object
      required: [step, attempts]
      properties:
        step: { $ref: '#/components/schemas/ProvisioningStep' }
        attempts: { type: integer }
        lastErrorCode: { type: string, description: 마지막 실패 코드(비밀값 없음) }
        nextAttemptAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    GrantRequestState:
      type: object
      required: [role, centers, submission]
      properties:
        role: { type: string }
        centers: { type: array, items: { type: string } }
        validFrom: { type: string, format: date, description: 비워 받았으면 근무 시작일 }
        validTo: { type: string, format: date, description: '비워 받았으면 계약 종료일(정규직은 없음 — 기한 없음)' }
        reason: { type: string, description: 등록 때 받은 근거 }
        approvalRef: { type: string, description: 'approval 승인 ID(AP-…) — 결정이 온 뒤' }
        submission: { type: string, enum: [PENDING, SUBMITTED, APPROVED, REJECTED], description: 'PENDING = 아직 approval 에 올리지 않음(계정 발급 전·발급 중 정지), SUBMITTED = 승인 대기, APPROVED·REJECTED = approval 결정' }
    Employee:
      type: object
      required: [operatorId, employeeNo, name, mailAddress, employmentType, affiliation, startDate, status, provisioning, version, createdAt, updatedAt]
      properties:
        operatorId: { type: string, description: '운영자 ID(OP-…) — 토큰 sub·서비스 간 식별자' }
        employeeNo: { type: string, description: '사번(P2026-00012) — 화면 표시·검색용' }
        name: { type: string }
        mailAddress: { type: string }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        affiliation: { $ref: '#/components/schemas/Affiliation' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
        provisioning: { $ref: '#/components/schemas/Provisioning' }
        requestedGrants: { type: array, items: { $ref: '#/components/schemas/GrantRequestState' } }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EmployeePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Employee' } }
        nextCursor: { type: string }
    EmployeeSelf:
      type: object
      required: [operatorId, employeeNo, name, mailAddress, employmentType, affiliation, status]
      properties:
        operatorId: { type: string }
        employeeNo: { type: string }
        name: { type: string }
        mailAddress: { type: string }
        employmentType: { $ref: '#/components/schemas/EmploymentType' }
        affiliation: { $ref: '#/components/schemas/Affiliation' }
        status: { $ref: '#/components/schemas/EmploymentStatus' }
    Department:
      type: object
      required: [code]
      properties:
        code: { type: string, description: '본사 부서 코드(예 1004)' }
        name: { type: string, description: 표시 이름 — 정하지 않았으면 없음 }
        employeeCount: { type: integer, description: 이 부서 소속 직원 중 퇴사하지 않은 수 }
    DepartmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Department' } }
    EmployeeNameList:
      type: object
      required: [items]
      description: (0.5.0) 내부 이름 조회 응답
      properties:
        items:
          type: array
          items:
            type: object
            required: [operatorId, name]
            properties:
              operatorId: { type: string }
              name: { type: string }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
