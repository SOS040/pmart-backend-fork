openapi: 3.1.0
info:
  title: review-service
  version: 0.3.0
  x-stage: 2
  description: |
    리뷰·사진·평점, 작성/수정/삭제 이력(REV_ELIGIBLE→SUBMIT_PENDING→PUBLISHED→LOCKED(3일) / DELETED), 자격(품목별 실제 배송완료 후 14일 1건)의 정본. (docs/architecture/service-map.md §1, 2단계)
    비정본: 배송완료 사실(delivery-execution/order), 신고·차단 정책 [팀 확인 필요]. 평점 집계 투영은 product-content.
    발행: ReviewPublished, ReviewDeleted. 구독: DeliveryCompleted(자격 시작. 분할배송은 품목별 실제 수령 시각).
    최초 등록 후 3일 미만만 수정, 삭제 후 재작성 불가.
    0.2.0(2026-11-16, 구현): 사진 올리기·보기(`/review-photos`, 리뷰당 5장·장당 10MB·JPEG/PNG/WEBP — 사용자 결정), 자격에 상품명(주문 당시 사본).
    자격은 DeliveryCompleted(품목별 첫 수령 시각)로 생긴다. 작성 때 주문 원장으로 다시 확인 — 그 품목이 받은 수량만큼 모두 반품되었으면 NOT_ELIGIBLE(사용자 결정 "전체 환불이면 새 작성 막기", 이미 쓴 리뷰는 그대로).
    작성자 표시는 고객 별명을 가린 값(customer-service 내부 조회, 작성 때 한 번 저장). 운영자 숨김·신고는 아직 없다(사용자 결정 — 정책 승인 전).
    0.3.0(2026-11-18, 사용자 결정 "A해줘" — 리뷰 요청 알림): 내부 조회 `GET /internal/orders/{orderId}/review-status` — 그 주문에서 이 계정이 리뷰를 썼는지(삭제한 것 포함)·아직 쓸 수 있는 품목 수.
    notification-service 가 배송 완료 1시간 뒤 "리뷰를 남겨 주세요" 알림을 보낼지 정할 때 부른다(토큰 없는 내부 호출). 반품 여부는 보지 않는다(작성 때 order 로 확인).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: eligibilities, description: 본인 리뷰 작성 자격 }
  - { name: reviews, description: 리뷰 작성·수정·삭제·조회 }
  - { name: photos, description: 리뷰 사진 올리기·본문(비공개 버킷을 이 서비스가 대신 읽어 준다) }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /me/review-eligibilities:
    get:
      tags: [eligibilities]
      summary: 본인 리뷰 자격 조회 (주문 품목별. 기한은 품목 실제 배송완료 + 14일)
      operationId: listMyReviewEligibilities
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Eligibility' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /reviews:
    post:
      tags: [reviews]
      summary: 리뷰 작성 (품목당 1건. REV_ELIGIBLE → SUBMIT_PENDING → PUBLISHED)
      operationId: createReview
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewRequest' }
      responses:
        '201':
          description: 등록됨 (사진 처리 중이면 state SUBMIT_PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: NOT_ELIGIBLE (배송완료 사실 없음·남의 품목·받은 수량 전부 반품) / ELIGIBILITY_EXPIRED (14일 경과) / ALREADY_REVIEWED / REWRITE_AFTER_DELETE_FORBIDDEN / PHOTO_NOT_FOUND (내가 올린 사진이 아니거나 다른 리뷰에 쓰임)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /reviews/{reviewId}:
    get:
      tags: [reviews]
      summary: 리뷰 단건 조회
      operationId: getReview
      security: []
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [reviews]
      summary: 리뷰 수정 (최초 등록 후 3일 미만, 본인만)
      operationId: updateReview
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                text: { type: string, maxLength: 1000 }
                photoIds: { type: array, maxItems: 5, items: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (LOCKED 3일 경과 또는 DELETED) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: PHOTO_NOT_FOUND (내가 올린 사진이 아니거나 다른 리뷰에 쓰임)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [reviews]
      summary: 리뷰 삭제 (삭제 후 재작성 불가. ReviewDeleted 발행)
      operationId: deleteReview
      x-pmart-user-types: [CUSTOMER]
      x-pmart-user-types-note: "작성자 본인 삭제(운영자 숨김은 아직 없음 — 2026-11-16 사용자 결정)"
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 (이미 삭제면 멱등 성공) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /products/{productId}/reviews:
    get:
      tags: [reviews]
      summary: 상품 리뷰 목록 (PUBLISHED/LOCKED만. 작성자는 마스킹)
      operationId: listProductReviews
      security: []
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [NEWEST, RATING_DESC, RATING_ASC], default: NEWEST } }
        - { name: withPhotoOnly, in: query, schema: { type: boolean, default: false } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  summary:
                    type: object
                    properties:
                      averageRating: { type: number }
                      reviewCount: { type: integer }

  /review-photos:
    post:
      tags: [photos]
      summary: 리뷰 사진 올리기 (리뷰 작성·수정 전에 한 장씩)
      description: |
        JPEG·PNG·WEBP(파일 앞부분으로 판정), 장당 10MB 이하. 돌려준 photoId 를 작성·수정의 photoIds 에 넣는다(리뷰당 5장).
        올린 사람만 그 사진을 리뷰에 붙일 수 있다. 24시간 안에 리뷰에 붙지 않은 사진은 지운다. 같은 Idempotency-Key 재전송은 같은 photoId.
      operationId: uploadReviewPhoto
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 저장
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewPhoto' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422':
          description: PHOTO_INVALID (형식·크기)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /review-photos/{photoId}:
    get:
      tags: [photos]
      summary: 리뷰 사진 본문 (공개 리뷰에 붙은 사진만 — 토큰 없이 `<img src>`)
      operationId: getReviewPhoto
      security: []
      parameters:
        - { name: photoId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 이미지 바이트(바뀌지 않으므로 긴 캐시)
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  # ---------- internal (서비스 토큰) ----------
  /internal/reviews/{reviewId}:
    get:
      tags: [internal]
      summary: '[content/case→review] 리뷰 원문·상태·작성자 조회 (신고 처리·집계 검증용)'
      operationId: getReviewInternal
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Review'
                  - type: object
                    properties:
                      accountId: { type: string }
                      orderLineId: { type: string }
                      deliveredAt: { type: string, format: date-time, description: 자격 근거 (order 사본) }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/review-status:
    get:
      tags: [internal]
      summary: '[notification→review] 주문의 리뷰 작성 여부 (토큰 없는 내부 호출) — 리뷰 요청 알림을 보낼지'
      description: |
        이 계정(accountId)의 그 주문 품목 중 리뷰 자격이 있는 품목 수·리뷰를 쓴 품목 수(삭제한 리뷰 포함 — 삭제 뒤 재작성은 못 한다)·아직 쓸 수 있는 품목 수(리뷰 없음·기한 안).
        자격이 아직 없거나 남의 주문이면 모두 0(404 아님). 반품으로 쓸 수 없게 된 품목은 여기서 가리지 않는다(작성 때 order 로 확인).
        리뷰 본문·작성자는 주지 않는다. (0.3.0, 2026-11-18)
      x-added-in: '2026-11-18'
      operationId: getOrderReviewStatus
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: accountId, in: query, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderReviewStatus' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

components:
  schemas:
    OrderReviewStatus:
      type: object
      description: 주문 하나의 리뷰 작성 여부(본인 계정 기준). 0.3.0
      required: [orderId, accountId, eligibleLineCount, reviewedLineCount, openLineCount, reviewed]
      properties:
        orderId: { type: string }
        accountId: { type: string }
        eligibleLineCount: { type: integer, description: 리뷰 자격이 생긴(배송 완료된) 품목 수 }
        reviewedLineCount: { type: integer, description: 리뷰를 쓴 품목 수(삭제한 리뷰 포함) }
        openLineCount: { type: integer, description: 리뷰가 없고 작성 기한(수령 + 14일) 안인 품목 수 }
        reviewed: { type: boolean, description: reviewedLineCount > 0 }
    ReviewState:
      type: string
      enum: [REV_ELIGIBLE, SUBMIT_PENDING, PUBLISHED, LOCKED, DELETED, EXPIRED]
    Eligibility:
      type: object
      properties:
        orderId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        productName: { type: [string, 'null'], description: 주문 당시 상품명 사본(없을 수 있다) }
        deliveredAt: { type: string, format: date-time, description: 품목별 실제 수령 시각 }
        eligibleUntil: { type: string, format: date-time, description: deliveredAt + 14일 }
        state: { $ref: '#/components/schemas/ReviewState' }
        reviewId: { type: [string, 'null'] }
    CreateReviewRequest:
      type: object
      required: [orderLineId, rating]
      properties:
        orderLineId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 1000 }
        photoIds: { type: array, maxItems: 5, items: { type: string }, description: 업로드 완료된 사진 ID (POST /review-photos) }
    Review:
      type: object
      required: [reviewId, productId, rating, state, createdAt]
      properties:
        reviewId: { type: string }
        productId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        authorMasked: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string }
        photos:
          type: array
          items:
            type: object
            properties:
              photoId: { type: string }
              url: { type: string, description: '사진 본문 경로 (/api/v1/review-photos/{photoId})' }
        state: { $ref: '#/components/schemas/ReviewState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
        editableUntil: { type: string, format: date-time, description: createdAt + 3일 }
        updatedAt: { type: [string, 'null'], format: date-time }
    ReviewPhoto:
      type: object
      required: [photoId, contentType, sizeBytes, uploadedAt]
      properties:
        photoId: { type: string }
        url: { type: string, description: '사진 본문 경로 (/api/v1/review-photos/{photoId}) — 공개 리뷰에 붙은 뒤에만 열린다' }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        sizeBytes: { type: integer, format: int64 }
        uploadedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
