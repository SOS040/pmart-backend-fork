openapi: 3.1.0
info:
  title: cart-service
  version: 0.6.0
  description: |
    0.6.0(2026-11-26, ADR-0090 수량 행사 1+1·2+1): 품목 `quantity` 는 유상 수량. 표시 사본에 `quantityOffer`(이름·buy·free — pricing /prices 사본)와
      `freeQuantity`(= ⌊quantity ÷ buy⌋ × free, 행사 없으면 0). 합계는 유상 수량만(무료분 0원). 재고 표시(availability)는 총 수량(quantity + freeQuantity)으로 본다 —
      주문서도 총 수량으로 재고를 확인한다. 실제 무료 수량은 주문서 견적이 정한다.
    0.5.0(2026-11-25, 클라이언트 BR-97 "할인가 표시해" — 장바구니 막대 할인 전 합계 줄긋기): `Cart.selectedListAmount` = 선택 품목의 기간 할인 **전** 단가(기본가) 합계(주문 초안 `Quote.baseItemAmount` 와 같은 기준). `selectedItemAmount` 가 null 이면 null. 언제나 selectedItemAmount + selectedDiscountAmount 와 같다.
    0.4.0(2026-11-21, ADR-0082 4단계 할인가 표시): 품목 표시에 기간 할인 `salePrice`·`discountRatePercent`·`discountName`(pricing `/prices` 의 discount 사본).
    `selectedItemAmount` 는 **기간 할인 뒤** 단가 합계(주문 초안 최소주문 판정과 같은 기준 — 쿠폰 전), `selectedDiscountAmount` = 그 기간 할인 합계. 결제 금액은 주문서 견적.
    0.3.0(2026-11-20, ADR-0077 고객 탈퇴): 구독 CustomerWithdrawalCompleted(commerce.customer.v1) — 그 회원(MEMBER = accountId)의 장바구니(진행 중·만료)·품목·변경/병합 결과를 모두 지운다(재가입은 새 계정, 복원 없음). API 모양은 그대로.
    0.2.1(2026-11-18, 사용자 "추천대로"): 최소 주문 금액을 설정 저장소 공통 값 `pmart.commerce.min-order-amount`(order-service 와 같은 한 값, LAN 15000)에서 읽는다 — 상수 두 곳이던 것. 설정이 없으면 `minOrderAmount`·`minOrderShortfall` 이 null(장바구니는 그대로).
    0.2.0(2026-11-18, 고객 앱 장바구니 최소주문 안내 — 사용자 "A해줘"): 장바구니 조회(`Cart`, 변경 응답의 cart 포함)에 `minOrderAmount`(최소 주문 금액 15,000원 — order-service 주문 초안과 같은 BR-14 확정값)와 `minOrderShortfall` = max(0, minOrderAmount − selectedItemAmount). 선택 품목 가격을 하나라도 모르면(selectedItemAmount null) 부족액도 null(추측하지 않음). 표시 안내일 뿐 — 실제 차단·부족액은 주문 초안 견적(`Quote.minOrderShortfall`, 할인·쿠폰 전 상품액 기준, 배달팁·봉투값 제외)이 정본. cart → order 동기 호출은 없다.
    0.1.1(2026-11-18, mfc-inventory IV-1 — PR 세션 요청 #122): 표시 가용(availability·availableQty)이 mfc-inventory 출하 가능 수량 `shippableAvailable`(예약과 같은 소비기한 적격 LOT 의 E − R, 오늘 기준 — 장바구니는 배송일을 모름). 판정 불가(null)는 UNKNOWN(available 로 바꾸지 않음). API 모양은 그대로(설명만).
    장바구니·품목·선택·cartVersion(마지막 변경 후 30일 보존), 비회원 장바구니, 로그인 병합 이관(MERGE_PENDING/PARTIAL/CONFIRMED)의 정본. (docs/architecture/service-map.md §1)
    비정본: 재고 예약(장바구니는 예약하지 않음), 견적 확정(order), 가격 정본(pricing), 구매 상한 정책(product).
    담기 성공은 재고 확보·가격 보장·주문 확정이 아니다. 모든 수량 변경은 절대값 설정 명령이며 Idempotency-Key + expectedVersion으로 충돌을 판정한다.
    의존(동기): product(구매 상한·판매 상태), mfc-inventory(출하 가능 수량 조회 — 0.1.1. 조회 실패·판정 불가는 0이 아님), pricing(표시 가격).
    발행: CartItemChangeApplied. 구독: OrderConfirmed(확정 포함분만 1회 정리), ProductSaleStateChanged.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: carts, description: 장바구니 조회·생성 }
  - { name: items, description: 품목 담기·수량/선택 변경·삭제 (절대값 설정 명령) }
  - { name: merges, description: 주문서 로그인 후 비회원→회원 병합 이관 }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /carts:
    post:
      tags: [carts]
      summary: 장바구니 생성 또는 현재 장바구니 반환 (회원 토큰은 accountId, 비회원 토큰(typ=GUEST)은 비회원 주체 기준)
      description: |
        비회원은 먼저 auth POST /auth/guest-sessions 로 비회원 토큰을 받는다. 마지막 변경 후 30일이 지난 장바구니는 새로 만든다.
        X-Device-Id 는 기록용(선택)이며 소유 판정에 쓰지 않는다.
      operationId: createOrGetCart
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: false, schema: { type: string, maxLength: 128 }, description: 기록용(선택). 소유는 토큰 주체로 판정 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                shoppingAddressId: { type: string }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
      responses:
        '201':
          description: 생성 또는 기존 장바구니 반환
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /carts/{cartId}:
    get:
      tags: [carts]
      summary: 장바구니 조회 (cartVersion·품목·표시 가격/가용 사본 포함)
      description: |
        가격·가용·판매 상태는 각 정본의 사본이며 sources에 asOf를 표시한다. 가용 조회 실패는 UNKNOWN이지 0이 아니다.
      operationId: getCart
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '403':
          description: FORBIDDEN_OWNER (현재 고객/기기의 장바구니 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /carts/{cartId}/items:
    post:
      tags: [items]
      summary: 품목 담기 (같은 SKU는 합산이 아니라 절대 수량 설정으로 통일)
      description: |
        같은 SKU가 이미 있으면 그 품목의 수량을 quantity로 설정한다(증가 명령 아님). 검증 순서는 판매 상태 → 구매 상한(product) → 현재 PPC 가용(mfc-inventory).
      operationId: addCartItem
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity, expectedVersion]
              properties:
                sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
                selected: { type: boolean, default: true }
                expectedVersion: { $ref: '_common.yaml#/components/schemas/Version' }
      responses:
        '200':
          description: 반영됨 (status APPLIED, resultId=cartItemId, version=새 cartVersion)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChangeResult' }
        '403':
          description: FORBIDDEN_OWNER
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: CART_VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: QUANTITY_LIMIT_EXCEEDED / INSUFFICIENT_AVAILABLE_QUANTITY / SKU_NOT_SALEABLE / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CartChangeError' }
        '503':
          description: REQUEST_RESULT_UNKNOWN (하위 의존 응답 불명. GET change-requests/{requestId}로 해소) / DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /carts/{cartId}/items/{itemId}:
    patch:
      tags: [items]
      summary: 품목 수량·선택 변경 (절대값, Idempotency-Key + expectedVersion)
      description: |
        같은 Idempotency-Key·같은 본문 재전송은 기존 결과 반환이며 수량 증가가 아니다. 버전 충돌은 최신 목록을 다시 조회해 고객이 재확정한다.
        quantity 0은 허용하지 않는다(삭제는 DELETE).
      operationId: changeCartItem
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              minProperties: 2
              properties:
                quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
                selected: { type: boolean }
                expectedVersion:
                  type: integer
                  minimum: 0
                  description: 고객이 마지막으로 확인한 cartVersion. 헤더 X-Expected-Version과 같이 보내면 두 값이 일치해야 한다.
      responses:
        '200':
          description: 반영됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChangeResult' }
        '403':
          description: FORBIDDEN_OWNER
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: CART_VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: QUANTITY_LIMIT_EXCEEDED / INSUFFICIENT_AVAILABLE_QUANTITY / SKU_NOT_SALEABLE
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/CartChangeError' }
        '503':
          description: REQUEST_RESULT_UNKNOWN / DEPENDENCY_UNAVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [items]
      summary: 품목 삭제
      operationId: deleteCartItem
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '200':
          description: 삭제됨 (이미 없으면 멱등 성공)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChangeResult' }
        '403':
          description: FORBIDDEN_OWNER
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: CART_VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /carts/{cartId}/change-requests/{requestId}:
    get:
      tags: [items]
      summary: 변경 요청 원결과 조회 (REQUEST_RESULT_UNKNOWN 해소. 변경을 중복 적용하지 않음)
      operationId: getCartChangeRequest
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartChangeResult' }
        '404':
          description: NOT_FOUND (해당 키로 접수된 변경 없음 → 미적용으로 판단)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /carts/{cartId}/merges:
    post:
      tags: [merges]
      summary: 비회원 장바구니 병합 이관 (주문서 로그인 후 고객 확인분만 1회)
      description: |
        cartId는 대상 회원 장바구니. 고객이 확인한 원항목 집합만 이관하며 항목별로 재검증한다.
        (0.2.2, 2026-11-19 — 클라이언트 BR-50, 실제 동작대로 고침) 재검증 = 원항목 그대로(없거나 SKU·수량이 바뀌면 SOURCE_ITEM_CHANGED)·판매 상태·구매 상한(대상 + 앞서 이관분 누적).
        **현재 가용·가격·센터는 막지 않는다**(담기와 같다 — 가용은 담기를 막지 않는다, Commerce 7장): 비회원 장바구니와 회원 장바구니의 mfcId 가 달라도 거절하지 않고,
        합친 뒤 회원 장바구니 조회가 그 장바구니 센터 기준으로 품절·미취급(availability)을 보여 주며 주문서 견적이 막는다.
        X-Guest-Token 이 만료·무효·비회원 토큰이 아니거나 원본 장바구니 주인이 아니면 403 FORBIDDEN_OWNER — 앱이 비회원 토큰을 갱신(auth `POST /auth/tokens` — 비회원 refresh token, 같은 X-Device-Id)한 뒤 같은 Idempotency-Key 로 다시.
        언제 부르나: auth 는 CART_MERGE_CONFIRM 을 보내지 않는다 — purpose=CHECKOUT 로그인 뒤 앱이 비회원 장바구니에 품목이 있으면 확인을 받아 부른다.
        성공분만 회원에 합산하고 비회원 장바구니에서 비운다. 일부 실패는 실패분·이유를 보존하며 전체 재합산하지 않는다.
        같은 Idempotency-Key 재전송은 기존 병합 결과 반환(중복 합산 없음). 일반 로그인은 이 API를 호출하지 않는다(자동 병합 금지).
      operationId: mergeCart
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
        - { name: X-Guest-Token, in: header, required: true, schema: { type: string, maxLength: 4096 }, description: 비회원 장바구니 소유 증명 — 로그인 전에 쓰던 비회원 access token(만료 전). 로그 금지 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sourceCartId, expectedVersion, items]
              properties:
                sourceCartId: { type: string, description: 비회원 장바구니 }
                sourceCartVersion: { type: integer }
                expectedVersion: { type: integer, description: 대상 회원 장바구니의 cartVersion }
                items:
                  type: array
                  minItems: 1
                  description: 고객이 확인한 이관 항목 집합 (절대 수량)
                  items:
                    type: object
                    required: [sourceItemId, sku, quantity]
                    properties:
                      sourceItemId: { type: string }
                      sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                      quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
      responses:
        '200':
          description: 병합 결과 (MERGE_CONFIRMED 또는 MERGE_PARTIAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '202':
          description: MERGE_PENDING (비회원 비움 등 후속 정리 대기. GET merges/{mergeId}로 확인)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '403':
          description: FORBIDDEN_OWNER (대상 또는 원본 장바구니 소유 불일치)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: CART_VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: REQUEST_RESULT_UNKNOWN (GET merges/{mergeId}로 원결과 확인. 전체 재합산 금지)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /carts/{cartId}/merges/{mergeId}:
    get:
      tags: [merges]
      summary: 병합 결과 조회 (항목별 이관 성공·실패, 비회원 비움 결과)
      operationId: getCartMerge
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: mergeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  # ---------- internal (서비스 토큰) ----------
  /internal/carts/{cartId}/selected-items:
    get:
      tags: [internal]
      summary: '[order→cart] 주문 초안 생성용 선택 품목·cartVersion 조회'
      operationId: getSelectedItemsInternal
      parameters:
        - { name: cartId, in: path, required: true, schema: { type: string } }
        - { name: accountId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cartId: { type: string }
                  cartVersion: { type: integer }
                  mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        cartItemId: { type: string }
                        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                        quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    CartItem:
      type: object
      required: [cartItemId, sku, quantity, selected]
      properties:
        cartItemId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        selected: { type: boolean }
        addedAt: { type: string, format: date-time }
        display:
          type: object
          description: 표시용 사본 (content/pricing/product/mfc-inventory). 구매 보장 아님.
          properties:
            name: { type: string }
            optionLabel: { type: string }
            imageUrl: { type: string, format: uri }
            unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
            priceVersion: { type: integer }
            salePrice: { type: [integer, 'null'], minimum: 0, description: '(0.4.0) 기간 할인가(개당). 할인 없거나 모르면 null — unitPrice 를 보인다' }
            discountRatePercent: { type: [integer, 'null'], description: '(0.4.0) 할인율(내림, %)' }
            discountName: { type: [string, 'null'], description: '(0.4.0) 행사 이름' }
            quantityOffer:
              x-added-in: '2026-11-26'
              description: '(0.6.0 ADR-0090) 지금 걸린 수량 행사(1+1·2+1). 없으면 null. 걸리면 salePrice 는 null(기간 할인과 겹치지 않음)'
              oneOf:
                - type: 'null'
                - type: object
                  required: [name, buyQuantity, freeQuantity]
                  properties:
                    name: { type: string }
                    buyQuantity: { type: integer }
                    freeQuantity: { type: integer }
            freeQuantity: { type: integer, minimum: 0, x-added-in: '2026-11-26', description: '(0.6.0) 이 수량에 붙는 무료 수량(표시용 — 주문서 견적이 최종)' }
            saleState: { type: string, enum: [ON_SALE, TEMPORARILY_SOLD_OUT, SALE_STOPPED, UNKNOWN] }
            availability:
              type: string
              enum: [AVAILABLE, LOW, SOLD_OUT, NOT_CARRIED, UNKNOWN]
              description: |
                장바구니 mfcId(담당 MFC) 기준 mfc-inventory 출하 가능 수량(shippableAvailable, 0.1.1 — 오늘 기준 소비기한 적격 LOT 만) 사본. 구매·예약 보장이 아니다(결제 진입 때 재고를 다시 잡는다).
                AVAILABLE 담은 수량 이상, LOW 0 < 가용 < 담은 수량(부족), SOLD_OUT 가용 0, NOT_CARRIED 담당 MFC 취급 안 함,
                UNKNOWN mfcId 없음·재고 조회 실패(0 아님). "N개 남음" 노출 임계값은 운영 설정이라 아직 쓰지 않는다.
            availableQty: { type: [integer, 'null'], description: "LOW 일 때 살 수 있는 최대 수량, SOLD_OUT 이면 0. 그 밖은 null(수량 비공개)" }
    Cart:
      type: object
      required: [cartId, cartVersion, ownerType, items]
      properties:
        cartId: { type: string }
        cartVersion: { $ref: '_common.yaml#/components/schemas/Version' }
        ownerType: { type: string, enum: [MEMBER, GUEST] }
        accountId: { type: [string, 'null'] }
        shoppingAddressId: { type: [string, 'null'] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        items: { type: array, items: { $ref: '#/components/schemas/CartItem' } }
        selectedItemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: '선택 품목 표시 합계(0.4.0 부터 기간 할인 뒤·쿠폰 전 — 주문 초안 최소주문 판정과 같은 기준). 견적 아님' }
        selectedDiscountAmount: { type: [integer, 'null'], minimum: 0, description: '(0.4.0) 선택 품목 기간 할인 합계(원). selectedItemAmount 가 null 이면 null' }
        selectedListAmount: { type: [integer, 'null'], minimum: 0, x-added-in: '2026-11-25', description: '(0.5.0 BR-97) 선택 품목 기간 할인 전 단가(기본가) 합계(원) — 주문 초안 Quote.baseItemAmount 와 같은 기준. selectedItemAmount 가 null 이면 null' }
        minOrderAmount: { type: [integer, 'null'], minimum: 0, description: '최소 주문 금액(원, 0.2.0) — BR-14 확정값 15,000(order-service 주문 초안과 같음). 할인·쿠폰 전 상품액 기준, 배달팁·봉투값 제외', x-added-in: '2026-11-18' }
        minOrderShortfall: { type: [integer, 'null'], minimum: 0, description: '최소 주문까지 더 담을 금액(원, 0.2.0) = max(0, minOrderAmount − selectedItemAmount). 0 이면 충족. selectedItemAmount 가 null(선택 품목 가격 불명)이면 null — 0 으로 보지 않는다. 표시 안내이며 실제 판정은 주문 초안 견적', x-added-in: '2026-11-18' }
        lastChangedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 마지막 변경 + 30일 }
        pendingMergeId: { type: [string, 'null'] }
        sources:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    CartChangeResult:
      allOf:
        - $ref: '_common.yaml#/components/schemas/CommandResponse'
        - type: object
          properties:
            cartId: { type: string }
            cartItemId: { type: string }
            sku: { $ref: '_common.yaml#/components/schemas/Sku' }
            quantity: { type: integer, description: 반영된 절대 수량. 삭제면 0 }
            selected: { type: boolean }
            cartVersion: { type: integer, description: 새 cartVersion (=version) }
            cart:
              description: |
                응답 시점의 장바구니 전체(GET /carts/{cartId} 와 같은 모양 — 표시용 사본·selectedItemAmount·sources 포함).
                앱은 이 값으로 화면을 끝내고 다시 조회하지 않아도 된다(BR-43, 2026-11-03). 결과 조회(GET …/change-requests/{id})도
                지금의 장바구니를 준다(그 변경 직후 상태가 아닐 수 있다 — cartVersion 으로 비교).
              allOf: [{ $ref: '#/components/schemas/Cart' }]
            appliedRequestId: { type: string }
    CartChangeError:
      allOf:
        - $ref: '_common.yaml#/components/schemas/ErrorResponse'
        - type: object
          properties:
            cartVersion: { type: integer, description: 현재 cartVersion }
            limit:
              type: object
              description: QUANTITY_LIMIT_EXCEEDED일 때 기초상품 환산 합계와 상한
              properties:
                baseProductId: { type: string }
                totalUnits: { type: integer }
                limitUnits: { type: integer }
                suggestedQuantity: { type: integer }
            availableQty: { type: [integer, 'null'], description: INSUFFICIENT_AVAILABLE_QUANTITY일 때 확인된 가용. 불명이면 null }
    MergeResult:
      type: object
      required: [mergeId, state, targetCartId, sourceCartId]
      properties:
        mergeId: { type: string }
        state: { type: string, enum: [MERGE_PENDING, MERGE_PARTIAL, MERGE_CONFIRMED, MERGE_REJECTED, UNKNOWN] }
        targetCartId: { type: string }
        targetCartVersion: { type: integer }
        sourceCartId: { type: string }
        sourceCleared: { type: string, enum: [NOT_STARTED, PARTIAL, DONE, UNKNOWN], description: 비회원 장바구니 비움 결과(성공분만) }
        items:
          type: array
          items:
            type: object
            properties:
              sourceItemId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              requestedQuantity: { type: integer }
              result: { type: string, enum: [MERGED, REJECTED, UNKNOWN] }
              targetCartItemId: { type: [string, 'null'] }
              mergedQuantity: { type: [integer, 'null'] }
              reasonCode: { type: [string, 'null'], description: QUANTITY_LIMIT_EXCEEDED / INSUFFICIENT_AVAILABLE_QUANTITY / SKU_NOT_SALEABLE 등 }
        occurredAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
