openapi: 3.1.0
info:
  title: mail-provisioner
  version: 0.2.0
  description: |
    사서함 프로비저닝 사이드카(ADR-0056 결정 10·D9). 메일 서버(docker-mailserver)의 설정 볼륨을 같이 붙여 계정 파일에 한 줄을 쓰는 방식으로
    사서함을 만들고 비활성화한다(`setup email add` 와 같은 일 — docker.sock 을 쓰지 않는다). 할 수 있는 일은 사서함 만들기·비활성·다시 활성·
    비밀번호 바꾸기뿐이고 지우지 않는다(D7). 호출자는 hr-service 하나. LAN 포트 없이 PC 5 Docker 네트워크 안에서만(서비스 간 경로 —
    ADR-0026, 사용자 토큰 받지 않음). 비밀번호는 해시(SHA512-CRYPT)만 파일에 쓰고 로그·응답에 싣지 않는다.
    모든 명령은 그 자체로 멱등(같은 결과면 파일을 다시 쓰지 않음)이라 Idempotency-Key 로 결과를 재생하지 않는다(DB 없음 — 헤더는 공통 규칙대로 받는다).
    0.2.0(2026-11-14): 직원 본인이 웹메일(Roundcube `password` 플러그인 `httpapi` 드라이버)에서 사서함 비밀번호를 바꾸는 경로
    `/internal/mailbox-password-changes` — 호출자 Roundcube(같은 PC 5 Docker 네트워크). 현재 비밀번호가 맞아야 바뀐다.
servers:
  - url: /api/v1
tags:
  - { name: mailboxes, description: 사서함 }

paths:
  /internal/mailboxes:
    post:
      tags: [mailboxes]
      summary: "[hr-service→mail-provisioner] 사서함 만들기 (멱등 — 있으면 그대로, 비활성이면 다시 활성)"
      description: |
        비밀번호를 주지 않으면 무작위 값으로 만든다(아무도 모르는 값 — 웹메일 비밀번호는 password 로 따로 정한다).
        만든 직후에는 메일 서버가 반영할 때까지(수 초) 메일을 받지 못할 수 있다 — GET 의 receiving 으로 확인한다.
      operationId: createMailbox
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { $ref: '#/components/schemas/Address' }
      responses:
        '200':
          description: 만들어짐(또는 이미 있음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/mailboxes/{address}:
    get:
      tags: [mailboxes]
      summary: "[hr-service→mail-provisioner] 사서함 상태 (메일을 받을 수 있는지 — SMTP RCPT 확인)"
      operationId: getMailbox
      security: []
      parameters:
        - $ref: '#/components/parameters/AddressPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/mailboxes/{address}/disable:
    post:
      tags: [mailboxes]
      summary: "[hr-service→mail-provisioner] 비활성 (로그인 불가 — 메일·사서함은 지우지 않음, D7)"
      operationId: disableMailbox
      security: []
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 비활성(이미 비활성이어도 성공)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/mailboxes/{address}/enable:
    post:
      tags: [mailboxes]
      summary: "[hr-service→mail-provisioner] 다시 활성 (비활성 전 비밀번호로 돌아온다 — 바꾸려면 password)"
      operationId: enableMailbox
      security: []
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 활성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mailbox' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/mailboxes/{address}/password:
    put:
      tags: [mailboxes]
      summary: "[hr-service→mail-provisioner] 웹메일 비밀번호 정하기 (해시만 저장, 로그 금지)"
      operationId: setMailboxPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/AddressPath'
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 128, description: 로그 금지 }
      responses:
        '204': { description: 바뀜 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/mailbox-password-changes:
    post:
      tags: [mailboxes]
      summary: "[Roundcube→mail-provisioner] 직원 본인의 웹메일 비밀번호 바꾸기 (현재 비밀번호 확인, 해시만 저장, 로그 금지)"
      description: |
        Roundcube `password` 플러그인 `httpapi` 드라이버의 요청 모양 그대로다(form `user`·`curpass`·`newpass`, 2xx = 성공, 4xx = 실패 안내,
        404·5xx = 연결 실패 안내). 그래서 `Idempotency-Key`·`X-Source-System` 을 받지 않는다(`pmart.web.excluded-paths`).
        믿음의 근거는 현재 비밀번호다 — 해시가 맞을 때만 바꾼다(hr-service 의 `PUT …/password` 와 달리 아무 사서함이나 바꿀 수 없다).
        사서함이 없거나·비활성이거나·현재 비밀번호가 틀리면 모두 같은 403(어느 것인지 알리지 않는다). 새 비밀번호 길이가 맞지 않으면 400.
      operationId: changeMailboxPassword
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user, curpass, newpass]
              properties:
                user: { type: string, maxLength: 128, description: "웹메일 로그인 이름(메일 주소 — @ 없으면 설정 도메인을 붙인다)" }
                curpass: { type: string, minLength: 1, maxLength: 128, description: 로그 금지 }
                newpass: { type: string, minLength: 12, maxLength: 128, description: 로그 금지 }
      responses:
        '204': { description: 바뀜(메일 서버가 몇 초 안에 새 비밀번호를 쓴다) }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

components:
  parameters:
    AddressPath:
      name: address
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Address' }
  schemas:
    Address:
      type: string
      maxLength: 128
      pattern: '^[a-z0-9][a-z0-9._-]{0,62}@[a-z0-9.-]+$'
      description: 메일 주소(설정한 도메인만 — 그 밖은 400)
    Mailbox:
      type: object
      required: [address, state, receiving]
      properties:
        address: { type: string }
        state: { type: string, enum: [ACTIVE, DISABLED] }
        receiving: { type: boolean, description: 메일 서버가 이 주소의 메일을 받는가(SMTP RCPT 250) }
