openapi: 3.1.0
info:
  title: backoffice-bff
  version: 0.1.0
  description: |
    관리자 화면별 조회 조합·명령 전달 계층. 상태 없음, 정본 아님. (docs/architecture/service-map.md §8)
    조회는 원천별 asOf·postedAt·신선도·확인 등급(직접확인/사본/불명)을 그대로 노출하며 기준시각이 다른 수량은 합산하지 않는다.
    명령은 대상 서비스로 그대로 전달한다(멱등키·expected version 부착). 응답 ACK(ACCEPTED)는 성공이 아니며 결과는 짝 조회로 확인한다.
    금지 — 주문 상태 직접 변경, 잔고 덮어쓰기, 강제 성공, 검증 생략.
servers:
  - url: /api/v1/backoffice
security:
  - bearerAuth: []
tags:
  - { name: views, description: 화면별 읽기 모델(원천별 asOf 포함) }
  - { name: commands, description: 대상 서비스 명령 전달(프록시) }

paths:
  /views/unified-lookup:
    get:
      tags: [views]
      summary: 통합 조회 (주문·배송·TRF·운행·사건을 식별자/고객으로 한 번에)
      operationId: getUnifiedLookupView
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, maxLength: 128 }, description: 주문번호·전화 참조·TRF·tripId 등 }
        - { name: kind, in: query, schema: { type: string, enum: [ORDER, DELIVERY, TRANSFER, TRIP, CUSTOMER, CASE, ANY] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            kind: { type: string }
                            id: { type: string }
                            summary: { type: object, additionalProperties: true }
                            source: { $ref: '#/components/schemas/SourceStamp' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /views/approval-inbox:
    get:
      tags: [views]
      summary: 승인함 (BO-10; approval-service 읽기 + 원정본 반영 상태)
      description: |
        approval-service GET /approvals 를 운영자 본인 토큰으로 읽어 화면용으로 묶는다(2026-11-03, BR-40). 정렬은 제출 최신순.
        dossierId = approvalId(approval-service 승인 ID) — 승인 상세·결정은 approval-service /approvals/{approvalId}.
        approval-service 가 응답하지 않으면 200 + 빈 items + unavailableSources=[approval-service](추정하지 않음). 운영자가 아니면 403.
        centerId 는 아직 approval-service 가 거르지 않는다(넘기기만 함).
      operationId: getApprovalInboxView
      parameters:
        - { name: approvalType, in: query, schema: { type: string } }
        - { name: reviewState, in: query, schema: { type: string } }
        - { name: centerId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            dossierId: { type: string, description: '= approvalId' }
                            approvalId: { type: string }
                            changeRequestId: { type: string }
                            approvalType: { type: string }
                            targetService: { type: string }
                            summary: { type: string }
                            caseId: { type: [string, 'null'] }
                            expiresAt: { type: [string, 'null'], format: date-time }
                            requestState: { type: string }
                            reviewState: { type: string }
                            executionState: { type: string }
                            deliveryState: { type: string }
                            targetRef: { type: string }
                            expectedVersion: { type: integer }
                            requestedBy: { type: string }
                            submittedAt: { type: string, format: date-time }
                            source: { $ref: '#/components/schemas/SourceStamp' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/case-inbox:
    get:
      tags: [views]
      summary: 사건함 (case-service 읽기 + 연결 도메인 사건 상태)
      operationId: getCaseInboxView
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: assignee, in: query, schema: { type: string } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            caseId: { type: string }
                            state: { type: string }
                            priority: { type: string }
                            slaDueAt: { type: [string, 'null'], format: date-time }
                            openObligations: { type: integer }
                            linkedRefs: { type: array, items: { type: object, properties: { kind: { type: string }, id: { type: string } } } }
                            source: { $ref: '#/components/schemas/SourceStamp' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/replenishment-status:
    get:
      tags: [views]
      summary: 보충 현황 (TRF별 승인/확보/편성/출발/수령 — 원천별 기준시각 분리, 합산 금지)
      operationId: getReplenishmentStatusView
      parameters:
        - { name: mfcId, in: query, schema: { type: string } }
        - { name: cdcId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: trfId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            trfId: { type: string }
                            version: { type: integer }
                            approved: { $ref: '#/components/schemas/StampedQty' }
                            allocated: { $ref: '#/components/schemas/StampedQty' }
                            transport: { $ref: '#/components/schemas/StampedState' }
                            departed: { $ref: '#/components/schemas/StampedQty' }
                            received: { $ref: '#/components/schemas/StampedQty' }
                            unsettled: { $ref: '#/components/schemas/StampedQty' }
                            replenishmentState: { $ref: '#/components/schemas/StampedState' }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/trip-control:
    get:
      tags: [views]
      summary: 운행 관제 (planning 배정 + execution 운행/ETA/사건 + cold-chain 이탈)
      operationId: getTripControlView
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: cdcId, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            tripId: { type: string }
                            assignment: { $ref: '#/components/schemas/StampedState' }
                            trip: { $ref: '#/components/schemas/StampedState' }
                            departure: { $ref: '#/components/schemas/StampedState' }
                            vehicleId: { type: string }
                            driverId: { type: string }
                            stops: { type: array, items: { type: object, additionalProperties: true } }
                            eta: { $ref: '#/components/schemas/StampedState' }
                            openIncidents: { type: integer }
                            openExcursions: { type: integer }
                      unplanned: { type: array, items: { type: object, additionalProperties: true } }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/live-delivery:
    get:
      tags: [views]
      summary: 실시간 배송 현황 (MFC별 고객 배송·배차·라이더 — delivery-* 읽기)
      operationId: getLiveDeliveryView
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            deliveryId: { type: string }
                            orderId: { type: string }
                            delivery: { $ref: '#/components/schemas/StampedState' }
                            dispatch: { $ref: '#/components/schemas/StampedState' }
                            riderId: { type: [string, 'null'] }
                            promisedAt: { type: string, format: date-time }
                            latestEta: { type: [string, 'null'], format: date-time }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/packing-handover:
    get:
      tags: [views]
      summary: 포장 인계 현황 (MFC 포장 완료·인계 펜스·라이더 인계 — mfc-*/delivery 읽기)
      operationId: getPackingHandoverView
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            shipmentId: { type: string }
                            orderId: { type: string }
                            packing: { $ref: '#/components/schemas/StampedState' }
                            handoverFence: { $ref: '#/components/schemas/StampedState' }
                            handedOverQty: { $ref: '#/components/schemas/StampedQty' }
                            riderId: { type: [string, 'null'] }
                      page: { $ref: '_common.yaml#/components/schemas/Page' }

  /views/metrics:
    get:
      tags: [views]
      summary: 지표 (분모 보존; 비율은 분자/분모를 함께 반환)
      operationId: getMetricsView
      parameters:
        - { name: metric, in: query, required: true, schema: { type: string, enum: [ON_TIME_DELIVERY, SHORTAGE_RATE, TRANSPORT_ON_TIME, UNPLANNED_RATE, PAYMENT_UNKNOWN, CASE_SLA] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: granularity, in: query, schema: { type: string, enum: [DAY, HOUR], default: DAY } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ComposedView'
                  - type: object
                    properties:
                      metric: { type: string }
                      points:
                        type: array
                        items:
                          type: object
                          required: [bucket, numerator, denominator]
                          properties:
                            bucket: { type: string }
                            numerator: { type: integer }
                            denominator: { type: integer, description: 0이면 비율 미정의(null) }
                            ratio: { type: [number, 'null'] }
                            source: { $ref: '#/components/schemas/SourceStamp' }

  /commands/{targetService}/{command}:
    post:
      tags: [commands]
      summary: 명령 전달 프록시 (Idempotency-Key 부착; 대상 CommandResponse 그대로 반환, ACK≠성공)
      description: |
        본문은 대상 서비스 계약 그대로 전달한다. BFF는 행위 시점 권한 검증(auth)을 먼저 호출하고, 통과하면 멱등키·X-Source-System=backoffice-bff·
        X-Expected-Version을 붙여 대상에 전달한다. 응답 status는 대상의 값을 변형하지 않는다. UNKNOWN_RESULT는 GET /commands/{targetService}/{command}/{requestId}로 해소.
        허용 명령은 대상 서비스 계약에 등록된 것만. 주문 상태 직접 변경·잔고 덮어쓰기·강제 성공 명령은 UNSUPPORTED_ACTION.
      operationId: proxyCommand
      parameters:
        - { name: targetService, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' }, description: 예 approval-service }
        - { name: command, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]+$' }, description: 대상 계약의 명령 경로 식별자 }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetRef, payload]
              properties:
                targetRef: { type: string, description: 대상 aggregate 식별자(경로 치환용) }
                reason: { type: string, maxLength: 500, description: 감사 기록 사유 }
                payload: { type: object, additionalProperties: true, description: 대상 서비스 계약 본문 그대로 }
      responses:
        '202':
          description: 대상 CommandResponse 그대로 (ACCEPTED는 성공 아님)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: UNSUPPORTED_ACTION / APPROVAL_REQUIRED / CONFIG_REQUIRED (대상 응답 그대로)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /commands/{targetService}/{command}/{requestId}:
    get:
      tags: [commands]
      summary: 전달한 명령의 원결과 조회 (대상 서비스 짝 조회로 위임)
      operationId: getProxiedCommandResult
      parameters:
        - { name: targetService, in: path, required: true, schema: { type: string } }
        - { name: command, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  resultId: { type: [string, 'null'] }
                  source: { $ref: '#/components/schemas/SourceStamp' }
                  detail: { type: object, additionalProperties: true }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    SourceStamp:
      type: object
      description: 원천 서비스·기준시각·신선도·확인 등급. 화면은 이 값을 숨기지 않는다.
      required: [system, asOf, confidence]
      properties:
        system: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        postedAt: { type: [string, 'null'], format: date-time, description: 정본 전기 시각(있을 때) }
        confidence:
          type: string
          description: DIRECT=정본 직접 확인. COPY=사본/이벤트 투영. UNKNOWN=조회 실패 또는 불명.
          enum: [DIRECT, COPY, UNKNOWN]
    StampedQty:
      type: object
      description: 수량 + 출처. 기준시각이 다른 StampedQty끼리 합산하지 않는다.
      properties:
        qty: { type: [integer, 'null'] }
        source: { $ref: '#/components/schemas/SourceStamp' }
    StampedState:
      type: object
      properties:
        state: { type: [string, 'null'] }
        version: { type: [integer, 'null'] }
        at: { type: [string, 'null'], format: date-time }
        source: { $ref: '#/components/schemas/SourceStamp' }
    ComposedView:
      type: object
      description: 모든 화면 응답의 공통 머리. 원천별 asOf 목록과 조회 실패 원천을 분리해 보여준다.
      required: [sources]
      properties:
        sources: { type: array, items: { $ref: '#/components/schemas/SourceStamp' } }
        unavailableSources: { type: array, items: { type: string } }
        composedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
