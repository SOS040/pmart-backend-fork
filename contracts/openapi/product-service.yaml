openapi: 3.1.0
info:
  title: product-service
  version: 0.1.0
  description: |
    기초상품·상품·SKU(E-/B- 8자리, 재사용 금지)·구성 낱개 수·카테고리(상위 30·하위 141)·바코드↔SKU·판매 단위·중량·물류 규격·전사 판매 상태·승인 버전의 정본. (docs/architecture/service-map.md §1, ADR-0001)
    비정본: 센터별 취급 ON/OFF·재고(각 inventory), 가격(pricing), 상세 콘텐츠(product-content), 승인 워크플로(approval).
    발행 이벤트: ProductVersionPublished, ProductSaleStateChanged, CategoryChanged, SkuIssued.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: products, description: 상품·SKU 조회(버전 포함) }
  - { name: categories, description: 카테고리 트리(대표 노출 경로 1개) }
  - { name: barcodes, description: 바코드 해석 }
  - { name: commands, description: SKU 발급·판매 상태 변경 명령(승인 결과 참조) }
  - { name: internal, description: 서비스 간 조회·검증(서비스 토큰) }

paths:
  /products:
    get:
      tags: [products]
      summary: 상품 목록 조회 (카테고리·판매 상태 필터)
      operationId: listProducts
      parameters:
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: saleState, in: query, schema: { $ref: '#/components/schemas/SaleState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ProductSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 조회 (승인 버전·SKU 목록·규격 포함)
      operationId: getProduct
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: version, in: query, description: 생략 시 현재 승인 버전, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /products/{productId}/sale-state-changes:
    post:
      tags: [commands]
      summary: 전사 판매 상태 변경 (판매중/일시품절/판매중지)
      description: |
        전사 판매 상태의 정본 변경. 센터별 취급 ON/OFF는 각 inventory 서비스 책임이므로 여기서 다루지 않는다.
        반영 시 ProductSaleStateChanged 발행. 행위 시점 권한 검증은 auth-service에 위임한다.
      operationId: changeSaleState
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [saleState, reason]
              properties:
                saleState: { $ref: '#/components/schemas/SaleState' }
                reason: { type: string, maxLength: 200 }
                approvalId: { type: string, description: 승인이 필요한 변경일 때 approval-service 승인 ID }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /products/{productId}/sale-state-changes/{requestId}:
    get:
      tags: [commands]
      summary: 판매 상태 변경 결과 조회
      operationId: getSaleStateChange
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /skus/{sku}:
    get:
      tags: [products]
      summary: SKU 조회 (구성 낱개 수·중량·판매 단위·판매 상태)
      operationId: getSku
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuDetail' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /sku-issuances:
    post:
      tags: [commands]
      summary: SKU 발급 명령 (approval 승인 결과 참조)
      description: |
        승인된 ChangeRequest(approvalId)를 참조해 E-/B- 8자리 SKU를 발급한다. 번호 재사용 금지, 같은 approvalId 재전송은 기존 결과 반환.
        반영 시 SkuIssued·ProductVersionPublished 발행. 승인 없는 발급은 APPROVAL_REQUIRED로 거절.
      operationId: issueSku
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuIssuanceRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / APPROVAL_SCOPE_MISMATCH (승인 범위와 요청 불일치) / BASE_PRODUCT_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /sku-issuances/{requestId}:
    get:
      tags: [commands]
      summary: SKU 발급 결과 조회 (발급된 sku 포함)
      operationId: getSkuIssuance
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  sku: { $ref: '_common.yaml#/components/schemas/Sku' }
                  productId: { type: string }
                  productVersion: { type: integer }
                  approvalId: { type: string }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /categories/tree:
    get:
      tags: [categories]
      summary: 카테고리 트리 (상위 30·하위 141, 노출 경로 151)
      operationId: getCategoryTree
      parameters:
        - { name: version, in: query, description: 생략 시 현재 발효 버전, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  effectiveFrom: { type: string, format: date-time }
                  nodes: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }

  /barcodes/{barcode}:
    get:
      tags: [barcodes]
      summary: 바코드 해석 (barcode → SKU·상품)
      operationId: resolveBarcode
      parameters:
        - { name: barcode, in: path, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BarcodeResolution' }
        '404':
          description: BARCODE_NOT_MAPPED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  # ---------- internal (서비스 토큰) ----------
  /internal/skus/{sku}:
    get:
      tags: [internal]
      summary: '[cart/order/inventory→product] SKU 조회 (버전·판매 상태·구성 낱개 수·중량)'
      operationId: getSkuInternal
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuDetail' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/skus:
    get:
      tags: [internal]
      summary: '[cart/order→product] SKU 일괄 조회 (최대 100건)'
      operationId: listSkusInternal
      parameters:
        - name: skus
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK (존재하지 않는 SKU는 items에서 제외하고 missing에 나열)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SkuDetail' } }
                  missing: { type: array, items: { type: string } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/purchase-limit-checks:
    post:
      tags: [internal]
      summary: '[cart/order→product] 구매 상한 검증 (기초상품별 Σ 수량×구성 낱개 수 ≤ 10)'
      description: |
        조회성 검증이며 상태를 바꾸지 않는다. E/B를 기초상품 단위로 환산해 합산하며, 상한값은 정책값(NOT_SET이면 CONFIG_REQUIRED).
        실물 재고 수량과는 다른 계산 단위이다.
      operationId: checkPurchaseLimit
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseLimitCheckRequest' }
      responses:
        '200':
          description: OK (위반 여부는 본문 violations로 판단)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseLimitCheckResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/products/{productId}/versions/{version}:
    get:
      tags: [internal]
      summary: '[order/search/content→product] 특정 승인 버전의 상품 스냅샷'
      operationId: getProductVersionInternal
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    SaleState:
      type: string
      description: 전사 판매 상태. 센터별 취급 여부와 별개.
      enum: [ON_SALE, TEMPORARILY_SOLD_OUT, SALE_STOPPED]
    SaleUnitType:
      type: string
      description: E=낱개 판매 단위, B=밀봉 묶음
      enum: [E, B]
    LogisticsSpec:
      type: object
      description: 물류 규격. BOX/PLT 환산과 Ti/Hi는 승인 버전으로만 변경.
      properties:
        unitsPerBox: { type: integer, minimum: 1 }
        boxesPerPallet: { type: integer, minimum: 1 }
        ti: { type: integer, minimum: 1 }
        hi: { type: integer, minimum: 1 }
        storageType: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
    SkuDetail:
      type: object
      required: [sku, productId, baseProductId, unitType, unitsPerSku, saleState, version]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        baseProductId: { type: string, description: 구매 상한 합산 단위 }
        unitType: { $ref: '#/components/schemas/SaleUnitType' }
        unitsPerSku: { type: integer, minimum: 1, description: 구성 낱개 수 }
        weightG: { type: integer, minimum: 0 }
        saleState: { $ref: '#/components/schemas/SaleState' }
        alcohol: { type: boolean, description: 주류 여부(PG 인증 결과 확인 대상) }
        barcodes: { type: array, items: { type: string } }
        logistics: { $ref: '#/components/schemas/LogisticsSpec' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        publishedAt: { type: string, format: date-time }
    ProductSummary:
      type: object
      properties:
        productId: { type: string }
        baseProductId: { type: string }
        internalName: { type: string, description: 관리용 명칭. 고객용 상품명은 product-content }
        primaryCategoryId: { type: string, description: 대표 노출 경로 1개 }
        saleState: { $ref: '#/components/schemas/SaleState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductSummary'
        - type: object
          properties:
            categoryIds: { type: array, items: { type: string }, description: 노출 경로 전체 }
            skus: { type: array, items: { $ref: '#/components/schemas/SkuDetail' } }
            approvalId: { type: string, description: 이 버전을 확정한 approval 승인 ID }
            publishedAt: { type: string, format: date-time }
    CategoryNode:
      type: object
      properties:
        categoryId: { type: string }
        parentId: { type: [string, 'null'] }
        depth: { type: integer, enum: [1, 2] }
        name: { type: string }
        sortOrder: { type: integer }
        exposed: { type: boolean }
    BarcodeResolution:
      type: object
      properties:
        barcode: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        unitType: { $ref: '#/components/schemas/SaleUnitType' }
        unitsPerSku: { type: integer }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    SkuIssuanceRequest:
      type: object
      required: [approvalId, baseProductId, unitType, unitsPerSku]
      properties:
        approvalId: { type: string }
        changeRequestId: { type: string }
        baseProductId: { type: string }
        productId: { type: string, description: 기존 상품에 SKU 추가 시. 없으면 신규 상품 생성 }
        unitType: { $ref: '#/components/schemas/SaleUnitType' }
        unitsPerSku: { type: integer, minimum: 1 }
        weightG: { type: integer, minimum: 0 }
        barcodes: { type: array, items: { type: string } }
        logistics: { $ref: '#/components/schemas/LogisticsSpec' }
    PurchaseLimitCheckRequest:
      type: object
      required: [items]
      properties:
        accountId: { type: string, description: 로그 용도. 상한은 요청 품목만으로 계산 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, quantity]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
    PurchaseLimitCheckResult:
      type: object
      required: [passed, violations]
      properties:
        passed: { type: boolean }
        limitPerBaseProduct: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        violations:
          type: array
          items:
            type: object
            properties:
              baseProductId: { type: string }
              totalUnits: { type: integer, description: Σ 수량×구성 낱개 수 }
              limitUnits: { type: integer }
              skus: { type: array, items: { type: string } }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
