openapi: 3.1.0
info:
  title: approval-service
  version: 0.1.0
  description: |
    ChangeRequest(초안)·ApprovalDossier(승인 단위·원도메인 승인 ID 참조, 이중 발급 금지)·5축 상태·부분 집행·재심사 계보·통합 승인함(BO-10)·대량 변경(BO-26)·PolicyReference(BO-09)·ApplicationReceipt 의 정본. (docs/architecture/service-map.md §8, ADR-0004)
    비정본: 승인 결과의 업무 정본(product/pricing/replenishment/claim/quality/serviceability/auth/inventory/center-master), 사건(case-service).

    5축 상태
    - 요청: DRAFT / SUBMITTED / WITHDRAW_REQUESTED / WITHDRAWN
    - 심사: REVIEW_PENDING / EVIDENCE_REQUIRED / APPROVED / PARTIALLY_APPROVED / REJECTED / EXPIRED / SUPERSEDED
    - 실행: NOT_REQUESTED / VALIDATING / ACCEPTED / IN_PROGRESS / PARTIAL / APPLIED / REJECTED / UNKNOWN_RESULT
    - 전달: PENDING / DELIVERED / ACKNOWLEDGED / RETRY_PENDING / FAILED
    - 사건: caseId 연결 여부
    부분 집행 불변식: **승인량 = 누적 유효 집행 + 승인된 미집행 취소 + 열린 집행 잔량**.
    발효는 approval → ApprovalDecided(이벤트) → 정본 반영 → ApplicationReceipt 회신 순. approval 이 정본을 거쳐 3자를 동기 호출하지 않는다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: change-requests, description: 변경 요청 초안·제출·철회 }
  - { name: approvals, description: 승인함·결정·재심사·반영 확인 }
  - { name: batch-changes, description: 대량 변경 BO-26 }
  - { name: policy-references, description: 정책 참조 레지스트리 BO-09 }
  - { name: internal, description: 정본 서비스의 반영 결과 회신 }

paths:
  /change-requests:
    post:
      tags: [change-requests]
      summary: 변경 요청 초안 생성 (DRAFT; 승인 아님)
      operationId: createChangeRequest
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeRequestBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /change-requests/{changeRequestId}:
    get:
      tags: [change-requests]
      summary: 변경 요청 조회
      operationId: getChangeRequest
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChangeRequest' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /change-requests/{changeRequestId}/submissions:
    post:
      tags: [change-requests]
      summary: 제출 (DRAFT→SUBMITTED, ApprovalDossier 생성, ChangeRequestSubmitted)
      description: 제출 시 승인 단위(종류·원객체/행·범위·예상 버전·허용 행위·수량/금액·조건·효력/만료)를 확정하고 approvalId 를 발급한다. 같은 원객체·종류의 열린 승인이 있으면 DUPLICATE_APPROVAL.
      operationId: submitChangeRequest
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202':
          description: 제출됨 (resultId = approvalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE / VERSION_CONFLICT / DUPLICATE_APPROVAL (이중 발급 금지)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: EVIDENCE_REQUIRED (종류별 필수 증빙 누락)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /change-requests/{changeRequestId}/withdrawals:
    post:
      tags: [change-requests]
      summary: 철회 (SUBMITTED→WITHDRAW_REQUESTED→WITHDRAWN; 집행 시작 후는 불가)
      operationId: withdrawChangeRequest
      parameters:
        - { name: changeRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (실행 축 IN_PROGRESS 이후 → 취소 승인 별도 요청)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /approvals:
    get:
      tags: [approvals]
      summary: 통합 승인함 (BO-10; 종류·심사 상태·센터 범위·담당 필터)
      operationId: listApprovals
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ApprovalType' } }
        - { name: reviewState, in: query, schema: { $ref: '#/components/schemas/ReviewState' } }
        - { name: executionState, in: query, schema: { $ref: '#/components/schemas/ExecutionState' } }
        - { name: centerId, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: requesterId, in: query, schema: { type: string } }
        - { name: targetRef, in: query, description: '대상 참조와 정확히 일치(예 productImportBatch:{batchId}) — 정본 화면이 자기 대상의 승인을 찾을 때(BR-41, 2026-11-03)', schema: { type: string, maxLength: 128 } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApprovalSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /approvals/{approvalId}:
    get:
      tags: [approvals]
      summary: 승인 상세 (5축 상태·승인 단위·집행 누계·계보)
      operationId: getApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /approvals/{approvalId}/decisions:
    post:
      tags: [approvals]
      summary: 심사 결정 (APPROVE / PARTIALLY_APPROVE / REJECT / REQUEST_EVIDENCE) → ApprovalDecided
      description: |
        승인자 권한·센터 범위·대행 기간·자기승인 분리는 auth-service 행위 시점 검증. 요청자 = 승인자이면 FORBIDDEN.
        PARTIALLY_APPROVE 는 lines 의 approvedQty/approvedAmount 로 승인량을 줄인다(요청량 초과 불가).
        효력은 effectiveFrom 부터. 결정 후 실행 축은 NOT_REQUESTED→VALIDATING 으로 넘어가고 정본의 Receipt 로 갱신된다.
      operationId: decideApproval
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '202':
          description: 결정 기록 (resultId = decisionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403':
          description: FORBIDDEN (권한·범위·자기승인·대행 기간 외)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (REVIEW_PENDING/EVIDENCE_REQUIRED 아님) / VERSION_CONFLICT / STALE_VERSION (원객체 예상 버전 불일치)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: VALIDATION_FAILED (부분 승인량 > 요청량) / EVIDENCE_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /approvals/{approvalId}/decisions/{decisionId}:
    get:
      tags: [approvals]
      summary: 결정 조회
      operationId: getDecision
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - { name: decisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /approvals/{approvalId}/re-reviews:
    post:
      tags: [approvals]
      summary: 재심사 요청 (새 승인 버전 발급, 계보 유지; 기존은 SUPERSEDED)
      description: 집행된 수량은 되돌리지 않는다. 새 버전의 승인량은 기존 미집행 잔량 범위에서 조정 가능.
      operationId: requestReReview
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 500 }
                revisedLines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
                evidenceRefs: { type: array, items: { type: string } }
      responses:
        '202':
          description: 새 승인 버전 (resultId = 새 approvalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /approvals/{approvalId}/receipts:
    get:
      tags: [approvals]
      summary: 반영 확인 목록 (수신자별 ApplicationReceipt; 실행·전달 축 근거)
      operationId: listApplicationReceipts
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  approvalId: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/ApplicationReceipt' } }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/application-receipts:
    post:
      tags: [internal]
      summary: '[정본 서비스→approval] 반영 결과 회신 (APPLIED / PARTIAL / REJECTED / UNKNOWN_RESULT)'
      description: 이벤트(ProductVersionPublished 등)로도 수신하지만 동기 회신 경로를 함께 둔다. 같은 receiverService·approvalId·receiptSeq 재전송은 멱등.
      operationId: reportApplicationReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationReceiptRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVARIANT_VIOLATION (집행 누계 > 승인량)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /batch-changes:
    post:
      tags: [batch-changes]
      summary: 대량 변경 배치 등록 (BO-26; fileHash 고정·행별 멱등·결과 분리)
      description: 같은 fileHash 재등록은 기존 batchId 반환. 각 행은 rowKey 로 멱등하며 개별 ChangeRequest 로 전개된다.
      operationId: createBatchChange
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, fileHash, fileName, rows]
              properties:
                type: { $ref: '#/components/schemas/ApprovalType' }
                fileHash: { type: string, description: SHA-256 hex }
                fileName: { type: string }
                rows:
                  type: array
                  minItems: 1
                  maxItems: 5000
                  items:
                    type: object
                    required: [rowKey, payload]
                    properties:
                      rowKey: { type: string, description: 파일 내 유일 키 (행 멱등) }
                      targetRef: { type: string }
                      payload: { type: object, additionalProperties: true }
      responses:
        '201':
          description: 배치 생성 (resultId = batchId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /batch-changes/{batchId}:
    get:
      tags: [batch-changes]
      summary: 배치 조회 (집계)
      operationId: getBatchChange
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchChange' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /batch-changes/{batchId}/rows:
    get:
      tags: [batch-changes]
      summary: 배치 행별 결과 (BatchRowResultRecorded)
      operationId: listBatchChangeRows
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/BatchRowState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BatchRow' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /policy-references:
    get:
      tags: [policy-references]
      summary: 정책 참조 조회 (BO-09; 소유 서비스·정책 키·반영 상태)
      operationId: listPolicyReferences
      parameters:
        - { name: ownerService, in: query, required: true, schema: { type: string } }
        - { name: policyKey, in: query, schema: { type: string } }
        - { name: applyState, in: query, schema: { type: string, enum: [APPROVED, PENDING_APPLY, APPLIED, FAILED, UNKNOWN] } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PolicyReference' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
    post:
      tags: [policy-references]
      summary: 정책 참조 등록 (원정책 ID·버전 연결; 계산 엔진 복제 없음, PolicyVersionApproved)
      operationId: registerPolicyReference
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerService, policyKey, policyVersion, approvalId]
              properties:
                ownerService: { type: string }
                policyKey: { type: string, description: 예 ORDER.MIN_ORDER_AMOUNT }
                policyId: { type: string, description: 소유 서비스의 정책 ID }
                policyVersion: { type: integer }
                approvalId: { type: string }
                effectiveFrom: { type: string, format: date-time }
                summary: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 등록 (resultId = policyReferenceId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (approvalId 가 APPROVED 아님)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    ApprovalType:
      type: string
      description: 승인 종류 → 정본 (service-map §8 approval-service 표)
      enum: [PRODUCT, PRICE, DISPLAY, CENTER_MASTER, SERVICEABILITY, INITIAL_STOCK, OPERATION_RESTRICTION, OPERATION_RESUME, POLICY, SUPPLY_BUSINESS, REFUND_CLAIM, QUALITY_RECALL, INVENTORY_ADJUSTMENT, INVENTORY_LOSS, GRANT, CENTER_CLOSURE, BATCH]
    RequestState:
      type: string
      enum: [DRAFT, SUBMITTED, WITHDRAW_REQUESTED, WITHDRAWN]
    ReviewState:
      type: string
      enum: [REVIEW_PENDING, EVIDENCE_REQUIRED, APPROVED, PARTIALLY_APPROVED, REJECTED, EXPIRED, SUPERSEDED]
    ExecutionState:
      type: string
      enum: [NOT_REQUESTED, VALIDATING, ACCEPTED, IN_PROGRESS, PARTIAL, APPLIED, REJECTED, UNKNOWN_RESULT]
    DeliveryState:
      type: string
      enum: [PENDING, DELIVERED, ACKNOWLEDGED, RETRY_PENDING, FAILED]
    BatchRowState:
      type: string
      enum: [PENDING, VALID, INVALID, SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT]
    ApprovalLine:
      type: object
      required: [lineKey]
      properties:
        lineKey: { type: string, description: 원객체 행 식별 (sku / orderLineId / locationCode 등) }
        targetRef: { type: string }
        requestedQty: { type: integer, minimum: 0 }
        approvedQty: { type: integer, minimum: 0 }
        requestedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        attributes: { type: object, additionalProperties: true, description: 종류별 변경 내용 (before/after) }
    ChangeRequestBody:
      type: object
      required: [type, targetService, targetRef, allowedActions, summary]
      properties:
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string, description: 정본 서비스 }
        targetRef: { type: string, description: 원객체 ID }
        targetExpectedVersion: { type: integer, description: 원객체 예상 버전 (STALE_VERSION 판정) }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        allowedActions: { type: array, minItems: 1, items: { type: string } }
        summary: { type: string, maxLength: 500 }
        lines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
        conditions: { type: array, items: { type: string } }
        requestedEffectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        evidenceRefs: { type: array, items: { type: string } }
        caseId: { type: string }
    ChangeRequest:
      allOf:
        - $ref: '#/components/schemas/ChangeRequestBody'
        - type: object
          properties:
            changeRequestId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            requestState: { $ref: '#/components/schemas/RequestState' }
            requesterId: { type: string }
            approvalId: { type: [string, 'null'], description: 제출 후 발급 }
            createdAt: { type: string, format: date-time }
            submittedAt: { type: [string, 'null'], format: date-time }
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, PARTIALLY_APPROVE, REJECT, REQUEST_EVIDENCE] }
        lines:
          type: array
          description: PARTIALLY_APPROVE 시 행별 approvedQty/approvedAmount
          items: { $ref: '#/components/schemas/ApprovalLine' }
        conditions: { type: array, items: { type: string } }
        effectiveFrom: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        comment: { type: string, maxLength: 1000 }
        requiredEvidence: { type: array, items: { type: string }, description: REQUEST_EVIDENCE 시 }
        delegationId: { type: string, description: 대행 승인 시 auth Delegation }
    Decision:
      allOf:
        - $ref: '#/components/schemas/DecisionRequest'
        - type: object
          properties:
            decisionId: { type: string }
            approvalId: { type: string }
            approverId: { type: string }
            decidedAt: { type: string, format: date-time }
    ApprovalSummary:
      type: object
      properties:
        approvalId: { type: string }
        changeRequestId: { type: string }
        type: { $ref: '#/components/schemas/ApprovalType' }
        targetService: { type: string }
        targetRef: { type: string }
        summary: { type: string }
        requesterId: { type: string }
        requestState: { $ref: '#/components/schemas/RequestState' }
        reviewState: { $ref: '#/components/schemas/ReviewState' }
        executionState: { $ref: '#/components/schemas/ExecutionState' }
        deliveryState: { $ref: '#/components/schemas/DeliveryState' }
        caseId: { type: [string, 'null'] }
        submittedAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    Approval:
      allOf:
        - $ref: '#/components/schemas/ApprovalSummary'
        - type: object
          properties:
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            approvalVersion: { type: integer, description: 재심사마다 증가 }
            lineage:
              type: object
              properties:
                previousApprovalId: { type: [string, 'null'] }
                supersededByApprovalId: { type: [string, 'null'] }
            targetExpectedVersion: { type: integer }
            centerScope: { type: array, items: { type: string } }
            allowedActions: { type: array, items: { type: string } }
            lines: { type: array, items: { $ref: '#/components/schemas/ApprovalLine' } }
            conditions: { type: array, items: { type: string } }
            effectiveFrom: { type: [string, 'null'], format: date-time }
            execution:
              type: object
              description: 부분 집행 불변식 (승인량 = 누적 유효 집행 + 승인된 미집행 취소 + 열린 집행 잔량)
              properties:
                approvedQty: { type: integer }
                executedQty: { type: integer }
                cancelledUnexecutedQty: { type: integer }
                openRemainingQty: { type: integer }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                executedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            decisions: { type: array, items: { $ref: '#/components/schemas/Decision' } }
            receipts: { type: array, items: { $ref: '#/components/schemas/ApplicationReceipt' } }
            evidenceRefs: { type: array, items: { type: string } }
    ApplicationReceiptRequest:
      type: object
      required: [approvalId, receiverService, receiptSeq, result]
      properties:
        approvalId: { type: string }
        receiverService: { type: string }
        receiptSeq: { type: integer, minimum: 1, description: 수신자별 회신 순번 (멱등) }
        result: { type: string, enum: [ACCEPTED, APPLIED, PARTIAL, REJECTED, UNKNOWN_RESULT] }
        appliedQty: { type: integer }
        appliedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        domainRef: { type: string, description: 정본 측 결과 ID (commitId / versionId / grantId) }
        domainVersion: { type: integer }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
    ApplicationReceipt:
      allOf:
        - $ref: '#/components/schemas/ApplicationReceiptRequest'
        - type: object
          properties:
            receiptId: { type: string }
            deliveryState: { $ref: '#/components/schemas/DeliveryState' }
            receivedAt: { type: string, format: date-time }
    BatchChange:
      type: object
      properties:
        batchId: { type: string }
        type: { $ref: '#/components/schemas/ApprovalType' }
        fileHash: { type: string }
        fileName: { type: string }
        state: { type: string, enum: [VALIDATING, READY, SUBMITTED, COMPLETED, PARTIALLY_FAILED, REJECTED] }
        totalRows: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: BatchRowState 별 건수
        approvalId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    BatchRow:
      type: object
      properties:
        rowKey: { type: string }
        state: { $ref: '#/components/schemas/BatchRowState' }
        changeRequestId: { type: [string, 'null'] }
        domainRef: { type: [string, 'null'] }
        errorCode: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
    PolicyReference:
      type: object
      properties:
        policyReferenceId: { type: string }
        ownerService: { type: string }
        policyKey: { type: string }
        policyId: { type: string }
        policyVersion: { type: integer }
        approvalId: { type: string }
        applyState: { type: string, enum: [APPROVED, PENDING_APPLY, APPLIED, FAILED, UNKNOWN] }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        appliedAt: { type: [string, 'null'], format: date-time }
        summary: { type: string }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
