openapi: 3.1.0
info:
  title: transport-execution-service
  version: 0.1.0
  description: |
    간선 운행·정차·실제 출발 사실(departureId)·인계 증빙·운행 사건·최신 ETA·비용 근거의 정본. (docs/architecture/service-map.md §6)
    TOUT 전기는 cdc-inventory, TIN은 mfc-inventory, 품질 판정은 quality, 재배정 계획은 transport-planning, 지급은 회계.
    실제 출발은 사람이 등록한 증빙 사실이며 GPS로 합성하지 않는다. 인계 증빙은 TIN이 아니다. 도착은 수량 증거가 아니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: trips, description: 운행 조회·출발 전 대조·출발·물리적 종료 }
  - { name: stops, description: 정차 도착/하차/인계/출차 }
  - { name: incidents, description: 운행 사건 }
  - { name: eta, description: 최신 ETA }
  - { name: cost, description: 비용 근거 }
  - { name: internal, description: 서비스 간 조회 }

paths:
  /trips/{tripId}:
    get:
      tags: [trips]
      summary: 운행 조회 (상태·정차·출발 사실·사건·ETA 요약)
      operationId: getTrip
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Trip' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/pre-departure-checks:
    post:
      tags: [trips]
      summary: 출발 전 실상차 대조 등록 (타 MFC 혼입·누락·봉인·구획)
      description: 대조 결과 FAIL이면 출발 등록은 409 INVALID_STATE. 결과 조회는 GET /trips/{tripId}(preDepartureCheck).
      operationId: recordPreDepartureCheck
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreDepartureCheckInput' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED (봉인·사진 누락)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /trips/{tripId}/departures:
    post:
      tags: [trips]
      summary: 실제 출발 사실 등록 → TruckActuallyDeparted (departureId 발급)
      description: |
        운행당 실제 출발은 1회. 재등록은 같은 departureId를 돌려준다. source=SIMULATED는 훈련·리허설용이며 TOUT 전기 대상이 아니다.
        trfCompositions는 이 출발에 실린 TRF별 구성(48/60 등)을 동결한다. 미출발 잔량은 같은 TRF로 보내지 않는다.
      operationId: recordDeparture
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepartureInput' }
      responses:
        '201':
          description: 출발 사실 (기존 사실이면 동일 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '409':
          description: INVALID_STATE (대조 미통과·이미 출발) / IDEMPOTENCY_CONFLICT / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: EVIDENCE_REQUIRED (evidenceRef 누락)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/departures/{departureId}:
    get:
      tags: [internal]
      summary: '[cdc-outbound/cdc-inventory/planning→execution] 실제 출발 사실 조회 (원결과 조회)'
      operationId: getDeparture
      parameters:
        - { name: departureId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departure' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/stops/{stopId}/arrivals:
    post:
      tags: [stops]
      summary: 정차 도착 등록 → StopArrived (수량 증거 아님)
      operationId: recordStopArrival
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopEventInput' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/stops/{stopId}/unloading-starts:
    post:
      tags: [stops]
      summary: 하차 시작 등록 (하차면 배정 확인)
      operationId: recordUnloadingStart
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopEventInput' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/stops/{stopId}/handovers:
    post:
      tags: [stops]
      summary: 인계 증빙 등록 → TransportHandoverEvidenceRecorded (TIN 아님)
      description: 정차·TRF·LPN·수량·인계자/인수자·사진·봉인을 기록한다. 수량 차이는 discrepancies에 남기고 사건(QTY)으로 연결한다.
      operationId: recordHandover
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverInput' }
      responses:
        '201':
          description: 인계 증빙 (handoverId 발급)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED (사진·인수자 누락)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /trips/{tripId}/stops/{stopId}/handovers/{handoverId}:
    get:
      tags: [stops]
      summary: 인계 증빙 조회
      operationId: getHandover
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - { name: handoverId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Handover' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/stops/{stopId}/departures:
    post:
      tags: [stops]
      summary: 정차 출차 등록 (인계 기록 후에만)
      operationId: recordStopDeparture
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: stopId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StopEventInput' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (인계 미기록 정차)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /trips/{tripId}/incidents:
    post:
      tags: [incidents]
      summary: 운행 사건 등록 → TransportIncidentRaised (환적·재출발 자동 없음)
      operationId: raiseTransportIncident
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInput' }
      responses:
        '201':
          description: 사건 (incidentId 발급)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    get:
      tags: [incidents]
      summary: 운행 사건 목록
      operationId: listTransportIncidents
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/IncidentState' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Incident' } }

  /trips/{tripId}/incidents/{incidentId}:
    get:
      tags: [incidents]
      summary: 운행 사건 조회
      operationId: getTransportIncident
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - { name: incidentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/eta:
    get:
      tags: [eta]
      summary: 최신 ETA 조회 (최초 약속 originalPromise 보존)
      operationId: getTripEta
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripEta' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /trips/{tripId}/physical-ends:
    post:
      tags: [trips]
      summary: 운행 물리적 종료 등록 (마지막 정차 후 복귀) → TripPhysicallyEnded
      description: fleet 재가용 계산 입력이 된다. 수량 의무가 남아 있으면 운행은 CLOSED가 아니라 PHYSICAL_ENDED에 머문다.
      operationId: recordPhysicalEnd
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 간선 기사용 사용자 종류 없음(현장 담당자·운영자 기준)"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endedAt, returnCenterId]
              properties:
                endedAt: { type: string, format: date-time }
                returnCenterId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                odometerKm: { type: number }
                evidenceRef: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /trips/{tripId}/cost-basis:
    get:
      tags: [cost]
      summary: 비용 근거 조회 (요율 버전·대기·추가 정차; 요율 미등록이면 NOT_COMPUTABLE)
      description: 산정 불가는 0원이 아니다. 지급 정본은 회계이며 여기서는 근거만 제공한다.
      operationId: getTripCostBasis
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 미구현, 비용 근거는 운영자 조회로 봄"
      parameters:
        - { name: tripId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostBasis' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    TripState:
      type: string
      enum: [DRAFT, VALIDATING, CONFIRMED, LOADING, READY, IN_TRANSIT, PHYSICAL_ENDED, CLOSED]
    StopState:
      type: string
      enum: [PLANNED, ARRIVED, WAITING, UNLOADING, HANDOVER_PENDING, HANDOVER_RECORDED, DEPARTED]
    IncidentState:
      type: string
      enum: [OPEN, ASSIGNED, ACTION_PENDING, RESOLVED, CLOSED]
    StopEventInput:
      type: object
      required: [occurredAt]
      properties:
        occurredAt: { type: string, format: date-time }
        recordedBy: { type: string, description: 기사 또는 현장 담당자 식별자 }
        location:
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
        unloadingBayId: { type: string, description: mfc-capacity 하차면 예약 참조 }
        evidenceRef: { type: string }
        note: { type: string, maxLength: 500 }
    PreDepartureCheckInput:
      type: object
      required: [result, checkedAt, checkedBy]
      properties:
        result: { type: string, enum: [PASS, FAIL] }
        checkedAt: { type: string, format: date-time }
        checkedBy: { type: string }
        manifestRef: { type: string, description: TransferShipmentManifest 참조 }
        findings:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [WRONG_MFC_MIXED, MISSING_LPN, SEAL_MISMATCH, COMPARTMENT_MISMATCH, EXTRA_LPN] }
              lpn: { type: string }
              trfId: { type: string }
              detail: { type: string }
        seals: { type: array, items: { type: object, properties: { compartmentId: { type: string }, sealNo: { type: string } } } }
        evidenceRefs: { type: array, items: { type: string } }
    TrfComposition:
      type: object
      required: [trfId, lines]
      properties:
        trfId: { type: string }
        trfVersion: { type: integer }
        lines:
          type: array
          items:
            type: object
            required: [sku, qty]
            properties:
              lpn: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lot: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              compartmentId: { type: string }
    DepartureInput:
      type: object
      required: [departedAt, source, vehicleId, driverId, evidenceRef, trfCompositions]
      properties:
        departedAt: { type: string, format: date-time }
        source: { type: string, enum: [REAL, SIMULATED], description: GPS 추정으로 합성 금지 }
        vehicleId: { type: string }
        driverId: { type: string }
        evidenceRef: { type: string, description: 발차 사진·게이트 기록 등 증빙 참조 }
        preDepartureCheckId: { type: string }
        trfCompositions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TrfComposition' } }
        recordedBy: { type: string }
    Departure:
      allOf:
        - $ref: '#/components/schemas/DepartureInput'
        - type: object
          required: [departureId, tripId]
          properties:
            departureId: { type: string }
            tripId: { type: string }
            fromCdc: { $ref: '_common.yaml#/components/schemas/CenterId' }
            recordedAt: { type: string, format: date-time }
    HandoverInput:
      type: object
      required: [trfId, handedAt, handedBy, receivedBy, lines, evidenceRef]
      properties:
        trfId: { type: string }
        handedAt: { type: string, format: date-time }
        handedBy: { type: string, description: 인계자(기사) }
        receivedBy: { type: string, description: 인수자(MFC 담당) }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              lpn: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lot: { type: string }
              qty: { type: integer, minimum: 0 }
        seals: { type: array, items: { type: object, properties: { compartmentId: { type: string }, sealNo: { type: string }, intact: { type: boolean } } } }
        evidenceRef: { type: string, description: 사진·서명 참조 }
        discrepancies:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [SHORT, OVER, DAMAGED, WRONG_LPN, SEAL_BROKEN] }
              lpn: { type: string }
              sku: { type: string }
              expectedQty: { type: integer }
              actualQty: { type: integer }
              note: { type: string }
    Handover:
      allOf:
        - $ref: '#/components/schemas/HandoverInput'
        - type: object
          required: [handoverId, tripId, stopId]
          properties:
            handoverId: { type: string }
            tripId: { type: string }
            stopId: { type: string }
            departureId: { type: string }
            incidentId: { type: [string, 'null'], description: 차이가 있으면 연결된 QTY 사건 }
            recordedAt: { type: string, format: date-time }
    IncidentInput:
      type: object
      required: [kind, occurredAt, reportedBy]
      properties:
        kind: { type: string, enum: [DELAY, BREAKDOWN, GPS_LOST, TEMP, QTY] }
        occurredAt: { type: string, format: date-time }
        reportedBy: { type: string }
        stopId: { type: string }
        trfIds: { type: array, items: { type: string } }
        custodyLocation:
          type: object
          description: 화물 현 보관 위치(고장·환적 대기 시 안전 보관 근거)
          properties:
            kind: { type: string, enum: [ON_VEHICLE, CENTER, THIRD_PARTY, UNKNOWN] }
            centerId: { type: string }
            lat: { type: number }
            lng: { type: number }
            description: { type: string }
        delayMinutes: { type: integer }
        excursionId: { type: string, description: cold-chain 이탈 사건 참조 }
        handoverId: { type: string, description: QTY 사건의 근거 인계 }
        evidenceRef: { type: string }
        description: { type: string, maxLength: 1000 }
    Incident:
      allOf:
        - $ref: '#/components/schemas/IncidentInput'
        - type: object
          required: [incidentId, tripId, state]
          properties:
            incidentId: { type: string }
            tripId: { type: string }
            state: { $ref: '#/components/schemas/IncidentState' }
            caseId: { type: [string, 'null'], description: case-service 이관 참조 }
            resolution: { type: string }
            raisedAt: { type: string, format: date-time }
            resolvedAt: { type: [string, 'null'], format: date-time }
    TripEta:
      type: object
      required: [tripId, asOf]
      properties:
        tripId: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        stops:
          type: array
          items:
            type: object
            properties:
              stopId: { type: string }
              centerId: { type: string }
              originalPromise: { type: string, format: date-time, description: 배정 시 최초 약속 (불변) }
              latestEta: { type: string, format: date-time }
              delayMinutes: { type: integer }
              basis: { type: string, enum: [PLAN, GPS, DRIVER_REPORT, INCIDENT] }
              matrixVersion: { type: string }
    Stop:
      type: object
      properties:
        stopId: { type: string }
        sequence: { type: integer }
        centerId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        state: { $ref: '#/components/schemas/StopState' }
        trfIds: { type: array, items: { type: string } }
        plannedArriveAt: { type: string, format: date-time }
        arrivedAt: { type: [string, 'null'], format: date-time }
        unloadingStartedAt: { type: [string, 'null'], format: date-time }
        departedAt: { type: [string, 'null'], format: date-time }
        handoverIds: { type: array, items: { type: string } }
    Trip:
      type: object
      required: [tripId, state, version]
      properties:
        tripId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/TripState' }
        assignmentId: { type: string }
        assignmentVersion: { type: integer }
        instructionVersion: { type: integer }
        vehicleId: { type: string }
        driverId: { type: string }
        fromCdc: { $ref: '_common.yaml#/components/schemas/CenterId' }
        preDepartureCheck:
          type: object
          properties:
            checkId: { type: string }
            result: { type: string, enum: [PASS, FAIL] }
            checkedAt: { type: string, format: date-time }
        departure: { $ref: '#/components/schemas/Departure' }
        stops: { type: array, items: { $ref: '#/components/schemas/Stop' } }
        openIncidentIds: { type: array, items: { type: string } }
        obligations:
          type: array
          description: 수량 의무 대사 상태(출발 q = 수령 r + 손실 l + 미정산 t)
          items:
            type: object
            properties:
              trfId: { type: string }
              departedQty: { type: integer }
              receivedQty: { type: [integer, 'null'] }
              state: { type: string, enum: [PENDING, RECONCILED, DISCREPANCY] }
        physicallyEndedAt: { type: [string, 'null'], format: date-time }
        sources:
          type: array
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    CostBasis:
      type: object
      required: [tripId, state]
      properties:
        tripId: { type: string }
        state:
          type: string
          description: NOT_COMPUTABLE는 요율 미등록. 0원으로 해석 금지.
          enum: [COMPUTED, PARTIAL, NOT_COMPUTABLE]
        rateVersion: { type: [string, 'null'] }
        missing: { type: array, items: { type: string, enum: [BASE_RATE, WAITING_RATE, EXTRA_STOP_RATE, DISTANCE_RATE] } }
        components:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [BASE, DISTANCE, WAITING, EXTRA_STOP, OVERTIME] }
              quantity: { type: number }
              unit: { type: string }
              amount: { $ref: '_common.yaml#/components/schemas/Money' }
              evidenceRef: { type: string }
        totalAmount: { type: [integer, 'null'], description: NOT_COMPUTABLE면 null }
        computedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
