openapi: 3.1.0
info:
  title: customer-assistant-service
  version: 0.1.0
  x-stage: 3
  x-stage-note: 고객앱 RAG 1차(2026-11-09, ADR-0051) — 고객 공개 안내 문서 질의응답 + 근거 표시 + 내 주문 상태 안내 + 고객센터 문의 연결.
  description: |
    고객앱 고객센터 채팅의 AI 상담(RAG). 승인된 고객 공개 안내 문서(`docs/business/customer-faq/`)만 검색해 근거와 함께 답한다.
    운영자 문서·답변은 다른 서비스(ai-assistant-service)가 갖고, 이 서비스는 그 DB 에 접속할 계정이 없다(ADR-0051).

    **누가**: 로그인한 회원 고객만(typ=CUSTOMER). 비회원(GUEST)·운영자 토큰은 403(사용자 결정 2026-11-09 C2).
    **출처(X-Source-System)**: 토큰에 `src` 가 있으면 헤더와 같아야 한다. 없으면 `customer-app` 만 허용한다.

    **요청 제한(C3)**: 고객마다 1분에 5개, 하루(Asia/Seoul 자정 기준) 50개. 넘으면 429 `RATE_LIMITED` + `Retry-After`(초).
    같은 Idempotency-Key 재전송(같은 답 다시 받기)은 세지 않는다.

    **질문 저장(C5)**: 질문 원문은 저장하지 않는다 — 요청 해시(sha256)만. 그래서 질문 목록 API 가 없다(채팅 기록은 앱 화면에만).
    답변 문장·인용·고른 주문 ID 는 같은 키 재조회를 위해 저장한다.

    **결과(state)**
    - `ANSWERED`: 안내 문서를 근거로 답함.
    - `NO_GROUNDING`: 안내 문서에서 근거를 못 찾음 → `handoff`(고객센터 문의 남기기, C4).
    - `REALTIME_DATA_REQUIRED`: 특정 주문의 지금 상태를 물었는데 주문을 고르지 않음 → `recentOrders`(최근 주문 최대 5개)에서 고르게 한다(C6).
    - `ORDER_STATUS`: 고른 주문의 지금 상태를 물음 → 주문 상태를 order-service 에서 읽어 정해진 문장으로 답한다(모델이 상태를 지어내지 않는다).
    - `OUT_OF_SCOPE`: 취소·환불·반품 같은 실행 요청, 지시 무력화 시도 → 하지 않음 + `handoff`.
    - `PROCESSING`: 같은 키가 처리 중(202).

    **주문(orderId)**: 고르면 서버가 고객 토큰을 order-service `GET /orders/{orderId}` 로 넘겨 본인 주문인지 확인한다(남의·없는 주문 422 `ORDER_NOT_FOUND`).
    응답의 `order` 는 응답할 때마다 order-service 에서 새로 읽는다(저장하지 않음). 읽지 못하면 null.
    주문 정보는 모델에 넘기지 않는다 — 안내 답변은 문서만 근거로 한다.

    **멱등**: 범위는 (sourceSystem, 고객 subject, Idempotency-Key). 요청 해시 = sha256(정규화 질문 + "\n" + {"orderId"} JSON).
    같은 키에 다른 질문·주문이면 409 `IDEMPOTENCY_CONFLICT`. 최초 응답을 잃으면 `GET /customer-assistant/questions?requestId=`.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: ops, description: 운영 정보 }
  - { name: customer-assistant, description: 고객센터 AI 상담(읽기 전용) }

paths:
  /actuator/health:
    get:
      tags: [ops]
      summary: 헬스 (인증 불필요)
      operationId: getCustomerAssistantHealth
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE] }

  /customer-assistant/questions:
    post:
      tags: [customer-assistant]
      summary: 고객센터 AI 상담 질문 — 안내 문서를 근거로 답한다(같은 Idempotency-Key 재전송은 같은 답)
      operationId: askCustomerQuestion
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerQuestion' }
            example:
              question: 상품 준비가 시작된 주문도 취소할 수 있나요?
      responses:
        '200':
          description: 완료 — ANSWERED · NO_GROUNDING · REALTIME_DATA_REQUIRED · ORDER_STATUS · OUT_OF_SCOPE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
              examples:
                answered: { $ref: '#/components/examples/Answered' }
                noGrounding: { $ref: '#/components/examples/NoGrounding' }
                realtime: { $ref: '#/components/examples/RealtimeRequired' }
                orderStatus: { $ref: '#/components/examples/OrderStatus' }
        '202':
          description: 같은 키가 다른 요청에서 처리 중 — Retry-After 뒤 GET ?requestId= 로 조회
          headers:
            Retry-After: { schema: { type: integer }, description: 초 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: IDEMPOTENCY_CONFLICT — 같은 Idempotency-Key 를 다른 질문·주문에 썼다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: ORDER_NOT_FOUND(남의·없는 주문) 또는 CONFIG_REQUIRED(안내 문서 색인 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '429':
          description: RATE_LIMITED — 1분 5개·하루 50개를 넘었다. Retry-After 초 뒤에 다시
          headers:
            Retry-After: { schema: { type: integer }, description: 초 }
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 검색·모델·주문 조회 장애 또는 시간 초과. 같은 Idempotency-Key 로 다시 보낸다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [customer-assistant]
      summary: 요청 키로 답변 찾기 — 최초 응답을 잃었을 때(범위 = 출처 + 본인 + 키)
      operationId: findCustomerAnswerByRequestId
      parameters:
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - name: requestId
          in: query
          required: true
          description: 질문 때 보낸 Idempotency-Key
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 완료된 답변
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '202':
          description: 처리 중 — Retry-After 뒤 다시 조회
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 그 범위에 기록이 없다(다른 고객 포함, 존재를 드러내지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 직전 시도가 실패했거나 처리 중 lease 가 만료됐다 → 같은 키·같은 본문으로 POST 다시
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/questions/{answerId}:
    get:
      tags: [customer-assistant]
      summary: 답변 다시 보기(질문한 고객 본인만)
      operationId: getCustomerAnswer
      parameters:
        - { name: answerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '202':
          description: 처리 중
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerAnswer' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: NOT_FOUND — 없거나 다른 고객의 답변
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE(retryable=true) — 실패했거나 lease 만료 → 같은 키로 POST 재시도
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customer-assistant/recent-orders:
    get:
      tags: [customer-assistant]
      summary: '"주문 건에 대한 문의"에서 고를 최근 주문(본인, 최근 확정 순, 최대 10개) — order-service GET /orders 를 고객 토큰으로 부른다(C6)'
      operationId: listRecentOrdersForChat
      parameters:
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 5 }
      responses:
        '200':
          description: OK (요청 제한에 세지 않는다)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderBrief' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '503':
          description: DEPENDENCY_UNAVAILABLE — 주문 조회 장애
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'

  schemas:
    CustomerQuestion:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1, maxLength: 500 }
        orderId:
          type: [string, 'null']
          maxLength: 64
          description: '"주문 건에 대한 문의"로 고른 주문. 본인 주문이어야 한다(아니면 422 ORDER_NOT_FOUND)'

    CustomerAnswerState:
      type: string
      enum: [ANSWERED, NO_GROUNDING, REALTIME_DATA_REQUIRED, ORDER_STATUS, OUT_OF_SCOPE, PROCESSING]

    AnswerMode:
      type: string
      enum: [GENERATIVE, BASELINE_EXTRACTIVE, ORDER_TEMPLATE, NONE]
      description: GENERATIVE=모델 생성(인용 검사 통과), BASELINE_EXTRACTIVE=안내 문서 원문 발췌, ORDER_TEMPLATE=주문 상태를 정해진 문장으로, NONE=답 생성 안 함

    Citation:
      type: object
      required: [documentId, title, excerpt]
      properties:
        documentId: { type: string, description: 안내 문서 경로(docs/business/customer-faq/…) }
        title: { type: string, description: 안내 문서 제목(첫 제목 줄) }
        section: { type: [string, 'null'], description: 절 제목 }
        excerpt: { type: string, description: 근거 절 본문(지위 표시 태그는 뺀다) }

    OrderBrief:
      type: object
      required: [orderId, status, statusLabel]
      properties:
        orderId: { type: string }
        status: { type: string, description: order-service OrderStatus 그대로 }
        statusLabel: { type: string, description: 고객에게 보일 상태 이름(예 "상품 준비 중") }
        orderedAt: { type: [string, 'null'], format: date-time }
        itemCount: { type: [integer, 'null'] }
        totalAmount: { type: [integer, 'null'], description: 원 }
        arrivalWindow:
          type: [object, 'null']
          description: 도착 예정 시간대(주문 상세에서만, Asia/Seoul)
          properties:
            date: { type: string, format: date }
            start: { type: string }
            end: { type: string }

    Handoff:
      type: object
      required: [target, message]
      description: 고객센터 문의 남기기 연결(C4). 앱은 버튼을 보이고, 누르면 case-service POST /inquiries 를 origin=ASSISTANT_HANDOFF 로 연다.
      properties:
        target: { type: string, enum: [INQUIRY] }
        message: { type: string, description: 버튼 위 안내 문구 }
        buttonLabel: { type: string, description: '버튼 문구 — "고객센터에 문의 남기기"' }
        orderId: { type: [string, 'null'], description: 고른 주문이 있으면 문의에 그대로 }

    CustomerAnswer:
      type: object
      required: [answerId, requestId, state, answer, citations, answerMode, askedAt]
      properties:
        answerId: { type: string }
        requestId: { type: string, description: 질문 때의 Idempotency-Key }
        state: { $ref: '#/components/schemas/CustomerAnswerState' }
        answer: { type: string }
        citations: { type: array, items: { $ref: '#/components/schemas/Citation' } }
        answerMode: { $ref: '#/components/schemas/AnswerMode' }
        orderId: { type: [string, 'null'] }
        order:
          $ref: '#/components/schemas/OrderBrief'
          description: 고른 주문의 지금 상태(응답 때마다 새로 읽음). 고르지 않았거나 못 읽으면 없음(null)
        recentOrders:
          type: array
          description: REALTIME_DATA_REQUIRED 일 때 고를 최근 주문(최대 5개, 그 밖은 빈 배열)
          items: { $ref: '#/components/schemas/OrderBrief' }
        handoff:
          $ref: '#/components/schemas/Handoff'
          description: 고객센터 문의 연결(NO_GROUNDING·OUT_OF_SCOPE·ORDER_STATUS). 그 밖은 없음(null)
        askedAt: { type: string, format: date-time }

  examples:
    Answered:
      value:
        answerId: CANS-2f0c9a1e
        requestId: 7b1d4c2e-0b5a-4f7e-9d61-1d2b3c4d5e6f
        state: ANSWERED
        answer: 상품 준비가 시작된 뒤에는 앱에서 취소할 수 없어요. 고객센터에 문의를 남겨 주시면 준비를 멈출 수 있는지 확인해 알려 드릴게요.
        citations:
          - documentId: docs/business/customer-faq/02-cancel.md
            title: 주문 취소
            section: 상품 준비가 시작된 뒤 취소 문의를 하면요?
            excerpt: "- 이미 상품 준비가 시작되어 앱에서는 취소할 수 없어요. …"
        answerMode: GENERATIVE
        orderId: null
        order: null
        recentOrders: []
        handoff: null
        askedAt: "2026-11-09T07:10:00Z"
    NoGrounding:
      value:
        answerId: CANS-0a1b2c3d
        requestId: 1f2e3d4c-0000-4000-8000-000000000001
        state: NO_GROUNDING
        answer: 이 문의는 지금 바로 답변드리기 어려워요. 고객센터에 문의를 남겨 주시면 담당자가 확인한 뒤 답변드릴게요.
        citations: []
        answerMode: NONE
        recentOrders: []
        handoff: { target: INQUIRY, message: 고객센터에 문의를 남겨 주시면 담당자가 확인한 뒤 답변드릴게요. 답변은 고객센터의 내 문의에서 확인할 수 있어요., buttonLabel: 고객센터에 문의 남기기, orderId: null }
        askedAt: "2026-11-09T07:11:00Z"
    RealtimeRequired:
      value:
        answerId: CANS-5e6f7a8b
        requestId: 2a3b4c5d-0000-4000-8000-000000000002
        state: REALTIME_DATA_REQUIRED
        answer: 어떤 주문이 궁금하신가요? 아래 최근 주문에서 골라 주시면 그 주문의 상태를 알려 드릴게요.
        citations: []
        answerMode: NONE
        recentOrders:
          - { orderId: ORD-01J…, status: IN_DELIVERY, statusLabel: 배송 중, orderedAt: "2026-11-09T06:40:00Z", itemCount: 3, totalAmount: 23400 }
        handoff: null
        askedAt: "2026-11-09T07:12:00Z"
    OrderStatus:
      value:
        answerId: CANS-9c8d7e6f
        requestId: 3c4d5e6f-0000-4000-8000-000000000003
        state: ORDER_STATUS
        answer: 고르신 주문은 지금 '배송 중'이에요. 도착 예정 시간은 11월 9일 13:00~14:00이에요. 자세한 진행 상황은 주문 상세에서 볼 수 있어요.
        citations: []
        answerMode: ORDER_TEMPLATE
        orderId: ORD-01J…
        order: { orderId: ORD-01J…, status: IN_DELIVERY, statusLabel: 배송 중, arrivalWindow: { date: "2026-11-09", start: "13:00", end: "14:00" } }
        recentOrders: []
        handoff: { target: INQUIRY, message: 더 궁금한 점이 있으면 고객센터에 문의를 남겨 주세요., buttonLabel: 고객센터에 문의 남기기, orderId: ORD-01J… }
        askedAt: "2026-11-09T07:13:00Z"
