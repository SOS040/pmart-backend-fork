openapi: 3.1.0
info:
  title: mfc-location-service
  version: 0.5.0
  description: |
    MFC 센터 내부 Area/Location 마스터·온도구역·격리/출하대기 구역·위치 상태의 정본. (docs/architecture/service-map.md §5)
    비정본: 수량·공간 예약 잔여량 V(mfc-inventory), 센터 마스터(center-master).
    로케이션 코드 문법 `[Q-03 결정 필요]` — 현재는 자유 문자열(maxLength 32)로 두고 문법 확정 시 pattern 추가(하위 호환).

    구현(0.2.0, ADR-0040 2단계): 등록·속성 변경·상태 변경·조회·적치 후보. 쓰기는 그 센터의 운영자(`centers` 클레임), 읽기는 그 센터 운영자 또는
    서비스 토큰. 위치가 생기거나 바뀔 때마다 MfcLocationStateChanged(토픽 mfc.location.v1)에 전체 속성(코드·구역·온도대·상태·버전)을 싣는다 —
    mfc-inventory 가 투영해 수령·적치 위치를 검증한다. 위치 폐지(DELETE, 2026-11-08)는 CLOSED 위치만, mfc-inventory 스냅샷(locationCode)으로 재고 0 을 확인한 뒤 RETIRED.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: locations, description: 위치 마스터 CRUD·상태 }

paths:
  /locations:
    get:
      tags: [locations]
      summary: 위치 목록 (센터·구역·온도대·상태)
      operationId: listLocations
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: zone, in: query, schema: { $ref: '#/components/schemas/ZoneKind' } }
        - { name: temperatureZone, in: query, schema: { $ref: '#/components/schemas/TemperatureZone' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/LocationState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Location' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
    post:
      tags: [locations]
      summary: 위치 등록
      operationId: createLocation
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationBody' }
      responses:
        '201':
          description: 생성
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / LOCATION_CODE_DUPLICATE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /locations/{locationId}:
    get:
      tags: [locations]
      summary: 위치 조회
      operationId: getLocation
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      tags: [locations]
      summary: 위치 속성 변경 (치수·슬롯 수·온도대·구역; 코드 변경 불가)
      operationId: updateLocation
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationBody' }
      responses:
        '200':
          description: 변경됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Location' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    delete:
      tags: [locations]
      summary: 위치 폐지 (재고 잔량 0·예약 없음일 때만, 논리 삭제 RETIRED)
      description: '구현(2026-11-08): 그 센터 운영자. CLOSED 만(먼저 닫아 새 적치·수령을 막는다 — 아니면 409 INVALID_STATE). mfc-inventory `GET /internal/snapshots?locationCode=` 에 재고 단위가 있으면 409, 조회 실패면 503(폐지 안 함). RETIRED + MfcLocationStateChanged, 되돌리지 않음. 이미 RETIRED 면 202 지금 상태. 공간 예약(MoveAllocation)은 아직 없어 보지 않는다.'
      operationId: retireLocation
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (잔량·공간 예약 존재 — mfc-inventory 확인 결과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /locations/{locationId}/state-changes:
    post:
      tags: [locations]
      summary: 위치 상태 변경 (ACTIVE/CLOSED/COUNT_LOCKED, MfcLocationStateChanged)
      description: COUNT_LOCKED 는 실사 잠금 협업용. CLOSED 위치에는 mfc-inventory 가 PUTAWAY/MOVE 를 거절한다(LOCATION_CLOSED).
      operationId: changeLocationState
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetState, reason]
              properties:
                targetState: { $ref: '#/components/schemas/LocationState' }
                reason: { type: string, maxLength: 200 }
                countSessionId: { type: string, description: COUNT_LOCKED 시 실사 세션 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/location-republications:
    post:
      tags: [locations]
      summary: '[운영 복구] 지금 위치 상태를 같은 버전으로 다시 알림(상태 변화 없음)'
      description: 구독 쪽 투영을 처음 연결하거나 복구할 때. 센터를 주면 그 센터만. 최대 20000건.
      operationId: republishLocations
      parameters:
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }

  /locations/{locationId}/state-changes/{requestId}:
    get:
      tags: [locations]
      summary: 상태 변경 요청 결과 조회
      operationId: getLocationStateChange
      parameters:
        - { name: locationId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  fromState: { $ref: '#/components/schemas/LocationState' }
                  toState: { $ref: '#/components/schemas/LocationState' }
                  newVersion: { type: integer }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /putaway-candidates:
    get:
      tags: [locations]
      summary: 적치 후보 위치 (온도대·구역 적합, 공간 잔여 V는 mfc-inventory 사본)
      operationId: listPutawayCandidates
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
        - { name: temperatureZone, in: query, schema: { $ref: '#/components/schemas/TemperatureZone' } }
        - { name: qty, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        locationId: { type: string }
                        locationCode: { type: string }
                        zone: { $ref: '#/components/schemas/ZoneKind' }
                        remainingSpace: { type: [integer, 'null'], description: V 사본. null은 불명 }
                        rank: { type: integer }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

components:
  schemas:
    ZoneKind:
      type: string
      enum: [RECEIVING, STORAGE, PICKING, PACKING, QUARANTINE, DISPATCH_STAGING, RETURN, DISPOSAL, CART]
      description: 'CART(0.4.0) = 재고 이동용 바구니(식별번호 있는 임시 위치, 코드 CRT-{온도대}-{번호})'
    TemperatureZone:
      type: string
      enum: [AMBIENT, CHILLED, FROZEN]
    LocationState:
      type: string
      enum: [ACTIVE, CLOSED, COUNT_LOCKED, RETIRED]
    LocationBody:
      type: object
      required: [mfcId, locationCode, zone, temperatureZone]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        locationCode:
          type: string
          maxLength: 32
          description: |
            센터 안 유일, 등록 뒤 바꿀 수 없다. 문법(Q-03 결정 2026-11-07, ADR-0042 — 새 등록에만 검사, 어기면 400 LOCATION_CODE_INVALID):
            선반·피킹(STORAGE·PICKING) `{온도대 A/C/F}-{구역 영문1+숫자1}-{랙 2자리}-{단 1~9}-{칸 2자리}` 예 `C-S1-03-2-04`
            (온도대 글자 = temperatureZone, 구역 = areaCode).
            그 밖의 구역 `{접두}-{온도대}-{번호 2자리}` 예 `RCV-C-01` — 접두 RCV 수령·PAK 포장·QRT 격리·DSP 출고 대기·RTN 회수·DSL 폐기·CRT 이동 카트(0.4.0).
            이 결정 전에 등록된 자유 형식 코드는 그대로 쓴다(바꾸려면 새로 등록하고 옮긴 뒤 닫는다).
        areaCode: { type: string, description: '구역. 선반·피킹은 코드의 구역과 같아야 하고, 없으면 코드에서 채운다' }
        zone: { $ref: '#/components/schemas/ZoneKind' }
        temperatureZone: { $ref: '#/components/schemas/TemperatureZone' }
        dimensions:
          type: object
          description: 공간 잔여 계산 입력
          properties:
            widthMm: { type: integer, minimum: 0 }
            depthMm: { type: integer, minimum: 0 }
            heightMm: { type: integer, minimum: 0 }
            slotCount: { type: integer, minimum: 0 }
            maxWeightG: { type: integer, minimum: 0 }
        pickSequence: { type: integer, description: 피킹 동선 순서 }
        categoryId: { type: [string, 'null'], maxLength: 64, description: '(0.5.0) 진열 카테고리 — 상품 카테고리 ID(그 아래 카테고리 상품도 받는다). 없으면 기타 칸(아무 상품 — 세일 상품 등). 2026-11-08 사용자 결정' }
        highTurnover: { type: boolean, default: false, description: '(0.4.0) 고회전 선반 — 같은 상품이 여러 칸에 있어도 된다(그 밖의 선반은 한 상품은 한 자리). 2026-11-08 사용자 결정' }
    Location:
      allOf:
        - $ref: '#/components/schemas/LocationBody'
        - type: object
          properties:
            locationId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { $ref: '#/components/schemas/LocationState' }
            stateReason: { type: [string, 'null'] }
            updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
