openapi: 3.1.0
info:
  title: mfc-inventory-service
  version: 0.2.0
  description: |
    MFC 재고 수량의 **단일 쓰기 주체**. (docs/architecture/service-map.md §5, ADR-0002)
    정본: Balance(센터·위치·SKU·LOT·품질상태·업무상태·수량·버전), LedgerEntry, ReservationPart, MoveAllocation(물량 M·공간 V), commitId 원장.
    비정본: 작업·포장·인계 fence(mfc-fulfillment), 수령 사실(mfc-inbound), 품질 판정(mfc-quality), 위치 마스터(mfc-location), 취소 판단(order-orchestration).

    수량 기호와 불변식
    - H(On-hand 현물), Q(격리), E(판매가능 실물 = H − Q − 미검수), R(예약), A(가용)
    - **0 ≤ R ≤ E ≤ H, A = E − R**
    - TIN(수령): H+q (E 제외, 검수 후 E+q). 인계 확정: H−q, E−q, R−q 를 **한 사건**으로 전기.
    - 격리: Q+q, E−q, 영향 ReservationPart → BLOCKED. 회수품 인수: H+q, Q+q. 폐기: 승인 잔량 내 H−q, Q−q.
    모든 변경은 commitId를 갖는다. 호출자는 자체 사본으로 성공을 판단하지 않고 commitId/requestId 조회로 확정한다.
    가용 조회 실패는 0이 아니라 503 DEPENDENCY_UNAVAILABLE 이다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: reservations, description: 예약 ReservationPart (HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED) }
  - { name: postings, description: 수량 전기 명령 (수령·작업·인계·품질·조정) }
  - { name: queries, description: 가용·스냅샷·원결과 조회 }
  - { name: sku-handlings, description: 센터 SKU 취급 ON·OFF (운영자 — 자기 센터) }
  - { name: skus, description: 상품 SKU 투영 조회 }

paths:
  /internal/reservations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] ReserveInventory — 결제 직전 재고 예약 (all-or-nothing)'
      description: |
        행별 요청량 ≤ A 를 검증하고 동일 SKU는 합산한다. 한 행이라도 부족하면 전체 거절(INSUFFICIENT_STOCK, 부족 행 details 포함).
        TTL 기본 10분 `[Q-04]`. 만료 시 InventoryHoldExpired 발행, R−q.

        슬라이스 4 구현(2026-10-30): 원장은 센터·SKU 한 행(LOT·위치·품질 차원 없음). 예약 SKU 행을 SKU 오름차순으로 잠가(`FOR UPDATE`)
        직렬화하므로 마지막 수량 경합에서 총 성공량 ≤ A 다. 거절은 기록하지 않으므로 같은 키 재요청은 다시 판정한다.
        - INSUFFICIENT_STOCK details: `field` = sku, `reason` = `requestedQty=<합산 요청량>;availableQty=<A>`
        - SKU_NOT_HANDLED details: `field` = sku, `reason` = `HANDLING_OFF`
        - lotConstraint 는 아직 지원하지 않는다(400 VALIDATION_FAILED).
      operationId: reserveInventory
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReserveInventoryRequest' }
      responses:
        '201':
          description: 예약 생성 (resultId = reservationId, status APPLIED)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: INSUFFICIENT_STOCK (details에 부족 sku·requestedQty·availableQty) / SKU_NOT_HANDLED(센터 취급 OFF) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/reservations/{reservationId}:
    get:
      tags: [reservations]
      summary: 예약 조회 (상태·행별 HELD/CONFIRMED 수량·만료 시각)
      operationId: getReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/reservations/{reservationId}/confirmations:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 확정 (PG 승인 후, HELD→CONFIRMED, TTL 해제)'
      description: |
        이미 CONFIRMED 면 변경 없이 성공(appliedQty 0). EXPIRED/RELEASED 는 409 INVALID_STATE. orderId 가 예약과 다르면 409 INVALID_STATE.
        만료 시각이 지났어도 만료 작업이 아직 EXPIRED 로 바꾸기 전(HELD, 수량 점유 중)이면 확정한다.
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
      operationId: confirmReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                paymentAttemptId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (EXPIRED/RELEASED/BLOCKED 예약) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/reservations/{reservationId}/releases:
    post:
      tags: [reservations]
      summary: '[orchestration→inventory] 예약 해제 (보상·취소; 피킹 후는 CANCEL_RETURN_PENDING 경유)'
      description: |
        피킹 전: R−q, A+q 즉시. 피킹 후(PICKED/PACKED 업무상태): E−q, R−q 후 CANCEL_RETURN_PENDING,
        복귀·적격 확인(CommitTaskExecution MOVE)으로만 E/A+q. 검증 없이 판매가능 복구 금지.
        부분 해제는 lines 지정. lines 생략 시 전량.

        슬라이스 4 구현: 피킹 업무상태가 아직 없어 모든 해제는 R−q 즉시. 부분 해제는 지원하지 않는다 — lines 가 예약 전량과 다르면
        422 PARTIAL_RELEASE_NOT_SUPPORTED. 이미 RELEASED/EXPIRED 면 변경 없이 성공(appliedQty 0).
        X-Expected-Version 은 상태가 바뀔 때만 비교한다.
      operationId: releaseReservation
      parameters:
        - { name: reservationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [SAGA_COMPENSATION, CANCEL_BEFORE_PICK, CANCEL_AFTER_PICK, SHORTAGE, PAYMENT_FAILED, EXPIRED_MANUAL] }
                sourceRef: { type: string, description: stopRequestId / claimId / sagaId }
                lines:
                  type: array
                  items: { $ref: '#/components/schemas/SkuQtyLine' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: PARTIAL_RELEASE_NOT_SUPPORTED (lines 가 예약 전량과 다름)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/receipts:
    post:
      tags: [postings]
      summary: '[inbound→inventory] ConfirmReceipt — TIN 전기 (H+q; 정상분만 검수 후 E+)'
      description: |
        receiptId·departureId 유일성으로 중복 계상 방지. normalQty는 PENDING_INSPECTION으로 H+q,
        quarantinedQty는 Q+q, pendingQty는 미판정 보류. MfcReceiptPosted 발행 → cdc-inventory가 같은 receiptId로 Transit 대사.

        재고 모델 v2(ADR-0040, 0.2.0): 줄마다 수령 위치(toLocationCode, 필수)에 UNSTOWED 로 넣는다 — normalQty·pendingQty 는
        PENDING_INSPECTION(H+q), quarantinedQty 는 QUARANTINED(H+q·Q+q). **E 는 검수(INSPECT)·적치(PUTAWAY) 뒤에만 는다.**
        줄의 LOT: sourceLotRef 나 expiryDate 가 있으면 같은 SKU·표기·기한의 추적 LOT, 둘 다 없으면 수령마다 추적 미확인 LOT.
        inventory 가 발급한 lotId 는 GET /internal/receipts/{receiptId} 로 조회한다(검수·적치 명령에 쓴다).
        같은 receiptId·같은 내용은 처음 commitId 를 그대로 돌려주고(이중 계상 없음, Idempotency-Key 가 달라도), 다른 내용이면 409
        RECEIPT_ALREADY_POSTED. 수량 합이 0 이면 400. MfcReceiptPosted 는 아직 발행하지 않는다(TRF 경로 구현 시).
        수령 위치는 mfc-location 투영(MfcLocationStateChanged)으로 검사한다: 미등록 422 LOCATION_NOT_REGISTERED(전파 지연이면 재시도),
        ACTIVE 아님 409 LOCATION_CLOSED, 수령·회수 구역(RECEIVING·RETURN) 아님 409 LOCATION_ZONE_MISMATCH.
      operationId: confirmReceipt
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmReceiptRequest' }
      responses:
        '201':
          description: TIN COMMITTED (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / RECEIPT_ALREADY_POSTED (같은 receiptId 다른 본문)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/receipts/{receiptId}:
    get:
      tags: [postings]
      summary: '[inbound→inventory] 수령 결과 — 줄별 inventory lotId·수령 위치·수량'
      operationId: getReceipt
      parameters:
        - { name: receiptId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/task-executions:
    post:
      tags: [postings]
      summary: '[inbound/fulfillment→inventory] CommitTaskExecution — 검수·적치·피킹·패킹·이동 결과 반영'
      description: |
        INSPECT: PENDING_INSPECTION→NORMAL(E+q) 또는 QUARANTINED(Q+q). PUTAWAY: UNSTOWED→STORED, 위치 변경, V 소비.
        PICK: STORED→PICKED, 위치 변경. PACK: PICKED→PACKED. MOVE: 위치 이동(취소 복귀 포함, CANCEL_RETURN_PENDING→STORED 시 E/A+q).
        appliedQty < 요청량이면 PARTIAL_APPLIED.

        구현(ADR-0040, 0.2.0): INSPECT(fromLocation 의 PENDING_INSPECTION/UNSTOWED → resultQuality/UNSTOWED)와
        PUTAWAY(fromLocation 의 NORMAL/UNSTOWED → toLocation 의 NORMAL/STORED, 이때 E+q). executionId 필수 — 같은 executionId 는
        요청 ID 가 달라도 한 번(다른 내용이면 409 EXECUTION_ALREADY_POSTED). lines[].lotId 는 inventory lotId.
        위치 잔량이 모자라면 422 INSUFFICIENT_STOCK. PICK·PACK·MOVE 는 501 UNSUPPORTED_ACTION(6b 이후).
        위치 검사(mfc-location 투영): 출발 위치가 실사 잠금이면 409 LOCATION_CLOSED. PUTAWAY 목적지는 등록·ACTIVE·구역 STORAGE/PICKING·
        온도대 = SKU 보관 유형 — 아니면 422 LOCATION_NOT_REGISTERED / 409 LOCATION_CLOSED·LOCATION_ZONE_MISMATCH·TEMPERATURE_ZONE_MISMATCH,
        보관 유형을 모르면 422 CONFIG_REQUIRED.
      operationId: commitTaskExecution
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitTaskExecutionRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: VERSION_CONFLICT / INVALID_STATE (업무상태 전이 불가) / LOCATION_CLOSED / SPACE_EXCEEDED(V 부족)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (피킹 위치 잔량 부족) / PARTIAL_APPLIED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/package-handovers:
    post:
      tags: [postings]
      summary: '[fulfillment→inventory] CommitPackageHandover — 인계 전기 H−q, E−q, R−q 한 사건'
      description: |
        handoverAuthorizationId + fenceVersion 으로 fence 정합을 검증한다(ADR-0006). 같은 packageId 재전송은 기존 commitId 반환.
        성공 시 PackageHandedOverPosted 발행(commitId로 fulfillment의 PackageHandedOver와 연결).
      operationId: commitPackageHandover
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitPackageHandoverRequest' }
      responses:
        '201':
          description: 인계 전기 완료 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409':
          description: INVALID_STATE (예약 BLOCKED/RELEASED) / FENCE_VERSION_MISMATCH / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: INSUFFICIENT_STOCK (PACKED 잔량 < 인계량)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/quality-postings:
    post:
      tags: [postings]
      summary: '[quality→inventory] 격리/해제/폐기 반영 (approvalRef 필수)'
      description: |
        QUARANTINE: Q+q, E−q, 영향 ReservationPart→BLOCKED, ReservationBlocked(영향 orderId 포함) 발행.
        RELEASE: Q−q, E+q. DISPOSE: 승인 잔량 내 H−q, Q−q. 승인 잔량 초과는 APPROVAL_REQUIRED.
      operationId: postQualityDecision
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityPostingRequest' }
      responses:
        '201':
          description: 반영 결과 (resultId = commitId, appliedQty)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED (승인 잔량 초과·승인 참조 없음) / INSUFFICIENT_STOCK
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/adjustments:
    post:
      tags: [postings]
      summary: '[backoffice/실사→inventory] 재고 조정 집행 CNT/ADJ (approvalRef 필수)'
      description: 실사 수량(CNT) 또는 차이 조정(ADJ). 승인된 수량 범위 내에서만 집행하며 InventoryAdjustmentPosted를 발행해 approval 실행 축을 갱신한다.
      operationId: postAdjustment
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustmentRequest' }
      responses:
        '201':
          description: 조정 반영 (resultId = commitId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / INVARIANT_VIOLATION (0≤R≤E≤H 위반)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/availability:
    get:
      tags: [queries]
      summary: '[cart/commerce→inventory] 가용 수량 A = E − R (센터·SKU)'
      description: 조회 사본이며 성공을 확정하지 않는다. 산출 실패·미설정 시 0을 반환하지 않고 503으로 응답한다.
      operationId: getAvailability
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: sku
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            maxItems: 100
            items: { $ref: '_common.yaml#/components/schemas/Sku' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mfcId: { type: string }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Availability' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/snapshots:
    get:
      tags: [queries]
      summary: '[SCM/replenishment→inventory] 센터 재고 스냅샷 (H/Q/E/R/A, 위치·LOT·품질상태별)'
      operationId: getSnapshot
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sku, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items: { type: array, items: { $ref: '#/components/schemas/Balance' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/commits/{commitId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — commitId로 전기 내역 확인
      operationId: getCommit
      parameters:
        - { name: commitId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Commit' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/requests/{requestId}:
    get:
      tags: [queries]
      summary: 원결과 조회 — requestId(=Idempotency-Key)로 inventory_apply_status 확인 (UNKNOWN_RESULT 해소)
      description: |
        호출 서비스(X-Source-System = 토큰 주체)의 요청만 찾는다. 전기(commit)를 만든 요청은 APPLIED + commitId.
        기록됐지만 수량 변화가 없던 요청(이미 확정·해제된 예약 등)은 APPLIED, commitId null.
        거절(4xx)로 끝난 요청은 기록되지 않으므로 404 — 반영되지 않았다는 뜻이다(같은 키로 다시 보내면 다시 판정).
      operationId: getRequestResult
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  applyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
                  commitId: { type: [string, 'null'] }
                  appliedQty: { type: integer }
                  rejectReason: { type: string }
                  occurredAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /mfcs/{mfcId}/sku-handlings:
    get:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 목록 (취급 레코드가 없으면 OFF)'
      description: |
        상품 SKU 투영(SkuIssued/ProductVersionPublished)에 있는 SKU 전체를 이 센터의 취급 여부와 함께 돌려준다.
        취급 레코드가 없으면 OFF(handlingEnabled=false, version 0)이다(사용자 결정 2026-10-30: 기본 OFF, 센터 운영자가 켬).
        토큰의 centers 클레임에 mfcId 가 없으면 403.
      operationId: listSkuHandlings
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: enabled, in: query, required: false, description: 'true=ON 만, false=OFF(레코드 없음 포함)만, 생략=전체', schema: { type: boolean } }
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - $ref: '_common.yaml#/components/parameters/PageSize'
      responses:
        '200':
          description: OK (SKU 오름차순, 커서 = 마지막 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingPage' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 ON/OFF 변경 (자기 센터만)'
      description: |
        켜기(enabled=true)는 SKU 투영이 있고 state=ACTIVE 일 때만(INACTIVE → 422 SKU_INACTIVE). 끄기는 항상 허용.
        현재 값과 같으면 변경·이력 없이 현재 상태를 돌려준다(changed=false). 바뀌면 이력을 남기고 version +1.
        X-Expected-Version 은 이 센터·SKU 취급 레코드의 version(레코드가 없으면 0).
      operationId: changeSkuHandling
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingChange' }
      responses:
        '200':
          description: 반영(같은 키·같은 본문 재요청은 저장된 결과 재생)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: SKU_NOT_FOUND (SKU 투영이 아직 없음 — 상품 승인 이벤트 수신 전)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_INACTIVE (비활성 SKU 는 켤 수 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /mfcs/{mfcId}/sku-handling-batches:
    post:
      tags: [sku-handlings]
      summary: '[운영자] MFC SKU 취급 일괄 변경 (최대 500행, 전부 또는 전무)'
      description: |
        모든 행을 먼저 검증하고 하나라도 실패하면 아무것도 바꾸지 않는다(422 SKU_HANDLING_BATCH_REJECTED, details[].field = items[i]).
        행 규칙은 단건과 같다. 같은 SKU 가 두 번 나오면 400 VALIDATION_FAILED.
      operationId: changeSkuHandlingBatch
      parameters:
        - { name: mfcId, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SkuHandlingBatchRequest' }
      responses:
        '200':
          description: 전 행 반영
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuHandlingBatchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SKU_HANDLING_BATCH_REJECTED (행별 SKU_NOT_FOUND / SKU_INACTIVE / VERSION_CONFLICT 를 details 에)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/sku-handling-republications:
    post:
      tags: [sku-handlings]
      summary: '[운영 도구→mfc-inventory] 지금 취급 상태를 SkuHandlingChanged 로 다시 알린다'
      description: |
        취급 레코드마다 현재 상태(켬·끔, 행 버전)를 SkuHandlingChanged(republished=true)로 다시 발행한다(mfc.sku-handling.v1).
        상태는 바꾸지 않으므로 같은 Idempotency-Key 로 다시 불러도 다시 발행한다. 사건 발행 전부터 있던 취급(2026-11-05 이전)을 검색 색인에 처음 연결할 때, 구독 쪽 사본을 복구할 때 쓴다.
        같은 버전을 다시 받은 구독자는 무시하므로 여러 번 불러도 결과가 같다. mfcId 를 주면 그 센터만. 한 번에 최대 20000건(넘으면 422).
      operationId: republishSkuHandlings
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: mfcId, in: query, required: false, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: 다시 발행한 건수
          content:
            application/json:
              schema:
                type: object
                required: [publishedCount]
                properties:
                  publishedCount: { type: integer, minimum: 0 }
        '422':
          description: DOMAIN_REJECTED — 건수 상한 초과, 센터를 나눠 부른다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/skus/{sku}:
    get:
      tags: [skus]
      summary: '[서비스→mfc-inventory] SKU 투영 조회 (product-service 이벤트 사본)'
      description: 조회 사본이다. 상품 정본은 product-service.
      operationId: getSkuProjection
      parameters:
        - { name: sku, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Sku' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SkuProjection' }
        '404':
          description: SKU_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    InventoryApplyStatus:
      type: string
      enum: [CAPTURED, SUBMITTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT]
    QualityState:
      type: string
      enum: [PENDING_INSPECTION, NORMAL, QUARANTINED, DISPOSAL_PENDING]
    WorkState:
      type: string
      enum: [UNSTOWED, STORED, PICKED, PACKED, CANCEL_RETURN_PENDING]
    ReservationPartState:
      type: string
      description: HELD→CONFIRMED/RELEASED/EXPIRED/BLOCKED, CONFIRMED→CONSUMED/RELEASED/BLOCKED
      enum: [HELD, CONFIRMED, RELEASED, EXPIRED, BLOCKED, CONSUMED]
    SkuQtyLine:
      type: object
      required: [sku, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
    LotConstraint:
      type: object
      description: 예약 시 LOT 제약 (선택, 아직 미지원 — 400). 미지정이면 FEFO.
      properties:
        minShelfLifeDays: { type: integer, minimum: 0 }
        lotId: { type: string }
    ReserveInventoryRequest:
      type: object
      required: [orderId, mfcId, lines]
      properties:
        orderId: { type: string }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        ttlMinutes:
          type: integer
          minimum: 1
          maximum: 60
          default: 10
          description: 예약 유효 시간. 기본 10분 (Q-04)
        promisedDate:
          type: string
          format: date
          description: |
            배송 약속일(예약 배송 슬롯의 날짜, Asia/Seoul). 소비기한 적격 기준일 — 소비기한 − 약속일 ≥ 최소 잔여일인 LOT 만 배정한다
            (MFC 문서 §6 Q-05 결정 2026-11-07, ADR-0040). 없으면 예약 시각의 날짜(즉시 배송).
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              lotConstraint: { $ref: '#/components/schemas/LotConstraint' }
    Reservation:
      type: object
      properties:
        reservationId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        state: { $ref: '#/components/schemas/ReservationPartState' }
        expiresAt: { type: [string, 'null'], format: date-time }
        parts:
          type: array
          items:
            type: object
            properties:
              partId: { type: string }
              orderLineId: { type: [string, 'null'] }
              sku: { type: string }
              lotId: { type: string, description: inventory lotId. 한 줄이 여러 LOT 조각으로 나뉠 수 있다(줄당 LOT 수 제한 없음, FEFO) }
              kind: { type: string, enum: [HAND, FUTURE] }
              qty: { type: integer }
              state: { $ref: '#/components/schemas/ReservationPartState' }
              blockedReason: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ConfirmReceiptRequest:
      type: object
      required: [receiptId, trfId, departureId, mfcId, lines]
      properties:
        receiptId: { type: string, description: inbound가 발급. 중복 계상 방지 키 }
        trfId: { type: string, description: 이관 지시 ID (replenishment) }
        departureId: { type: string, description: cdc TOUT departureId }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, normalQty, quarantinedQty, pendingQty, toLocationCode]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string, description: '사용하지 않음(0.2.0) — 상류 LOT 표기는 sourceLotRef. inventory lotId 는 수령 결과 조회로' }
              sourceLotRef: { type: string, maxLength: 128, description: 상류(제조사·WMS) LOT 표기 원문. 그대로 보존 }
              expiryDate: { type: string, format: date, description: 소비기한 }
              normalQty: { type: integer, minimum: 0, description: 정상 수령 → PENDING_INSPECTION H+q }
              quarantinedQty: { type: integer, minimum: 0, description: 격리 수령 → Q+q }
              pendingQty: { type: integer, minimum: 0, description: 미판정 보류 }
              toLocationCode: { type: string, maxLength: 64, description: 수령 위치(입고대). 필수(0.2.0) }
    ReceiptResult:
      type: object
      required: [receiptId, commitId, lines]
      properties:
        receiptId: { type: string }
        commitId: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [lineNo, sku, lotId, locationCode, normalQty, quarantinedQty, pendingQty]
            properties:
              lineNo: { type: integer }
              sku: { type: string }
              lotId: { type: string }
              locationCode: { type: string }
              normalQty: { type: integer }
              quarantinedQty: { type: integer }
              pendingQty: { type: integer }
    CommitTaskExecutionRequest:
      type: object
      required: [executionType, mfcId, taskId, lines]
      properties:
        executionType: { type: string, enum: [INSPECT, PUTAWAY, PICK, PACK, MOVE] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        taskId: { type: string }
        executionId: { type: string, description: fulfillment/inbound 측 실행 ID }
        reservationId: { type: string, description: PICK/PACK 시 소비 대상 예약 }
        fromLocation: { type: string }
        toLocation: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              resultQuality: { type: string, enum: [NORMAL, QUARANTINED], description: INSPECT 전용 }
              targetWorkState: { $ref: '#/components/schemas/WorkState' }
    CommitPackageHandoverRequest:
      type: object
      required: [packageId, handoverAuthorizationId, fenceVersion, mfcId, orderId, reservationId, lines]
      properties:
        packageId: { type: string }
        shipmentId: { type: string }
        handoverAuthorizationId: { type: string }
        fenceVersion: { type: integer, minimum: 0 }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        orderId: { type: string }
        reservationId: { type: string }
        deliveryId: { type: string }
        riderId: { type: string }
        handedOverAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/SkuQtyLine' }
    QualityPostingRequest:
      type: object
      required: [postingType, mfcId, approvalRef, lines]
      properties:
        postingType: { type: string, enum: [QUARANTINE, RELEASE, DISPOSE] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        qualityDecisionId: { type: string }
        approvalRef:
          type: string
          description: mfc-quality 승인 ID 또는 approval-service approvalId. 폐기는 approval 승인 필수
        reason: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              locationCode: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
    AdjustmentRequest:
      type: object
      required: [adjustmentType, mfcId, approvalRef, lines]
      properties:
        adjustmentType: { type: string, enum: [CNT, ADJ] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        approvalRef: { type: string, description: approval-service approvalId }
        countSessionId: { type: string }
        reason: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, locationCode]
            properties:
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              locationCode: { type: string }
              qualityState: { $ref: '#/components/schemas/QualityState' }
              countedQty: { type: integer, minimum: 0, description: CNT 전용 }
              deltaQty: { type: integer, description: ADJ 전용. 음수 허용 }
    Availability:
      type: object
      description: |
        수량은 센터 요약(stock_balance — 단위 행 합과 같은 트랜잭션에서 바뀜, ADR-0040)에서 읽는다. A 에는 소비기한 기준을 통과하지 못한 LOT 도
        들어 있을 수 있어, 예약이 NO_ELIGIBLE_LOT 으로 거절될 수 있다. 원장 행이 없는 SKU(한 번도 입고되지 않음)는 0 이다. A = E − R.
        handlingEnabled=false 인 SKU 는 수량이 있어도 예약할 수 없다(SKU_NOT_HANDLED). version 은 원장 행 version(행 없음 = 0).
      properties:
        sku: { type: string }
        onHand: { type: [integer, 'null'], description: H }
        quarantined: { type: [integer, 'null'], description: Q }
        sellable: { type: [integer, 'null'], description: E }
        reserved: { type: [integer, 'null'], description: R }
        available: { type: [integer, 'null'], description: A = E − R }
        handlingEnabled: { type: boolean, description: 센터 취급 ON/OFF (center_sku_handling, 레코드 없음 = OFF) }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    Balance:
      type: object
      properties:
        mfcId: { type: string }
        locationCode: { type: string }
        sku: { type: string }
        lotId: { type: string }
        expiryDate: { type: string, format: date }
        qualityState: { $ref: '#/components/schemas/QualityState' }
        workState: { $ref: '#/components/schemas/WorkState' }
        qty: { type: integer }
        reservedQty: { type: integer }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    Commit:
      type: object
      properties:
        commitId: { type: string }
        requestId: { type: string }
        commitType: { type: string, enum: [RESERVE, CONFIRM, RELEASE, EXPIRE, TIN, TASK_EXECUTION, HANDOVER, QUALITY, ADJUSTMENT, CORRECTION], description: 'EXPIRE = 예약 TTL 만료 작업의 R−q, CORRECTION = LOT·위치 정정(H 증감 0)' }
        mfcId: { type: string }
        sourceSystem: { type: string }
        sourceRef: { type: string, description: receiptId / packageId / taskId / approvalRef }
        appliedQty: { type: integer }
        occurredAt: { type: string, format: date-time }
        entries:
          type: array
          description: LedgerEntry 목록 (한 사건의 복수 수량 변화)
          items:
            type: object
            properties:
              sku: { type: string }
              lotId: { type: [string, 'null'] }
              locationCode: { type: [string, 'null'], description: 요약 수준 기록(R)은 null }
              qualityState: { type: [string, 'null'] }
              workState: { type: [string, 'null'] }
              symbol: { type: string, enum: [H, Q, E, R, V] }
              delta: { type: integer }
              balanceVersion: { type: integer }
    SkuHandling:
      type: object
      required: [sku, handlingEnabled, version]
      properties:
        sku: { type: string }
        handlingEnabled: { type: boolean, description: 레코드가 없으면 false }
        version: { type: integer, description: 취급 레코드 version (레코드 없음 = 0) }
        skuState: { type: string, enum: [ACTIVE, INACTIVE] }
        productId: { type: [string, 'null'] }
        changedBy: { type: [string, 'null'] }
        reason: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], format: date-time }
    SkuHandlingPage:
      type: object
      properties:
        centerId: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
        page: { $ref: '_common.yaml#/components/schemas/Page' }
    SkuHandlingChange:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
    SkuHandlingResult:
      type: object
      required: [status, requestId, occurredAt, handling]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changed: { type: boolean, description: false 면 이미 같은 값이라 바뀐 것이 없음 }
        occurredAt: { type: string, format: date-time }
        handling: { $ref: '#/components/schemas/SkuHandling' }
    SkuHandlingBatchRequest:
      type: object
      required: [items]
      properties:
        reason: { type: string, maxLength: 500, description: 행에 reason 이 없을 때 쓰는 공통 사유 }
        items:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/SkuHandlingBatchItem' }
    SkuHandlingBatchItem:
      type: object
      required: [sku, enabled]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        enabled: { type: boolean }
        reason: { type: string, maxLength: 500 }
        expectedVersion: { type: integer, minimum: 0, description: 행별 낙관적 잠금(선택) }
    SkuHandlingBatchResult:
      type: object
      required: [status, requestId, occurredAt, items]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        changedCount: { type: integer }
        occurredAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/SkuHandling' } }
    SkuProjection:
      type: object
      required: [sku, state, productVersion]
      properties:
        sku: { type: string }
        productId: { type: [string, 'null'] }
        baseProductId: { type: [string, 'null'] }
        unitType: { type: [string, 'null'] }
        unitsPerSku: { type: [integer, 'null'] }
        weightG: { type: [integer, 'null'] }
        volumeMl: { type: [integer, 'null'] }
        storageType: { type: [string, 'null'], description: AMBIENT / CHILLED / FROZEN }
        alcohol: { type: [boolean, 'null'] }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        productVersion: { type: integer, description: 마지막으로 반영한 상품 버전(이보다 오래된 이벤트는 무시) }
        updatedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
