openapi: 3.1.0
info:
  title: delivery-serviceability-service
  version: 0.1.0
  description: |
    배송 권역(폴리곤)·담당 MFC 매핑 버전(본사 BO-07 승인 → 발효), 주소 정규화·판정, 배송 가능 조건의 정본. (docs/architecture/service-map.md §7, ADR-0007)
    센터 마스터(center-master), 슬롯(delivery-capacity), 고객 주소록(customer)은 소유하지 않는다.
    매핑 버전 발효 후에도 기존 주문의 판정은 불변이다(주문 스냅샷에 mappingVersion 기록).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: serviceability, description: 주소 판정 (API-SERVICEAREA-001) }
  - { name: conditions, description: 배송 가능 조건 조회 }
  - { name: internal, description: 매핑 버전 조회 (order / routing / bo) }
  - { name: mapping-versions, description: "권역·담당 MFC 매핑 버전 등록(임시 백오피스·seed) — 초안 → SERVICEABILITY 승인(BO-07) → 발효" }

paths:
  /serviceability-versions:
    post:
      tags: [mapping-versions]
      summary: 권역 매핑 버전 초안 등록 (운영자) — 승인 요청 본문을 돌려준다
      description: |
        권역(GeoJSON Polygon/MultiPolygon, 경도·위도 순)·담당 MFC·중첩 우선순위를 버전으로 등록한다. 형식이 맞으면 DRAFT 로 저장하고 내용을 잠근 해시를 붙인
        approvalRequest(approval-service ChangeRequestBody 모양)를 돌려준다. 그대로 approval-service POST /change-requests 에 보내 제출·승인하면
        ApprovalDecided(SERVICEABILITY) 를 받아 발효(ACTIVE)하고 ServiceabilityVersionApplied 를 발행한다. 이전 발효 버전은 SUPERSEDED.
        시험 주소(testAddresses)를 주면 발효 직전에 기대 판정과 비교하고, 하나라도 다르면 발효하지 않는다(BO-07).
      operationId: createServiceabilityVersion
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceabilityVersionDraft' }
      responses:
        '201':
          description: 초안 저장
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { $ref: '#/components/schemas/ServiceabilityVersion' }
                  approvalRequest: { type: object, additionalProperties: true, description: approval-service ChangeRequestBody }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /serviceability-versions/{version}:
    get:
      tags: [mapping-versions]
      summary: 매핑 버전 조회 (운영자, 권역 경계 포함)
      operationId: getServiceabilityVersionForOperator
      parameters:
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityVersion' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /serviceability-checks:
    post:
      tags: [serviceability]
      summary: 주소 판정 (담당 MFC / 서비스 밖 / 중첩 충돌 / 입력 보완 / 조회 불명)
      description: |
        주소를 정규화한 뒤 현재 발효 중인 매핑 버전으로 담당 MFC를 판정한다. 결과는 checkId로 재조회 가능.
        - SERVICEABLE 담당 MFC 1곳 확정(mfcId·mappingVersion)
        - OUT_OF_AREA 서비스 권역 밖
        - OVERLAP 둘 이상 권역에 중첩 → 운영 조사 대상, 주문 진행 불가
        - NEEDS_INPUT 주소 정규화 실패·상세주소 보완 필요
        - UNKNOWN 정본 조회 불명 → 재시도. 임의 MFC 배정 금지
        배송 시간 제한 00:00~08:00 없음 등 조건은 conditions에 포함된다.
      operationId: createServiceabilityCheck
      security: []   # 비회원도 배송 가능 지역 확인(좌표 판정만, 개인정보 저장 없음). customer-service 비회원 배송지가 익명으로 호출
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceabilityCheckRequest' }
      responses:
        '200':
          description: 판정 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityCheck' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422':
          description: ADDRESS_NORMALIZATION_FAILED / CONFIG_REQUIRED (발효 매핑 버전 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /serviceability-checks/{checkId}:
    get:
      tags: [serviceability]
      summary: 판정 결과 재조회
      operationId: getServiceabilityCheck
      security: []   # 비회원 주소 판정 결과 재조회(checkId 는 추측 불가 UUID)
      parameters:
        - { name: checkId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityCheck' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /delivery-conditions:
    get:
      tags: [conditions]
      summary: 배송 가능 조건 조회 (방식·수단·중량·부피·보냉·시간 제한)
      operationId: getDeliveryConditions
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK (정책값은 3값 응답. NOT_SET은 0/무제한이 아님)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryConditions' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/serviceability-versions/current:
    get:
      tags: [internal]
      summary: 현재 발효 중인 매핑 버전
      operationId: getCurrentServiceabilityVersion
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityVersion' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/serviceability-versions/{version}:
    get:
      tags: [internal]
      summary: 매핑 버전 조회 (승인 건·발효 시각·권역 요약)
      operationId: getServiceabilityVersion
      parameters:
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - name: includeGeometry
          in: query
          description: true면 폴리곤 좌표 포함 (크기 주의)
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceabilityVersion' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    ServiceabilityCheckRequest:
      type: object
      required: [address]
      properties:
        address:
          type: object
          description: addressId 또는 roadAddress 중 하나 필수
          properties:
            addressId: { type: string, description: customer-service 주소록 ID }
            roadAddress: { type: string }
            jibunAddress: { type: string }
            detail: { type: string }
            postalCode: { type: string }
            lat: { type: number }
            lng: { type: number }
        mappingVersion:
          type: integer
          description: 생략 시 현재 발효 버전. 기존 주문 재검증 시 스냅샷 버전 지정
        purpose: { type: string, enum: [ORDER_DRAFT, ADDRESS_BOOK, TEST_ADDRESS, REVALIDATION] }
    ServiceabilityResult:
      type: string
      enum: [SERVICEABLE, OUT_OF_AREA, OVERLAP, NEEDS_INPUT, UNKNOWN]
    ServiceabilityCheck:
      type: object
      properties:
        checkId: { type: string }
        result: { $ref: '#/components/schemas/ServiceabilityResult' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        mappingVersion: { type: integer }
        zoneId: { type: string, description: 판정된 권역 ID }
        overlappingZones:
          type: array
          description: OVERLAP일 때 중첩 권역·MFC 목록
          items:
            type: object
            properties:
              zoneId: { type: string }
              mfcId: { type: string }
        normalizedAddress:
          type: object
          properties:
            roadAddress: { type: string }
            detail: { type: string }
            postalCode: { type: string }
            lat: { type: number }
            lng: { type: number }
            buildingName: { type: string }
        missingFields: { type: array, description: NEEDS_INPUT일 때 보완 필요 항목, items: { type: string } }
        conditions: { $ref: '#/components/schemas/DeliveryConditions' }
        evaluatedAt: { type: string, format: date-time }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    DeliveryConditions:
      type: object
      properties:
        mfcId: { type: string }
        policyVersion: { type: integer }
        deliveryModes:
          type: array
          items: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        vehicleTypes:
          type: array
          items: { type: string, enum: [MOTORCYCLE, BICYCLE, CAR, WALK] }
        maxWeightG: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        maxVolumeL: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        coldChainAvailable: { $ref: '_common.yaml#/components/schemas/PolicyValue' }
        timeRestriction:
          type: object
          description: 배송 시간 제한. 1단계 확정 "00:00~08:00 제한 없음"
          properties:
            state: { type: string, enum: [NONE, WINDOW] }
            start: { type: string, example: '00:00' }
            end: { type: string, example: '08:00' }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ServiceabilityVersionDraft:
      type: object
      required: [zones]
      properties:
        zones:
          type: array
          minItems: 1
          items:
            type: object
            required: [zoneId, mfcId, geometry]
            properties:
              zoneId: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
              mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
              name: { type: string, maxLength: 100 }
              priority: { type: integer, description: 중첩 시 큰 값이 우선. 같거나 없으면 OVERLAP(주문 진행 불가) }
              geometry:
                type: object
                required: [type, coordinates]
                description: GeoJSON Polygon/MultiPolygon. 좌표는 [경도, 위도]
                properties:
                  type: { type: string, enum: [Polygon, MultiPolygon] }
                  coordinates: { type: array, items: {} }
        effectiveFrom: { type: string, format: date-time, description: 생략 시 승인 반영 즉시 }
        changeSummary: { type: string, maxLength: 500 }
        testAddresses:
          type: array
          description: 발효 전 검증할 시험 주소와 기대 판정
          items:
            type: object
            required: [lat, lng, expectedResult]
            properties:
              label: { type: string }
              lat: { type: number }
              lng: { type: number }
              expectedResult: { $ref: '#/components/schemas/ServiceabilityResult' }
              expectedMfcId: { type: string }
    ServiceabilityVersion:
      type: object
      properties:
        version: { type: integer }
        state: { type: string, enum: [DRAFT, PENDING_APPROVAL, APPROVED, ACTIVE, SUPERSEDED, REJECTED] }
        approvalRef: { type: string, description: BO-07 승인 건 }
        approvedAt: { type: string, format: date-time }
        effectiveFrom: { type: string, format: date-time }
        supersededAt: { type: string, format: date-time }
        testAddressesVerified: { type: integer, description: 발효 전 시험 주소 검증 건수 }
        zones:
          type: array
          items:
            type: object
            properties:
              zoneId: { type: string }
              mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
              name: { type: string }
              geometry:
                type: object
                description: GeoJSON Polygon (includeGeometry=true일 때만)
                properties:
                  type: { type: string, enum: [Polygon, MultiPolygon] }
                  coordinates: { type: array, items: {} }
        changeSummary: { type: string }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
