openapi: 3.1.0
info:
  title: mfc-quality-service
  version: 0.2.0
  description: |
    MFC 품질 판정(PENDING→NORMAL/QUARANTINED)·격리 해제 승인·회수품 검수·폐기 승인·품질 사건·리콜 영향 LOT 추적의 정본. (docs/architecture/service-map.md §5)
    비정본: 수량 반영(mfc-inventory에 quality-postings 요청 후 commitId 수신), 손실 회계 승인(approval-service/본사).
    규칙: RELEASE(격리 해제)는 승인자 필수. 회수품은 상온 미개봉 적격만 RESALE, **신선·냉장·냉동은 항상 DISPOSE**.
    폐기: REQUESTED→APPROVED/REJECTED→(부분 실행)→COMPLETED, 요청자/승인자 분리.

    구현 0.2.0(2026-11-08, IV-09·IV-10): 격리·해제 판정, 폐기 요청·승인·실행. 권한 — 그 센터 운영자 + 역할. 판정·요청·실행 = MFC_WORKER 또는
    MFC_SUPERVISOR, 승인·반려 = MFC_SUPERVISOR(요청자·판정자 본인 아님). 행위자 ID 는 토큰 주체(본문의 decidedBy·actorId 가 다르면 403).
    재고 반영은 mfc-inventory `/internal/quality-postings`(Idempotency-Key = 판정 ID·실행 ID) — 결과 모름은 같은 키로 서버가 다시 보낸다.
    회수품 검수·품질 사건은 아직 501(회수품 반입 원천이 없음).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: decisions, description: 격리·해제 판정 }
  - { name: return-inspections, description: 회수품 검수 }
  - { name: disposals, description: 폐기 승인 }
  - { name: incidents, description: 품질 사건 }

paths:
  /quality-decisions:
    post:
      tags: [decisions]
      summary: 품질 판정 등록 (QUARANTINE / RELEASE) → mfc-inventory quality-postings, QualityDecisionMade
      description: |
        QUARANTINE 은 검수자 단독 가능. RELEASE 는 approverId 필수이며 decidedBy ≠ approverId.
        수량 반영 성공은 inventory commitId 로만 확정. 영향 예약은 inventory 가 BLOCKED 처리하고 ReservationBlocked 를 발행한다.
        구현 0.2.0: QUARANTINE 은 바로 재고 반영(status APPLIED / UNKNOWN_RESULT / REJECTED). RELEASE 는 **요청만**(status ACCEPTED, 판정 REQUESTED) —
        본문의 approverId 로 승인을 대신하지 않는다(요청·승인 분리, MFC Q-11). 승인은 다른 운영자가 POST …/{id}/approvals.
        decidedBy 는 토큰 주체와 같아야 한다(생략 가능). 줄마다 lotId·locationCode 필수, workState STORED(기본)/UNSTOWED.
      operationId: createQualityDecision
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QualityDecisionRequest' }
      responses:
        '202':
          description: 접수 (resultId = qualityDecisionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: VALIDATION_FAILED / INSUFFICIENT_STOCK (재고 거절은 본문 status REJECTED 로도 옴)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /quality-decisions/{qualityDecisionId}/approvals:
    post:
      tags: [decisions]
      summary: '[0.2.0] 격리 해제(RELEASE) 승인·반려 — 승인이면 재고 반영'
      description: |
        MFC_SUPERVISOR, 판정 요청자 본인은 안 됨(422 SELF_APPROVAL). REQUESTED 판정만(아니면 409 INVALID_STATE, 같은 결정 재요청은 지금 판정).
        APPROVE → mfc-inventory RELEASE(Q−q, STORED 면 E+q) → APPLIED / UNKNOWN_RESULT(서버가 같은 키로 다시) / REJECTED(사유). REJECT → DECLINED.
      operationId: approveQualityDecision
      parameters:
        - { name: qualityDecisionId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: 결정 뒤 판정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDecision' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /quality-decisions/{qualityDecisionId}:
    get:
      tags: [decisions]
      summary: 판정 조회 (inventory 반영 상태·commitId)
      operationId: getQualityDecision
      parameters:
        - { name: qualityDecisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityDecision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /return-inspections:
    post:
      tags: [return-inspections]
      summary: 회수품 검수 결과 등록 (RESALE / DISPOSE, ReturnInspected)
      description: |
        ReturnItemReceived(inbound) 이후 수행. 행별 판정 RESALE 은 상온(AMBIENT)·미개봉·적격일 때만 허용.
        temperatureZone 이 CHILLED/FROZEN 또는 신선 카테고리이면 RESALE 요청은 422 RESALE_NOT_ALLOWED.
        RESALE 은 inventory 에 RELEASE(Q−q, E+q), DISPOSE 는 폐기 승인 요청(disposal-approvals)으로 이어진다.
      operationId: createReturnInspection
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnInspectionRequest' }
      responses:
        '202':
          description: 접수 (resultId = returnInspectionId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: IDEMPOTENCY_CONFLICT / INVALID_STATE (반입 미등록·이미 검수)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: RESALE_NOT_ALLOWED (신선·냉장·냉동·개봉) / QTY_EXCEEDS_RECEIVED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /return-inspections/{returnInspectionId}:
    get:
      tags: [return-inspections]
      summary: 회수품 검수 조회
      operationId: getReturnInspection
      parameters:
        - { name: returnInspectionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnInspection' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /disposal-approvals:
    post:
      tags: [disposals]
      summary: 폐기 승인 요청/결정 (REQUESTED→APPROVED/REJECTED, 요청자·승인자 분리, DisposalApproved)
      description: |
        action REQUEST 는 폐기 요청 생성. action APPROVE/REJECT 는 disposalApprovalId 대상 결정이며 requesterId ≠ approverId.
        손실 회계 영향은 approval-service(BO-15) 승인 참조(approvalRef)를 요구한다. 실행은 inventory DISPOSE 전기(승인 잔량 내 부분 실행 가능).
        구현 0.2.0: actorId = 토큰 주체. REQUEST(MFC_WORKER·MFC_SUPERVISOR) 줄마다 sku·lotId·locationCode·qty. APPROVE·REJECT(MFC_SUPERVISOR, 요청자 아님 —
        422 SELF_APPROVAL), APPROVE 는 approvalRef 필수(422 APPROVAL_REQUIRED — BO-15 승인 ID, 지금은 존재 확인 없이 기록만), lines 로 부분 승인(요청량 이하).
        승인하면 DisposalApproved. 응답 resultId = disposalApprovalId. 실제 폐기는 POST …/{id}/executions.
      operationId: decideDisposal
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisposalApprovalRequest' }
      responses:
        '202':
          description: 접수 (resultId = disposalApprovalId)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: SELF_APPROVAL / APPROVAL_REQUIRED (approvalRef 없음) / QTY_EXCEEDS_QUARANTINED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /disposal-approvals/{disposalApprovalId}/executions:
    post:
      tags: [disposals]
      summary: '[0.2.0] 폐기 실행 — 승인 잔량 안에서 mfc-inventory DISPOSE(H−q, Q−q)'
      description: |
        MFC_WORKER·MFC_SUPERVISOR. APPROVED·PARTIALLY_EXECUTED 만. 줄(sku·lotId·locationCode)마다 승인량 − 실행 누계 − 진행 중 실행 이하(아니면 422 QTY_EXCEEDS_APPROVED).
        실행 ID = Idempotency-Key 기준(같은 키는 같은 실행). 재고 반영 APPLIED 면 누계 +q, 다 실행하면 COMPLETED. 모름은 서버가 같은 실행 ID 로 다시,
        거절은 REJECTED(잔량 되돌림).
      operationId: executeDisposal
      parameters:
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lines]
              properties:
                lines:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/QualityLine' }
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: 실행 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalExecution' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: QTY_EXCEEDS_APPROVED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /disposal-approvals/{disposalApprovalId}:
    get:
      tags: [disposals]
      summary: 폐기 승인 조회 (승인량·집행 누계·잔량)
      operationId: getDisposalApproval
      parameters:
        - { name: disposalApprovalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisposalApproval' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /quality-incidents:
    get:
      tags: [incidents]
      summary: 품질 사건 목록 (온도 이탈·파손·리콜 영향 LOT)
      operationId: listQualityIncidents
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/IncidentKind' } }
        - { name: state, in: query, schema: { type: string, enum: [OPEN, DECIDED, CLOSED] } }
        - { name: lotId, in: query, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/QualityIncident' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /quality-incidents/{incidentId}:
    get:
      tags: [incidents]
      summary: 품질 사건 조회
      operationId: getQualityIncident
      parameters:
        - { name: incidentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QualityIncident' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    IncidentKind:
      type: string
      enum: [TEMPERATURE_EXCURSION, DAMAGE, RECALL, EXPIRY, CONTAMINATION, OTHER]
    InventoryApplyStatus:
      type: string
      enum: [NOT_REQUESTED, SUBMITTED, APPLIED, REJECTED, UNKNOWN_RESULT]
    QualityLine:
      type: object
      required: [sku, lotId, locationCode, qty]
      properties:
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        lotId: { type: string }
        locationCode: { type: string }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        workState: { type: string, enum: [STORED, UNSTOWED], description: '0.2.0 — 재고 단위 행 업무 상태(기본 STORED)' }
    QualityDecisionRequest:
      type: object
      required: [mfcId, decisionType, reason, lines]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        decisionType: { type: string, enum: [QUARANTINE, RELEASE] }
        decidedBy: { type: string, description: '0.2.0 — 토큰 주체(생략 가능, 다르면 403)' }
        approverId: { type: string, description: '0.2.0 — 요청에서는 무시. 승인은 POST …/approvals 로(응답의 approverId = 실제 승인자)' }
        reason: { type: string, enum: [TEMPERATURE, DAMAGE, EXPIRY, RECALL, INSPECTION_FAIL, INSPECTION_PASS, OTHER] }
        incidentId: { type: string }
        note: { type: string, maxLength: 500 }
        evidenceRefs: { type: array, items: { type: string } }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/QualityLine' }
    QualityDecision:
      allOf:
        - $ref: '#/components/schemas/QualityDecisionRequest'
        - type: object
          properties:
            qualityDecisionId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            state: { type: string, enum: [REQUESTED, SUBMITTED, APPLIED, UNKNOWN_RESULT, REJECTED, DECLINED], description: '0.2.0 — REQUESTED = 해제 승인 대기, DECLINED = 해제 반려' }
            rejectReason: { type: [string, 'null'], description: 재고 거절 사유 }
            approvedAt: { type: [string, 'null'], format: date-time }
            inventoryApplyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
            inventoryCommitId: { type: [string, 'null'] }
            appliedQty: { type: integer }
            affectedOrderIds: { type: array, items: { type: string }, description: inventory ReservationBlocked 투영 }
            decidedAt: { type: string, format: date-time }
    ReturnInspectionRequest:
      type: object
      required: [mfcId, claimId, returnReceiptId, inspectedBy, lines]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        claimId: { type: string }
        returnReceiptId: { type: string, description: inbound 회수품 반입 ID }
        inspectedBy: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [sku, qty, verdict, temperatureZone, opened]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
              verdict: { type: string, enum: [RESALE, DISPOSE] }
              temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
              fresh: { type: boolean, description: 신선 카테고리 여부. true 면 RESALE 불가 }
              opened: { type: boolean, description: 개봉 여부. true 면 RESALE 불가 }
              disposeReason: { type: string, enum: [TEMPERATURE_ZONE, FRESH, OPENED, DAMAGED, EXPIRED, OTHER] }
              evidenceRef: { type: string }
    ReturnInspection:
      allOf:
        - $ref: '#/components/schemas/ReturnInspectionRequest'
        - type: object
          properties:
            returnInspectionId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            resaleQty: { type: integer }
            disposeQty: { type: integer }
            inventoryApplyStatus: { $ref: '#/components/schemas/InventoryApplyStatus' }
            inventoryCommitId: { type: [string, 'null'], description: RESALE 분 RELEASE commitId }
            disposalApprovalId: { type: [string, 'null'], description: DISPOSE 분 폐기 승인 요청 }
            inspectedAt: { type: string, format: date-time }
    DisposalApprovalRequest:
      type: object
      required: [action, mfcId]
      properties:
        action: { type: string, enum: [REQUEST, APPROVE, REJECT] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        disposalApprovalId: { type: string, description: APPROVE/REJECT 시 필수 }
        actorId:
          type: string
          description: REQUEST 시 requesterId / APPROVE·REJECT 시 approverId. 0.2.0 — 토큰 주체(생략 가능, 다르면 403)
        approvalRef: { type: string, description: approval-service approvalId (BO-15 손실 회계). APPROVE 시 필수 }
        reason: { type: string, maxLength: 500 }
        sourceRef: { type: string, description: qualityDecisionId / returnInspectionId / incidentId }
        lines:
          type: array
          description: REQUEST 시 필수. APPROVE 시 생략하면 전량, 지정하면 부분 승인
          items: { $ref: '#/components/schemas/QualityLine' }
    DisposalApproval:
      type: object
      properties:
        disposalApprovalId: { type: string }
        mfcId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { type: string, enum: [REQUESTED, APPROVED, REJECTED, PARTIALLY_EXECUTED, COMPLETED] }
        requesterId: { type: string }
        approverId: { type: [string, 'null'] }
        approvalRef: { type: [string, 'null'] }
        sourceRef: { type: string }
        lines:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              lotId: { type: string }
              locationCode: { type: string }
              requestedQty: { type: integer }
              approvedQty: { type: integer }
              executedQty: { type: integer, description: inventory DISPOSE 누계 }
              remainingQty: { type: integer, description: approvedQty − executedQty }
        executions:
          type: array
          items: { $ref: '#/components/schemas/DisposalExecution' }
        reason: { type: [string, 'null'] }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    DisposalExecution:
      type: object
      properties:
        executionId: { type: string }
        disposalApprovalId: { type: string }
        state: { type: string, enum: [SUBMITTED, APPLIED, UNKNOWN_RESULT, REJECTED] }
        executedBy: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/QualityLine' } }
        qty: { type: integer }
        inventoryCommitId: { type: [string, 'null'] }
        rejectReason: { type: [string, 'null'] }
        executedAt: { type: string, format: date-time }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    QualityIncident:
      type: object
      properties:
        incidentId: { type: string }
        mfcId: { type: string }
        kind: { $ref: '#/components/schemas/IncidentKind' }
        state: { type: string, enum: [OPEN, DECIDED, CLOSED] }
        sourceEvent: { type: string, description: TemperatureExcursion / LineShortageReported / RecallIssued }
        sourceRef: { type: string }
        affectedLots:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
