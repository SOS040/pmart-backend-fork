openapi: 3.1.0
info:
  title: search-service
  version: 0.8.0
  description: |
    0.8.0(2026-11-22, 클라이언트 BR-82 "할인 상품 목록"): `GET /search/products?onSale=true` — 대표 SKU 에 지금 기간 할인이 있는 상품만(결과의 salePrice 가 붙는 것과 같은 판정:
    할인 금액 > 0, 끝 시각 전, 가격 사본과 같은 priceVersion). 정렬·필터·검색어는 그대로 함께 쓴다. 할인율순 정렬은 아직 없다. 할인 정보를 못 읽으면 503.
    0.7.0(2026-11-22, 클라이언트 BR-81 "필터가 안 보임"): `GET /search/filters` 의 속성 이름을 모든 카테고리 필터 패널에서 찾는다(전에는 그 카테고리·조상만이라
    하위 카테고리 상품의 그룹이 id 로 보였다). 카테고리마다 따로 정의된 같은 이름 그룹("중량" 등)은 한 줄로 묶고 key 를 `n:<그룹 이름>` 으로 준다(같은 옵션은 건수 합).
    검색 `filters=n:<그룹 이름>.<옵션>` 은 그 이름의 그룹 모두로 거른다. 그룹 id 키(예전 형식)도 그대로 받는다. key 는 그대로 돌려보내는 불투명 값으로 쓴다.
    0.6.0(2026-11-21, ADR-0082 4단계 할인가 표시): 검색 결과 항목에 대표 SKU 기간 할인 `salePrice`·`discountRatePercent`·`discountName`·`discountEndsAt`
    (promotion-service SkuDisplayDiscountChanged → Logstash 색인 `sku-discounts`). 가격 사본과 같은 priceVersion·끝 전일 때만, 아니면 null(정가).
    가격순 정렬·가격 범위는 **기본가 기준 그대로**(할인율순 정렬은 이번 범위 밖). 표시용 — 결제 금액은 주문서 견적.
    0.5.2(2026-11-20 고객 앱 요청 — 사용자 "가로 해줘"): `GET /search/suggestions` 의 q 를 선택으로 — 없으면 keywords 는 빈 목록, popular 만(검색 첫 화면 인기 검색어).
    0.5.0(2026-11-20 ADR-0073 단계 B): 동의어 규칙 관리 — 운영 `GET /search/synonym-rules`(지금 버전·규칙)·`GET /search/synonym-rule-applications`(승인 반영 기록), MD·OPERATOR_ADMIN.
    바꾸기는 approval-service 변경 요청(종류 `SEARCH_SYNONYM`, targetRef `pmart-product-synonyms`, allowedActions `[APPLY_SYNONYM_RULES]`, `targetExpectedVersion` = 여기 version, 행 = 규칙 UPSERT·DELETE)으로만 —
    운영 관리자가 승인하면 이 서비스가 ApprovalDecided 를 받아 기준 버전이 같을 때만 전부 반영(재색인 없이 다음 검색부터)하고 ApplicationReceiptRecorded 로 회신한다.
    0.4.0(2026-11-20 ADR-0073 — 사용자 "개발 규모 안 따지면 추천대로"): ① 동의어 — 상품명 검색에 동의어 집합 적용(운영 승인으로 바뀌면 재색인 없이 다음 검색부터).
    ② 오타 교정(첫 쪽·검색어 있음·초성 아님): 결과 0건이면 고친 검색어로 다시 찾아 `correctedQuery`(결과는 고친 검색어 것, `query` 는 원래 검색어 — 다음 쪽은 같은 원래 `q` + `cursor` 로 부르면 고친 검색어로 이어 준다(0.5.1)),
    결과가 적으면(설정, 지금 3건 이하) 고친 검색어가 더 많이 찾을 때 `suggestedQuery`(결과는 원래 검색어 것). `noCorrection=true` 면 교정하지 않는다("원래 검색어로 찾기").
    자동완성은 후보가 없으면 고친 검색어로. ③ 운영 `GET /search/zero-result-keywords`(MD·OPERATOR_ADMIN) — 최근 N일 결과 0건 검색어.
    0.3.0(2026-11-19 ADR-0072 — 사용자 "추천대로 5번 6번"): 정렬 `POPULAR`(최근 30일 판매 — 주문 확정 − 출고 전 취소 − 반품, 대표 SKU)·`RATING`(베이지안 별점 —
    리뷰가 적은 높은 별점은 덜 믿음)·`REVIEW_COUNT`(리뷰 많은 순, 새 값)가 실제로 동작한다(전에는 관련도로 대체). 신호가 없는 상품은 그 정렬에서 맨 뒤. 기본 순위(RELEVANCE)는 그대로.
    결과 `rating`(평균 소수 첫째)·`reviewCount` 를 채운다(storefront 순위 신호 사본 — 리뷰 등록 뒤 몇 초 늦을 수 있음).
    검색 색인·키워드 검색·자동완성·필터 속성·최근 검색어의 정본. (docs/architecture/service-map.md §1, 1단계 기본)
    비정본: 판매 가능 판단(색인 지연은 재고 있음이 아니다), 상품·가격·재고 정본.
    구독: ProductVersionPublished, ProductContentPublished, ProductSaleStateChanged, CategoryChanged.
    정렬은 기본·인기·신규·가격 오름/내림·별점. 할인율순은 1차 제외. 검색 0건은 정상 결과다.
    0.2.0(2026-11-17): 최근 검색어(고객 토큰 검색 자동 기록)·인기 키워드(suggestions.popular) 구현. 검색 기록은 검색 응답과 따로
    비동기로 남겨 실패해도 검색은 실패하지 않는다. 검색자는 (사용자 종류:주체 ID)의 HMAC-SHA256(서버 비밀키) 해시로만 저장한다(고객 ID 원문 미저장).
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: search, description: 상품 검색·자동완성·필터 속성 }
  - { name: recent-searches, description: 본인 최근 검색어 }
  - { name: synonyms, description: '[운영] 동의어 규칙(0.5.0) — 바꾸기는 approval-service SEARCH_SYNONYM' }
  - { name: internal, description: 색인 관리(서비스 토큰) }

paths:
  /search/products:
    get:
      tags: [search]
      summary: 상품 검색 (키워드·카테고리·필터·정렬. 현재 쇼핑 주소 기준 취급 표시)
      description: |
        결과의 판매 상태·가용·가격은 색인 시점 사본이며 asOf를 반환한다. 주소(mfcId)가 바뀌면 호출자는 재조회한다.
        연속 검색은 가장 최신 요청 결과만 반영한다(호출자 책임).
      operationId: searchProducts
      security: []
      parameters:
        - name: q
          in: query
          description: |
            검색어. 띄어쓰기가 달라도 찾는다("생크림" ↔ "생 크림"). 한글 자음만 2자 이상이면 초성 검색이다(예 "ㄷㅂ" → 두부, 2026-11-05).
            기록(2026-11-17): 첫 페이지(cursor 없음)이고 q 가 비어 있지 않으면 서버가 자동으로 남긴다 — 고객(CUSTOMER) 토큰이면 본인 최근
            검색어(앞뒤·연속 공백 정리, 100자까지, 입력 그대로 — 초성 검색어도), 고객·비회원(GUEST) 토큰이면 인기 키워드 집계용 검색 기록.
            토큰 없는 익명 검색은 남기지 않는다.
          schema: { type: string, maxLength: 100 }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: mfcId, in: query, description: '현재 쇼핑 주소 담당 센터. 취급 여부(carried) 표시·거르기용', schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/SortKey' } }
        - name: filters
          in: query
          description: '승인 속성 필터. 형식은 attributeKey.value (예 n:중량.200g 이하) — attributeKey 는 /search/filters 의 key 그대로(0.7.0 부터 n:<그룹 이름> 또는 그룹 id)'
          style: form
          explode: true
          schema: { type: array, items: { type: string, maxLength: 100 } }
        - name: includeNotCarried
          in: query
          description: |
            mfcId 를 줄 때만 의미가 있다. false(기본)면 그 센터가 대표 SKU 를 취급하지 않는 상품을 검색 색인에서 바로 거른다 — 페이지는
            size 만큼 차고 total 도 거른 뒤 건수다(2026-11-05, 이전의 "더 읽어 채우기"·빈 페이지 + 다음 커서는 없어졌다). true 면 미취급도
            carried=false 로 돌려준다 — 업무 문서(Commerce 6장·수용 기준)는 미취급을 품절·판매중지와 구분해 표시하라고 하므로, 화면이 구분
            표시를 하려면 true 로 받는다. 취급 여부는 mfc-inventory 취급 변경 사건의 색인 사본이라 변경 뒤 몇 초 늦을 수 있다.
          schema: { type: boolean, default: false }
        - { name: minPrice, in: query, description: '기본가 하한(원, 이상). 가격이 아직 없는 상품은 가격 범위를 주면 빠진다(2026-11-03)', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: maxPrice, in: query, description: '기본가 상한(원, 이하). minPrice 보다 작으면 400', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: noCorrection, in: query, schema: { type: boolean, default: false }, description: '(0.4.0) true 면 오타 교정하지 않는다 — "원래 검색어로 찾기"' }
        - { name: onSale, in: query, x-added-in: '0.8.0', schema: { type: boolean, default: false }, description: '(0.8.0 BR-82) true 면 대표 SKU 에 지금 기간 할인이 있는 상품만 — 결과의 salePrice 와 같은 판정' }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK (0건도 200)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /search/suggestions:
    get:
      tags: [search]
      summary: 자동완성·추천 키워드 (실패해도 직접 검색은 가능)
      operationId: getSearchSuggestions
      security: []
      parameters:
        - { name: q, in: query, required: false, description: '0.5.2 — 없으면(검색 첫 화면) keywords 는 빈 목록, popular 만', schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keywords: { type: array, items: { type: string }, description: '자동완성. q 가 없거나 공백뿐이면 빈 목록(0.5.2)' }
                  popular:
                    type: array
                    items: { type: string }
                    description: |
                      인기 키워드(2026-11-17 사용자 결정 기준, q 와 무관한 전체 목록). 최근 window(설정, 지금 7일) 동안 결과가 1건 이상이었던
                      검색의 검색 횟수 순 상위 size(설정, 지금 10)개. 서로 다른 검색자(고객·비회원 토큰 — 사용자 종류+주체) min-searchers(설정,
                      지금 2)명 이상이 쓴 검색어만 — 한 사람이 되풀이한 검색어는 오르지 않는다. 토큰 없는 검색은 세지 않는다. 부적절한 낱말은
                      설정 hidden-keywords(운영 숨김 목록, 대소문자·공백 정리 후 일치)로 뺀다. 몇 분(설정 refresh) 사본이라 바로 바뀌지 않는다.
                      설정이 없거나 집계를 못 하면 빈 목록이다 — 자동완성(keywords)과 검색은 그대로 된다.

  /search/zero-result-keywords:
    get:
      tags: [search]
      summary: '[운영] 결과 0건 검색어 (0.4.0, ADR-0073)'
      description: |
        검색 기록(고객·비회원의 첫 쪽 검색)에서 최근 days 일 결과 0건 검색어를 많이 나온 순으로. 인기 키워드 숨김 목록은 뺀다. 검색자는 수만(해시 — 원문 없음).
        동의어·상품명 개선의 근거(운영 화면). MD·OPERATOR_ADMIN 만(그 밖 운영자 403).
      operationId: listZeroResultKeywords
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: days, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 90 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, days]
                properties:
                  days: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [keyword, searches, searchers]
                      properties:
                        keyword: { type: string }
                        searches: { type: integer }
                        searchers: { type: integer, description: 서로 다른 검색자 수(근사) }
                        lastSearchedAt: { type: [string, 'null'], format: date-time }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /search/synonym-rules:
    get:
      tags: [synonyms]
      summary: '[운영] 지금 동의어 규칙 (0.5.0, ADR-0073)'
      description: |
        상품명 검색에 쓰는 동의어 규칙 전체와 버전. 바꾸려면 이 version 을 기준 버전(targetExpectedVersion)으로 approval-service 에 변경 요청
        (`SEARCH_SYNONYM`)을 만든다 — 승인 전에 다른 변경이 반영되면 그 요청은 반영되지 않는다(회신 REJECTED·STALE_VERSION, 다시 조회해 새로 요청).
        낱말은 소문자·앞뒤 공백 없이 저장된다. MD·OPERATOR_ADMIN 만(그 밖 운영자 403).
      operationId: getSynonymRules
      x-pmart-user-types: [OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynonymRuleSet' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /search/synonym-rule-applications:
    get:
      tags: [synonyms]
      summary: '[운영] 동의어 승인 반영 기록 (0.5.0, ADR-0073)'
      description: |
        승인된 동의어 변경 요청마다 반영 결과(최근 순). 반영하지 않은 까닭: `STALE_VERSION`(승인 전에 다른 변경이 반영됨)·`LINE_REJECTED`(행이 어긋남 —
        lineReasons: `RULE_NOT_FOUND` 지울 규칙 없음·`INVALID_TERMS`·`INVALID_OP`·`DUPLICATE_RULE`). 반려된 요청은 오지 않는다. MD·OPERATOR_ADMIN 만.
      operationId: listSynonymRuleApplications
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SynonymRuleApplication' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /search/filters:
    get:
      tags: [search]
      summary: 카테고리·검색어 기준 선택 가능한 필터 속성 (용량·개당 수량 등 승인 속성)
      operationId: getSearchFilters
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attributes: { type: array, items: { $ref: '#/components/schemas/FilterAttribute' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /me/recent-searches:
    get:
      tags: [recent-searches]
      summary: 본인 최근 검색어 조회
      description: |
        최신순. 고객 토큰으로 첫 페이지 검색(GET /search/products, q 있음)을 하면 서버가 자동으로 남긴다. 같은 검색어는 하나만 두고 맨 위로
        올린다(searchedAt 갱신). 최근 max-items(설정, 지금 10)개, retention(설정, 지금 90일)이 지난 것은 보이지 않고 매일 지운다.
        기록은 검색 뒤 비동기라 바로 다음 조회에 몇 초 늦게 보일 수 있다. 고객 토큰만 — 그 밖의 종류는 403. 설정이 없으면 422 CONFIG_REQUIRED.
      operationId: listRecentSearches
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        keyword: { type: string }
                        searchedAt: { type: string, format: date-time }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
    delete:
      tags: [recent-searches]
      summary: 최근 검색어 전체 삭제
      description: 본인 최근 검색어 목록만 지운다(인기 키워드 집계용 검색 기록은 그대로). 없어도 204(멱등). 고객 토큰만 — 그 밖의 종류는 403.
      operationId: clearRecentSearches
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 (없어도 멱등 성공) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /me/recent-searches/{keyword}:
    delete:
      tags: [recent-searches]
      summary: 최근 검색어 개별 삭제
      description: |
        keyword 는 기록과 같은 방식(앞뒤·연속 공백 정리)으로 맞춰 찾는다. 본인 최근 검색어 목록만 바꾼다(인기 키워드 집계는 그대로).
        없어도 204(멱등). 고객 토큰만 — 그 밖의 종류는 403.
      operationId: deleteRecentSearch
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: keyword, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 (없어도 멱등 성공) }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---------- internal (서비스 토큰) ----------
  /internal/reindex-requests:
    post:
      tags: [internal]
      summary: '[approval/bff→search] 재색인 요청 (승인 변경 반영 지연·누락 복구. 상품 카드 중복 생성 없음)'
      operationId: requestReindex
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [PRODUCT, CATEGORY, FULL] }
                productIds: { type: array, maxItems: 500, items: { type: string } }
                categoryIds: { type: array, items: { type: string } }
                reason: { type: string, maxLength: 200 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reindex-requests/{requestId}:
    get:
      tags: [internal]
      summary: 재색인 요청 진행 조회
      operationId: getReindexRequest
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  scope: { type: string }
                  processed: { type: integer }
                  total: { type: integer }
                  failedProductIds: { type: array, items: { type: string } }
                  finishedAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/index-status:
    get:
      tags: [internal]
      summary: '[bff→search] 색인 신선도 (원천별 마지막 반영 이벤트 시각·지연)'
      description: |
        색인 문서의 시각 필드 최댓값(2026-11-03). eventType ANY = Logstash 가 마지막으로 반영한 시각(모든 사건) — 색인이 멈췄는지의 기준.
        ProductContentPublished·ProductSaleStateChanged·PriceVersionEffective = 마지막으로 반영된 사건의 사건 시각.
        ProductVersionPublished 는 따로 남는 시각이 없어 ANY 로 본다. 아직 그 사건이 없으면 항목이 없다.
        lagSeconds = 지금 − lastAppliedAt(마지막 반영 뒤 지난 시간 — 사건이 없어 조용한 것과 멈춘 것은 이것만으로 구분되지 않는다).
        Elasticsearch 가 응답하지 않으면 503 DEPENDENCY_UNAVAILABLE.
      operationId: getIndexStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: integer }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        eventType: { type: string }
                        lastAppliedAt: { type: string, format: date-time }
                        lagSeconds: { type: integer }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    SortKey:
      type: string
      description: 할인율순(DISCOUNT)은 1차 제외
      enum: [RELEVANCE, POPULAR, NEWEST, PRICE_ASC, PRICE_DESC, RATING, REVIEW_COUNT]
      default: RELEVANCE
    SearchHit:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        imageUrl: { type: string, format: uri }
        categoryPath: { type: array, items: { type: string } }
        representativeSku: { $ref: '_common.yaml#/components/schemas/Sku' }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money', description: pricing 사본 }
        priceVersion: { type: integer }
        salePrice: { type: [integer, 'null'], minimum: 0, description: '(0.6.0) 기간 할인가(대표 SKU 개당). 할인 없음·가격 버전 다름·끝남이면 null' }
        discountRatePercent: { type: [integer, 'null'], description: '(0.6.0) 할인율(내림, %)' }
        discountName: { type: [string, 'null'], description: '(0.6.0) 행사 이름' }
        discountEndsAt: { type: [string, 'null'], format: date-time, description: '(0.6.0) 행사 끝' }
        saleState: { type: string, enum: [ON_SALE, TEMPORARILY_SOLD_OUT, SALE_STOPPED, UNKNOWN] }
        carried: { type: [boolean, 'null'], description: 'mfcId 지정 시 그 센터의 대표 SKU 취급 여부(색인 사본, 취급 레코드 없음 = false). mfcId 가 없으면 null' }
        rating: { type: [number, 'null'], description: '(0.3.0) 공개 리뷰 평균(소수 첫째). 리뷰 없으면 비움' }
        reviewCount: { type: [integer, 'null'], description: '(0.3.0) 공개 리뷰 수' }
        productVersion: { type: integer, description: 색인된 product 버전 }
    SearchResult:
      type: object
      required: [items, page]
      properties:
        query: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        total:
          type: integer
          description: |
            검색 조건에 맞는 건수. mfcId + includeNotCarried=false 면 미취급을 거른 뒤 건수다(2026-11-05부터 정확).
        page: { $ref: '_common.yaml#/components/schemas/Page' }
        appliedSort: { $ref: '#/components/schemas/SortKey' }
        correctedQuery: { type: [string, 'null'], description: '(0.4.0) 원래 검색어 결과가 0건이라 이 검색어로 고쳐 찾은 결과다 — 앱 "○○ 검색 결과예요 · 원래 검색어로 찾기(noCorrection=true)"' }
        suggestedQuery: { type: [string, 'null'], description: '(0.4.0) 결과가 적어 제안하는 검색어(결과는 원래 검색어 것) — 앱 "혹시 ○○를 찾으셨나요?"' }
        appliedFilters: { type: array, items: { type: string } }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    FilterAttribute:
      type: object
      properties:
        key: { type: string, example: 'n:용량', description: '0.7.0 — 같은 이름 그룹을 묶은 n:<그룹 이름>, 이름에 . 이 있거나 이름을 모르면 그룹 id' }
        label: { type: string, example: 용량 }
        multiSelect: { type: boolean }
        values:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              count: { type: integer, description: 현재 조건에서의 결과 수. 0이면 선택 불가 표시 }
    SynonymRule:
      type: object
      required: [ruleId, terms]
      properties:
        ruleId: { type: string, description: '규칙 ID(영문·숫자·_.- 1~64자) — 변경 요청 행의 lineKey' }
        terms: { type: array, items: { type: string }, description: 같은 뜻 낱말(2~20개, 소문자) }
    SynonymRuleSet:
      type: object
      required: [version, rules]
      properties:
        version: { type: integer, format: int64, description: '규칙 버전(처음 0, 반영마다 1씩)' }
        rules: { type: array, items: { $ref: '#/components/schemas/SynonymRule' } }
        lastApprovalId: { type: [string, 'null'], description: 마지막으로 반영한 승인 }
        updatedAt: { type: [string, 'null'], format: date-time }
    SynonymRuleApplication:
      type: object
      required: [approvalId, result, baseVersion, version, at]
      properties:
        approvalId: { type: string }
        changeRequestId: { type: [string, 'null'] }
        approverId: { type: [string, 'null'] }
        result: { type: string, enum: [APPLIED, REJECTED] }
        reason: { type: [string, 'null'], description: 'REJECTED 까닭 STALE_VERSION·LINE_REJECTED' }
        baseVersion: { type: [integer, 'null'], format: int64, description: 요청의 기준 버전 }
        version: { type: integer, format: int64, description: '반영 뒤 버전(반영하지 않았으면 그때 버전)' }
        lineReasons:
          type: object
          additionalProperties: { type: string }
          description: 규칙 ID → 어긋난 까닭
        at: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
