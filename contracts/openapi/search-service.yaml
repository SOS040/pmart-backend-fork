openapi: 3.1.0
info:
  title: search-service
  version: 0.1.2
  description: |
    검색 색인·키워드 검색·자동완성·필터 속성·최근 검색어의 정본. (docs/architecture/service-map.md §1, 1단계 기본)
    비정본: 판매 가능 판단(색인 지연은 재고 있음이 아니다), 상품·가격·재고 정본.
    구독: ProductVersionPublished, ProductContentPublished, ProductSaleStateChanged, CategoryChanged.
    정렬은 기본·인기·신규·가격 오름/내림·별점. 할인율순은 1차 제외. 검색 0건은 정상 결과다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: search, description: 상품 검색·자동완성·필터 속성 }
  - { name: recent-searches, description: 본인 최근 검색어 }
  - { name: internal, description: 색인 관리(서비스 토큰) }

paths:
  /search/products:
    get:
      tags: [search]
      summary: 상품 검색 (키워드·카테고리·필터·정렬. 현재 쇼핑 주소 기준 취급 표시)
      description: |
        결과의 판매 상태·가용·가격은 색인 시점 사본이며 asOf를 반환한다. 주소(mfcId)가 바뀌면 호출자는 재조회한다.
        연속 검색은 가장 최신 요청 결과만 반영한다(호출자 책임).
      operationId: searchProducts
      security: []
      parameters:
        - name: q
          in: query
          description: |
            검색어. 띄어쓰기가 달라도 찾는다("생크림" ↔ "생 크림"). 한글 자음만 2자 이상이면 초성 검색이다(예 "ㄷㅂ" → 두부, 2026-11-05).
          schema: { type: string, maxLength: 100 }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: mfcId, in: query, description: '현재 쇼핑 주소 담당 센터. 취급 여부(carried) 표시·거르기용', schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: sort, in: query, schema: { $ref: '#/components/schemas/SortKey' } }
        - name: filters
          in: query
          description: 승인 속성 필터. 형식은 attributeKey.value (예 capacity.500ml)
          style: form
          explode: true
          schema: { type: array, items: { type: string, maxLength: 100 } }
        - name: includeNotCarried
          in: query
          description: |
            mfcId 를 줄 때만 의미가 있다. false(기본)면 그 센터가 대표 SKU 를 취급하지 않는 상품을 검색 색인에서 바로 거른다 — 페이지는
            size 만큼 차고 total 도 거른 뒤 건수다(2026-11-05, 이전의 "더 읽어 채우기"·빈 페이지 + 다음 커서는 없어졌다). true 면 미취급도
            carried=false 로 돌려준다 — 업무 문서(Commerce 6장·수용 기준)는 미취급을 품절·판매중지와 구분해 표시하라고 하므로, 화면이 구분
            표시를 하려면 true 로 받는다. 취급 여부는 mfc-inventory 취급 변경 사건의 색인 사본이라 변경 뒤 몇 초 늦을 수 있다.
          schema: { type: boolean, default: false }
        - { name: minPrice, in: query, description: '기본가 하한(원, 이상). 가격이 아직 없는 상품은 가격 범위를 주면 빠진다(2026-11-03)', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: maxPrice, in: query, description: '기본가 상한(원, 이하). minPrice 보다 작으면 400', schema: { type: integer, format: int64, minimum: 0 } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK (0건도 200)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /search/suggestions:
    get:
      tags: [search]
      summary: 자동완성·추천 키워드 (실패해도 직접 검색은 가능)
      operationId: getSearchSuggestions
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  keywords: { type: array, items: { type: string } }
                  popular: { type: array, items: { type: string }, description: 인기 키워드(승인 기준 집계) }

  /search/filters:
    get:
      tags: [search]
      summary: 카테고리·검색어 기준 선택 가능한 필터 속성 (용량·개당 수량 등 승인 속성)
      operationId: getSearchFilters
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: categoryId, in: query, schema: { type: string } }
        - { name: mfcId, in: query, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attributes: { type: array, items: { $ref: '#/components/schemas/FilterAttribute' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /me/recent-searches:
    get:
      tags: [recent-searches]
      summary: 본인 최근 검색어 조회
      operationId: listRecentSearches
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        keyword: { type: string }
                        searchedAt: { type: string, format: date-time }
    delete:
      tags: [recent-searches]
      summary: 최근 검색어 전체 삭제
      operationId: clearRecentSearches
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 }

  /me/recent-searches/{keyword}:
    delete:
      tags: [recent-searches]
      summary: 최근 검색어 개별 삭제
      operationId: deleteRecentSearch
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: keyword, in: path, required: true, schema: { type: string, maxLength: 100 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 (없어도 멱등 성공) }

  # ---------- internal (서비스 토큰) ----------
  /internal/reindex-requests:
    post:
      tags: [internal]
      summary: '[approval/bff→search] 재색인 요청 (승인 변경 반영 지연·누락 복구. 상품 카드 중복 생성 없음)'
      operationId: requestReindex
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [PRODUCT, CATEGORY, FULL] }
                productIds: { type: array, maxItems: 500, items: { type: string } }
                categoryIds: { type: array, items: { type: string } }
                reason: { type: string, maxLength: 200 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/reindex-requests/{requestId}:
    get:
      tags: [internal]
      summary: 재색인 요청 진행 조회
      operationId: getReindexRequest
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  scope: { type: string }
                  processed: { type: integer }
                  total: { type: integer }
                  failedProductIds: { type: array, items: { type: string } }
                  finishedAt: { type: [string, 'null'], format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/index-status:
    get:
      tags: [internal]
      summary: '[bff→search] 색인 신선도 (원천별 마지막 반영 이벤트 시각·지연)'
      description: |
        색인 문서의 시각 필드 최댓값(2026-11-03). eventType ANY = Logstash 가 마지막으로 반영한 시각(모든 사건) — 색인이 멈췄는지의 기준.
        ProductContentPublished·ProductSaleStateChanged·PriceVersionEffective = 마지막으로 반영된 사건의 사건 시각.
        ProductVersionPublished 는 따로 남는 시각이 없어 ANY 로 본다. 아직 그 사건이 없으면 항목이 없다.
        lagSeconds = 지금 − lastAppliedAt(마지막 반영 뒤 지난 시간 — 사건이 없어 조용한 것과 멈춘 것은 이것만으로 구분되지 않는다).
        Elasticsearch 가 응답하지 않으면 503 DEPENDENCY_UNAVAILABLE.
      operationId: getIndexStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents: { type: integer }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        eventType: { type: string }
                        lastAppliedAt: { type: string, format: date-time }
                        lagSeconds: { type: integer }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    SortKey:
      type: string
      description: 할인율순(DISCOUNT)은 1차 제외
      enum: [RELEVANCE, POPULAR, NEWEST, PRICE_ASC, PRICE_DESC, RATING]
      default: RELEVANCE
    SearchHit:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        imageUrl: { type: string, format: uri }
        categoryPath: { type: array, items: { type: string } }
        representativeSku: { $ref: '_common.yaml#/components/schemas/Sku' }
        basePrice: { $ref: '_common.yaml#/components/schemas/Money', description: pricing 사본 }
        priceVersion: { type: integer }
        saleState: { type: string, enum: [ON_SALE, TEMPORARILY_SOLD_OUT, SALE_STOPPED, UNKNOWN] }
        carried: { type: [boolean, 'null'], description: 'mfcId 지정 시 그 센터의 대표 SKU 취급 여부(색인 사본, 취급 레코드 없음 = false). mfcId 가 없으면 null' }
        rating: { type: number }
        reviewCount: { type: integer }
        productVersion: { type: integer, description: 색인된 product 버전 }
    SearchResult:
      type: object
      required: [items, page]
      properties:
        query: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/SearchHit' } }
        total:
          type: integer
          description: |
            검색 조건에 맞는 건수. mfcId + includeNotCarried=false 면 미취급을 거른 뒤 건수다(2026-11-05부터 정확).
        page: { $ref: '_common.yaml#/components/schemas/Page' }
        appliedSort: { $ref: '#/components/schemas/SortKey' }
        appliedFilters: { type: array, items: { type: string } }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    FilterAttribute:
      type: object
      properties:
        key: { type: string, example: capacity }
        label: { type: string, example: 용량 }
        multiSelect: { type: boolean }
        values:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              count: { type: integer, description: 현재 조건에서의 결과 수. 0이면 선택 불가 표시 }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
