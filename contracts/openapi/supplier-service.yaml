openapi: 3.1.0
info:
  title: supplier-service
  version: 0.1.0
  description: |
    공급사 마스터·계약·납품 조건의 정본(예정). (docs/architecture/service-map.md §3)
    3단계 — 1차 제외 (SCM 문서 0.1). 경계·계약명만 예약: SupplierRegistered. 아래 경로는 자리표시자이며 구현 대상이 아니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: suppliers, description: 공급사 마스터 (3단계 자리표시자) }

paths:
  /suppliers:
    get:
      tags: [suppliers]
      summary: 공급사 목록 조회
      description: 1차 제외 (SCM 문서 0.1)
      operationId: listSuppliers
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자(코드 없음), 공급사 마스터는 직원 관리"
      x-stage: 3
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK (3단계 정의 예정)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placeholder' }
    post:
      tags: [suppliers]
      summary: 공급사 등록 → SupplierRegistered
      description: 1차 제외 (SCM 문서 0.1)
      operationId: registerSupplier
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자(코드 없음), 공급사 마스터는 직원 관리"
      x-stage: 3
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }

  /suppliers/{supplierId}:
    get:
      tags: [suppliers]
      summary: 공급사 상세 조회
      description: 1차 제외 (SCM 문서 0.1)
      operationId: getSupplier
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자(코드 없음), 공급사 마스터는 직원 관리"
      x-stage: 3
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK (3단계 정의 예정)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Placeholder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /suppliers/{supplierId}/contracts:
    post:
      tags: [suppliers]
      summary: 공급 계약·납품 조건 등록
      description: 1차 제외 (SCM 문서 0.1)
      operationId: createSupplierContract
      x-pmart-user-types: [OPERATOR]
      x-pmart-user-types-note: "추정 — 3단계 자리표시자(코드 없음), 공급사 마스터는 직원 관리"
      x-stage: 3
      parameters:
        - { name: supplierId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }

components:
  schemas:
    Placeholder:
      type: object
      description: 3단계에서 정의. 1차 제외 (SCM 문서 0.1)
      properties:
        supplierId: { type: string }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
