openapi: 3.1.0
info:
  title: claim-service
  version: 0.1.0
  description: |
    취소·반품·교환 신청·심사·승인 범위, 자격 판정, 신청 가능량, 회수 지시·검수 결과 연결, 환불 의도·금액·상태, 철회의 정본. (docs/architecture/service-map.md §2)
    PG 실행(payment), 회수 수행(delivery), 검수·재입고(mfc), 주문 수량 정본(order)은 소유하지 않는다.
    취소(CANCEL)는 접수 후 order-orchestration S3로, 반품·교환은 S6(docs/business/flows/return-exchange-refund.md)로 진행한다.
    1단계는 취소·반품 접수, 2단계에서 교환·회수를 완성한다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: claims, description: 고객·CS 클레임 접수·조회·철회 }
  - { name: decisions, description: 운영자 심사 (BO-12~14) }
  - { name: refunds, description: 환불 상태 조회 }
  - { name: internal, description: 서비스 간 (mfc-inbound 회수 수령) }

paths:
  /claims:
    post:
      tags: [claims]
      summary: 클레임 접수 (CANCEL | RETURN | EXCHANGE)
      description: |
        자격·대상 수량·중복·진행 점유를 검증해 접수한다. 접수는 심사·승인이 아니다.
        접수 기한(Asia/Seoul 실제 수령시각 기준, 경계시각까지 가능)
        - 일반 교환·반품 수령 후 7일
        - 신선식품(냉장/냉동) 24시간
        - 하자·오배송·광고 상이 사유의 교환 수령 후 3개월(달력 월, 없는 날은 말일) 또는 안 날(알 수 있었던 날)부터 30일 중 하나
        분할배송은 신청 품목의 실제 수령시각(delivery-execution DeliveryCompleted) 기준. 신선 24h 경과라도 사유가 하자이면 특례로 심사한다.
        신청 가능 수량 = 실제 전달량 − 완료/진행 클레임 점유. CANCEL은 원수량 − 기취소 − 인계 − 진행 클레임.
        회수·재배달 주소는 원주문 주소 고정. 단순 변심 교환은 왕복 9,000원 청구, 상품/배달 문제는 0원.
      operationId: createClaim
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClaimRequest' }
      responses:
        '201':
          description: 접수됨 (같은 키·같은 본문은 기존 클레임 반환)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CLAIM_WINDOW_EXPIRED / QUANTITY_EXCEEDS_AVAILABLE / DUPLICATE_CLAIM / NOT_DELIVERED_YET / EVIDENCE_REQUIRED / ORDER_NOT_CANCELLABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [claims]
      summary: 클레임 목록 (고객은 본인, 운영자는 orderId·상태 필터)
      operationId: listClaims
      parameters:
        - { name: orderId, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ClaimType' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/ClaimState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /claims/{claimId}:
    get:
      tags: [claims]
      summary: 클레임 상세 (심사 결과·회수·환불·재배송 상태를 각각 표시)
      operationId: getClaim
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /claims/{claimId}/decisions:
    post:
      tags: [decisions]
      summary: "[운영자 BO-14] 심사 결정 (품목별 APPROVED/REJECTED, 회수 필요 여부)"
      description: |
        부분 승인 가능(3건 중 2건 승인 → 2건만 후속). 회수 없는 처리(skipPickup)는 승인 사유·증빙 필수.
        비용 결정(회수비·교환비)은 근거·승인자와 함께 기록. 환불 의도는 여기서 산정되며 PG 실행은 payment가 한다.
        CANCEL 유형은 S3 결과(orchestration 확정 수량)로 자동 결정되므로 운영자 결정 대상이 아니다(UNSUPPORTED_ACTION).
      operationId: createClaimDecision
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClaimDecisionRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: EVIDENCE_REQUIRED (회수 생략·비용 결정 근거 누락) / APPROVAL_REQUIRED / UNSUPPORTED_ACTION
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /claims/{claimId}/decisions/{requestId}:
    get:
      tags: [decisions]
      summary: 심사 결정 결과 조회
      operationId: getClaimDecision
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimDecision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /claims/{claimId}/withdrawals:
    post:
      tags: [claims]
      summary: 클레임 철회 (고객)
      description: |
        진행된 회수 수행·실물·PG 취소를 대사해 처리하며 사건을 삭제하지 않는다. 환불이 이미 PG 성공이면 철회 불가(INVALID_STATE).
        회수 배차가 진행 중이면 dispatch 취소를 요청하고 결과 확인 후 WITHDRAWN으로 전이한다.
      operationId: createClaimWithdrawal
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 300 }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (환불 완료·종결) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /claims/{claimId}/withdrawals/{requestId}:
    get:
      tags: [claims]
      summary: 철회 요청 결과 조회
      operationId: getClaimWithdrawal
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, WITHDRAWN, REJECTED, UNKNOWN] }
                  reason: { type: string }
                  reconciledAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /claims/{claimId}/refunds:
    get:
      tags: [refunds]
      summary: 환불 의도·상태 조회 (PG 성공 전 "완료" 표시 없음)
      operationId: listClaimRefunds
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  claimId: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/Refund' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/claims/{claimId}/return-receipts:
    post:
      tags: [internal]
      summary: "[mfc-inbound→claim] 회수품 점포 수령 확인 (품목별 실수령 수량)"
      description: |
        회수 승인량 2 / 실수령 1이면 미수령 1을 남긴다. 수령 확인은 검수·환불 완료가 아니다.
        검수 결과(RESALE/DISPOSE)는 ReturnInspected 이벤트로 수신하며 이 API는 수령 사실만 기록한다.
      operationId: createReturnReceipt
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnReceiptRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (회수 미승인·종결) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: RECEIPT_EXCEEDS_APPROVED (승인 회수량 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/claims/{claimId}/return-receipts/{requestId}:
    get:
      tags: [internal]
      summary: 회수 수령 확인 결과 조회
      operationId: getReturnReceipt
      parameters:
        - { name: claimId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnReceipt' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    ClaimType:
      type: string
      enum: [CANCEL, RETURN, EXCHANGE]
    ClaimState:
      type: string
      description: |
        OPENED 접수. UNDER_REVIEW 심사 중. DECIDED 결정(일부 승인 가능). IN_PROGRESS 회수·환불·재배송 진행. CLOSED 모든 의무 확인 후 종결. WITHDRAWN 철회.
        CANCEL 유형은 OPENED → STOP_PENDING(출고 중지/인계 확인 중) → IN_PROGRESS → CLOSED 또는 REJECTED(취소 불가).
      enum: [OPENED, UNDER_REVIEW, STOP_PENDING, DECIDED, IN_PROGRESS, CLOSED, WITHDRAWN, REJECTED]
    ClaimReason:
      type: string
      description: DEFECT·WRONG_ITEM·NOT_AS_ADVERTISED는 교환 특례 기한(3개월/인지 30일) 대상
      enum: [CHANGE_OF_MIND, DEFECT, WRONG_ITEM, NOT_AS_ADVERTISED, DAMAGED_IN_DELIVERY, MISSING_ITEM, LATE_DELIVERY, CUSTOMER_ABSENT, ADDRESS_ERROR, OTHER]
    ClaimLineRequest:
      type: object
      required: [orderLineId, qty]
      properties:
        orderLineId: { type: string }
        qty: { type: integer, minimum: 1 }
        exchangeSku:
          $ref: '_common.yaml#/components/schemas/Sku'
          description: EXCHANGE일 때 교환 대상 SKU (동일 SKU 기본)
    CreateClaimRequest:
      type: object
      required: [orderId, type, lines, reason]
      properties:
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ClaimLineRequest' } }
        reason: { $ref: '#/components/schemas/ClaimReason' }
        reasonDetail: { type: string, maxLength: 1000 }
        evidenceRefs:
          type: array
          description: 사진 등 증빙 참조(file-service). 하자·오배송·광고 상이 사유는 필수
          items: { type: string }
        receivedAt:
          type: string
          format: date-time
          description: 고객이 주장하는 수령 시각(참고). 기한 판정은 delivery-execution 실제 전달 시각으로 한다
        awareAt:
          type: string
          format: date-time
          description: 하자 등을 안 날(알 수 있었던 날). 특례 30일 기산점. 불명이면 증빙 보완 심사
        channel: { type: string, enum: [CUSTOMER_APP, CS, OPERATOR] }
    ClaimLine:
      type: object
      properties:
        claimLineId: { type: string }
        orderLineId: { type: string }
        sku: { type: string }
        requestedQty: { type: integer }
        approvedQty: { type: integer }
        decision: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectReason: { type: string }
        pickupRequired: { type: boolean }
        receivedQty: { type: integer, description: 점포 실수령 수량 }
        inspection:
          type: object
          properties:
            resaleQty: { type: integer }
            disposeQty: { type: integer }
            inspectedAt: { type: string, format: date-time }
        refundAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 원가격·원안분 기준 }
        deliveredAt: { type: string, format: date-time, description: 기한 기산 근거(실제 전달 시각) }
        windowDeadline: { type: string, format: date-time, description: 적용된 접수 기한(Asia/Seoul 경계) }
        windowRule: { type: string, enum: [GENERAL_7D, FRESH_24H, DEFECT_3M, DEFECT_AWARE_30D] }
    PickupState:
      type: string
      enum: [NOT_REQUIRED, REQUESTED, DISPATCHED, PICKED_UP, DELIVERED_TO_STORE, RECEIVED, INSPECTED]
    Claim:
      type: object
      properties:
        claimId: { type: string }
        version: { type: integer }
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        state: { $ref: '#/components/schemas/ClaimState' }
        reason: { $ref: '#/components/schemas/ClaimReason' }
        reasonDetail: { type: string }
        evidenceRefs: { type: array, items: { type: string } }
        lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
        stopRequestId: { type: string, description: CANCEL일 때 S3 멱등 키 }
        sagaId: { type: string }
        pickup:
          type: object
          properties:
            state: { $ref: '#/components/schemas/PickupState' }
            deliveryId: { type: string, description: 회수 배송번호(dispatch) }
            addressFixedToOrder: { type: boolean, default: true }
        fees:
          type: object
          properties:
            exchangeRoundTripFee: { $ref: '_common.yaml#/components/schemas/Money', description: 단순 변심 교환 9000 }
            returnPickupFee: { $ref: '_common.yaml#/components/schemas/Money' }
            decidedBy: { type: string }
            evidenceRef: { type: string }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' } }
        reshipment:
          type: object
          description: EXCHANGE 승인 시 교환 이행 단위 (새 주문·새 결제 생성 없음)
          properties:
            state: { type: string, enum: [NOT_APPLICABLE, APPROVED, FULFILLMENT_CREATED, IN_PROGRESS, DELIVERED, OUT_OF_STOCK] }
            shipmentId: { type: string }
        openedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        sources:
          type: array
          description: 조합한 원천별 기준시각 (order·delivery·payment·mfc)
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ClaimSummary:
      type: object
      properties:
        claimId: { type: string }
        orderId: { type: string }
        type: { $ref: '#/components/schemas/ClaimType' }
        state: { $ref: '#/components/schemas/ClaimState' }
        openedAt: { type: string, format: date-time }
    ClaimDecisionRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [claimLineId, decision]
            properties:
              claimLineId: { type: string }
              decision: { type: string, enum: [APPROVED, REJECTED] }
              approvedQty: { type: integer, minimum: 0 }
              pickupRequired: { type: boolean, default: true }
              rejectReason: { type: string }
        skipPickupReason: { type: string, description: 회수 생략 시 필수 }
        skipPickupEvidenceRefs: { type: array, items: { type: string } }
        fees:
          type: object
          properties:
            exchangeRoundTripFee: { $ref: '_common.yaml#/components/schemas/Money' }
            returnPickupFee: { $ref: '_common.yaml#/components/schemas/Money' }
            evidenceRef: { type: string }
        refundTrigger:
          type: string
          description: 환불 개시점. 미지정이면 등록된 정책값, 정책 미설정이면 심사 대기 상신(자동 환불 없음)
          enum: [ON_PICKUP_CONFIRMED, ON_STORE_RECEIVED, ON_INSPECTED]
        approvalRef: { type: string, description: 정책 밖 결정(비용 면제 등)일 때 승인 건 ID }
        note: { type: string, maxLength: 1000 }
    ClaimDecision:
      type: object
      properties:
        requestId: { type: string }
        claimId: { type: string }
        operatorId: { type: string }
        state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
        lines: { type: array, items: { $ref: '#/components/schemas/ClaimLine' } }
        decidedAt: { type: string, format: date-time }
    RefundState:
      type: string
      description: 접수 → 심사/승인 → 실행 대기 → PG 결과 확인 → 완료 / 실패 / 확인 중
      enum: [RECEIVED, APPROVED, PENDING_EXECUTION, PG_PENDING, COMPLETED, FAILED, UNKNOWN]
    Refund:
      type: object
      properties:
        refundIntentId: { type: string }
        claimId: { type: string }
        state: { $ref: '#/components/schemas/RefundState' }
        amount: { $ref: '_common.yaml#/components/schemas/Money', description: 원주문 가격 스냅샷·품목별 할인 안분 }
        breakdown:
          type: object
          properties:
            itemAmount: { $ref: '_common.yaml#/components/schemas/Money' }
            discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
            bagFee: { $ref: '_common.yaml#/components/schemas/Money', description: 전체 취소만 환불 }
            deliveryTip: { $ref: '_common.yaml#/components/schemas/Money', description: 확정 기준 }
            feeDeduction: { $ref: '_common.yaml#/components/schemas/Money', description: 교환 왕복·회수비 공제 }
        paymentAttemptId: { type: string }
        cancellationRequestId: { type: string, description: payment 취소 거래 requestId }
        pgResult: { type: string, enum: [SUCCESS, FAILED, UNKNOWN] }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    ReturnReceiptRequest:
      type: object
      required: [mfcId, deliveryId, lines, receivedAt, receivedBy]
      properties:
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryId: { type: string, description: 회수 배송번호 }
        receivedBy: { type: string, description: 점원 식별자 }
        receivedAt: { type: string, format: date-time }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [claimLineId, receivedQty]
            properties:
              claimLineId: { type: string }
              receivedQty: { type: integer, minimum: 0 }
              note: { type: string }
    ReturnReceipt:
      type: object
      properties:
        requestId: { type: string }
        claimId: { type: string }
        state: { type: string, enum: [ACCEPTED, APPLIED, REJECTED] }
        lines:
          type: array
          items:
            type: object
            properties:
              claimLineId: { type: string }
              approvedQty: { type: integer }
              receivedQty: { type: integer }
              outstandingQty: { type: integer, description: 미수령 잔량 }
        receivedAt: { type: string, format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
