openapi: 3.1.0
info:
  title: mfc-fulfillment-service
  version: 0.2.0
  description: |
    MFC 작업(PICK/PACK/DISPATCH Task)·Shipment·Package·HandoverFact·**인계 fence**의 정본. (docs/architecture/service-map.md §5, ADR-0006)

    0.2.0(2026-11-07, 슬라이스 6b): 점원 단말 Task API·포장 밀봉 구현. 작업자 = 운영자 계정(작업자 로그인 BR-02 결정 전 잠정) — 그 센터 권한 +
    역할 `MFC_WORKER`. 담당은 mfc-capacity 수동 배정(감독자 `MFC_SUPERVISOR`, WK-02 — Q-08 전 수동 지정만)의 투영과 시작 때 동기 조회.
    PICK 시작(센터에서 그 주문의 첫 시작)이 준비 시작 PreparationStarted(D6-1). 피킹 실적은 mfc-inventory PICK(선반 → 포장 구역)으로, 포장 밀봉은
    PACK(PICKED → PACKED)으로 반영한다. 결품 보고는 작업을 BLOCKED 로 두고 LineShortageReported 만 낸다(재고 처리는 IV-09 단계).
    DISPATCH·인계 fence 는 아직 501(6c).
    비정본: 수량(mfc-inventory), 취소 판단(order-orchestration/claim), 배차(delivery-dispatch), 작업자 배정 정본(mfc-capacity), 주문 상태(order).

    상태 기계
    - TSK: WAITING→READY→ASSIGNED→IN_PROGRESS→COMPLETED / BLOCKED / FAILED / CANCELLED / CLOSED_PARTIAL (계획 = 완료 + 취소 + 잔량)
    - SHP: PREPARING→READY→PARTIALLY_HANDED_OVER→HANDED_OVER / CANCELLED / CLOSED_PARTIAL
    - PKG: OPEN→SEALED→HANDED_OVER / INVALIDATED / VOIDED
    - 인계 fence: AuthorizePackageHandover → HANDOVER_IN_PROGRESS(handoverAuthorizationId, fenceVersion) → CommitPackageHandover → mfc-inventory 커밋 → HANDED_OVER.
      WorkStopResult와 PackageHandedOver는 같은 packageId에 상호 배타. fence 만료는 취소 성공이 아니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: work-orders, description: 서비스 간 작업 요청·중지 (orchestration) }
  - { name: tasks, description: 점원 단말 피킹/패킹 실행 }
  - { name: shipments, description: 출하 단위·포장·QR }
  - { name: handovers, description: 라이더 QR 인계 fence }

paths:
  /internal/work-orders:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] ConfirmOrder — 작업 요청 수락/거절 (재전달 시 중복 생성 없음)'
      description: |
        확정 주문의 이행 계획(shipments)을 받아 출고마다 PICK(READY, 예약 주문은 슬롯 시작 N분 전) + PACK(WAITING) Task 를 만든다
        (docs/business/flows/order-checkout-saga.md §2.0, 슬라이스 6a 2026-11-07). 작업자 배정·DISPATCH 는 6a 범위 밖.
        결정은 응답 본문 WorkOrderDecision 이다 — 업무 거절도 201 + decision REJECTED 로 준다(같은 키 재전송 때 같은 결정을 재생).
        - 작업 버전(workVersion): 주문 하나에 작업 지시(fulfillmentId) 하나, 요청마다 버전 하나. 첫 요청 1, 거절 뒤 재시도는 이전보다 큰 값.
          같은 orderId·같은 workVersion 재전달은 기존 결정을 돌려준다. 이미 접수된 주문에 새 버전이 오거나
          마지막 버전보다 작은 값이 오면 409 INVALID_STATE.
        - 거절 사유(WorkRejectReason): INVENTORY_MISMATCH(재고 예약이 확정 상태로 요청 수량을 덮지 못함 — mfc-inventory 예약 조회),
          OPERATION_RESTRICTED(센터 운영 중단), CAPACITY_EXCEEDED, LOT_INELIGIBLE, ALREADY_STOPPED(주문 전체가 이미 중지됨).
          retryable 은 같은 MFC 재시도 대상(INVENTORY_MISMATCH·OPERATION_RESTRICTED, D6-5)인지다.
        - 이미 부분 중지(order_work_stop)된 주문은 남은 수량만 작업으로 만든다.
        - 예약 주문 PICK 준비 시각 = arrivalWindow.start − 센터 운영 설정 N분. 설정이 없는 센터는 작업은 접수하고 PICK 만 WAITING(holdReason CONFIG_REQUIRED).
        WorkAccepted / WorkRejected(토픽 mfc.fulfillment.v1)를 결정과 한 트랜잭션으로 발행한다. 상품준비(PreparationStarted)는 첫 피킹 시작 때(6b).
      operationId: confirmOrder
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOrderRequest' }
      responses:
        '201':
          description: 결정 (ACCEPTED — fulfillmentId·작업 ID / REJECTED — rejectReason·retryable)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrderDecision' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: DEPENDENCY_UNAVAILABLE (mfc-inventory 예약 조회 불가 — 결정을 기록하지 않았다. 같은 키로 재전송)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    get:
      tags: [work-orders]
      summary: 주문 ID 로 작업 지시 조회 (마지막 작업 버전 기준)
      x-added-in: '2026-11-07'
      operationId: findWorkOrderByOrder
      parameters:
        - { name: orderId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}:
    get:
      tags: [work-orders]
      summary: 작업 요청 조회 (Task·Shipment·Package 상태 요약)
      operationId: getWorkOrder
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}/stop-requests:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] StopWork — 취소 접수에 따른 작업 중지, 포장별 판정 회신'
      description: |
        포장별로 STOPPED / HANDOVER_IN_PROGRESS / HANDED_OVER 를 판정한다(S3-a).
        HANDOVER_IN_PROGRESS 포장은 fence 결과를 기다려 GET …/stop-requests/{stopRequestId} 로 재조회한다.
        취소 접수시각은 우선순위 근거가 아니다. 같은 stopRequestId 재전송은 기존 판정을 반환한다.
      operationId: stopWork
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopRequestId, orderId, scope]
              properties:
                stopRequestId: { type: string, description: claim-service 발급 }
                orderId: { type: string }
                scope: { type: string, enum: [FULL, PARTIAL] }
                lines:
                  type: array
                  description: PARTIAL 시 대상 행
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 포장별 판정 (즉시 확정 가능 분)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/work-orders/{fulfillmentId}/stop-requests/{stopRequestId}:
    get:
      tags: [work-orders]
      summary: 중지 요청 판정 재조회 (fence 대기 중·응답 불명 해소)
      operationId: getStopRequest
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/stop-requests:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] StopWork (주문 단위) — 작업 지시 ID 를 모르는 취소(S3-a)'
      description: |
        orchestration 이 주문 ID 로 중지를 요청한다(작업 지시가 아직 없거나 fulfillmentId 를 모를 때). 판정은 …/work-orders/{fulfillmentId}/stop-requests 와 같다.
        작업 지시가 없는 주문은 요청 수량 전부 STOPPED(notStartedLines)로 확정하고 **중지 기록을 남긴다** — 이후 같은 주문의 작업 요청(ConfirmOrder)은
        중지된 수량을 빼고 받는다(슬라이스 6). 같은 stopRequestId 재전송은 기존 판정을 반환한다(다른 본문이면 409 IDEMPOTENCY_CONFLICT).
        판정 결과는 WorkStopResult(토픽 mfc.fulfillment.v1)로도 발행한다.
      operationId: stopOrderWork
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopRequestId, orderId, scope, lines]
              properties:
                stopRequestId: { type: string, description: claim-service 발급 }
                orderId: { type: string }
                claimId: { type: string }
                scope: { type: string, enum: [FULL, PARTIAL] }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 판정 (state RESOLVED 면 확정, PENDING 이면 GET 으로 재조회)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /internal/stop-requests/{stopRequestId}:
    get:
      tags: [work-orders]
      summary: 주문 단위 중지 요청 판정 재조회
      operationId: getOrderStopRequest
      parameters:
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /tasks:
    get:
      tags: [tasks]
      summary: 점원 단말 작업 목록 (내 작업·유형·상태 필터)
      description: |
        pmart-clients BR-05. MFC-business-logic §2-2 Task, WK-01~05, 단말 표시 항목(:1183).
        assignee=me 는 인증된 작업자 주체로 해석한다(작업자 로그인 방식은 BR-02 결정 대기).
        목록의 담당자는 mfc-capacity 배정 정본(AssignmentPublished)의 fulfillment 투영이며, 응답 asOf 가 투영 기준시각이다.
        투영은 늦을 수 있으므로 시작 가능 여부는 POST …/starts 판정만 믿는다.
        정렬은 생성시각 오름차순의 표시 정렬이며 실행 우선순위가 아니다(우선순위는 Q-08 결정 대기, :866).
      x-added-in: '2026-10-24'
      operationId: listTasks
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - name: assignee
          in: query
          description: 현재는 me 만 지원
          schema: { type: string, enum: [me] }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/TaskType' } }
        - name: state
          in: query
          description: 여러 값은 반복 파라미터. 생략 시 ASSIGNED, IN_PROGRESS (화면 기본값)
          style: form
          explode: true
          schema: { type: array, items: { $ref: '#/components/schemas/TaskState' } }
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TaskSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /tasks/{taskId}:
    get:
      tags: [tasks]
      summary: 작업 상세 (지시 행·확정·잔량·담당 버전)
      description: |
        pmart-clients BR-05. 행 정의는 MFC-business-logic §2-2 TaskLine(계획 = 확정완료 + 승인취소 + 잔량).
        수량은 이 서비스의 작업 실적 기준이며 재고 수량 정본은 mfc-inventory 이다. 완료 표시는 서버 확정(실행 결과 APPLIED) 후에만 한다.
        재고 확정 대기는 업무 진행 상태와 별도 필드다(:808) — 행의 pendingQty, 상세의 pendingExecutions.
      x-added-in: '2026-10-24'
      operationId: getTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /tasks/{taskId}/starts:
    post:
      tags: [tasks]
      summary: 작업 시작 점유 (WK-03, ASSIGNED→IN_PROGRESS, 한 요청만 성공)
      description: |
        pmart-clients BR-05. WK-03 "시작 점유 한 요청만 성공", TC-11(동일 작업 시작 2건 경합 → 활성 시작 1건).
        사전 조건은 유효 담당·최신 버전·선행 완료·허용 상태(ASSIGNED, 또는 WK-05 재개로 ASSIGNED 복귀한 작업)이다.
        유효 담당은 투영이 아니라 mfc-capacity GET /assignments?taskId= 동기 조회로 판정한다(1 hop). 조회 불가면 503 으로 거절하고 시작하지 않는다.
        옛 배정 버전 요청은 VERSION_CONFLICT 이며 details 로 assignmentVersion / taskVersion 을 구분한다(:928).
        본문 workerId 가 인증 문맥의 작업자와 다르면 403 이다.
        판정 순서는 담당 조회 → 판정 기록이다. 담당 조회가 실패하면 아무것도 기록하지 않고 503 DEPENDENCY_UNAVAILABLE 을 반환한다(시작 안 됨 확정).
        이 명령은 UNKNOWN_RESULT 를 반환하지 않는다. 결과가 불명인 경우는 응답을 받지 못한 경우(타임아웃·연결 끊김)뿐이다.
        같은 Idempotency-Key 재전송은 기록된 판정(STARTED/REJECTED)을 반환한다. 503 은 기록되지 않으므로 같은 키 재전송은 처음부터 다시 판정한다.
        응답을 받지 못하면 같은 키로 재전송하는 것이 기본 확정 방법이다. GET …/starts/{requestId} 는 조회 전용 보조 수단이다.
        같은 키의 앞선 요청이 아직 처리 중이면 409 IDEMPOTENCY_CONFLICT(retryable=true)이며, 잠시 뒤 같은 키로 다시 보낸다.
        같은 키에 다른 본문이면 409 IDEMPOTENCY_CONFLICT(retryable=false)이다.
        키를 잃었으면 GET /tasks/{taskId} 의 activeStart 로 본인 시작 여부를 확인한다(새 키 재시작은 ALREADY_STARTED).
        성공 시 Task 는 IN_PROGRESS 가 되고 TaskProgressed 를 발행한다(새 이벤트 없음).
        Q-09 결정 전 잠정: 시작 점유는 자동 만료하지 않는다. 점유는 실행 완료·WK-04 종결(BLOCKED/FAILED/CANCELLED/CLOSED_PARTIAL)·WK-05 재배정으로 끝난다.
      x-added-in: '2026-10-24'
      operationId: startTask
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workerId, assignmentVersion]
              properties:
                workerId: { type: string, description: 인증 문맥의 작업자와 대조한다 }
                assignmentVersion: { type: integer, minimum: 0 }
                deviceId: { type: string, description: PDA 식별자 }
      responses:
        '201':
          description: 시작 점유 성공 (status APPLIED, version = Task 새 버전)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: ALREADY_STARTED (다른 시작 점유가 이미 성공) / NOT_ASSIGNEE (활성 담당자 불일치) / PREDECESSOR_NOT_COMPLETED / INVALID_STATE / VERSION_CONFLICT / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503':
          description: DEPENDENCY_UNAVAILABLE (mfc-capacity 배정 조회 불가). 판정을 기록하지 않았으므로 시작 안 됨이 확정이다. 같은 키로 재전송할 수 있다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /tasks/{taskId}/starts/{requestId}:
    get:
      tags: [tasks]
      summary: 시작 점유 판정 조회 (requestId = Idempotency-Key)
      description: |
        요청한 작업자 본인과 같은 센터 권한자만 조회할 수 있다.
        기록된 판정(STARTED/REJECTED)만 조회된다. 503 으로 끝난 요청, 서버에 도달하지 않은 요청, 아직 처리 중인 요청은 모두 404 이다.
        따라서 404 만으로 시작 안 됨을 확정하지 않는다. 같은 Idempotency-Key 로 재전송해 판정을 받는다.
      x-added-in: '2026-10-24'
      operationId: getTaskStart
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskStart' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404':
          description: 기록된 판정 없음 (미도달·503·처리 중). 시작 안 됨의 확정이 아니다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /tasks/{taskId}/executions:
    post:
      tags: [tasks]
      summary: 점원 피킹/패킹 실행 결과 등록 (결품·파손·차단 보고 포함)
      description: |
        수량 반영은 mfc-inventory.CommitTaskExecution 으로 요청하고 commitId를 받는다. 자체 사본으로 성공 판단 금지.
        shortage 가 있으면 LineShortageReported 발행(Task → BLOCKED 또는 CLOSED_PARTIAL). reason DAMAGED 는 quality가 구독.
      operationId: recordTaskExecution
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExecutionRequest' }
      responses:
        '202':
          description: 접수 (resultId = executionId, nextAction QUERY_RESULT 가능)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (Task가 ASSIGNED/IN_PROGRESS 아님) / NOT_ASSIGNEE (활성 담당자 불일치) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /tasks/{taskId}/executions/{executionId}:
    get:
      tags: [tasks]
      summary: 실행 결과 조회 (inventory 반영 상태·commitId)
      operationId: getTaskExecution
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: executionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskExecution' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /shipments/{shipmentId}:
    get:
      tags: [shipments]
      summary: 출하 단위 조회 (Task·Package·fence·ETA 투영)
      operationId: getShipment
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /shipments/{shipmentId}/packages:
    post:
      tags: [shipments]
      summary: 포장 밀봉 (OPEN→SEALED) → 포장 QR 발급, PackingFinished
      description: 포장 내용(PackageContent)·봉투 수·주류 여부·부피/무게를 기록한다. 모든 포장이 SEALED 되면 ShipmentReady 발행(배차 요청 정보 포함).
      operationId: sealPackage
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SealPackageRequest' }
      responses:
        '201':
          description: 포장 생성·QR 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE (Shipment CANCELLED/HANDED_OVER) / CONTENT_MISMATCH (패킹 완료 수량 초과)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}:
    get:
      tags: [shipments]
      summary: 포장 조회 (상태·버전·QR·fence)
      operationId: getPackage
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/{packageId}/handover-authorizations:
    post:
      tags: [handovers]
      summary: AuthorizePackageHandover — 라이더 QR 스캔, fence HANDOVER_IN_PROGRESS 개시
      description: |
        배정 라이더·배송번호·포장번호 일치, 기인계·무효 라벨·제한 라이더·중지 확정 포장을 검사한다.
        성공 시 handoverAuthorizationId·fenceVersion·fenceExpiresAt 발급. 만료 후 재스캔 필요(만료 ≠ 취소 성공).
      operationId: authorizePackageHandover
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId, deliveryId, scannedCode]
              properties:
                riderId: { type: string }
                deliveryId: { type: string }
                scannedCode: { type: string, description: QR 원문 (packageId + packageVersion) }
                scannedAt: { type: string, format: date-time }
      responses:
        '201':
          description: fence 개시
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverAuthorization' }
        '403':
          description: FORBIDDEN (배정 라이더 불일치·제한 라이더)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (중지 확정·SEALED 아님) / ALREADY_HANDED_OVER / PACKAGE_INVALIDATED (구 라벨) / DELIVERY_MISMATCH (타 주문·타 배송) / FENCE_ACTIVE (다른 승인 진행 중)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}/handover-commits:
    post:
      tags: [handovers]
      summary: CommitPackageHandover — mfc-inventory 커밋 후 HANDED_OVER, PackageHandedOver 발행
      description: |
        fence 유효(handoverAuthorizationId·fenceVersion 일치, 미만료)를 확인한 뒤 mfc-inventory.CommitPackageHandover 를 호출한다(2 hop).
        inventory 응답 불명이면 UNKNOWN_RESULT 로 응답하고 fence 유지. 호출자는 GET …/handover-resolution 으로 해소한다.
      operationId: commitPackageHandover
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoverAuthorizationId, fenceVersion, riderId]
              properties:
                handoverAuthorizationId: { type: string }
                fenceVersion: { type: integer, minimum: 0 }
                riderId: { type: string }
                handedOverAt: { type: string, format: date-time }
      responses:
        '201':
          description: 인계 확정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverCommitResult' }
        '409':
          description: INVALID_STATE (fence 없음·만료) / FENCE_VERSION_MISMATCH / ALREADY_HANDED_OVER
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /packages/{packageId}/handover-resolution:
    get:
      tags: [handovers]
      summary: QueryHandoverResolution — 포장 인계 판정 조회 (stopRequest·fence·inventory commit 결합)
      operationId: getHandoverResolution
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResolution' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/{packageId}/repackings:
    post:
      tags: [shipments]
      summary: 재포장 — 새 Package 버전 발급, 구 라벨 INVALIDATED (PackageInvalidated)
      description: 인계 전(SEALED)만 가능. 재포장 후 구 QR 스캔은 PACKAGE_INVALIDATED 로 거절된다.
      operationId: repackPackage
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [DAMAGED_BAG, CONTENT_CHANGE, LABEL_UNREADABLE, SHORTAGE_ADJUST] }
                contents:
                  type: array
                  description: 변경된 내용물. 생략 시 기존 내용 유지
                  items: { $ref: '#/components/schemas/PackageContentLine' }
      responses:
        '201':
          description: 새 Package (packageVersion+1, 새 QR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE (HANDED_OVER / fence 진행 중)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    TaskState:
      type: string
      enum: [WAITING, READY, ASSIGNED, IN_PROGRESS, COMPLETED, BLOCKED, FAILED, CANCELLED, CLOSED_PARTIAL]
    TaskType:
      type: string
      enum: [PICK, PACK, DISPATCH]
    TaskAssignment:
      type: object
      description: mfc-capacity 배정 정본의 투영
      properties:
        workerId: { type: [string, 'null'] }
        assignmentVersion: { type: integer }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    TaskSummary:
      type: object
      properties:
        taskId: { type: string }
        taskType: { $ref: '#/components/schemas/TaskType' }
        state: { $ref: '#/components/schemas/TaskState' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        fulfillmentId: { type: string }
        shipmentId: { type: [string, 'null'] }
        assignment: { $ref: '#/components/schemas/TaskAssignment' }
        lineCount: { type: integer }
        plannedQty: { type: integer }
        completedQty: { type: integer }
        remainingQty: { type: integer }
        promisedReadyAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    TaskLine:
      type: object
      required: [taskLineId, orderLineId, sku, plannedQty, completedQty, cancelledQty, remainingQty]
      properties:
        taskLineId: { type: string }
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productName: { type: string, description: 표시용 사본 }
        barcode: { type: [string, 'null'], description: 필수 스캔 대조값 }
        locationId:
          type: [string, 'null']
          description: 지시 로케이션 (예 B04-02-205). PACK·DISPATCH 는 null 일 수 있음
        lotId:
          type: [string, 'null']
          description: 예약 로트. 다른 로트 집품은 실적 차단(IV-07)
        expiresOn: { type: [string, 'null'], format: date, description: 로트 유통기한 (Asia/Seoul) }
        picks:
          type: array
          description: |
            PICK 지시(0.2.0) — 한 줄이 여러 LOT 예약 조각으로 나뉠 수 있어(줄당 LOT 수 제한 없음) LOT 마다 남은 집품량과 선반 위치 후보.
            locationId·lotId·expiresOn 은 첫 지시의 사본. 재고 조회가 안 되면 빈 배열(asOf freshness STALE).
          items:
            type: object
            properties:
              lotId: { type: string }
              expiresOn: { type: [string, 'null'], format: date }
              remainingQty: { type: integer, description: 이 LOT 조각에서 더 집을 양 }
              locations:
                type: array
                items:
                  type: object
                  properties:
                    locationCode: { type: string }
                    qty: { type: integer, description: 그 위치의 LOT 선반 잔량(이 주문 몫만이 아님) }
        plannedQty: { type: integer }
        completedQty: { type: integer, description: 서버 확정 실적 }
        cancelledQty: { type: integer, description: 승인 취소 }
        remainingQty: { type: integer, description: 계획 - 확정 - 취소 }
        pendingQty:
          type: integer
          description: 접수됐지만 재고 확정 대기인 실적 (remainingQty 에 아직 반영 안 됨)
    TaskActiveStart:
      type: object
      description: 성공한 시작 점유. IN_PROGRESS 일 때만 응답에 포함
      properties:
        requestId: { type: string }
        workerId: { type: string }
        deviceId: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
    TaskPendingExecution:
      type: object
      properties:
        executionId: { type: string }
        state: { type: string, enum: [RECORDED, INVENTORY_PENDING, UNKNOWN_RESULT] }
        recordedAt: { type: string, format: date-time }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          properties:
            lines: { type: array, items: { $ref: '#/components/schemas/TaskLine' } }
            activeStart: { $ref: '#/components/schemas/TaskActiveStart' }
            pendingExecutions:
              type: array
              description: 재고 확정 전 실행 결과. 상세는 GET …/executions/{executionId}
              items: { $ref: '#/components/schemas/TaskPendingExecution' }
            blockReason: { type: [string, 'null'] }
            packingLocations:
              type: array
              description: PACK — 이 출고의 집품분이 놓인 포장 위치(PICK 실적의 도착지, 0.2.0)
              items: { type: string }
            asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    TaskStart:
      type: object
      properties:
        requestId: { type: string }
        taskId: { type: string }
        outcome: { type: string, enum: [STARTED, REJECTED] }
        rejectCode:
          type: [string, 'null']
          description: ALREADY_STARTED / NOT_ASSIGNEE / PREDECESSOR_NOT_COMPLETED / INVALID_STATE / VERSION_CONFLICT
        workerId: { type: string }
        assignmentVersion: { type: integer }
        taskVersion: { type: integer }
        decidedAt: { type: string, format: date-time }
    ShipmentState:
      type: string
      enum: [PREPARING, READY, PARTIALLY_HANDED_OVER, HANDED_OVER, CANCELLED, CLOSED_PARTIAL]
    PackageState:
      type: string
      enum: [OPEN, SEALED, HANDED_OVER, INVALIDATED, VOIDED]
    FenceState:
      type: string
      enum: [NONE, HANDOVER_IN_PROGRESS, COMMITTED, EXPIRED]
    PackageContentLine:
      type: object
      required: [orderLineId, sku, qty]
      properties:
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
    ConfirmOrderRequest:
      type: object
      required: [orderId, mfcId, reservationId, shipments]
      properties:
        orderId: { type: string }
        orderVersion: { type: integer }
        workVersion: { type: integer, minimum: 1, default: 1, description: '작업 버전(2026-11-07 추가). 첫 요청 1, 같은 MFC 재시도마다 1씩 증가' }
        sagaId: { type: string, description: '요청한 orchestration 사가(2026-11-07 추가, 추적용)' }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        reservationId: { type: string }
        capacityHoldId: { type: string }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        outOfStockPreference: { type: string, description: '고객 사전 선택(결품 처리, 2026-11-07 추가) — OrderConfirmed 사본' }
        arrivalWindow:
          type: object
          description: '도착 희망 시간대(2026-11-07 추가, OrderConfirmed 사본). 예약 주문 PICK 준비 시각의 기준(start − N분)'
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        promisedReadyAt: { type: string, format: date-time, description: 예약배달은 슬롯 기준 준비 완료 목표 }
        shipments:
          type: array
          minItems: 1
          description: '출고 단위. 6a 는 주문당 1개(D6-2)'
          items:
            type: object
            required: [shipmentId, lines]
            properties:
              shipmentId: { type: string, description: order-service 이행 계획의 shipmentId }
              deliveryId: { type: string }
              weightG: { type: integer }
              lines:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/ConfirmOrderLine' }
    ConfirmOrderLine:
      type: object
      description: '출고 행(2026-11-07 — PackageContentLine 에 단말 표시용 사본을 더함)'
      required: [orderLineId, sku, qty]
      properties:
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
        productName: { type: string, description: '주문 당시 상품명 사본(PDA 표시)' }
        unitsPerSku: { type: integer, minimum: 1 }
        weightG: { type: integer, minimum: 0, description: 행 전체 중량 }
    WorkRejectReason:
      type: string
      description: |
        작업 거절 사유(2026-11-07). retryable(같은 MFC 재시도 대상, D6-5) = INVENTORY_MISMATCH·OPERATION_RESTRICTED.
        CAPACITY_EXCEEDED·LOT_INELIGIBLE·ALREADY_STOPPED 는 재시도하지 않는다.
      enum: [INVENTORY_MISMATCH, OPERATION_RESTRICTED, CAPACITY_EXCEEDED, LOT_INELIGIBLE, ALREADY_STOPPED]
    WorkOrderDecision:
      type: object
      description: 'ConfirmOrder 결정(2026-11-07)'
      required: [orderId, workVersion, decision, decidedAt]
      properties:
        fulfillmentId: { type: string }
        orderId: { type: string }
        workVersion: { type: integer }
        decision: { type: string, enum: [ACCEPTED, REJECTED] }
        rejectReason: { $ref: '#/components/schemas/WorkRejectReason' }
        retryable: { type: boolean, description: 'REJECTED 일 때 같은 MFC 재시도 대상인지' }
        message: { type: string }
        shipmentIds: { type: array, items: { type: string } }
        taskIds: { type: array, items: { type: string } }
        decidedAt: { type: string, format: date-time }
    WorkOrder:
      type: object
      properties:
        fulfillmentId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        workVersion: { type: integer, description: '마지막 작업 버전(2026-11-07 추가)' }
        acceptance: { type: string, enum: [ACCEPTED, REJECTED] }
        rejectReason: { $ref: '#/components/schemas/WorkRejectReason' }
        preparationStartedAt: { type: [string, 'null'], format: date-time }
        tasks:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string }
              taskType: { type: string, enum: [PICK, PACK, DISPATCH] }
              state: { $ref: '#/components/schemas/TaskState' }
              shipmentId: { type: string }
              readyAt: { type: [string, 'null'], format: date-time, description: 'PICK 준비 시각(2026-11-07 추가). 예약 주문은 슬롯 시작 − N분' }
              holdReason: { type: [string, 'null'], description: 'WAITING 사유(2026-11-07 추가). CONFIG_REQUIRED = 센터 준비 시각 설정 없음' }
              assigneeId: { type: string }
              assignmentVersion: { type: integer }
              plannedQty: { type: integer }
              completedQty: { type: integer }
              cancelledQty: { type: integer }
              remainingQty: { type: integer, description: 계획 = 완료 + 취소 + 잔량 }
        shipments: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
    StopRequestResult:
      type: object
      properties:
        stopRequestId: { type: string }
        fulfillmentId: { type: string }
        orderId: { type: string }
        state: { type: string, enum: [PENDING, RESOLVED, UNKNOWN] }
        notStartedLines:
          type: array
          description: 작업 지시가 생기기 전에 중지된 수량(포장 없음 — 전부 STOPPED)
          items:
            type: object
            properties:
              orderLineId: { type: string }
              qty: { type: integer }
        packages:
          type: array
          items:
            type: object
            properties:
              packageId: { type: string }
              shipmentId: { type: string }
              verdict: { type: string, enum: [STOPPED, HANDOVER_IN_PROGRESS, HANDED_OVER] }
              fenceVersion: { type: integer }
              fenceExpiresAt: { type: [string, 'null'], format: date-time }
              inventoryCommitId: { type: [string, 'null'], description: HANDED_OVER 시 재고 commitId }
              stoppedLines:
                type: array
                items:
                  type: object
                  properties:
                    orderLineId: { type: string }
                    qty: { type: integer }
                    workStateAtStop: { type: string, enum: [NOT_PICKED, PICKED, PACKED] }
        resolvedAt: { type: string, format: date-time }
    TaskExecutionRequest:
      type: object
      required: [executionType, workerId, lines]
      properties:
        executionType: { type: string, enum: [PICK, PACK], description: '0.2.0: PICK 만. PACK 실적은 포장 밀봉(POST /shipments/{id}/packages)으로 — PACK 은 422' }
        workerId: { type: string }
        assignmentVersion: { type: integer }
        fromLocation: { type: string, description: PICK — 집은 선반 위치(한 실행 = 한 선반) }
        toLocation: { type: string, description: PICK — 내려놓은 포장 위치(구역 PACKING) }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, sku, pickedQty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              pickedQty: { type: integer, minimum: 0 }
              shortage:
                type: object
                description: 결품·파손·차단 보고 (pickedQty < 계획량일 때)
                properties:
                  qty: { type: integer, minimum: 1 }
                  reason: { type: string, enum: [SHORT, DAMAGED, BLOCKED] }
                  note: { type: string, maxLength: 200 }
                  evidenceRef: { type: string }
        durationSec: { type: integer, description: 패킹 소요시간 }
    TaskExecution:
      type: object
      properties:
        executionId: { type: string }
        taskId: { type: string }
        state: { type: string, enum: [RECORDED, INVENTORY_PENDING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        appliedQty: { type: integer }
        shortages:
          type: array
          items:
            type: object
            properties:
              orderLineId: { type: string }
              qty: { type: integer }
              reason: { type: string, enum: [SHORT, DAMAGED, BLOCKED] }
        recordedAt: { type: string, format: date-time }
    SealPackageRequest:
      type: object
      required: [contents, bagCount]
      properties:
        packingLocation: { type: string, description: '포장 위치. 없으면 이 출고 집품분의 포장 위치가 하나일 때 그 위치(0.2.0)' }
        contents:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PackageContentLine' }
        bagCount: { type: integer, minimum: 0 }
        containsAlcohol: { type: boolean }
        temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
        weightG: { type: integer, minimum: 0 }
        volumeCm3: { type: integer, minimum: 0 }
        packedBy: { type: string }
    Package:
      type: object
      properties:
        packageId: { type: string }
        packageVersion: { type: integer, description: 재포장마다 증가. QR에 포함 }
        shipmentId: { type: string }
        orderId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/PackageState' }
        qrCode: { type: string }
        contents: { type: array, items: { $ref: '#/components/schemas/PackageContentLine' } }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        temperatureZone: { type: string }
        weightG: { type: integer }
        fence:
          type: object
          properties:
            state: { $ref: '#/components/schemas/FenceState' }
            handoverAuthorizationId: { type: [string, 'null'] }
            fenceVersion: { type: integer }
            riderId: { type: [string, 'null'] }
            expiresAt: { type: [string, 'null'], format: date-time }
        sealedAt: { type: [string, 'null'], format: date-time }
        handedOverAt: { type: [string, 'null'], format: date-time }
        invalidatedReason: { type: [string, 'null'] }
    Shipment:
      type: object
      properties:
        shipmentId: { type: string }
        fulfillmentId: { type: string }
        orderId: { type: string }
        deliveryId: { type: [string, 'null'] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/ShipmentState' }
        holdReason: { type: [string, 'null'] }
        packages: { type: array, items: { $ref: '#/components/schemas/Package' } }
        packingDurationSec: { type: integer }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        weightG: { type: integer }
        volumeCm3: { type: integer }
        readyAt: { type: [string, 'null'], format: date-time }
        riderEta:
          type: object
          description: 점원 화면용 ETA 투영 (delivery 사본)
          properties:
            eta: { type: string, format: date-time }
            asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    HandoverAuthorization:
      type: object
      properties:
        handoverAuthorizationId: { type: string }
        packageId: { type: string }
        packageVersion: { type: integer }
        fenceVersion: { type: integer }
        riderId: { type: string }
        deliveryId: { type: string }
        fenceExpiresAt: { type: string, format: date-time }
        authorizedAt: { type: string, format: date-time }
    HandoverCommitResult:
      type: object
      required: [status, handoverId]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        handoverId: { type: string, description: HandoverFact ID }
        inventoryCommitId: { type: [string, 'null'], description: mfc-inventory commitId. UNKNOWN_RESULT 시 null }
        packageState: { $ref: '#/components/schemas/PackageState' }
        shipmentState: { $ref: '#/components/schemas/ShipmentState' }
        handedOverAt: { type: string, format: date-time }
        nextAction: { type: string }
    HandoverResolution:
      type: object
      properties:
        packageId: { type: string }
        packageVersion: { type: integer }
        packageState: { $ref: '#/components/schemas/PackageState' }
        verdict: { type: string, enum: [STOPPED, HANDOVER_IN_PROGRESS, HANDED_OVER, UNKNOWN] }
        fence:
          type: object
          properties:
            state: { $ref: '#/components/schemas/FenceState' }
            handoverAuthorizationId: { type: [string, 'null'] }
            fenceVersion: { type: integer }
            expiresAt: { type: [string, 'null'], format: date-time }
        handoverId: { type: [string, 'null'] }
        inventoryCommitId: { type: [string, 'null'] }
        inventoryApplyStatus: { type: string, enum: [NOT_REQUESTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        stopRequestId: { type: [string, 'null'] }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
