openapi: 3.1.0
info:
  title: mfc-fulfillment-service
  version: 0.1.0
  description: |
    MFC 작업(PICK/PACK/DISPATCH Task)·Shipment·Package·HandoverFact·**인계 fence**의 정본. (docs/architecture/service-map.md §5, ADR-0006)
    비정본: 수량(mfc-inventory), 취소 판단(order-orchestration/claim), 배차(delivery-dispatch), 작업자 배정 정본(mfc-capacity), 주문 상태(order).

    상태 기계
    - TSK: WAITING→READY→ASSIGNED→IN_PROGRESS→COMPLETED / BLOCKED / FAILED / CANCELLED / CLOSED_PARTIAL (계획 = 완료 + 취소 + 잔량)
    - SHP: PREPARING→READY→PARTIALLY_HANDED_OVER→HANDED_OVER / CANCELLED / CLOSED_PARTIAL
    - PKG: OPEN→SEALED→HANDED_OVER / INVALIDATED / VOIDED
    - 인계 fence: AuthorizePackageHandover → HANDOVER_IN_PROGRESS(handoverAuthorizationId, fenceVersion) → CommitPackageHandover → mfc-inventory 커밋 → HANDED_OVER.
      WorkStopResult와 PackageHandedOver는 같은 packageId에 상호 배타. fence 만료는 취소 성공이 아니다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: work-orders, description: 서비스 간 작업 요청·중지 (orchestration) }
  - { name: tasks, description: 점원 단말 피킹/패킹 실행 }
  - { name: shipments, description: 출하 단위·포장·QR }
  - { name: handovers, description: 라이더 QR 인계 fence }

paths:
  /internal/work-orders:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] ConfirmOrder — 작업 요청 수락/거절 (재전달 시 중복 생성 없음)'
      description: |
        확정 주문의 이행 계획(shipments)을 받아 PICK/PACK Task를 생성한다. 응답은 WorkAccepted(APPLIED) 또는 WorkRejected(REJECTED).
        같은 orderId 재전달은 기존 fulfillmentId를 반환한다. 준비 시작 시 PreparationStarted 발행(→ order 상품준비).
      operationId: confirmOrder
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmOrderRequest' }
      responses:
        '201':
          description: WorkAccepted (resultId = fulfillmentId) / WorkRejected (status REJECTED, nextAction)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: WORK_REJECTED (OPERATION_RESTRICTED 접수 중지 / RESERVATION_BLOCKED / CAPACITY_EXCEEDED)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/work-orders/{fulfillmentId}:
    get:
      tags: [work-orders]
      summary: 작업 요청 조회 (Task·Shipment·Package 상태 요약)
      operationId: getWorkOrder
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/work-orders/{fulfillmentId}/stop-requests:
    post:
      tags: [work-orders]
      summary: '[orchestration→fulfillment] StopWork — 취소 접수에 따른 작업 중지, 포장별 판정 회신'
      description: |
        포장별로 STOPPED / HANDOVER_IN_PROGRESS / HANDED_OVER 를 판정한다(S3-a).
        HANDOVER_IN_PROGRESS 포장은 fence 결과를 기다려 GET …/stop-requests/{stopRequestId} 로 재조회한다.
        취소 접수시각은 우선순위 근거가 아니다. 같은 stopRequestId 재전송은 기존 판정을 반환한다.
      operationId: stopWork
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stopRequestId, orderId, scope]
              properties:
                stopRequestId: { type: string, description: claim-service 발급 }
                orderId: { type: string }
                scope: { type: string, enum: [FULL, PARTIAL] }
                lines:
                  type: array
                  description: PARTIAL 시 대상 행
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 포장별 판정 (즉시 확정 가능 분)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/work-orders/{fulfillmentId}/stop-requests/{stopRequestId}:
    get:
      tags: [work-orders]
      summary: 중지 요청 판정 재조회 (fence 대기 중·응답 불명 해소)
      operationId: getStopRequest
      parameters:
        - { name: fulfillmentId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopRequestResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /tasks/{taskId}/executions:
    post:
      tags: [tasks]
      summary: 점원 피킹/패킹 실행 결과 등록 (결품·파손·차단 보고 포함)
      description: |
        수량 반영은 mfc-inventory.CommitTaskExecution 으로 요청하고 commitId를 받는다. 자체 사본으로 성공 판단 금지.
        shortage 가 있으면 LineShortageReported 발행(Task → BLOCKED 또는 CLOSED_PARTIAL). reason DAMAGED 는 quality가 구독.
      operationId: recordTaskExecution
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExecutionRequest' }
      responses:
        '202':
          description: 접수 (resultId = executionId, nextAction QUERY_RESULT 가능)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (Task가 ASSIGNED/IN_PROGRESS 아님) / NOT_ASSIGNEE (활성 담당자 불일치) / VERSION_CONFLICT
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /tasks/{taskId}/executions/{executionId}:
    get:
      tags: [tasks]
      summary: 실행 결과 조회 (inventory 반영 상태·commitId)
      operationId: getTaskExecution
      parameters:
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: executionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskExecution' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /shipments/{shipmentId}:
    get:
      tags: [shipments]
      summary: 출하 단위 조회 (Task·Package·fence·ETA 투영)
      operationId: getShipment
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Shipment' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /shipments/{shipmentId}/packages:
    post:
      tags: [shipments]
      summary: 포장 밀봉 (OPEN→SEALED) → 포장 QR 발급, PackingFinished
      description: 포장 내용(PackageContent)·봉투 수·주류 여부·부피/무게를 기록한다. 모든 포장이 SEALED 되면 ShipmentReady 발행(배차 요청 정보 포함).
      operationId: sealPackage
      parameters:
        - { name: shipmentId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SealPackageRequest' }
      responses:
        '201':
          description: 포장 생성·QR 발급
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE (Shipment CANCELLED/HANDED_OVER) / CONTENT_MISMATCH (패킹 완료 수량 초과)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}:
    get:
      tags: [shipments]
      summary: 포장 조회 (상태·버전·QR·fence)
      operationId: getPackage
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/{packageId}/handover-authorizations:
    post:
      tags: [handovers]
      summary: AuthorizePackageHandover — 라이더 QR 스캔, fence HANDOVER_IN_PROGRESS 개시
      description: |
        배정 라이더·배송번호·포장번호 일치, 기인계·무효 라벨·제한 라이더·중지 확정 포장을 검사한다.
        성공 시 handoverAuthorizationId·fenceVersion·fenceExpiresAt 발급. 만료 후 재스캔 필요(만료 ≠ 취소 성공).
      operationId: authorizePackageHandover
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [riderId, deliveryId, scannedCode]
              properties:
                riderId: { type: string }
                deliveryId: { type: string }
                scannedCode: { type: string, description: QR 원문 (packageId + packageVersion) }
                scannedAt: { type: string, format: date-time }
      responses:
        '201':
          description: fence 개시
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverAuthorization' }
        '403':
          description: FORBIDDEN (배정 라이더 불일치·제한 라이더)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (중지 확정·SEALED 아님) / ALREADY_HANDED_OVER / PACKAGE_INVALIDATED (구 라벨) / DELIVERY_MISMATCH (타 주문·타 배송) / FENCE_ACTIVE (다른 승인 진행 중)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /packages/{packageId}/handover-commits:
    post:
      tags: [handovers]
      summary: CommitPackageHandover — mfc-inventory 커밋 후 HANDED_OVER, PackageHandedOver 발행
      description: |
        fence 유효(handoverAuthorizationId·fenceVersion 일치, 미만료)를 확인한 뒤 mfc-inventory.CommitPackageHandover 를 호출한다(2 hop).
        inventory 응답 불명이면 UNKNOWN_RESULT 로 응답하고 fence 유지. 호출자는 GET …/handover-resolution 으로 해소한다.
      operationId: commitPackageHandover
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handoverAuthorizationId, fenceVersion, riderId]
              properties:
                handoverAuthorizationId: { type: string }
                fenceVersion: { type: integer, minimum: 0 }
                riderId: { type: string }
                handedOverAt: { type: string, format: date-time }
      responses:
        '201':
          description: 인계 확정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverCommitResult' }
        '409':
          description: INVALID_STATE (fence 없음·만료) / FENCE_VERSION_MISMATCH / ALREADY_HANDED_OVER
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /packages/{packageId}/handover-resolution:
    get:
      tags: [handovers]
      summary: QueryHandoverResolution — 포장 인계 판정 조회 (stopRequest·fence·inventory commit 결합)
      operationId: getHandoverResolution
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - { name: stopRequestId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResolution' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /packages/{packageId}/repackings:
    post:
      tags: [shipments]
      summary: 재포장 — 새 Package 버전 발급, 구 라벨 INVALIDATED (PackageInvalidated)
      description: 인계 전(SEALED)만 가능. 재포장 후 구 QR 스캔은 PACKAGE_INVALIDATED 로 거절된다.
      operationId: repackPackage
      parameters:
        - { name: packageId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [DAMAGED_BAG, CONTENT_CHANGE, LABEL_UNREADABLE, SHORTAGE_ADJUST] }
                contents:
                  type: array
                  description: 변경된 내용물. 생략 시 기존 내용 유지
                  items: { $ref: '#/components/schemas/PackageContentLine' }
      responses:
        '201':
          description: 새 Package (packageVersion+1, 새 QR)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Package' }
        '409':
          description: INVALID_STATE (HANDED_OVER / fence 진행 중)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

components:
  schemas:
    TaskState:
      type: string
      enum: [WAITING, READY, ASSIGNED, IN_PROGRESS, COMPLETED, BLOCKED, FAILED, CANCELLED, CLOSED_PARTIAL]
    ShipmentState:
      type: string
      enum: [PREPARING, READY, PARTIALLY_HANDED_OVER, HANDED_OVER, CANCELLED, CLOSED_PARTIAL]
    PackageState:
      type: string
      enum: [OPEN, SEALED, HANDED_OVER, INVALIDATED, VOIDED]
    FenceState:
      type: string
      enum: [NONE, HANDOVER_IN_PROGRESS, COMMITTED, EXPIRED]
    PackageContentLine:
      type: object
      required: [orderLineId, sku, qty]
      properties:
        orderLineId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        qty: { $ref: '_common.yaml#/components/schemas/Quantity' }
        lotId: { type: string }
    ConfirmOrderRequest:
      type: object
      required: [orderId, mfcId, reservationId, shipments]
      properties:
        orderId: { type: string }
        orderVersion: { type: integer }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        reservationId: { type: string }
        capacityHoldId: { type: string }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        promisedReadyAt: { type: string, format: date-time, description: 예약배달은 슬롯 기준 준비 완료 목표 }
        shipments:
          type: array
          minItems: 1
          items:
            type: object
            required: [shipmentId, lines]
            properties:
              shipmentId: { type: string, description: order-service 이행 계획의 shipmentId }
              deliveryId: { type: string }
              weightG: { type: integer }
              lines:
                type: array
                minItems: 1
                items: { $ref: '#/components/schemas/PackageContentLine' }
    WorkOrder:
      type: object
      properties:
        fulfillmentId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        version: { type: integer }
        acceptance: { type: string, enum: [ACCEPTED, REJECTED] }
        preparationStartedAt: { type: [string, 'null'], format: date-time }
        tasks:
          type: array
          items:
            type: object
            properties:
              taskId: { type: string }
              taskType: { type: string, enum: [PICK, PACK, DISPATCH] }
              state: { $ref: '#/components/schemas/TaskState' }
              assigneeId: { type: string }
              assignmentVersion: { type: integer }
              plannedQty: { type: integer }
              completedQty: { type: integer }
              cancelledQty: { type: integer }
              remainingQty: { type: integer, description: 계획 = 완료 + 취소 + 잔량 }
        shipments: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
    StopRequestResult:
      type: object
      properties:
        stopRequestId: { type: string }
        fulfillmentId: { type: string }
        state: { type: string, enum: [PENDING, RESOLVED, UNKNOWN] }
        packages:
          type: array
          items:
            type: object
            properties:
              packageId: { type: string }
              shipmentId: { type: string }
              verdict: { type: string, enum: [STOPPED, HANDOVER_IN_PROGRESS, HANDED_OVER] }
              fenceVersion: { type: integer }
              fenceExpiresAt: { type: [string, 'null'], format: date-time }
              inventoryCommitId: { type: [string, 'null'], description: HANDED_OVER 시 재고 commitId }
              stoppedLines:
                type: array
                items:
                  type: object
                  properties:
                    orderLineId: { type: string }
                    qty: { type: integer }
                    workStateAtStop: { type: string, enum: [NOT_PICKED, PICKED, PACKED] }
        resolvedAt: { type: string, format: date-time }
    TaskExecutionRequest:
      type: object
      required: [executionType, workerId, lines]
      properties:
        executionType: { type: string, enum: [PICK, PACK] }
        workerId: { type: string }
        assignmentVersion: { type: integer }
        fromLocation: { type: string }
        toLocation: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [orderLineId, sku, pickedQty]
            properties:
              orderLineId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              lotId: { type: string }
              pickedQty: { type: integer, minimum: 0 }
              shortage:
                type: object
                description: 결품·파손·차단 보고 (pickedQty < 계획량일 때)
                properties:
                  qty: { type: integer, minimum: 1 }
                  reason: { type: string, enum: [SHORT, DAMAGED, BLOCKED] }
                  note: { type: string, maxLength: 200 }
                  evidenceRef: { type: string }
        durationSec: { type: integer, description: 패킹 소요시간 }
    TaskExecution:
      type: object
      properties:
        executionId: { type: string }
        taskId: { type: string }
        state: { type: string, enum: [RECORDED, INVENTORY_PENDING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        inventoryCommitId: { type: [string, 'null'] }
        appliedQty: { type: integer }
        shortages:
          type: array
          items:
            type: object
            properties:
              orderLineId: { type: string }
              qty: { type: integer }
              reason: { type: string, enum: [SHORT, DAMAGED, BLOCKED] }
        recordedAt: { type: string, format: date-time }
    SealPackageRequest:
      type: object
      required: [contents, bagCount]
      properties:
        contents:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PackageContentLine' }
        bagCount: { type: integer, minimum: 0 }
        containsAlcohol: { type: boolean }
        temperatureZone: { type: string, enum: [AMBIENT, CHILLED, FROZEN] }
        weightG: { type: integer, minimum: 0 }
        volumeCm3: { type: integer, minimum: 0 }
        packedBy: { type: string }
    Package:
      type: object
      properties:
        packageId: { type: string }
        packageVersion: { type: integer, description: 재포장마다 증가. QR에 포함 }
        shipmentId: { type: string }
        orderId: { type: string }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/PackageState' }
        qrCode: { type: string }
        contents: { type: array, items: { $ref: '#/components/schemas/PackageContentLine' } }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        temperatureZone: { type: string }
        weightG: { type: integer }
        fence:
          type: object
          properties:
            state: { $ref: '#/components/schemas/FenceState' }
            handoverAuthorizationId: { type: [string, 'null'] }
            fenceVersion: { type: integer }
            riderId: { type: [string, 'null'] }
            expiresAt: { type: [string, 'null'], format: date-time }
        sealedAt: { type: [string, 'null'], format: date-time }
        handedOverAt: { type: [string, 'null'], format: date-time }
        invalidatedReason: { type: [string, 'null'] }
    Shipment:
      type: object
      properties:
        shipmentId: { type: string }
        fulfillmentId: { type: string }
        orderId: { type: string }
        deliveryId: { type: [string, 'null'] }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
        state: { $ref: '#/components/schemas/ShipmentState' }
        holdReason: { type: [string, 'null'] }
        packages: { type: array, items: { $ref: '#/components/schemas/Package' } }
        packingDurationSec: { type: integer }
        bagCount: { type: integer }
        containsAlcohol: { type: boolean }
        weightG: { type: integer }
        volumeCm3: { type: integer }
        readyAt: { type: [string, 'null'], format: date-time }
        riderEta:
          type: object
          description: 점원 화면용 ETA 투영 (delivery 사본)
          properties:
            eta: { type: string, format: date-time }
            asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    HandoverAuthorization:
      type: object
      properties:
        handoverAuthorizationId: { type: string }
        packageId: { type: string }
        packageVersion: { type: integer }
        fenceVersion: { type: integer }
        riderId: { type: string }
        deliveryId: { type: string }
        fenceExpiresAt: { type: string, format: date-time }
        authorizedAt: { type: string, format: date-time }
    HandoverCommitResult:
      type: object
      required: [status, handoverId]
      properties:
        status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
        requestId: { type: string }
        handoverId: { type: string, description: HandoverFact ID }
        inventoryCommitId: { type: [string, 'null'], description: mfc-inventory commitId. UNKNOWN_RESULT 시 null }
        packageState: { $ref: '#/components/schemas/PackageState' }
        shipmentState: { $ref: '#/components/schemas/ShipmentState' }
        handedOverAt: { type: string, format: date-time }
        nextAction: { type: string }
    HandoverResolution:
      type: object
      properties:
        packageId: { type: string }
        packageVersion: { type: integer }
        packageState: { $ref: '#/components/schemas/PackageState' }
        verdict: { type: string, enum: [STOPPED, HANDOVER_IN_PROGRESS, HANDED_OVER, UNKNOWN] }
        fence:
          type: object
          properties:
            state: { $ref: '#/components/schemas/FenceState' }
            handoverAuthorizationId: { type: [string, 'null'] }
            fenceVersion: { type: integer }
            expiresAt: { type: [string, 'null'], format: date-time }
        handoverId: { type: [string, 'null'] }
        inventoryCommitId: { type: [string, 'null'] }
        inventoryApplyStatus: { type: string, enum: [NOT_REQUESTED, PROCESSING, APPLIED, REJECTED, UNKNOWN_RESULT] }
        stopRequestId: { type: [string, 'null'] }
        asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
