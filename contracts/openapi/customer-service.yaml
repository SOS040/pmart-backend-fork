                      version: { type: string, maxLength: 32 }
                      agreed: { type: boolean }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400':
          description: VALIDATION_FAILED (같은 항목을 두 번 보냄 등)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: REQUIRED_CONSENT_CANNOT_BE_WITHDRAWN / CONSENT_VERSION_OUTDATED / CONFIG_REQUIRED(현행 버전 설정 없음)
