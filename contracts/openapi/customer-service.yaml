openapi: 3.1.0
info:
  title: customer-service
  version: 0.9.0
  description: |
    0.9.0(2026-11-19, 사용자 "옥토모로" — 휴대폰 번호 확인): `POST /me/phone-verifications`(시작 — 프로필 휴대폰 번호로 인증 문자 본문 발급)·
    `POST /me/phone-verifications/{verificationId}/confirmations`(확인 — 고객이 대표번호로 그 문자를 보냈는지 OCTOMO 로 조회, 맞으면 `phoneVerified=true`)·
    `GET /me/phone-verifications/{verificationId}`. 고객이 문자를 보내는 방식(MO)이라 우리가 문자를 보내지 않는다. 010 11자리만. 번호 소유만 확인 — 이름·나이 확인 아님(주류 성인 확인에 쓰지 않음).
    0.8.0(2026-11-19, 클라이언트 BR-60 — 사용자 "응 해줘"): 주소 입력의 `receiverName`·`receiverPhone` 을 **선택**으로(회원 주소록·비회원 배송지 —
    레퍼런스 주소 화면에 받는 분·연락처 칸이 없다). PATCH 에서 빠뜨리면 저장된 값을 그대로 둔다. 응답 `Address` 의 두 값은 없을 수 있다(null).
    주문 초안용 내부 쇼핑 컨텍스트는 주소에 값이 없으면 **프로필로 채운다** — 받는 분 = 별명 → 로그인 제공자 이름, 연락처 = 프로필 `phone`(0.7.0).
    프로필에도 연락처가 없으면 비어 있고, order 가 초안에 CONTACT_REQUIRED 막힘을 단다.
    0.7.0(2026-11-19, 클라이언트 BR-32 — 사용자 "본인확인 일단 보류하고 저장은 되나?" → "응"): 휴대폰 번호를 **확인 안 된 연락처**로 저장한다 —
    `POST /me/profile-changes` 의 `phone`(010 등 휴대폰, 하이픈·공백 무시, 숫자로 저장, 빈 문자열 = 지우기). `GET /me` 는 본인에게 `phone`(가리지 않은 값)·
    `phoneVerified=false`·`phoneMasked`. 본인 확인 방식이 정해지면 그때 확인 완료로 바꾼다. 쓰는 곳은 배송지 받는 분 연락처 채우기뿐(로그인·본인 확인·주류 연령 확인에 쓰지 않는다).
    0.6.1(2026-11-19, 사용자 "그냥 PMart로 해줘 그리고 진행해줘"): 약관 본문 `GET /consent-terms/{consentType}/{version}`(토큰 없음, Markdown) —
    본문은 customer-service 가 버전별 파일로 가진다(시연용 초안, 법률 검토 전). `/consent-terms` 의 `documentUrl` 은 설정 값이 없으면 그 본문이 있을 때 이 경로.
    0.6.0(2026-11-19, 클라이언트 요청 BR-59 처음 실행 약관 — 사용자 "응 그렇게 해줘"): ① 동의 항목 `LOCATION_BASED_SERVICE`(위치기반서비스 이용약관) —
    **현재 위치 기능을 쓸 때만 필수**(`requiredFor=CURRENT_LOCATION`). 로그인·구매 가능 여부의 필수 목록에는 넣지 않아 기존 회원이 다시 동의하지 않는다(로그인 동의 단계에서도 묻지 않음).
    ② 로그인 전(기기) 동의 — `GET /device-consents`·`POST /device-consent-changes`(X-Device-Id, 토큰 없음 — 비회원 배송지와 같은 방식). 받는 항목은 MARKETING·LOCATION_BASED_SERVICE 뿐.
    로그인하면 auth 가 그 기기 동의를 계정으로 옮기고 기기 기록은 지운다(`POST /internal/accounts/{id}/device-consent-migrations` — 계정에 현행 버전 결정이 없는 항목만. 같은 기기를 다음에 비회원으로 쓰면 다시 받는다).
    로그인 동의 단계 판단(`GET /internal/accounts/{id}/consents?deviceId=`)은 옮기기 전에도 기기 결정을 결정한 것으로 본다(다시 묻지 않게).
    ③ 수신 동의 처리 결과 — 동의 조회(`/me/consents`·`/device-consents`)에 `senderName`(전송자)과 항목별 `lastChangedAt`(처리 일시). 바꾼 뒤 다시 조회해 앱이 "수신동의 처리완료" 안내를 띄운다.
    ④ 약관 본문 — `GET /consent-terms`(토큰 없음): 항목별 현행 버전·필수 여부·본문 주소(`documentUrl`, 설정 — 없으면 null).
    0.5.0(2026-11-18, 클라이언트 요청 rider-app drop-exact-coordinates 2 — 사용자 "응 해줘"): 배송지 저장(회원 주소록·비회원 배송지 추가·수정) 때 `geo`(지도 핀)가 없으면 서버가 도로명주소를 delivery-serviceability 지오코딩(배차와 같은 카카오 변환, ADR-0023)으로 바꿔 좌표를 채운다 — 주문 사본·라이더 전달지 핀이 비지 않게. 응답 `Address.geoSource`: PIN(고객 핀)·GEOCODE(서버가 채움), 좌표가 없으면 칸 없음. 변환 실패면 예전처럼 좌표 없이 저장(저장은 막지 않음). 요청 모양은 그대로.
    0.4.0(2026-11-18, 고객 앱 "다음에도 이 품절 처리 적용" — 사용자 "A해줘"): 주문 기본 설정 `GET`·`PUT /me/order-preferences` — `outOfStockPreference`(order-service 주문 초안 outOfStockPreference 와 같은 값 CANCEL_OOS_ONLY·CANCEL_ALL). 저장한 적 없으면 null(version 0). 앱이 주문서 기본값으로만 쓴다 — order-service 는 읽지 않고 주문마다 초안 값이 정본.
    고객 계정·프로필·이용 상태(ACTIVE/WITHDRAW_PENDING/WITHDRAW_COMPLETED), 약관·마케팅 동의(버전·시점·철회), 주소록·현재 쇼핑 주소(shoppingContextVersion),
    비회원 배송지, 첫 구매 중복혜택 대조값(소셜 식별, 5년)의 정본. (docs/architecture/service-map.md §1)
    비정본: 인증·세션·토큰(auth), 주문 이력(order), 권역 판정(delivery-serviceability).
    발행: CustomerConsentChanged, CustomerWithdrawalRequested, CustomerWithdrawalCompleted, ShoppingAddressChanged. 구독: CustomerAuthenticated(auth).
    0.3.0(2026-11-17, CU-1): 약관 동의 구현 — 필수 3(TERMS_OF_SERVICE·PRIVACY_POLICY·AGE_OVER_14) + 선택 1(MARKETING). 현행 버전은 설정
    `pmart.customer.consents.versions.*`. 로그인 중 동의(AUTH_CONSENT)는 auth 가 내부 경로로 넘긴다. ConsentType 에서 쓰지 않던
    MARKETING_PUSH·MARKETING_SMS·NIGHT_MARKETING 을 빼고 MARKETING 하나로(사용자 결정 2026-11-17 "선택 1 = 마케팅 수신").
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: profile, description: 본인 프로필 }
  - { name: consents, description: 약관·마케팅 동의 }
  - { name: device-consents, description: '로그인 전(기기) 동의·약관 본문 주소(0.6.0 — 토큰 없음)' }
  - { name: addresses, description: 주소록·현재 쇼핑 주소·비회원 배송지 }
  - { name: preferences, description: '주문 기본 설정(0.4.0 — 앱 주문서 기본값)' }
  - { name: withdrawals, description: 탈퇴 접수·철회·완료 }
  - { name: phone-verifications, description: '휴대폰 번호 확인(0.9.0 — OCTOMO, 고객이 대표번호로 문자 보냄)' }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /me:
    get:
      tags: [profile]
      summary: 본인 프로필·계정 상태 조회
      operationId: getMyProfile
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /me/profile-image:
    get:
      tags: [profile]
      summary: 본인 프로필 사진(로그인 제공자 사진의 우리 사본, ADR-0024)
      description: |
        제공자(Google) 사진 URL 을 그대로 주지 않는다. 로그인 뒤 서버가 한 번 받아 비공개 저장소에 둔 사본이다. 본인 토큰이 있어야 읽는다
        (`Authorization` 헤더 — `<img src>` 만으로는 안 된다). 주소는 `Profile.profileImageUrl` 을 쓴다(사본이 바뀌면 `v` 가 바뀐다).
      operationId: getMyProfileImage
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: 이미지 바이트
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /me/profile-changes:
    post:
      tags: [profile]
      summary: 프로필 변경 (닉네임·연락처). 확정 주문의 배송정보는 소급 수정하지 않음
      description: |
        즉시 반영(status APPLIED, version +1). 같은 닉네임이면 버전을 올리지 않는다.
        nickname 은 앞뒤 공백을 떼고 1~30자, 줄바꿈·제어 문자 불가.
        phone(0.7.0, 2026-11-19): 확인 안 된 연락처로 저장 — 휴대폰 번호(01X, 10~11자리, 하이픈·공백 무시)만, 아니면 400 VALIDATION_FAILED(field phone). 빈 문자열이면 지운다. nickname·phone 중 하나 이상. 같은 값이면 바꾸지 않는다.
        결과는 GET /me/profile-changes/{requestId}(= Idempotency-Key)로 다시 본다.
      operationId: changeMyProfile
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 30 }
                phone: { type: string, maxLength: 20, description: '0.7.0 — 휴대폰 번호(확인 안 된 연락처). 빈 문자열 = 지우기. 값은 로그 금지' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: VERSION_CONFLICT / INVALID_STATE (WITHDRAW_PENDING 이후 변경 불가)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/profile-changes/{requestId}:
    get:
      tags: [profile]
      summary: 프로필 변경 결과 조회
      operationId: getMyProfileChange
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/phone-verifications:
    post:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 시작 — 보낼 문자 본문 발급 (0.9.0)
      description: |
        프로필에 저장된 휴대폰 번호(`/me/profile-changes` phone)를 확인한다. 응답의 `text` 를 `sendTo`(OCTOMO 대표번호)로 고객이 직접 문자로 보낸 뒤
        `…/confirmations` 를 부른다(앱은 문자 앱을 받는 번호·본문을 채워 연다). `expiresAt` 이 지나면 다시 시작. 새로 시작하면 이전 대기 중인 확인은 끝난다(EXPIRED).
        - 400 `PHONE_REQUIRED`(번호 없음)·`PHONE_NOT_SUPPORTED`(010 11자리만), 409 INVALID_STATE(이미 확인됨·탈퇴 신청 이후), 429 `TOO_MANY_VERIFICATIONS`(하루 시작 횟수 초과),
          422 CONFIG_REQUIRED(서버 설정 없음). 같은 Idempotency-Key 재시도는 같은 결과(같은 본문).
      operationId: startPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '201':
          description: 시작됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerificationStart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '429':
          description: TOO_MANY_VERIFICATIONS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/phone-verifications/{verificationId}:
    get:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 상태 (0.9.0)
      operationId: getPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerification' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/phone-verifications/{verificationId}/confirmations:
    post:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 — 고객이 문자를 보냈는지 조회 (0.9.0)
      description: |
        고객이 "보냈어요"를 눌렀을 때만 부른다(앱이 자동으로 되풀이해 부르지 않는다 — 조회마다 OCTOMO 월 한도가 줄어든다).
        - 문자가 확인되면 `VERIFIED` + 프로필 `phoneVerified=true`(프로필 version +1).
        - 아직 없으면 `PENDING`·`remainingAttempts` 감소(0 이 되면 `FAILED`·TOO_MANY_ATTEMPTS). 시간이 지났으면 `EXPIRED`. 그 사이 프로필 번호가 바뀌었으면 `FAILED`·PHONE_CHANGED.
        - 이미 끝난 확인은 OCTOMO 를 부르지 않고 그 상태를 돌려준다(재시도 안전).
        - 503 DEPENDENCY_UNAVAILABLE: OCTOMO 조회 실패·한도 초과 — 시도 횟수를 줄이지 않는다, 잠시 뒤 다시.
      operationId: confirmPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 확인 결과(상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerification' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /me/consents:
    get:
      tags: [consents]
      summary: 현재 동의 상태 (항목별 버전·동의 시각·철회 시각)
      description: |
        항목은 늘 다섯(필수 TERMS_OF_SERVICE·PRIVACY_POLICY·AGE_OVER_14, 선택 MARKETING, 기능 필수 LOCATION_BASED_SERVICE — 0.6.0). 한 번도 고르지 않은 항목은 agreed=false·version 없음.
        `version`(고른 버전)이 `latestVersion`(현행)과 다르면 그 항목은 다시 받아야 한다 — 필수 항목이 하나라도 그렇거나 동의하지 않았으면
        `requiredConsentOutdated=true` 이고, 서버의 구매 차단 스위치(`pmart.customer.consents.purchase-gate`)가 켜져 있으면 주문(구매 가능 여부)이 막힌다. 다시 받는 곳은 POST /me/consent-changes.
      operationId: listMyConsents
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, requiredConsentOutdated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Consent' } }
                  requiredConsentOutdated: { type: boolean, description: 필수 항목 중 현행 버전 동의가 없는 것이 있다 }
                  senderName: { type: [string, 'null'], description: '(0.6.0) 수신 동의 처리 결과 안내의 전송자 이름(설정 pmart.customer.consents.sender-name, 없으면 null)' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /me/consent-changes:
    post:
      tags: [consents]
      summary: 동의·철회 반영 (필수 약관 재동의·마케팅 수신 변경)
      description: |
        즉시 반영(APPLIED). `version` 은 그 항목의 현행 버전(GET /me/consents 의 latestVersion)이어야 한다 — 다르면 422 CONSENT_VERSION_OUTDATED.
        필수 항목은 agreed=false 로 바꿀 수 없다(422 REQUIRED_CONSENT_CANNOT_BE_WITHDRAWN — 필수 동의 철회 = 탈퇴, 탈퇴는 /me/withdrawals).
        마케팅(MARKETING)은 켜고 끌 수 있고, 철회는 주문 조회를 막지 않는다. 같은 값·같은 버전이면 바뀌지 않는다(사건 없음).
        탈퇴 신청 이후(WITHDRAW_PENDING·COMPLETED)는 동의(agreed=true)만 409 INVALID_STATE, 철회는 받는다. 탈퇴 철회 시 마케팅 동의를 자동 복원하지 않는다.
        항목마다 바뀌면 CustomerConsentChanged 발행. 결과는 GET /me/consent-changes/{requestId}(= Idempotency-Key)로 다시 본다.
        로그인 중 필수 동의 대기(AUTH_CONSENT, 토큰 없음)는 이 경로가 아니라 auth `POST /auth/social-logins/{authRequestId}/completions`.
      operationId: changeMyConsents
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
