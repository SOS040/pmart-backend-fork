openapi: 3.1.0
info:
  title: customer-service
  version: 0.20.0
  description: |
    0.20.0(2026-11-25, 클라이언트 BR-106 — 사용자 "비회원 주소 그거 복사해와야지"): 회원 주소록 `detailAddress` 선택(전에는 없거나 비면 400). 비회원 배송지를
      상세 없이 그대로 옮길 수 있다. 상세 없는 주소로는 주문서가 막힌다(order 0.23.0 `DETAIL_ADDRESS_REQUIRED`).
    0.19.0(2026-11-25, 사용자 "실제 이름과 닉네임 다르게 관리", "별명만 기존 이름으로 채워넣는걸로"): `Profile.providerNickname`
      — 로그인 제공자 닉네임(카카오 닉네임·네이버 별명, 없으면 이름 — 구글은 이름). `name` 은 제공자 실명만(카카오는 실명을 주지 않아 비어 있다 — 앱이 입력받는다). 고객이 정한 별명은 `nickname` 그대로.
      로그인마다 최신 값, 사건에 없으면 유지 — 배포 전 가입자는 다음 로그인부터 채워진다. 탈퇴 완료 때 지움.
    0.18.0(2026-11-25, 클라이언트 BR-105 "구글도 서버가 끊게"): 탈퇴 접수 `POST /me/withdrawals` 에 선택 `providerAccessToken`(GOOGLE 일 때만 — 재인증 직후 받은
      구글 OAuth 접근 토큰). 접수되면(대기·완료) 서버가 `https://oauth2.googleapis.com/revoke` 로 이 앱과의 구글 연결을 끊는다(비밀값 없음, 토큰은 저장·로그·응답 안 함, 실패해도 탈퇴는 그대로).
      없으면 지금처럼 앱의 기기 끊기. 철회(revocations)에는 없다 — 철회로 끝나면 끊지 않는다.
    0.17.0(2026-11-25, 클라이언트 BR-100 R3 "하트 아래 숫자"): `GET /product-wish-counts?productIds=` — 상품마다 찜한 회원 수(공개, 토큰 없이). 쉼표로 100개까지,
      찜이 없는 상품은 0. 누가 찜했는지는 주지 않는다. 탈퇴 완료 회원의 찜은 지워져 세지 않는다.
    0.16.0(2026-11-23 CU-7 — 사용자 결정: 이용제한 = 문의·리뷰 작성 막기, 정지 = 주문·로그인까지 막기, 기간 7일 자동 해제, 영구 정지 없음, 라이더와 따로):
    계정 제한 `restriction` NONE·RESTRICTED(이용제한)·SUSPENDED(정지)와 `restrictedUntil`(늘 기한 있음 — 지나면 NONE 으로 본다). 거는 길 둘:
    ① case `CustomerProfanityDetected`(platform.case.v1 — 문의 정지 단어, AI 채팅 예정)를 받아 **자동 7일 정지**(찾은 시각부터),
    ② 직원(CS_AGENT·OPERATOR_ADMIN) `POST /customers/{customerId}/restrictions`(RESTRICTED·SUSPENDED 고름, 사유 필수, 지금부터 7일)·
    `POST /customers/{customerId}/restriction-releases`(오인식 풀기, 사유 필수)·이력 `GET /customers/{customerId}/restrictions`.
    바뀔 때마다 `CustomerRestricted`(commerce.customer.v1) — auth(정지면 로그인·토큰 연장 막고 나간 토큰 끊음), case(제한·정지면 문의 작성 403),
    notification(고객 알림 "7일 계정 정지"). 정지면 내부 상태 `purchasable` false(주문 draft·checkout 422 ACCOUNT_NOT_PURCHASABLE). 리뷰 작성은
    review 가 `review-author` 의 `restriction` 으로 막는다. `/me`·직원 상세·찾기·내부 상태에 restriction·restrictedUntil. 사유는 로그·사건에 넣지 않는다.
    0.15.0(2026-11-21 BR-80 — 고객앱 요청 "프로필 사진 바꾸기"): 프로필 사진을 고객이 고른다. `PUT /me/profile-image`(직접 올리기, multipart `file`,
    JPEG·PNG·WebP 파일 앞부분으로 판정, 2MB 이하 — 넘거나 다른 형식이면 400 VALIDATION_FAILED field file), `DELETE /me/profile-image`(기본 이미지 = 사진 없음),
    `POST /me/profile-image/provider-restorations`(로그인 계정 사진으로 되돌리기). 셋 다 본인 토큰·Idempotency-Key, 결과 CommandResponse(APPLIED) — 새 주소는 `GET /me` 의
    `profileImageUrl`(`?v=` 가 바뀜). `Profile.photoSource`(PROVIDER·CUSTOM·NONE): CUSTOM·NONE 을 고른 뒤에는 로그인해도 제공자 사진으로 덮지 않는다.
    탈퇴 신청 이후는 409 INVALID_STATE. 사진·주소는 로그에 남기지 않는다.
    0.14.0(2026-11-20 — 사용자 "추천대로 해줘": 로그아웃 때 "지금 주소로 계속 둘러볼까요?"): 비회원 배송지(`POST /guest-delivery-addresses`)는 `detailAddress` 없이도 저장(도로명·위치만 —
    상품 둘러보기용. 비회원은 주문하지 않으므로 상세 주소는 로그인·주문 때 회원 주소록에서). 회원 주소록(`/me/addresses`)은 지금처럼 detailAddress 필수(빠지면 400).
    0.13.1(2026-11-20 BR-72 — 사용자 "(가)로 해줘, 1번"): 내부 동의 상태 `GET /internal/accounts/{id}/consents` 에 `fresh=true` — 저장된 계정 동의·기기 동의를 무시하고
    필수·선택 전부를 고르지 않은 것으로 답한다(가입을 끝내지 않은 계정이 다시 로그인하면 auth 가 동의부터 다시 받는다).
    0.13.0(2026-11-20, ADR-0081 — 사용자 "찜 기능 넣고 싶어"): 찜(위시리스트) — 회원만, 상품(productId) 단위, 최대 200개(정책값 `pmart.customer.wishlist.max-items`).
    `PUT`·`DELETE /me/wishlist-items/{productId}`(멱등 — 이미 있으면 그대로, 없으면 204), `GET /me/wishlist-items`(최근 찜한 순, 상품명·대표 사진·가격·판매 상태는
    조회 때 product-content 카드에서 — 실패하면 그 칸만 null), `GET /me/wishlist-product-ids`(하트 표시용 전체 ID). 품절·판매 종료도 남긴다. 재입고 알림 없음.
    0.12.0(2026-11-20, ADR-0077 — 사용자 "고객 탈퇴 만들어줘"): 탈퇴 접수·조회·철회 구현. 접수·철회는 같은 소셜로 다시 로그인한 ID 토큰(`provider`·`providerToken`)이 필요하다
    (auth-service 가 그 계정의 소셜인지 검증 — 다르면 403 REAUTHENTICATION_MISMATCH, 거절 401 PROVIDER_REJECTED, auth 장애 503). 접수 즉시 신규 구매만 막고
    주문 조회·클레임·고객센터는 그대로. 완료는 order·claim 의 미결 의무가 모두 없을 때 서버가 비동기로(이름·연락처·주소록 등 지움). `GET /me/withdrawals` = 최근 탈퇴 요청.
    0.11.0(2026-11-20, CU-3·CU-4 — 백오피스 "고객" 메뉴, 사용자 "가린 이름 · 고객번호 6자리"·"응 그대로 진행해", ADR-0070·ADR-0062): 고객번호 `customerNumber`
    (숫자 6자리, 첫 자리 1~9, 무작위·겹치지 않음·바뀌지 않음 — 가입 때 서버가 정하고 기존 고객도 채움, 라이더 번호와 같은 방식). 직원 조회(CS_AGENT·OPERATOR_ADMIN):
    `GET /customers`(고객번호·전화 완전 일치, 또는 고객 ID 여러 개 — 이름 검색·목록 훑기 없음), `GET /customers/{customerId}`(가린 값만),
    `POST /customers/{customerId}/pii-reveals`(이름·전화 원문 — 사유 + audit-service 기록 뒤에만, 기록 실패면 503). `/me` 에도 customerNumber.
    0.10.0(2026-11-20, ADR-0074 — 고객 BR-64, 사용자 "가입하자마자·한 번호 한 계정·기존 계정 안내·탈퇴 1달", 기존 회원 "(가)"): 가입·로그인 단계 휴대폰 확인을
    auth-service 가 대신 부르는 내부 API(`/internal/accounts/{id}/identity`·`…/identity-verifications`·`…/{vid}/confirmations`) — 토큰 없는 로그인 중 계정용.
    확인된 번호는 한 계정만(`customer_identity`, 유효 번호 해시 고유). 다른 계정의 번호면 확인 결과 outcome IDENTITY_ALREADY_REGISTERED(그 계정 ID·가린 이메일 — auth 가
    제공자·가입일을 붙여 앱에 줌), 탈퇴로 풀린 지 30일(설정) 안의 번호면 IDENTITY_REJOIN_BLOCKED. `/me/phone-verifications` 로 확인해도 같은 번호 규칙(다른 계정 번호면
    FAILED·PHONE_ALREADY_REGISTERED — 안내 없음). 확인된 번호는 프로필 phone·phoneVerified=true(주문 연락처 기본값).
    0.9.0(2026-11-19, 사용자 "옥토모로" — 휴대폰 번호 확인): `POST /me/phone-verifications`(시작 — 프로필 휴대폰 번호로 인증 문자 본문 발급)·
    `POST /me/phone-verifications/{verificationId}/confirmations`(확인 — 고객이 대표번호로 그 문자를 보냈는지 OCTOMO 로 조회, 맞으면 `phoneVerified=true`)·
    `GET /me/phone-verifications/{verificationId}`. 고객이 문자를 보내는 방식(MO)이라 우리가 문자를 보내지 않는다. 010 11자리만. 번호 소유만 확인 — 이름·나이 확인 아님(주류 성인 확인에 쓰지 않음).
    0.8.0(2026-11-19, 클라이언트 BR-60 — 사용자 "응 해줘"): 주소 입력의 `receiverName`·`receiverPhone` 을 **선택**으로(회원 주소록·비회원 배송지 —
    레퍼런스 주소 화면에 받는 분·연락처 칸이 없다). PATCH 에서 빠뜨리면 저장된 값을 그대로 둔다. 응답 `Address` 의 두 값은 없을 수 있다(null).
    주문 초안용 내부 쇼핑 컨텍스트는 주소에 값이 없으면 **프로필로 채운다** — 받는 분 = 별명 → 로그인 제공자 이름, 연락처 = 프로필 `phone`(0.7.0).
    프로필에도 연락처가 없으면 비어 있고, order 가 초안에 CONTACT_REQUIRED 막힘을 단다.
    0.7.0(2026-11-19, 클라이언트 BR-32 — 사용자 "본인확인 일단 보류하고 저장은 되나?" → "응"): 휴대폰 번호를 **확인 안 된 연락처**로 저장한다 —
    `POST /me/profile-changes` 의 `phone`(010 등 휴대폰, 하이픈·공백 무시, 숫자로 저장, 빈 문자열 = 지우기). `GET /me` 는 본인에게 `phone`(가리지 않은 값)·
    `phoneVerified=false`·`phoneMasked`. 본인 확인 방식이 정해지면 그때 확인 완료로 바꾼다. 쓰는 곳은 배송지 받는 분 연락처 채우기뿐(로그인·본인 확인·주류 연령 확인에 쓰지 않는다).
    0.6.1(2026-11-19, 사용자 "그냥 PMart로 해줘 그리고 진행해줘"): 약관 본문 `GET /consent-terms/{consentType}/{version}`(토큰 없음, Markdown) —
    본문은 customer-service 가 버전별 파일로 가진다(시연용 초안, 법률 검토 전). `/consent-terms` 의 `documentUrl` 은 설정 값이 없으면 그 본문이 있을 때 이 경로.
    0.6.0(2026-11-19, 클라이언트 요청 BR-59 처음 실행 약관 — 사용자 "응 그렇게 해줘"): ① 동의 항목 `LOCATION_BASED_SERVICE`(위치기반서비스 이용약관) —
    **현재 위치 기능을 쓸 때만 필수**(`requiredFor=CURRENT_LOCATION`). 로그인·구매 가능 여부의 필수 목록에는 넣지 않아 기존 회원이 다시 동의하지 않는다(로그인 동의 단계에서도 묻지 않음).
    ② 로그인 전(기기) 동의 — `GET /device-consents`·`POST /device-consent-changes`(X-Device-Id, 토큰 없음 — 비회원 배송지와 같은 방식). 받는 항목은 MARKETING·LOCATION_BASED_SERVICE 뿐.
    로그인하면 auth 가 그 기기 동의를 계정으로 옮기고 기기 기록은 지운다(`POST /internal/accounts/{id}/device-consent-migrations` — 계정에 현행 버전 결정이 없는 항목만. 같은 기기를 다음에 비회원으로 쓰면 다시 받는다).
    로그인 동의 단계 판단(`GET /internal/accounts/{id}/consents?deviceId=`)은 옮기기 전에도 기기 결정을 결정한 것으로 본다(다시 묻지 않게).
    ③ 수신 동의 처리 결과 — 동의 조회(`/me/consents`·`/device-consents`)에 `senderName`(전송자)과 항목별 `lastChangedAt`(처리 일시). 바꾼 뒤 다시 조회해 앱이 "수신동의 처리완료" 안내를 띄운다.
    ④ 약관 본문 — `GET /consent-terms`(토큰 없음): 항목별 현행 버전·필수 여부·본문 주소(`documentUrl`, 설정 — 없으면 null).
    0.5.0(2026-11-18, 클라이언트 요청 rider-app drop-exact-coordinates 2 — 사용자 "응 해줘"): 배송지 저장(회원 주소록·비회원 배송지 추가·수정) 때 `geo`(지도 핀)가 없으면 서버가 도로명주소를 delivery-serviceability 지오코딩(배차와 같은 카카오 변환, ADR-0023)으로 바꿔 좌표를 채운다 — 주문 사본·라이더 전달지 핀이 비지 않게. 응답 `Address.geoSource`: PIN(고객 핀)·GEOCODE(서버가 채움), 좌표가 없으면 칸 없음. 변환 실패면 예전처럼 좌표 없이 저장(저장은 막지 않음). 요청 모양은 그대로.
    0.4.0(2026-11-18, 고객 앱 "다음에도 이 품절 처리 적용" — 사용자 "A해줘"): 주문 기본 설정 `GET`·`PUT /me/order-preferences` — `outOfStockPreference`(order-service 주문 초안 outOfStockPreference 와 같은 값 CANCEL_OOS_ONLY·CANCEL_ALL). 저장한 적 없으면 null(version 0). 앱이 주문서 기본값으로만 쓴다 — order-service 는 읽지 않고 주문마다 초안 값이 정본.
    고객 계정·프로필·이용 상태(ACTIVE/WITHDRAW_PENDING/WITHDRAW_COMPLETED), 약관·마케팅 동의(버전·시점·철회), 주소록·현재 쇼핑 주소(shoppingContextVersion),
    비회원 배송지, 첫 구매 중복혜택 대조값(소셜 식별, 5년)의 정본. (docs/architecture/service-map.md §1)
    비정본: 인증·세션·토큰(auth), 주문 이력(order), 권역 판정(delivery-serviceability).
    발행: CustomerConsentChanged, CustomerWithdrawalRequested, CustomerWithdrawalCompleted, ShoppingAddressChanged. 구독: CustomerAuthenticated(auth).
    0.3.0(2026-11-17, CU-1): 약관 동의 구현 — 필수 3(TERMS_OF_SERVICE·PRIVACY_POLICY·AGE_OVER_14) + 선택 1(MARKETING). 현행 버전은 설정
    `pmart.customer.consents.versions.*`. 로그인 중 동의(AUTH_CONSENT)는 auth 가 내부 경로로 넘긴다. ConsentType 에서 쓰지 않던
    MARKETING_PUSH·MARKETING_SMS·NIGHT_MARKETING 을 빼고 MARKETING 하나로(사용자 결정 2026-11-17 "선택 1 = 마케팅 수신").
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: profile, description: 본인 프로필 }
  - { name: consents, description: 약관·마케팅 동의 }
  - { name: device-consents, description: '로그인 전(기기) 동의·약관 본문 주소(0.6.0 — 토큰 없음)' }
  - { name: addresses, description: 주소록·현재 쇼핑 주소·비회원 배송지 }
  - { name: preferences, description: '주문 기본 설정(0.4.0 — 앱 주문서 기본값)' }
  - { name: withdrawals, description: 탈퇴 접수·철회·완료 }
  - { name: wishlist, description: "찜(0.13.0, ADR-0081)" }
  - { name: phone-verifications, description: '휴대폰 번호 확인(0.9.0 — OCTOMO, 고객이 대표번호로 문자 보냄)' }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }
  - { name: staff, description: '직원용 고객 조회(0.11.0 — 백오피스 고객 메뉴, CS_AGENT·OPERATOR_ADMIN)' }

paths:
  /me:
    get:
      tags: [profile]
      summary: 본인 프로필·계정 상태 조회
      operationId: getMyProfile
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /me/profile-changes:
    post:
      tags: [profile]
      summary: 프로필 변경 (닉네임·연락처). 확정 주문의 배송정보는 소급 수정하지 않음
      description: |
        즉시 반영(status APPLIED, version +1). 같은 닉네임이면 버전을 올리지 않는다.
        nickname 은 앞뒤 공백을 떼고 1~30자, 줄바꿈·제어 문자 불가.
        phone(0.7.0, 2026-11-19): 확인 안 된 연락처로 저장 — 휴대폰 번호(01X, 10~11자리, 하이픈·공백 무시)만, 아니면 400 VALIDATION_FAILED(field phone). 빈 문자열이면 지운다. nickname·phone 중 하나 이상. 같은 값이면 바꾸지 않는다.
        결과는 GET /me/profile-changes/{requestId}(= Idempotency-Key)로 다시 본다.
      operationId: changeMyProfile
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nickname: { type: string, maxLength: 30 }
                phone: { type: string, maxLength: 20, description: '0.7.0 — 휴대폰 번호(확인 안 된 연락처). 빈 문자열 = 지우기. 값은 로그 금지' }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409':
          description: VERSION_CONFLICT / INVALID_STATE (WITHDRAW_PENDING 이후 변경 불가)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/profile-changes/{requestId}:
    get:
      tags: [profile]
      summary: 프로필 변경 결과 조회
      operationId: getMyProfileChange
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/profile-image:
    get:
      tags: [profile]
      summary: 본인 프로필 사진(로그인 제공자 사진의 우리 사본, ADR-0024)
      description: |
        제공자(Google) 사진 URL 을 그대로 주지 않는다. 로그인 뒤 서버가 한 번 받아 비공개 저장소에 둔 사본이다. 본인 토큰이 있어야 읽는다
        (`Authorization` 헤더 — `<img src>` 만으로는 안 된다). 주소는 `Profile.profileImageUrl` 을 쓴다(사본이 바뀌면 `v` 가 바뀐다).
      operationId: getMyProfileImage
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: 이미지 바이트
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    put:
      tags: [profile]
      summary: (0.15.0 BR-80) 프로필 사진 직접 올리기 — photoSource CUSTOM
      description: |
        multipart `file` 한 장. 형식은 파일 앞부분으로 판정(JPEG·PNG·WebP), 2MB 이하. 앱이 정사각형으로 자르고 줄여(예 512px JPEG) 보낸다 — 서버는 크기를 다시 바꾸지 않는다.
        올린 뒤에는 로그인해도 제공자 사진으로 덮지 않는다. 같은 Idempotency-Key 재전송은 처음 결과. 같은 사진을 다시 올리면 바뀌지 않고 APPLIED.
      operationId: uploadMyProfileImage
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-21'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (탈퇴 신청 이후)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    delete:
      tags: [profile]
      summary: (0.15.0 BR-80) 기본 이미지로(사진 없음) — photoSource NONE
      description: 직접 올린 사진·로그인 계정 사진 모두 보이지 않는다(profileImageUrl 없음). 로그인해도 제공자 사진으로 덮지 않는다. 이미 NONE 이어도 APPLIED.
      operationId: clearMyProfileImage
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-21'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (탈퇴 신청 이후)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/profile-image/provider-restorations:
    post:
      tags: [profile]
      summary: (0.15.0 BR-80) 로그인 계정 사진으로 되돌리기 — photoSource PROVIDER
      description: |
        직접 올린 사진을 지우고 로그인 제공자 사진 사본을 다시 쓴다. 사본은 응답 뒤 서버가 받아 둔다(잠깐 profileImageUrl 이 없을 수 있음 — 잠시 뒤 `GET /me`).
        제공자가 사진을 준 적이 없으면 사진 없음. 이미 PROVIDER 이어도 APPLIED.
      operationId: restoreMyProviderProfileImage
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-21'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409':
          description: INVALID_STATE (탈퇴 신청 이후)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/phone-verifications:
    post:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 시작 — 보낼 문자 본문 발급 (0.9.0)
      description: |
        프로필에 저장된 휴대폰 번호(`/me/profile-changes` phone)를 확인한다. 응답의 `text` 를 `sendTo`(OCTOMO 대표번호)로 고객이 직접 문자로 보낸 뒤
        `…/confirmations` 를 부른다(앱은 문자 앱을 받는 번호·본문을 채워 연다). `expiresAt` 이 지나면 다시 시작. 새로 시작하면 이전 대기 중인 확인은 끝난다(EXPIRED).
        - 400 `PHONE_REQUIRED`(번호 없음)·`PHONE_NOT_SUPPORTED`(010 11자리만), 409 INVALID_STATE(이미 확인됨·탈퇴 신청 이후), 429 `TOO_MANY_VERIFICATIONS`(하루 시작 횟수 초과),
          422 CONFIG_REQUIRED(서버 설정 없음). 같은 Idempotency-Key 재시도는 같은 결과(같은 본문).
      operationId: startPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '201':
          description: 시작됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerificationStart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '429':
          description: TOO_MANY_VERIFICATIONS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/phone-verifications/{verificationId}:
    get:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 상태 (0.9.0)
      operationId: getPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerification' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/phone-verifications/{verificationId}/confirmations:
    post:
      tags: [phone-verifications]
      summary: 휴대폰 번호 확인 — 고객이 문자를 보냈는지 조회 (0.9.0)
      description: |
        고객이 "보냈어요"를 눌렀을 때만 부른다(앱이 자동으로 되풀이해 부르지 않는다 — 조회마다 OCTOMO 월 한도가 줄어든다).
        - 문자가 확인되면 `VERIFIED` + 프로필 `phoneVerified=true`(프로필 version +1).
        - 아직 없으면 `PENDING`·`remainingAttempts` 감소(0 이 되면 `FAILED`·TOO_MANY_ATTEMPTS). 시간이 지났으면 `EXPIRED`. 그 사이 프로필 번호가 바뀌었으면 `FAILED`·PHONE_CHANGED.
        - 이미 끝난 확인은 OCTOMO 를 부르지 않고 그 상태를 돌려준다(재시도 안전).
        - 503 DEPENDENCY_UNAVAILABLE: OCTOMO 조회 실패·한도 초과 — 시도 횟수를 줄이지 않는다, 잠시 뒤 다시.
      operationId: confirmPhoneVerification
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 확인 결과(상태)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerification' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /me/consents:
    get:
      tags: [consents]
      summary: 현재 동의 상태 (항목별 버전·동의 시각·철회 시각)
      description: |
        항목은 늘 다섯(필수 TERMS_OF_SERVICE·PRIVACY_POLICY·AGE_OVER_14, 선택 MARKETING, 기능 필수 LOCATION_BASED_SERVICE — 0.6.0). 한 번도 고르지 않은 항목은 agreed=false·version 없음.
        `version`(고른 버전)이 `latestVersion`(현행)과 다르면 그 항목은 다시 받아야 한다 — 필수 항목이 하나라도 그렇거나 동의하지 않았으면
        `requiredConsentOutdated=true` 이고, 서버의 구매 차단 스위치(`pmart.customer.consents.purchase-gate`)가 켜져 있으면 주문(구매 가능 여부)이 막힌다. 다시 받는 곳은 POST /me/consent-changes.
      operationId: listMyConsents
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, requiredConsentOutdated]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Consent' } }
                  requiredConsentOutdated: { type: boolean, description: 필수 항목 중 현행 버전 동의가 없는 것이 있다 }
                  senderName: { type: [string, 'null'], description: '(0.6.0) 수신 동의 처리 결과 안내의 전송자 이름(설정 pmart.customer.consents.sender-name, 없으면 null)' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /me/consent-changes:
    post:
      tags: [consents]
      summary: 동의·철회 반영 (필수 약관 재동의·마케팅 수신 변경)
      description: |
        즉시 반영(APPLIED). `version` 은 그 항목의 현행 버전(GET /me/consents 의 latestVersion)이어야 한다 — 다르면 422 CONSENT_VERSION_OUTDATED.
        필수 항목은 agreed=false 로 바꿀 수 없다(422 REQUIRED_CONSENT_CANNOT_BE_WITHDRAWN — 필수 동의 철회 = 탈퇴, 탈퇴는 /me/withdrawals).
        마케팅(MARKETING)은 켜고 끌 수 있고, 철회는 주문 조회를 막지 않는다. 같은 값·같은 버전이면 바뀌지 않는다(사건 없음).
        탈퇴 신청 이후(WITHDRAW_PENDING·COMPLETED)는 동의(agreed=true)만 409 INVALID_STATE, 철회는 받는다. 탈퇴 철회 시 마케팅 동의를 자동 복원하지 않는다.
        항목마다 바뀌면 CustomerConsentChanged 발행. 결과는 GET /me/consent-changes/{requestId}(= Idempotency-Key)로 다시 본다.
        로그인 중 필수 동의 대기(AUTH_CONSENT, 토큰 없음)는 이 경로가 아니라 auth `POST /auth/social-logins/{authRequestId}/completions`.
      operationId: changeMyConsents
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [consentType, version, agreed]
                    properties:
                      consentType: { $ref: '#/components/schemas/ConsentType' }
                      version: { type: string, maxLength: 32 }
                      agreed: { type: boolean }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400':
          description: VALIDATION_FAILED (같은 항목을 두 번 보냄 등)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: REQUIRED_CONSENT_CANNOT_BE_WITHDRAWN / CONSENT_VERSION_OUTDATED / CONFIG_REQUIRED(현행 버전 설정 없음)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /me/consent-changes/{requestId}:
    get:
      tags: [consents]
      summary: 동의 변경 결과 조회
      operationId: getMyConsentChange
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/order-preferences:
    get:
      tags: [preferences]
      summary: 주문 기본 설정 조회(품절 처리 — 0.4.0)
      description: |
        0.4.0(2026-11-18): 고객 토큰만(그 밖 403). 주문서에서 "다음에도 이 품절 처리 적용"으로 저장한 값. 저장한 적 없으면 outOfStockPreference null·version 0·updatedAt null
        (앱이 자기 기본값을 쓴다 — 서버가 값을 지어내지 않는다). 계정 행이 아직 없어도 200(null).
      operationId: getMyOrderPreferences
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-18'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPreferences' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
    put:
      tags: [preferences]
      summary: 주문 기본 설정 저장(품절 처리 — 0.4.0)
      description: |
        0.4.0(2026-11-18): 고객 토큰만. 즉시 반영, 바뀌면 version +1(같은 값이면 그대로). 값은 order-service 주문 초안 `outOfStockPreference` 와 같은 enum —
        CANCEL_OOS_ONLY(품절 상품만 취소하고 나머지 배송) · CANCEL_ALL(전체 취소). 지우기(null)는 없다(400). order-service 는 이 값을 읽지 않는다 — 주문마다 초안에 보낸 값이 정본.
        X-Expected-Version 을 주면 지금 version 과 같아야 한다(아니면 409 VERSION_CONFLICT). 탈퇴 신청 이후는 409 INVALID_STATE. 같은 Idempotency-Key 는 저장 결과 재생.
      operationId: updateMyOrderPreferences
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-18'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outOfStockPreference]
              properties:
                outOfStockPreference: { $ref: '#/components/schemas/OutOfStockPreference' }
      responses:
        '200':
          description: 저장됨(지금 값)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderPreferences' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /me/addresses:
    get:
      tags: [addresses]
      summary: 주소록 조회 (권역 판정 결과 사본 포함)
      operationId: listMyAddresses
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Address' } }
                  shoppingContext: { $ref: '#/components/schemas/ShoppingContext' }
    post:
      tags: [addresses]
      summary: 주소 추가 (delivery-serviceability 권역 판정 동기 조회)
      operationId: addMyAddress
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: 추가됨 (권역 밖이어도 저장은 되며 serviceability로 구분)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: ADDRESS_LIMIT_EXCEEDED (주소록 최대 건수 정책값) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /me/addresses/{addressId}:
    get:
      tags: [addresses]
      summary: 주소 단건 조회
      operationId: getMyAddress
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: addressId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    patch:
      tags: [addresses]
      summary: 주소 수정 (초안·확정 주문은 주문 당시 사본을 써서 바뀌지 않음 — order-service shippingAddress, BR-37)
      operationId: updateMyAddress
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: addressId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
    delete:
      tags: [addresses]
      summary: 주소 삭제 (현재 쇼핑 주소면 INVALID_STATE. 초안·주문은 사본을 가져 영향 없음 — BR-37)
      operationId: deleteMyAddress
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: addressId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 삭제됨 }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /me/shopping-address-selections:
    post:
      tags: [addresses]
      summary: 현재 쇼핑 주소 선택 (shoppingContextVersion 증가, ShoppingAddressChanged 발행)
      operationId: selectShoppingAddress
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingContext' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }

  /me/shopping-context:
    get:
      tags: [addresses]
      summary: 현재 쇼핑 주소·담당 MFC·컨텍스트 버전 조회
      operationId: getShoppingContext
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShoppingContext' }

  /guest-delivery-addresses:
    post:
      tags: [addresses]
      summary: 비회원 배송지 등록 (기기 비회원 영역에서만 사용)
      operationId: createGuestDeliveryAddress
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /guest-delivery-addresses/{guestAddressId}:
    get:
      tags: [addresses]
      summary: 비회원 배송지 조회 (같은 기기만)
      operationId: getGuestDeliveryAddress
      security: []
      parameters:
        - { name: guestAddressId, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/wishlist-items:
    get:
      tags: [wishlist]
      summary: 내 찜 목록 — 최근 찜한 순 (0.13.0, ADR-0081)
      description: |
        상품명·대표 사진·대표 가격·판매 상태는 저장하지 않고 조회 때 product-content 카드(지금 쇼핑 주소의 담당 센터 기준 가용)로 채운다.
        카드를 못 읽거나 게시되지 않은 상품이면 그 칸은 null·saleState UNKNOWN(찜은 그대로 보인다).
        saleState — ON_SALE(살 수 있음) · SOLD_OUT(판매 중이나 담당 센터 가용 없음·일시 품절) · ENDED(판매 중지) · UNKNOWN(정보 없음).
      operationId: listWishlistItems
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/WishlistItem' } }
                  total: { type: integer, description: 전체 찜 수 }
                  limit: { type: integer, description: 최대 찜 수(설정, 지금 200) }

  /me/wishlist-product-ids:
    get:
      tags: [wishlist]
      summary: 내 찜 상품 ID 전체 — 상세·목록 카드 하트 표시용 (0.13.0)
      operationId: listWishlistProductIds
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK (최근 찜한 순, 최대 limit 개)
          content:
            application/json:
              schema:
                type: object
                required: [productIds, total]
                properties:
                  productIds: { type: array, items: { type: string } }
                  total: { type: integer }

  /product-wish-counts:
    get:
      tags: [wishlist]
      summary: 상품별 찜 수 (공개 — 상세 하트 아래 숫자, 0.17.0 BR-100 R3)
      operationId: listProductWishCounts
      security: []
      parameters:
        - { name: productIds, in: query, required: true, schema: { type: string, maxLength: 4000 }, description: '쉼표로 구분한 상품 ID(100개까지)' }
      responses:
        '200':
          description: OK — 요청한 순서, 찜 없으면 0
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [productId, wishCount]
                      properties:
                        productId: { type: string }
                        wishCount: { type: integer, minimum: 0 }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /me/wishlist-items/{productId}:
    put:
      tags: [wishlist]
      summary: 찜하기 (멱등 — 이미 찜했으면 그대로 200, 0.13.0)
      operationId: addWishlistItem
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 64, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200':
          description: 찜 상태(새로 찜했든 이미 있었든)
          content:
            application/json:
              schema:
                type: object
                required: [productId, addedAt, total]
                properties:
                  productId: { type: string }
                  addedAt: { type: string, format: date-time, description: 처음 찜한 시각 }
                  total: { type: integer }
        '409':
          description: INVALID_STATE (탈퇴 신청 이후)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: WISHLIST_LIMIT_EXCEEDED (최대 수 넘음 — details limit) / CONFIG_REQUIRED (max-items 미설정)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
    delete:
      tags: [wishlist]
      summary: 찜 빼기 (멱등 — 없어도 204, 0.13.0)
      operationId: removeWishlistItem
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '204': { description: 빠짐(또는 원래 없음) }

  /me/withdrawals:
    post:
      tags: [withdrawals]
      summary: 탈퇴 접수 (ACTIVE → WITHDRAW_PENDING, 신규 구매 차단)
      description: |
        접수 즉시 신규 구매를 차단하고 CustomerWithdrawalRequested를 발행한다. 완료는 order-service 미결 의무(미결 주문·불명 결제·환불·회수·분쟁) 조회가
        eligible=true일 때만 비동기로 진행되며, 완료 시 CustomerWithdrawalCompleted 발행(auth가 세션·소셜 연결 삭제). 완료된 탈퇴는 되돌리지 않는다.
      operationId: requestWithdrawal
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerToken]
              properties:
                provider: { type: string, enum: [GOOGLE, KAKAO, NAVER, APPLE], description: '(0.12.0) 재인증한 제공자 — 이 계정에 연결된 소셜이어야 한다' }
                providerToken: { type: string, description: '(0.12.0) 방금 다시 로그인해 받은 ID 토큰. 로그 금지' }
                providerAccessToken: { type: string, maxLength: 4096, x-added-in: '2026-11-25', description: '(0.18.0 BR-105) GOOGLE 만 — 재인증 직후 받은 구글 OAuth 접근 토큰. 접수되면 서버가 구글 연결을 끊는다(revoke). 저장·로그·응답 안 함. 다른 제공자는 무시' }
                reasonCode: { type: string, maxLength: 40 }
                reasonText: { type: string, maxLength: 500 }
      responses:
        '202':
          description: 접수됨(WITHDRAW_PENDING). 같은 Idempotency-Key 재전송은 같은 탈퇴 요청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '401':
          description: PROVIDER_REJECTED — 재인증 토큰 거절(만료·서명 등)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403':
          description: REAUTHENTICATION_MISMATCH — 이 계정에 연결된 소셜 계정이 아님
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_STATE (이미 WITHDRAW_PENDING/COMPLETED) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
    get:
      tags: [withdrawals]
      summary: 내 탈퇴 요청 — 최근 것부터 (0.12.0)
      operationId: listWithdrawals
      x-pmart-user-types: [CUSTOMER]
      responses:
        '200':
          description: OK (없으면 빈 목록)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Withdrawal' } }

  /me/withdrawals/{withdrawalId}:
    get:
      tags: [withdrawals]
      summary: 탈퇴 진행 상태 조회 (남은 의무 포함)
      operationId: getWithdrawal
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /me/withdrawals/{withdrawalId}/revocations:
    post:
      tags: [withdrawals]
      summary: 탈퇴 철회 (WITHDRAW_PENDING에서만, 마케팅 동의는 자동 복원하지 않음)
      operationId: revokeWithdrawal
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerToken]
              properties:
                provider: { type: string, enum: [GOOGLE, KAKAO, NAVER, APPLE] }
                providerToken: { type: string, description: '(0.12.0) 다시 로그인해 받은 ID 토큰. 로그 금지' }
      responses:
        '200':
          description: 철회됨(ACTIVE). 마케팅 동의는 복원하지 않는다
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '401':
          description: PROVIDER_REJECTED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403':
          description: REAUTHENTICATION_MISMATCH
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (이미 완료된 탈퇴는 철회 불가)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  # ---------- internal (서비스 토큰) ----------
  /customers:
    get:
      tags: [staff]
      summary: '[직원] 고객 찾기 — 고객번호·전화 완전 일치, 또는 고객 ID 여러 개 (0.11.0, CU-3·CU-4)'
      description: |
        권한 CS_AGENT·OPERATOR_ADMIN(그 밖·고객·라이더 403). `customerNumber`·`phone`·`customerIds` 중 **하나만**(둘 이상이거나 없으면 400).
        - `customerNumber`: 6자리 완전 일치. `phone`: 휴대전화 숫자(01로 시작 10~11자리, 하이픈·공백 무시) 완전 일치 — 프로필 휴대폰 번호 기준.
        - `customerIds`: 쉼표로 50개까지(백오피스 bff 가 목록·표에 "김*수 · 482913" 를 붙일 때). 없는 ID 는 빠진다.
        이름 검색·전체 목록은 없다(BackOffice 개인정보 — 목적별 제한). 응답은 가린 값만. 찾는 전화번호는 로그에 남기지 않는다. 찾기는 열람 기록을 남기지 않는다(원문이 없으므로).
      operationId: searchCustomersForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerNumber, in: query, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
        - { name: phone, in: query, schema: { type: string, maxLength: 20 } }
        - { name: customerIds, in: query, schema: { type: string, maxLength: 4000 }, description: '쉼표로 구분한 고객 ID(50개까지)' }
      responses:
        '200':
          description: OK — 찾은 고객(없으면 빈 목록)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCustomerList' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  /customers/{customerId}:
    get:
      tags: [staff]
      summary: '[직원] 고객 상세 — 가린 값만 (0.11.0, CU-4)'
      description: |
        권한 CS_AGENT·OPERATOR_ADMIN. 없는 고객 404 CUSTOMER_NOT_FOUND. 이름·전화·이메일은 가린 값만 — 원문은 `POST /customers/{customerId}/pii-reveals`.
        탈퇴한 고객은 지워진 값 그대로(가린 값 null). 상세 조회 자체는 기록하지 않는다.
      operationId: getCustomerForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCustomerDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /customers/{customerId}/pii-reveals:
    post:
      tags: [staff]
      summary: '[직원] 고객 이름·전화 원문 열람 — 사유 필수, 열람 기록 남김 (0.11.0, CU-4, ADR-0062)'
      description: |
        권한은 상세와 같다. 처리: 권한 → 고객 확인(없으면 404, 기록하지 않음) → audit-service `POST /internal/pii-access-logs` 에 **동기로** 기록
        (subjectType CUSTOMER, subjectRef = customerId, caseRef CUSTOMER:<customerId>, 항목·사유·역할) → 기록된 뒤에만 고른 항목 원문.
        **audit-service 에 닿지 않거나 결과를 모르면 503(DEPENDENCY_UNAVAILABLE·UNKNOWN_RESULT), 원문 없음**.
        멱등: 같은 직원·같은 고객·같은 Idempotency-Key 면 같은 열람 기록(같은 키에 다른 사유·항목이면 409 — audit 판정). 원문 응답은 저장하지 않는다. 사유·원문은 로그 금지.
      operationId: revealCustomerPiiForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerPiiRevealRequest' }
      responses:
        '200':
          description: 기록됨 — 고른 항목만 원문, 나머지는 null
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPiiReveal' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: 열람 기록을 남기지 못함(audit-service 미응답·결과 불명) — 원문을 주지 않는다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /customers/{customerId}/restrictions:
    get:
      tags: [staff]
      summary: '[직원] 계정 제한 이력 (0.16.0, CU-7)'
      description: 권한 CS_AGENT·OPERATOR_ADMIN. 최근 것부터 50개. 자동 정지는 source AUTO_PROFANITY·actor system.
      operationId: listCustomerRestrictionsForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [customerId, restriction, items]
                properties:
                  customerId: { type: string }
                  restriction: { $ref: '#/components/schemas/AccountRestriction' }
                  restrictedUntil: { type: [string, 'null'], format: date-time }
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerRestrictionRecord' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
    post:
      tags: [staff]
      summary: '[직원] 이용제한·정지 걸기 — 사유 필수, 지금부터 7일 (0.16.0, CU-7)'
      description: |
        권한 CS_AGENT·OPERATOR_ADMIN. `restriction` RESTRICTED(문의·리뷰 작성 막기)·SUSPENDED(주문·로그인까지 막기). 기한 = 지금 + 7일(설정
        `pmart.customer.restriction.period`, 기본 P7D — 영구 정지 없음). 지금 제한이 있으면 새 값·새 기한으로 바꾼다. 탈퇴 완료 고객 409 INVALID_STATE.
        사유 2~200자(로그·사건에 넣지 않음). 결과 CommandResponse APPLIED, resultId = 이력 ID.
      operationId: restrictCustomerForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restriction, reason]
              properties:
                restriction: { type: string, enum: [RESTRICTED, SUSPENDED] }
                reason: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '201':
          description: 걸었음
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /customers/{customerId}/restriction-releases:
    post:
      tags: [staff]
      summary: '[직원] 제한·정지 풀기 — 오인식 등, 사유 필수 (0.16.0, CU-7)'
      description: 권한 CS_AGENT·OPERATOR_ADMIN. 지금 제한이 없으면 409 NOT_RESTRICTED. 사유 2~200자. 결과 CommandResponse APPLIED.
      operationId: releaseCustomerRestrictionForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: 풀었음
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/CommandResponse' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
  /internal/accounts/{accountId}/status:
    get:
      tags: [internal]
      summary: '[order/cart/auth→customer] 계정 이용 상태 조회 (구매 가능 여부 판단 근거)'
      operationId: getAccountStatusInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accountId, status, purchasable]
                properties:
                  accountId: { type: string }
                  status: { $ref: '#/components/schemas/AccountStatus' }
                  purchasable: { type: boolean, description: 'ACTIVE이고 필수 동의 최신 버전이면 true. 필수 동의는 스위치 pmart.customer.consents.purchase-gate 가 켜졌을 때만 본다(꺼지면 ACTIVE 만 — LAN 2026-11-17 꺼짐)' }
                  requiredConsentOutdated: { type: boolean, description: '필수 항목 중 현행 버전 동의가 없는 것이 있다(0.3.0 부터 실제 값 — 그 전에는 늘 false)' }
                  restriction: { $ref: '#/components/schemas/AccountRestriction' }
                  restrictedUntil: { type: [string, 'null'], format: date-time, description: '(0.16.0) 제한 끝 시각 — NONE 이면 null' }
                  version: { $ref: '_common.yaml#/components/schemas/Version' }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /device-consents:
    get:
      tags: [device-consents]
      summary: 로그인 전(기기) 동의 상태 (0.6.0 — 처음 실행 약관)
      description: |
        토큰 없음(X-Device-Id). 항목은 MARKETING·LOCATION_BASED_SERVICE 둘. 한 번도 고르지 않았으면(또는 로그인해 계정으로 옮긴 뒤) agreed=false·version null.
      operationId: listDeviceConsents
      security: []
      x-added-in: '2026-11-19'
      parameters:
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConsentList' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /device-consent-changes:
    post:
      tags: [device-consents]
      summary: 로그인 전(기기) 동의·거부 반영 (0.6.0)
      description: |
        토큰 없음(X-Device-Id). 즉시 반영. MARKETING·LOCATION_BASED_SERVICE 만(그 밖 400 VALIDATION_FAILED — 필수 약관은 가입 때 auth 동의 단계에서).
        `version` 은 현행 버전(GET /consent-terms 의 latestVersion)이어야 한다 — 다르면 422 CONSENT_VERSION_OUTDATED. 같은 항목 두 번 400.
        같은 Idempotency-Key·같은 본문은 처음 반영을 다시 하지 않는다(응답은 지금 상태). 응답 = 반영 뒤 상태
        (처리 결과 안내 — senderName·lastChangedAt). 기기 동의는 사건을 내지 않는다(계정으로 옮길 때 CustomerConsentChanged, channel DEVICE).
      operationId: changeDeviceConsents
      security: []
      x-added-in: '2026-11-19'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [consentType, version, agreed]
                    properties:
                      consentType: { $ref: '#/components/schemas/ConsentType' }
                      version: { type: string, maxLength: 32 }
                      agreed: { type: boolean }
      responses:
        '200':
          description: 반영 뒤 기기 동의 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceConsentList' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '422':
          description: CONSENT_VERSION_OUTDATED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /consent-terms:
    get:
      tags: [device-consents]
      summary: 약관 항목·현행 버전·본문 주소 (0.6.0 — 토큰 없음)
      description: |
        처음 실행·가입·설정 화면이 항목과 버전을 정하고 펼쳐 볼 본문을 연다. 항목 다섯 — 필수 셋, 선택 MARKETING, 기능 필수 LOCATION_BASED_SERVICE(requiredFor CURRENT_LOCATION).
        `documentUrl` 은 설정 `pmart.customer.consents.documents.<항목>` → 없으면 서버가 가진 그 버전 본문의 경로 `/api/v1/consent-terms/{항목}/{버전}`(0.6.1) → 그것도 없으면 null.
      operationId: listConsentTerms
      security: []
      x-added-in: '2026-11-19'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentTermList' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /consent-terms/{consentType}/{version}:
    get:
      tags: [device-consents]
      summary: 약관 본문 (0.6.1 — 토큰 없음, Markdown)
      description: |
        항목·버전의 본문. 현행 버전이 아니어도 서버가 가진 버전이면 준다(예전에 동의한 버전 다시 보기). 없으면 404 CONSENT_TERM_NOT_FOUND.
        본문은 시연용 초안(회사 PMart, 법률 검토 전)이다 — 실제 서비스 전에 검토해 버전을 올린다.
      operationId: getConsentTermDocument
      security: []
      x-added-in: '2026-11-19'
      parameters:
        - { name: consentType, in: path, required: true, schema: { $ref: '#/components/schemas/ConsentType' } }
        - { name: version, in: path, required: true, schema: { type: string, maxLength: 32, pattern: '^[A-Za-z0-9._-]{1,32}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentTermDocument' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/accounts/{accountId}/device-consent-migrations:
    post:
      tags: [internal]
      summary: '[auth→customer] 로그인한 기기의 동의를 계정으로 옮김 (0.6.0)'
      description: |
        auth 가 로그인(회원 토큰을 준 뒤)·동의 완료 뒤 부른다. 기기의 아직 옮기지 않은 현행 버전 결정 중 **계정에 현행 버전 결정이 없는 항목만** 계정에 반영하고
        (channel DEVICE, CustomerConsentChanged) 기기 결정은 지운다(계정 값이 있던 항목도 — 계정 값이 이긴다). 계정 행이 없으면 만든다.
        다시 불러도 안전하다(이미 옮겼으면 0건). 응답 = 옮긴 항목 수.
      operationId: migrateDeviceConsentsInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string, maxLength: 128 }
      responses:
        '200':
          description: 옮긴 결과
          content:
            application/json:
              schema:
                type: object
                required: [migrated]
                properties:
                  migrated: { type: integer, minimum: 0 }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /internal/accounts/{accountId}/consents:
    get:
      tags: [internal]
      summary: '[auth→customer] 현행 버전 기준 동의 상태 — 로그인 때 필수 동의 단계(AUTH_CONSENT)를 둘지 판단 (0.3.0)'
      description: |
        계정 행이 아직 없어도(가입 중) 200 — 모든 필수 항목이 빠졌고 선택 항목은 고르지 않은 것으로 답한다.
        `missingRequired`·`undecidedOptional` 항목 형식은 `TYPE:version`(예 `TERMS_OF_SERVICE:2026-11-17`) — auth 가 AuthResult 에 그대로 싣는다.
      operationId: getAccountConsentsInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - name: deviceId
          in: query
          required: false
          description: '(0.6.0) 로그인한 기기 — 계정에 현행 버전 결정이 없는 항목은 그 기기의 (아직 옮기지 않은) 현행 버전 결정을 결정한 것으로 본다(쓰지 않음 — 옮기기는 device-consent-migrations)'
          schema: { type: string, maxLength: 128 }
        - name: fresh
          in: query
          required: false
          description: '(0.13.1, BR-72) true 면 저장된 계정·기기 동의를 무시하고 모든 필수를 missingRequired·모든 선택을 undecidedOptional 로(가입 다시 시작). 항목 목록(items)은 저장값 그대로'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /internal/accounts/{accountId}/consent-changes:
    post:
      tags: [internal]
      summary: '[auth→customer] 로그인 중 받은 동의 반영 (AUTH_CONSENT 완료, 0.3.0)'
      description: |
        auth 가 소셜 로그인 동의 완료(completions)에서 부른다 — 고객은 아직 토큰이 없다. 규칙은 POST /me/consent-changes 와 같다(현행 버전만,
        필수 항목 agreed=false 는 422). 계정 행이 없으면 만든다(가입). 응답은 반영 뒤 동의 상태 — `requiredConsentOutdated=false` 여야 auth 가 토큰을 준다.
        같은 Idempotency-Key·같은 본문은 처음 반영을 다시 하지 않는다(응답 상태는 지금 기준).
      operationId: changeAccountConsentsInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, changes]
              properties:
                channel: { type: string, enum: [SIGNUP, LOGIN], description: 'SIGNUP 신규 가입 · LOGIN 기존 회원 재동의' }
                changes:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [consentType, version, agreed]
                    properties:
                      consentType: { $ref: '#/components/schemas/ConsentType' }
                      version: { type: string, maxLength: 32 }
                      agreed: { type: boolean }
      responses:
        '200':
          description: 반영 뒤 동의 상태
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: REQUIRED_CONSENT_CANNOT_BE_WITHDRAWN / CONSENT_VERSION_OUTDATED / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/identity:
    get:
      tags: [internal]
      summary: '[auth→customer] 계정의 확인된 휴대폰 번호가 있는지 (0.10.0, ADR-0074)'
      description: 로그인마다 auth 가 묻는다(require-identity 켰을 때). 번호는 주지 않는다. 계정이 아직 없으면(가입 전) verified=false.
      operationId: getAccountIdentityInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accountId, verified]
                properties:
                  accountId: { type: string }
                  verified: { type: boolean }
                  verifiedAt: { type: [string, 'null'], format: date-time }

  /internal/accounts/{accountId}/identity-verifications:
    post:
      tags: [internal]
      summary: '[auth→customer] 가입·로그인 단계 휴대폰 확인 시작 (0.10.0, ADR-0074)'
      description: |
        `/me/phone-verifications` 와 같은 방식(고객이 OCTOMO 대표번호로 숫자 6자리를 보냄 — MO)이지만 번호를 본문으로 받는다(가입 전이라 프로필이 없을 수 있다).
        010 11자리(하이픈·공백은 뗀다). 이미 확인된 계정이면 409 IDENTITY_ALREADY_VERIFIED. 다른 계정의 번호인지는 **확인이 통과한 뒤에만** 알려 준다(번호만 넣어 남의 가입 여부를 알 수 없게).
        하루 시작 횟수·유효 시간은 phone-verification 설정과 같다. 같은 Idempotency-Key 는 같은 결과.
      operationId: startIdentityVerificationInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: '확인할 휴대폰 번호(010 11자리)' }
      responses:
        '201':
          description: 시작 — 보낼 문자 본문
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhoneVerificationStart' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '429':
          description: TOO_MANY_VERIFICATIONS — 하루 시작 횟수 초과
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/identity-verifications/{verificationId}/confirmations:
    post:
      tags: [internal]
      summary: '[auth→customer] 가입·로그인 단계 휴대폰 확인 (0.10.0, ADR-0074)'
      description: |
        OCTOMO 에 문자가 왔는지 묻는다(끝난 확인은 다시 묻지 않음 — 같은 결과). 왔으면 번호 규칙을 본다:
        그 번호가 다른 유효 계정의 확인 번호면 state FAILED·outcome IDENTITY_ALREADY_REGISTERED(existingAccountId·existingEmailMasked),
        탈퇴로 풀린 지 `pmart.customer.identity.rejoin-block` 안이면 FAILED·IDENTITY_REJOIN_BLOCKED(rejoinAvailableAt),
        아니면 VERIFIED·outcome VERIFIED — 계정의 확인 번호로 남기고 프로필 phone·phoneVerified=true(프로필이 없으면 만든다).
        아직 문자가 없으면 PENDING(남은 횟수), 기한 지나면 EXPIRED. OCTOMO 장애는 503(시도로 세지 않음).
      operationId: confirmIdentityVerificationInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - { name: verificationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerificationResult' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /internal/accounts/{accountId}/review-author:
    get:
      tags: [internal]
      summary: '[review→customer] 리뷰 작성자 표시 이름 (별명을 가린 값, 0.2.0)'
      description: |
        별명 첫 글자 + 나머지 * (예 "장보기왕" → "장***"). 별명이 없으면 "PMart 고객". 이름·이메일·전화는 내주지 않는다.
      operationId: getReviewAuthorInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accountId, displayName]
                properties:
                  accountId: { type: string }
                  displayName: { type: string }
                  restriction: { $ref: '#/components/schemas/AccountRestriction' }
                  restrictedUntil: { type: [string, 'null'], format: date-time, description: '(0.16.0 CU-7 — RESTRICTED·SUSPENDED 면 리뷰 작성 막기) 제한 끝 시각 — NONE 이면 null' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/accounts/{accountId}/shopping-context:
    get:
      tags: [internal]
      summary: '[order→customer] 주문 초안 스냅샷용 현재 쇼핑 주소·연락처'
      description: '0.8.0 — address 의 receiverName·receiverPhone 이 비어 있으면 프로필(별명 → 제공자 이름, phone)로 채워 준다. 그래도 연락처가 없으면 비어 있다(order 가 CONTACT_REQUIRED).'
      operationId: getShoppingContextInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
        - { name: shoppingAddressId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ShoppingContext'
                  - type: object
                    properties:
                      address: { $ref: '#/components/schemas/Address' }
                      phoneRef: { type: [string, 'null'], description: '원문 아님. 안심번호·마스킹 참조. 연락처가 없으면(주소·프로필 모두) null' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/accounts/{accountId}/first-purchase-checks:
    get:
      tags: [internal]
      summary: '[order→customer] 첫 구매 중복혜택 대조 (소셜 식별 5년 보존값 기준)'
      operationId: checkFirstPurchaseInternal
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId: { type: string }
                  firstPurchaseCandidate: { type: boolean, description: 대조값에 과거 첫 구매 기록이 없으면 true. 자격 점유는 order가 수행 }
                  matchedBy: { type: string, enum: [NONE, SOCIAL_IDENTITY, PHONE] }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

components:
  schemas:
    StaffCustomerSummary:
      type: object
      x-added-in: '2026-11-20'
      required: [customerId, status]
      properties:
        customerId: { type: string }
        customerNumber: { type: [string, 'null'], pattern: '^[1-9][0-9]{5}$', description: '고객번호 6자리(ADR-0070) — 화면 "김*수 · 482913"' }
        nameMasked: { type: [string, 'null'], description: '가린 이름(첫·끝 글자). 이름이 없으면 별명을 가려서, 둘 다 없으면 null' }
        phoneMasked: { type: [string, 'null'], description: '예 010-****-5678' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        restrictedUntil: { type: [string, 'null'], format: date-time }
    StaffCustomerList:
      type: object
      x-added-in: '2026-11-20'
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffCustomerSummary' } }
    StaffCustomerDetail:
      type: object
      x-added-in: '2026-11-20'
      required: [customerId, status, phoneVerified, joinedAt]
      properties:
        customerId: { type: string }
        customerNumber: { type: [string, 'null'], pattern: '^[1-9][0-9]{5}$' }
        nameMasked: { type: [string, 'null'] }
        phoneMasked: { type: [string, 'null'] }
        emailMasked: { type: [string, 'null'], description: '예 a***@k***' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        socialProvider: { type: [string, 'null'], description: '가입 방식 KAKAO·NAVER·APPLE·GOOGLE(화면 배지)' }
        phoneVerified: { type: boolean, description: '휴대폰 번호 확인됨(0.9.0 OCTOMO·0.10.0 가입 확인)' }
        joinedAt: { type: string, format: date-time }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        restrictedUntil: { type: [string, 'null'], format: date-time }
    CustomerPiiField:
      type: string
      enum: [NAME, PHONE]
    CustomerPiiRevealRequest:
      type: object
      x-added-in: '2026-11-20'
      required: [reason]
      properties:
        reason: { type: string, minLength: 2, maxLength: 200, description: '열람 사유(예 "주문 문의 — 연락"). 앞뒤 공백 제외 2자 이상. audit 에 남고 로그에는 남기지 않는다' }
        fields:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/CustomerPiiField' }
          description: 볼 항목. 없으면 둘 다
    CustomerPiiReveal:
      type: object
      x-added-in: '2026-11-20'
      properties:
        customerId: { type: string }
        piiAccessLogId: { type: string, description: audit-service 열람 기록 ID }
        recordedAt: { type: string, format: date-time }
        fields: { type: array, items: { $ref: '#/components/schemas/CustomerPiiField' } }
        name: { type: [string, 'null'], description: NAME 을 골랐을 때만 }
        phone: { type: [string, 'null'], description: PHONE 을 골랐을 때만 }
    PhoneVerificationStart:
      type: object
      required: [verificationId, state, sendTo, text, expiresAt, phoneMasked]
      properties:
        verificationId: { type: string }
        state: { type: string, enum: [PENDING] }
        sendTo: { type: string, description: '받는 번호(OCTOMO 대표번호, 예 1666-3538) — 고객이 이 번호로 보낸다' }
        text: { type: string, description: '보낼 문자 본문(숫자 6자리) — 고친 본문은 확인되지 않는다(완전 일치)' }
        expiresAt: { type: string, format: date-time }
        phoneMasked: { type: string, description: '확인할 번호(가림)' }
        maxAttempts: { type: integer, description: '확인 시도 최대 횟수' }
    PhoneVerification:
      type: object
      required: [verificationId, state, remainingAttempts, expiresAt, phoneMasked]
      properties:
        verificationId: { type: string }
        state: { type: string, enum: [PENDING, VERIFIED, FAILED, EXPIRED] }
        failureReason: { type: [string, 'null'], enum: [TOO_MANY_ATTEMPTS, PHONE_CHANGED, PHONE_ALREADY_REGISTERED, null], description: 'PHONE_ALREADY_REGISTERED(0.10.0) — 다른 계정의 확인 번호' }
        remainingAttempts: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        phoneMasked: { type: string }
        verifiedAt: { type: [string, 'null'], format: date-time }
    IdentityVerificationResult:
      type: object
      x-added-in: '2026-11-20'
      required: [verificationId, state, remainingAttempts, expiresAt]
      properties:
        verificationId: { type: string }
        state: { type: string, enum: [PENDING, VERIFIED, FAILED, EXPIRED] }
        failureReason: { type: [string, 'null'], description: 'TOO_MANY_ATTEMPTS·IDENTITY_ALREADY_REGISTERED·IDENTITY_REJOIN_BLOCKED' }
        remainingAttempts: { type: integer, minimum: 0 }
        expiresAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        outcome:
          type: [string, 'null']
          enum: [VERIFIED, IDENTITY_ALREADY_REGISTERED, IDENTITY_REJOIN_BLOCKED, null]
          description: 문자가 확인된 뒤의 번호 규칙 결과. 문자가 아직이면 null
        existingAccountId: { type: [string, 'null'], description: 'IDENTITY_ALREADY_REGISTERED — 그 번호의 계정(auth 가 제공자·가입일을 붙인다. 앱에는 주지 않음)' }
        existingEmailMasked: { type: [string, 'null'], description: '그 계정의 가린 이메일(예 a***@k***), 없으면 null' }
        rejoinAvailableAt: { type: [string, 'null'], format: date-time, description: IDENTITY_REJOIN_BLOCKED — 다시 가입할 수 있는 때 }
    OutOfStockPreference:
      type: string
      x-added-in: '2026-11-18'
      enum: [CANCEL_OOS_ONLY, CANCEL_ALL]
      description: 'order-service 주문 초안 outOfStockPreference 와 같은 값(0.4.0). CANCEL_OOS_ONLY 품절 상품만 취소 · CANCEL_ALL 전체 취소'
    OrderPreferences:
      type: object
      x-added-in: '2026-11-18'
      required: [version]
      properties:
        outOfStockPreference: { type: [string, 'null'], enum: [CANCEL_OOS_ONLY, CANCEL_ALL, null], description: '저장한 품절 처리 기본값(0.4.0). null = 저장한 적 없음' }
        version: { type: integer, minimum: 0, description: '바뀔 때마다 +1. 0 = 저장한 적 없음' }
        updatedAt: { type: [string, 'null'], format: date-time }
    AccountStatus:
      type: string
      enum: [ACTIVE, WITHDRAW_PENDING, WITHDRAW_COMPLETED]
    AccountRestriction:
      type: string
      x-added-in: '2026-11-23'
      description: '(0.16.0 CU-7) 계정 제한 — NONE 없음, RESTRICTED 이용제한(문의·리뷰 작성 막기), SUSPENDED 정지(주문·로그인까지). 늘 기한(7일)이 있고 지나면 NONE'
      enum: [NONE, RESTRICTED, SUSPENDED]
    CustomerRestrictionRecord:
      type: object
      x-added-in: '2026-11-23'
      required: [recordId, restriction, previous, source, actor, createdAt]
      properties:
        recordId: { type: string }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        previous: { $ref: '#/components/schemas/AccountRestriction' }
        restrictedUntil: { type: [string, 'null'], format: date-time }
        source: { type: string, enum: [STAFF, AUTO_PROFANITY], description: 'AUTO_PROFANITY = 문의(·AI 채팅) 정지 단어 자동 7일 정지' }
        reason: { type: [string, 'null'], description: '직원이 적은 사유(자동은 "문의에 위협·거친 말 — 자동 7일 정지")' }
        actor: { type: string, description: '건 직원 ID 또는 system:case-profanity' }
        createdAt: { type: string, format: date-time }
    ConsentType:
      type: string
      description: |
        필수 TERMS_OF_SERVICE(이용약관)·PRIVACY_POLICY(개인정보 수집·이용)·AGE_OVER_14(만 14세 이상), 선택 MARKETING(마케팅 정보 수신).
        기능 필수 LOCATION_BASED_SERVICE(위치기반서비스 이용약관, 0.6.0 BR-59 — 현재 위치 기능을 쓰기 전에만 필수, 로그인·구매 필수 목록에는 없다).
      enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, AGE_OVER_14, MARKETING, LOCATION_BASED_SERVICE]
    Consent:
      type: object
      required: [consentType, required, agreed, latestVersion]
      properties:
        consentType: { $ref: '#/components/schemas/ConsentType' }
        required: { type: boolean }
        agreed: { type: boolean, description: 마지막으로 고른 값(한 번도 고르지 않았으면 false) }
        version: { type: [string, 'null'], description: 마지막으로 고른 약관 버전. 없으면 한 번도 고르지 않음 }
        latestVersion: { type: string, description: 현행 버전. version 과 다르면 다시 받아야 한다 }
        agreedAt: { type: [string, 'null'], format: date-time, description: 마지막 동의 시각 }
        withdrawnAt: { type: [string, 'null'], format: date-time, description: 동의했다가 철회한 시각(지금 동의 중이면 없음) }
        channel: { type: [string, 'null'], enum: [SIGNUP, LOGIN, APP, DEVICE, null], description: '마지막으로 고른 곳 — SIGNUP 가입 · LOGIN 로그인 재동의 · APP 앱(설정·재동의) · DEVICE 로그인 전 기기 동의를 옮김(0.6.0)' }
        requiredFor: { type: [string, 'null'], enum: [CURRENT_LOCATION, null], description: '(0.6.0) 이 기능을 쓸 때만 필수(required=false). LOCATION_BASED_SERVICE = CURRENT_LOCATION' }
        lastChangedAt: { type: [string, 'null'], format: date-time, description: '(0.6.0) 마지막으로 바뀐(처리된) 시각 — 수신 동의 처리 결과 안내의 일시' }
    DeviceConsentList:
      type: object
      description: (0.6.0) 로그인 전 기기 동의 상태 — 항목 MARKETING·LOCATION_BASED_SERVICE
      required: [deviceId, items]
      properties:
        deviceId: { type: string }
        senderName: { type: [string, 'null'], description: 수신 동의 처리 결과 안내의 전송자 이름 }
        items: { type: array, items: { $ref: '#/components/schemas/Consent' } }
    ConsentTermDocument:
      type: object
      description: (0.6.1) 약관 본문
      required: [consentType, version, title, format, body]
      properties:
        consentType: { $ref: '#/components/schemas/ConsentType' }
        version: { type: string }
        title: { type: string, description: 본문 첫 줄 제목(# 뒤) }
        format: { type: string, enum: [MARKDOWN] }
        body: { type: string, description: 'Markdown 본문(제목 줄 포함, 표 사용)' }
    ConsentTermList:
      type: object
      description: (0.6.0) 약관 항목·현행 버전·본문 주소
      required: [items]
      properties:
        senderName: { type: [string, 'null'] }
        items:
          type: array
          items:
            type: object
            required: [consentType, required, latestVersion]
            properties:
              consentType: { $ref: '#/components/schemas/ConsentType' }
              required: { type: boolean }
              requiredFor: { type: [string, 'null'], enum: [CURRENT_LOCATION, null] }
              latestVersion: { type: string }
              documentUrl: { type: [string, 'null'] }
    ConsentStatus:
      type: object
      required: [accountId, requiredConsentOutdated, missingRequired, undecidedOptional, items]
      properties:
        accountId: { type: string }
        requiredConsentOutdated: { type: boolean, description: missingRequired 가 비어 있지 않다 }
        missingRequired:
          type: array
          items: { type: string }
          description: '현행 버전 동의가 없는 필수 항목 `TYPE:version`(현행 버전)'
        undecidedOptional:
          type: array
          items: { type: string }
          description: '현행 버전으로 아직 고르지 않은 선택 항목 `TYPE:version` — 가입·재동의 화면에서 함께 보여 줄 것'
        items: { type: array, items: { $ref: '#/components/schemas/Consent' } }
    Profile:
      type: object
      properties:
        accountId: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        nickname: { type: string }
        name: { type: string, description: 로그인 제공자(Google) 프로필 이름. 로그인마다 최신 값(ADR-0024). 없을 수 있다 }
        providerNickname: { type: string, x-added-in: '2026-11-25', description: '(0.19.0) 로그인 제공자 닉네임 — 카카오 닉네임·네이버 별명, 없으면 제공자 이름(구글은 이름). 고객이 정한 별명(nickname)과 다르다. 없을 수 있다' }
        email: { type: string, description: 로그인 제공자가 준 이메일. 없을 수 있다 }
        emailVerified: { type: boolean, description: 제공자가 이메일을 확인했는지 }
        profileImageUrl: { type: string, description: '프로필 사진 사본 경로(게이트웨이 상대 경로 `/api/v1/me/profile-image?v=…`, 본인 토큰 필요). 사본이 없으면 비어 있다' }
        photoSource: { type: string, enum: [PROVIDER, CUSTOM, NONE], x-added-in: '2026-11-21', description: '(0.15.0 BR-80) 사진 출처 — PROVIDER 로그인 계정 사진(로그인마다 최신), CUSTOM 직접 올림, NONE 기본 이미지. CUSTOM·NONE 이면 로그인해도 덮지 않는다' }
        phoneMasked: { type: [string, 'null'], description: '가린 번호(예 010-****-5678). 저장 안 했으면 null' }
        phone: { type: [string, 'null'], description: '0.7.0 — 본인에게만 가리지 않은 번호(숫자만). 배송지 받는 분 연락처 채우기용. 저장 안 했으면 null' }
        phoneVerified: { type: boolean, description: '0.7.0 — 본인 확인을 거친 번호인가. 본인 확인이 아직 없어 늘 false(번호가 없어도 false)' }
        socialProvider: { type: string, enum: [KAKAO, NAVER, APPLE, GOOGLE] }
        joinedAt: { type: string, format: date-time }
        customerNumber: { type: [string, 'null'], pattern: '^[1-9][0-9]{5}$', x-added-in: '2026-11-20', description: '(0.11.0) 고객번호 6자리 — 고객센터 문의 때 알려 주는 번호(ADR-0070)' }
        restriction: { $ref: '#/components/schemas/AccountRestriction' }
        restrictedUntil: { type: [string, 'null'], format: date-time, description: '(0.16.0 CU-7) 이용제한 끝 시각(앱 안내 "~까지 문의·리뷰를 쓸 수 없어요") — NONE 이면 null' }
        version: { $ref: '_common.yaml#/components/schemas/Version' }
    AddressInput:
      type: object
      required: [roadAddress]
      properties:
        label: { type: string, maxLength: 20 }
        roadAddress: { type: string, maxLength: 200 }
        detailAddress: { type: string, maxLength: 200, description: '회원 주소록도 선택(0.20.0 BR-106 — 없는 주소로는 주문서 DETAIL_ADDRESS_REQUIRED). 비회원 배송지는 선택(0.14.0 — 로그아웃 뒤 둘러보기용, 응답에서도 없을 수 있음)' }
        postalCode: { type: string, maxLength: 10 }
        receiverName: { type: [string, 'null'], maxLength: 50, description: '0.8.0 선택 — 없으면 주문 때 프로필 이름. PATCH 에서 빠지면 그대로' }
        receiverPhone: { type: [string, 'null'], maxLength: 20, description: '0.8.0 선택 — 없으면 주문 때 프로필 phone. PATCH 에서 빠지면 그대로' }
        entranceMethod: { type: string, enum: [FREE, PASSWORD, CALL, OTHER] }
        entranceNote: { type: string, maxLength: 100, description: 출입 비밀번호 원문은 로그 금지 }
        geo:
          type: object
          description: |
            고객이 지도 핀으로 맞춘 배달 위치(참고). 배송 가능 판정에는 쓰지 않는다 — 판정은 delivery-serviceability 가 roadAddress 를
            카카오 주소 검색으로 바꾼 좌표로 한다(ADR-0023). 그래서 roadAddress 는 주소 검색에서 고른 실제 도로명주소여야 한다.
          properties:
            lat: { type: number }
            lng: { type: number }
    Address:
      allOf:
        - $ref: '#/components/schemas/AddressInput'
        - type: object
          properties:
            addressId: { type: string }
            version: { $ref: '_common.yaml#/components/schemas/Version' }
            geoSource: { type: string, enum: [PIN, GEOCODE], x-added-in: '2026-11-18', description: '(0.5.0) geo 좌표 출처 — PIN 고객 지도 핀, GEOCODE 핀이 없어 서버가 도로명주소로 채움. geo 가 없으면 없음' }
            serviceability:
              type: object
              description: delivery-serviceability 판정 사본
              properties:
                state: { type: string, enum: [SERVICEABLE, OUT_OF_SERVICE_AREA, UNKNOWN] }
                mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
                serviceabilityVersion: { type: integer }
                asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    ShoppingContext:
      type: object
      properties:
        accountId: { type: string }
        shoppingAddressId: { type: [string, 'null'] }
        mfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        shoppingContextVersion: { type: integer }
        changedAt: { type: string, format: date-time }
    WishlistItem:
      type: object
      required: [productId, addedAt, saleState]
      description: (0.13.0) 찜 한 줄. 표시 값은 조회 때 product-content 카드에서 — 모르면 null.
      properties:
        productId: { type: string }
        addedAt: { type: string, format: date-time }
        name: { type: [string, 'null'], description: 고객용 상품명 }
        imageUrl: { type: [string, 'null'], description: '대표 사진 `/api/v1/content-images/{id}` — `?w=` 축소 가능' }
        price: { type: [integer, 'null'], format: int64, description: '대표 가격(원) — 판매 중 옵션 중 첫 옵션의 기본가, 가격 미설정이면 null' }
        saleState: { type: string, enum: [ON_SALE, SOLD_OUT, ENDED, UNKNOWN] }
    Withdrawal:
      type: object
      required: [withdrawalId, state, requestedAt]
      description: |
        (0.12.0) state — PENDING(접수, 아직 확인 전) · BLOCKED_BY_OBLIGATIONS(미결 의무 있음 — openObligations) · UNKNOWN(확인 실패, 다시 확인함 — 거래 없음으로 보지 않음)
        · COMPLETED(완료 — 이 응답 뒤 토큰은 더 쓸 수 없다) · REVOKED(철회). CHECKING_OBLIGATIONS·COMPLETING 은 쓰지 않는다(예약).
        openObligations.kind — ORDER_IN_PROGRESS · PAYMENT_UNKNOWN(order), CLAIM_IN_PROGRESS · REFUND_IN_PROGRESS · DISPUTE_OPEN(claim). ref = 주문·클레임 ID.
      properties:
        withdrawalId: { type: string }
        state: { type: string, enum: [PENDING, CHECKING_OBLIGATIONS, BLOCKED_BY_OBLIGATIONS, COMPLETING, COMPLETED, REVOKED, UNKNOWN] }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastCheckedAt: { type: [string, 'null'], format: date-time, description: 마지막 의무 확인 시각 }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        openObligations:
          type: array
          description: order-service 조회 사본
          items:
            type: object
            properties:
              kind: { type: string }
              ref: { type: string }
        obligationsAsOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
