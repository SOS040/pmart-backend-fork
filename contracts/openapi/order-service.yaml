openapi: 3.1.0
info:
  title: order-service
  version: 0.1.0
  description: |
    주문 초안·주문 원장·스냅샷·상태·이행 계획의 정본. (docs/architecture/service-map.md §2)
    사가 진행은 order-orchestration-service, PG 거래는 payment-service, 클레임 심사는 claim-service.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: drafts, description: 주문 초안(가격 동결 10분) }
  - { name: orders, description: 확정 주문 조회·변경 }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }

paths:
  /delivery-options:
    get:
      tags: [drafts]
      summary: 배송 방식별 가능 여부·사유·예상시간·배달팁·가장 빠른 예약 슬롯 (BR-13)
      description: |
        담당 MFC 기준 현재 시각(서버, Asia/Seoul)으로 판정한다. 00:00~08:00 에는 한집·알뜰을 NIGHT_TIME 으로 막고 예약만 안내한다.
        itemAmount(장바구니 selectedItemAmount 등 서버 값)를 주면 무료 사유를 적용한 배달팁을 함께 준다. 최종 금액은 주문 초안에서 확정한다.
        회원·비회원 토큰 모두 된다(비회원은 첫 구매 무료를 판정하지 않는다).
      operationId: getDeliveryOptions
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: itemAmount, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOptions' }
  /order-drafts:
    post:
      tags: [drafts]
      summary: "주문 초안 생성 (멱등: purchaseIntentId + Idempotency-Key)"
      operationId: createOrderDraft
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDraftRequest' }
      responses:
        '201':
          description: 초안 생성 또는 기존 초안 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 검증 거절 (ACCOUNT_NOT_PURCHASABLE, SKU_NOT_SALEABLE, QUANTITY_LIMIT_EXCEEDED, PRICE_NOT_SET, OUT_OF_SERVICE_AREA, SERVICEABILITY_UNKNOWN, MFC_CHANGED(409), WEIGHT_UNSPLITTABLE, CONFIG_REQUIRED). 최소주문 미달·배송 방식 불가·슬롯 문제는 거절이 아니라 초안 blockers 로 준다(모든 사유 표시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /order-drafts/{draftId}:
    get:
      tags: [drafts]
      summary: 초안 조회 (견적·유효시간·자원 확보 상태)
      operationId: getOrderDraft
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /order-drafts/{draftId}/checkouts:
    post:
      tags: [drafts]
      summary: 결제 진입 요청 → order-orchestration S1 시작
      description: |
        가격 동결(quoteExpiresAt)과 acceptedQuoteVersion을 검증한 뒤 사가를 시작한다.
        응답 ACCEPTED는 "사가 시작"이지 재고·슬롯·결제 성공이 아니다. 진행은 GET /order-drafts/{draftId}로 조회(resultId = orderId).
        진행 중이면 status RESOURCE_PENDING·nextAction WAIT, 결제창을 열 수 있으면 PAYMENT_PENDING·PAY 와 payment, 실패하면 DRAFT·REVIEW 와 checkoutFailure.
        같은 초안에 진행 중인 결제 진입이 있으면 그 진입을 그대로 돌려준다(409 아님). 2026-10-31 단계: 결제 시작까지(승인 대사·주문 확정은 다음 단계).
      operationId: startCheckout
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedQuoteVersion, paymentMethod]
              properties:
                acceptedQuoteVersion: { type: integer }
                paymentMethod: { type: string, enum: [TOSS_PAYMENTS] }
                consents:
                  type: array
                  items: { type: object, properties: { consentType: { type: string }, version: { type: string } } }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RE_QUOTE_REQUIRED (10분 경과·acceptedQuoteVersion 불일치) / CHECKOUT_BLOCKED (초안 blockers 가 남음) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders:
    get:
      tags: [orders]
      summary: 본인 주문 목록 (조회 기간은 정책값)
      operationId: listOrders
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }

  /orders/{orderId}:
    get:
      tags: [orders]
      summary: 주문 상세 (스냅샷 + 소유 시스템 확정 결과의 조합, 원천별 asOf 표시)
      operationId: getOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/reservation-time-changes:
    post:
      tags: [orders]
      summary: 예약배달 시간 변경 (상품준비 진입 전만) → S4
      operationId: requestReservationTimeChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newArrivalWindow]
              properties:
                newArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: INVALID_STATE (이미 상품준비 진입) / VERSION_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /orders/{orderId}/reservation-time-changes/{requestId}:
    get:
      tags: [orders]
      summary: 시간 변경 요청 결과 조회 (PENDING/CONFIRMED/REJECTED/UNKNOWN)
      operationId: getReservationTimeChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, CONFIRMED, REJECTED, UNKNOWN] }
                  reason: { type: string }
                  newVersion: { type: integer }

  # ---------- internal (서비스 토큰) ----------
  /internal/orders/{orderId}/confirmation:
    post:
      tags: [internal]
      summary: '[orchestration→order] 주문 확정 (PG 승인 대사 일치 + 자원 확정 후)'
      operationId: confirmOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentAttemptId, pgTransactionId, approvedAmount, reservationId]
              properties:
                paymentAttemptId: { type: string }
                pgTransactionId: { type: string }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                reservationId: { type: string }
                capacityHoldId: { type: string }
                slotHoldId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: AMOUNT_MISMATCH → 확정 차단, 대사 대상
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/orders/{orderId}/line-quantity-changes:
    post:
      tags: [internal]
      summary: '[orchestration/claim→order] 주문행 수량 변경 (결품·출고 전 취소·인계 누계·반품 수량 반영)'
      operationId: applyLineQuantityChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                reason: { type: string, enum: [SHORTAGE, CANCEL_BEFORE_SHIP, HANDOVER, RETURN, EXCHANGE] }
                sourceRef: { type: string, description: stopRequestId / handoverId / claimId }
                changes:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: 불변식 위반 (원수량 ≠ 미이행 + 인계 누계 + 출고 전 취소 누계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/withdrawal-eligibility:
    get:
      tags: [internal]
      summary: '[customer→order] 탈퇴 가능 여부 (미결 주문·불명 결제·환불·회수·분쟁)'
      operationId: getWithdrawalEligibility
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  openObligations:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, ref: { type: string } } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/order-lines/{orderLineId}/delivery-facts:
    get:
      tags: [internal]
      summary: '[review/claim→order] 품목별 실제 배송완료 시각·수량 (리뷰 14일·반품 기한 근거)'
      operationId: getOrderLineDeliveryFacts
      parameters:
        - { name: orderLineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderLineId: { type: string }
                  deliveredQty: { type: integer }
                  deliveredAt: { type: string, format: date-time }
                  deliveryId: { type: string }
                  evidenceRef: { type: string }

  /internal/customer-commitments:
    get:
      tags: [internal]
      summary: '[replenishment→order] 확정 미이행 고객 약속 C (센터·SKU·기간)'
      operationId: listCustomerCommitments
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: string }
                        orderLineId: { type: string }
                        sku: { type: string }
                        committedQty: { type: integer }
                        dueAt: { type: string, format: date-time }
                        state: { type: string, enum: [VALID, BLOCKED] }
                        version: { type: integer }

components:
  schemas:
    OrderStatus:
      type: string
      enum: [DRAFT, RESOURCE_PENDING, PAYMENT_PENDING, PAYMENT_UNKNOWN, CONFIRMED, PREPARING, PARTIALLY_HANDED_OVER, IN_DELIVERY, PARTIALLY_DELIVERED, COMPLETED, CANCELLED, EXPIRED]
    ArrivalWindow:
      type: object
      required: [date, start, end]
      properties:
        date: { type: string, format: date, description: Asia/Seoul }
        start: { type: string, example: '13:00' }
        end: { type: string, example: '14:00' }
    CreateDraftRequest:
      type: object
      required: [purchaseIntentId, items, shoppingAddressId, deliveryMode, outOfStockPreference]
      properties:
        purchaseIntentId: { type: string, description: 동일 주문 의도 식별 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [cartItemId, sku, quantity]
            properties:
              cartItemId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        shoppingAddressId: { type: string }
        expectedMfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
        contact: { type: object, properties: { phoneRef: { type: string } } }
        deliveryNote: { type: string, maxLength: 200 }
        bagOptOut: { type: boolean, description: 봉투 미사용 선택이어도 봉투값 100원은 청구 }
    Quote:
      type: object
      properties:
        quoteVersion: { type: integer }
        quoteExpiresAt: { type: string, format: date-time, description: 초안 생성 + 10분 }
        priceVersion: { type: integer }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 오퍼·프로모션 후, 쿠폰 전 상품액 }
        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTipReason: { type: string, enum: [STANDARD, OVER_30000, FIRST_PURCHASE, NONE] }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money', example: 100 }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        minOrderSatisfied:
          type: boolean
          description: 최소 주문금액 15000원은 쿠폰 전 상품액 기준
        weightG: { type: integer }
        plannedShipments:
          type: integer
          description: 총 상품중량 10000g 초과 시 2 이상
        minOrderAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 최소 주문 상품액(15,000). 배달팁·봉투값 제외 }
        minOrderShortfall: { $ref: '_common.yaml#/components/schemas/Money', description: '부족액 = max(0, minOrderAmount − itemAmount). "N원 더 담기" 표시용 (BR-14)' }
        deliveryTipBase: { $ref: '_common.yaml#/components/schemas/Money', description: 무료 사유 적용 전 방식별 배달팁(한집 4,000·알뜰/예약 3,000) }
        firstPurchaseBenefit:
          type: string
          enum: [EXPECTED, CHECKING_OTHER_ORDER, CONFIRMED, NOT_ELIGIBLE]
          description: '첫 구매 무료배달 상태(Commerce 8.8, BR-14). 초안 단계는 EXPECTED 까지 — 자격 확보(CONFIRMED)는 결제 진입 때 order 가 한다. 30,000원 이상 무료면 사유는 OVER_30000 이고 이 값은 참고용'
    DraftLine:
      type: object
      description: 서버가 받아들인 품목 (BR-21)
      properties:
        cartItemId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        weightG: { type: integer }
    DraftDelivery:
      type: object
      description: 서버가 받아들인 배송 조건 (BR-21). 주소 원문은 주문 확정 때 스냅샷한다
      properties:
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        shoppingAddressId: { type: string }
        deliveryNote: { type: string }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
    DraftBlocker:
      type: object
      description: '결제 진입을 막는 사유. 모두 보여 주고 주버튼에는 첫 사유(MIN_ORDER_AMOUNT → DELIVERY_MODE_UNAVAILABLE → SLOT_REQUIRED/SLOT_UNAVAILABLE 순)'
      required: [code]
      properties:
        code: { type: string, enum: [MIN_ORDER_AMOUNT, DELIVERY_MODE_UNAVAILABLE, SLOT_REQUIRED, SLOT_UNAVAILABLE] }
        detail: { type: string }
    DeliveryOption:
      type: object
      required: [mode, availability]
      properties:
        mode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        availability: { type: string, enum: [AVAILABLE, UNAVAILABLE, CONFIG_REQUIRED, UNKNOWN] }
        unavailableReason:
          type: [string, 'null']
          enum: [NIGHT_TIME, CENTER_CLOSED, NO_SLOT, CONFIG_REQUIRED, LOOKUP_FAILED, null]
          description: 'NIGHT_TIME = 00:00~08:00 실제 배송 없음(예약만). 조회 실패(LOOKUP_FAILED)를 배달 불가로 표시하지 않는다'
        eta: { $ref: '_common.yaml#/components/schemas/PolicyValue', description: '예상 소요시간 {minMinutes, maxMinutes}. 정책값 미설정이면 NOT_SET' }
        deliveryTip:
          type: object
          properties:
            base: { $ref: '_common.yaml#/components/schemas/Money' }
            applied: { type: [integer, 'null'], description: itemAmount 를 주면 무료 사유 적용 금액. 안 주면 null }
            reason: { type: [string, 'null'], enum: [STANDARD, OVER_30000, FIRST_PURCHASE, null] }
        earliestSlot: { $ref: '#/components/schemas/ArrivalWindow' }
    DeliveryOptions:
      type: object
      properties:
        mfcId: { type: string }
        evaluatedAt: { type: string, format: date-time }
        options: { type: array, items: { $ref: '#/components/schemas/DeliveryOption' } }
    ResourceState:
      type: object
      properties:
        inventoryReservation: { type: string, enum: [NOT_REQUESTED, HELD, FAILED, RELEASED, UNKNOWN, PAYMENT_PENDING_HOLD] }
        capacityHold: { type: string, enum: [NOT_REQUESTED, HELD, FAILED, RELEASED, UNKNOWN] }
        slotHold: { type: string, enum: [NOT_REQUIRED, HELD, FAILED, RELEASED, UNKNOWN] }
        payment: { type: string, enum: [NOT_STARTED, STARTED, APPROVED, FAILED, UNKNOWN, MISMATCH] }
        reservationExpiresAt: { type: string, format: date-time }
    OrderDraft:
      type: object
      properties:
        draftId: { type: string }
        purchaseIntentId: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mfcId: { type: string }
        quote: { $ref: '#/components/schemas/Quote' }
        resources: { $ref: '#/components/schemas/ResourceState' }
        nextAction: { type: string, enum: [REVIEW, RE_QUOTE, PAY, WAIT, DONE, EXPIRED] }
        orderId: { type: string, description: 결제 진입(checkouts) 때 발급. 결제·재고 예약·슬롯이 이 ID 를 쓴다. 확정 전에는 주문 조회 대상이 아니다 }
        payment:
          type: object
          description: nextAction=PAY 일 때만. 결제창(토스 결제위젯) 진입 정보 — 비밀값 없음. 결제창의 orderId 는 pgOrderId
          properties:
            paymentAttemptId: { type: string }
            amount: { $ref: '_common.yaml#/components/schemas/Money' }
            orderName: { type: string }
            provider: { type: string, enum: [TOSS_PAYMENTS] }
            pgOrderId: { type: string }
            clientKey: { type: string }
            checkoutUrl: { type: string }
            expiresAt: { type: string, format: date-time, description: 이 시각까지 결제창 인증을 끝내야 한다(재고 예약·슬롯·가격 동결 중 가장 이른 만료) }
        checkoutFailure:
          type: object
          description: 마지막 결제 진입이 자원 확보·결제 시작에서 실패했을 때. 확보했던 자원은 해제된다(이번 시도분만). 견적이 유효하면 다시 결제 진입할 수 있다
          properties:
            step: { type: string, description: 실패 단계(RESERVE_INVENTORY·HOLD_CAPACITY·HOLD_SLOT·START_PAYMENT·AWAIT_PAYMENT_RESULT 등) }
            code: { type: string, description: 예 INSUFFICIENT_STOCK·SKU_NOT_HANDLED·CAPACITY_EXCEEDED·SLOT_NOT_SELECTABLE·CONFIG_REQUIRED·RESOURCE_EXPIRED }
            message: { type: string }
        lines: { type: array, items: { $ref: '#/components/schemas/DraftLine' } }
        delivery: { $ref: '#/components/schemas/DraftDelivery' }
        blockers: { type: array, items: { $ref: '#/components/schemas/DraftBlocker' } }
        createdAt: { type: string, format: date-time }
    OrderLine:
      type: object
      properties:
        orderLineId: { type: string }
        sku: { type: string }
        productName: { type: string, description: 주문 당시 스냅샷 }
        unitsPerSku: { type: integer }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
        originalQty: { type: integer }
        unfulfilledQty: { type: integer }
        handedOverQty: { type: integer }
        cancelledBeforeShipQty: { type: integer }
        deliveredQty: { type: integer }
        returnedQty: { type: integer }
    Shipment:
      type: object
      properties:
        shipmentId: { type: string }
        deliveryId: { type: string }
        lines: { type: array, items: { type: object, properties: { orderLineId: { type: string }, qty: { type: integer } } } }
        weightG: { type: integer }
        state: { type: string, enum: [PLANNED, PREPARING, READY, HANDED_OVER, IN_DELIVERY, DELIVERED, FAILED, CANCELLED] }
        eta: { type: string, format: date-time }
    Order:
      type: object
      properties:
        orderId: { type: string }
        version: { type: integer }
        status: { $ref: '#/components/schemas/OrderStatus' }
        mfcId: { type: string }
        deliveryMode: { type: string }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        quote: { $ref: '#/components/schemas/Quote' }
        lines: { type: array, items: { $ref: '#/components/schemas/OrderLine' } }
        shipments: { type: array, items: { $ref: '#/components/schemas/Shipment' } }
        payment:
          type: object
          properties:
            paymentAttemptId: { type: string }
            state: { type: string }
            refundedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        claims: { type: array, items: { type: object, properties: { claimId: { type: string }, type: { type: string }, state: { type: string } } } }
        sources:
          type: array
          description: 조합한 원천별 기준시각
          items:
            type: object
            properties:
              system: { type: string }
              asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
    OrderSummary:
      type: object
      properties:
        orderId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        orderedAt: { type: string, format: date-time }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        itemCount: { type: integer }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
