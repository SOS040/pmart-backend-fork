openapi: 3.1.0
info:
  title: order-service
  version: 0.18.0
  description: |
    0.18.0(2026-11-21, ADR-0082 쿠폰·기간 할인 3단계 — 사용자 "응"): 주문서 `couponId`(장바구니 쿠폰 1장, 고객만). 견적이 기간 할인·쿠폰을 넣는다(pricing 0.2.0) —
    Quote `baseItemAmount`(정가)·`promotionDiscount`·`itemAmount`(기간 할인 뒤·쿠폰 전 — 최소 주문·무료 배달 판정)·`couponDiscount`·`coupon`{couponId, applicable, reason, name},
    `totalAmount` = itemAmount − couponDiscount + 배달팁 + 봉투값. 쓸 수 없는 쿠폰을 골랐으면 차단 사유 `COUPON_NOT_APPLICABLE`(detail = 사유) — 쿠폰을 빼고 주문서를 다시 만든다.
    DraftLine·OrderLine `discountShare`(기간 할인 + 쿠폰 안분). 결제 진입 때 쿠폰을 점유하고(promotion), 주문 확정 → 사용, 결제 실패·중단 → 해제, 주문 전체 취소 → 복원(원래 기한 안).
    내부 주문 `couponDiscount`(claim 환불 — 상품 환불액 = itemAmount − couponDiscount).
    0.17.0(2026-11-20 BR-68 — 사용자 "추천대로"): 고객 주문 목록 `GET /orders` 한 줄(OrderSummary)에 ① `lines` — 앞 주문행 최대 5개(line 순, 주문 당시 사본 — orderLineId·productId·sku·productName·optionLabel·quantity·lineAmount, 전체 수량은 그대로 itemCount)
    ② `mfcName` — 주문한 센터 이름(상세 0.15.0 `mfcName` 과 같은 값, 모르면 null). 지금 구매 가능 여부(R3)는 싣지 않는다(사용자 결정). 기간 `to` 는 0.12.0 부터 있다(그대로 — Asia/Seoul 날짜, 포함, from > to 400).
    0.16.0(2026-11-20, ADR-0077 고객 탈퇴): 내부 `GET /internal/accounts/{accountId}/withdrawal-eligibility` 구현 — 끝나지 않은 주문(ORDER_IN_PROGRESS)·결과 모르는 결제(PAYMENT_UNKNOWN).
    0.15.0(2026-11-19, 고객 앱 BR-61·BR-62 — 사용자 "응 바로 만들고 고객이 센터 이름 보여도 돼"): 고객 주문 조회 `GET /orders/{orderId}` 에
    ① `shipments[]` — **배차로 배송이 생긴 뒤부터**(delivery-dispatch `DeliveryCreated`) `{shipmentId, deliveryId, state, lines[]}`, 고객에게 가는 배송(FORWARD·RESHIPMENT)만,
    분할·재발송이면 배송마다 한 줄, 배송 전에는 빈 배열. state: 배송 생성·배정 READY → 픽업 IN_DELIVERY → 전달 DELIVERED / 실패 FAILED / 픽업 전 취소 CANCELLED(뒤로 가지 않음).
    ② `mfcName` — 주문한 센터 이름(center-master 센터 이름, 고객 공개 — 사용자 결정 2026-11-19). 모르면 null.
    0.14.2(2026-11-19, CL-5): 수량 변경 요청에 선택 `cancelReason`(클레임 취소 사유 — CHANGE_OF_MIND·OUT_OF_STOCK·DISPATCH_UNAVAILABLE 등) → `OrderCancelled.cancelReason` 에 싣는다.
    `reason` 은 그대로 수량 의미(CANCEL_BEFORE_SHIP). 알림이 사유별 문구(품절·배차 불가)를 고른다.
    0.14.1(2026-11-19, 고객 앱 알림 레퍼런스 — 사용자 "응 해줘"): 내부 주문 조회 `InternalOrder` 에 `deliveryMode`·`arrivalWindow`(예약배달만) — notification 의 "준비 중" 알림 문구용.
    0.14.0(2026-11-19, 클라이언트 BR-60 — 사용자 "응 해줘"): 초안 배송지 사본의 받는 분·연락처는 customer 가 주소 → 프로필 순으로 채운 값이다.
    연락처가 끝내 없으면 막힘 **CONTACT_REQUIRED**(앱은 "내 연락처"를 받아 `POST /me/profile-changes {phone}` 뒤 초안을 다시 만든다 — 주문만의 연락처 칸은 두지 않는다, R3 (가)).
    받는 분 이름은 없을 수 있다(R4 — 프로필 이름도 없을 때, 드묾): `ShippingAddress.receiverName`·`DropInfo.receiverName` null 가능.
    0.13.0(2026-11-18, O-8 — 백오피스 대시보드 D2·D3, 사용자 "PC 2 추천대로"): 직원(OPERATOR_ADMIN 만) 기간 집계 `GET /orders/metrics/summary`(상태별 주문 수·결제 승인 금액 합·건수)·`GET /orders/metrics/top-products`(SKU별 확정 수량 − 출고 전 취소 수량과 그 금액, 상위 N). 기준 날짜 = 주문 확정 시각(`confirmedAt`)의 한국 날짜(Asia/Seoul), from·to 둘 다 포함·필수, 93일 이하. **환불은 빼지 않는다**(환불은 claim-service `GET /claims/metrics/refunds` 로 따로 — 순매출을 만들지 않음). 개인정보 없음.
    0.12.1(2026-11-18, 사용자 "추천대로"): 최소 주문 상품액(BR-14, `Quote.minOrderAmount`)을 설정 저장소 공통 값 `pmart.commerce.min-order-amount`(cart-service 와 같은 한 값, LAN 15000)에서 읽는다. 설정이 없으면 새 주문 초안이 422 CONFIG_REQUIRED(0·무제한으로 바꾸지 않는다).
    0.12.0(2026-11-18, 고객 앱 주문 내역 — 사용자 "A해줘"): 주문 목록 `GET /orders` 한 줄에 대표 상품 `representativeItem`(첫 주문행의 productId·sku·주문 당시 상품명 사본)과 `deliveryMode` 추가(앱은 "<이름> 외 N개", 썸네일은 productId 로 따로). 목록 조회 조건 `from`·`to`(Asia/Seoul 날짜, 둘 다 포함)·`q`(어느 행이든 상품명 사본 부분 일치, 대소문자 무시) — **둘 다 없으면 최근 3개월**(오늘(Asia/Seoul) 3개월 전 날짜부터). 주문 내역 삭제 = 숨김 `POST /orders/{orderId}/hides`(본인·끝난 주문 COMPLETED·CANCELLED·EXPIRED 만, 아니면 409 ORDER_NOT_FINISHED, 두 번 숨겨도 그대로 APPLIED, 되돌리기 없음) — 숨긴 주문은 목록에서 빠지고 상세 `GET /orders/{orderId}` 는 그대로(클레임·환불이 가리킨다).
    0.11.3(2026-11-18, mfc-inventory IV-1 — PR 세션 요청 #122): 주문 초안 재고 확인(INSUFFICIENT_STOCK)이 mfc-inventory 출하 가능 수량 `shippableAvailable`(예약과 같은 소비기한 적격 LOT 만)로 판정 — 예약 주문은 도착 예정일 기준(`deliveryDate`), 그 밖은 오늘. 판정 불가(null)는 막지 않음. API 모양은 그대로(설명만).
    0.11.2(2026-11-17, O-7 — claim CL-1 추가 결정 9): 행 반품 수량 returnedQty 가 채워진다 — claim 반품 종결(ClaimClosed outcome RETURN_REFUNDED·RETURN_SHORT_CLOSED, order.claim.v1)의 returnedLines 를 더함(클레임 하나에 한 번, 한도 전달 − 이미 반품, 넘으면 반영 없이 대사 MISMATCH). 주문 상태는 그대로, 버전 +1·OrderLineQuantityChanged(reason RETURN·returnedQty·claimId). API 모양은 그대로(설명만).
    0.9.0(2026-11-16, ADR-0065 오배송 고객 잘못): 상담원이 기록하는 실제 집 주소 `POST /orders/lookups/{orderId}/redelivery-destinations`(다시 배송 — 일반 주소 변경 아님, 기록자·사유를 남김), 내부 조회 `GET /internal/orders/{orderId}/redelivery-destinations/{destinationId}`. 다시 배송 완료(DeliveryCompleted purpose MISDELIVERY_REDELIVERY)는 수량에 다시 세지 않는다.
    0.9.0(2026-11-16, 오배송 재발송 — ADR-0052 결정 4·5, 사용자 "새상품 재배차 서비스 넣어" → "전부 PR로", 작성 PC 5 — platform 검토): 수량 변경 사유 RESHIPMENT(미이행 +q·재발송 +q — 같은 수량을 재발송과 환불로 겹치지 않게 원장에), 내부 조회 행 reshippedQty. 재발송 상품의 인계·전달은 기존 O-1 그대로 받는다(보낼 수량에 재발송 포함).
    주문 초안·주문 원장·스냅샷·상태·이행 계획의 정본. (docs/architecture/service-map.md §2)
    사가 진행은 order-orchestration-service, PG 거래는 payment-service, 클레임 심사는 claim-service.
    0.4.0(2026-11-15): 직원용 주문 상세의 배송지는 가려서 주고(shippingAddressMasked), 원문은 사유를 적은 열람 요청(pii-reveals)으로만 —
    audit-service 개인정보 열람 기록(BO-25)이 남아야 준다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: drafts, description: 주문 초안(가격 동결 10분) }
  - { name: orders, description: 확정 주문 조회·변경 }
  - { name: internal, description: 서비스 간 조회(서비스 토큰) }
  - { name: fulfillment-issues, description: '이행 확인 필요(재고 보류 — 운영자 확인, 자동 처리 없음)' }
  - { name: order-lookups, description: '직원용 주문 검색·상세(백오피스 고객센터·라이더 운영, 0.3.0) + 개인정보 원문 열람(기록 남김, 0.4.0)' }
  - { name: order-metrics, description: '직원용 기간 집계(백오피스 대시보드 D2·D3, 0.13.0) — OPERATOR_ADMIN 만' }

paths:
  /fulfillment-issues:
    get:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 주문 목록 — 운영자 (0.2.0)
      description: |
        2026-11-08 사용자 결정(외부 검토 #5 반영): MFC 재고가 격리·실사 손실로 주문 예약 일부를 보류(ReservationBlocked, 다른 LOT 으로도 못 다시 잡음)하면
        주문을 "확인 필요"로 표시해 담당자가 보게 한다. **자동 취소·환불·LOT 대체·고객 안내는 하지 않는다**(정책 확정 전) — 주문 상태도 바꾸지 않는다.
        그 센터 운영자(centers 에 mfcId), 또는 OPERATOR_ADMIN(모든 센터 — 0.6.0, 2026-11-15 BO-12 처리 대기 메뉴: mfcId 를 비우면 모든 센터). 기본은 OPEN.
      operationId: listFulfillmentIssues
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: mfcId, in: query, required: false, schema: { type: string }, description: '센터 운영자는 필수(없으면 403). OPERATOR_ADMIN 은 비우면 모든 센터(0.6.0)', x-added-in: '2026-11-15' }
        - { name: state, in: query, schema: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED] } }
      responses:
        '200':
          description: OK (새 것부터, 최대 500)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FulfillmentIssue' } }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /fulfillment-issues/{issueId}/acknowledgements:
    post:
      tags: [fulfillment-issues]
      summary: 이행 확인 필요 — 담당자 확인 (0.2.0)
      description: 확인 표시만 한다(처리 내용은 note). 그 센터 운영자 또는 OPERATOR_ADMIN(0.6.0). 이미 확인했으면 지금 상태.
      operationId: acknowledgeFulfillmentIssue
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: issueId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 확인됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FulfillmentIssue' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /delivery-options:
    get:
      tags: [drafts]
      summary: 배송 방식별 가능 여부·사유·예상시간·배달팁·가장 빠른 예약 슬롯 (BR-13)
      description: |
        담당 MFC 기준 현재 시각(서버, Asia/Seoul)으로 판정한다. 00:00~08:00 에는 한집·알뜰을 NIGHT_TIME 으로 막고 예약만 안내한다.
        itemAmount(장바구니 selectedItemAmount 등 서버 값)를 주면 무료 사유를 적용한 배달팁을 함께 준다. 최종 금액은 주문 초안에서 확정한다.
        회원·비회원 토큰 모두 된다(비회원은 첫 구매 무료를 판정하지 않는다).
      operationId: getDeliveryOptions
      x-pmart-user-types: [CUSTOMER, GUEST]
      parameters:
        - { name: mfcId, in: query, required: true, schema: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        - { name: itemAmount, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryOptions' }
  /order-drafts:
    post:
      tags: [drafts]
      summary: "주문 초안 생성 (멱등: purchaseIntentId + Idempotency-Key)"
      operationId: createOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDraftRequest' }
      responses:
        '201':
          description: 초안 생성 또는 기존 초안 반환(같은 키·같은 본문)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: 검증 거절 (ACCOUNT_NOT_PURCHASABLE, SKU_NOT_SALEABLE, **INSUFFICIENT_STOCK**(0.8.0, 2026-11-16 — 담당 센터 가용이 주문 수량보다 적거나 취급 안 함, 초안을 만들지 않음 = 주문서 진입 금지. details[] field = sku, reason = `requestedQty=<q>;availableQty=<a>` 또는 `NOT_HANDLED`. 가용 조회 불명이면 막지 않고 결제 단계 재고 예약이 최종. 0.11.3(2026-11-18) — 가용 = mfc-inventory 출하 가능 수량 `shippableAvailable`(예약과 같은 소비기한 적격 — 예약 주문은 도착 예정일 기준), 판정 불가(null)는 불명으로 막지 않음), QUANTITY_LIMIT_EXCEEDED, PRICE_NOT_SET, OUT_OF_SERVICE_AREA, SERVICEABILITY_UNKNOWN, MFC_CHANGED(409), WEIGHT_UNSPLITTABLE, CONFIG_REQUIRED). 최소주문 미달·배송 방식 불가·슬롯 문제는 거절이 아니라 초안 blockers 로 준다(모든 사유 표시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '503': { $ref: '_common.yaml#/components/responses/DependencyUnavailable' }

  /order-drafts/{draftId}:
    get:
      tags: [drafts]
      summary: 초안 조회 (견적·유효시간·자원 확보 상태)
      operationId: getOrderDraft
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDraft' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /order-drafts/{draftId}/checkouts:
    post:
      tags: [drafts]
      summary: 결제 진입 요청 → order-orchestration S1 시작
      description: |
        가격 동결(quoteExpiresAt)과 acceptedQuoteVersion을 검증한 뒤 사가를 시작한다.
        응답 ACCEPTED는 "사가 시작"이지 재고·슬롯·결제 성공이 아니다. 진행은 GET /order-drafts/{draftId}로 조회(resultId = orderId).
        진행 중이면 status RESOURCE_PENDING·nextAction WAIT, 결제창을 열 수 있으면 PAYMENT_PENDING·PAY 와 payment, 실패하면 DRAFT·REVIEW 와 checkoutFailure.
        같은 초안에 진행 중인 결제 진입이 있으면 그 진입을 그대로 돌려준다(409 아님). 2026-10-31 단계: 결제 시작까지(승인 대사·주문 확정은 다음 단계).
      operationId: startCheckout
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: draftId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptedQuoteVersion, paymentMethod]
              properties:
                acceptedQuoteVersion: { type: integer }
                paymentMethod: { type: string, enum: [TOSS_PAYMENTS] }
                consents:
                  type: array
                  items: { type: object, properties: { consentType: { type: string }, version: { type: string } } }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: RE_QUOTE_REQUIRED (10분 경과·acceptedQuoteVersion 불일치) / CHECKOUT_BLOCKED (초안 blockers 가 남음) / ACCOUNT_NOT_PURCHASABLE (초안 뒤 계정이 구매 불가로 바뀜 — 결제 진입 때 다시 확인, BR-37) / CONFIG_REQUIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders:
    get:
      tags: [orders]
      summary: 본인 주문 목록 (기간·상품명 검색, 기본 최근 3개월)
      description: |
        고객 토큰만(그 밖 403). 본인의 확정 주문만 최근 확정 순(confirmedAt 내림차순). 결제 진입 전·확정 전 주문 ID 는 나오지 않는다 — 진행은 초안 조회로.
        page.nextCursor 는 불투명 문자열(다음 쪽 cursor 로 그대로 — 다음 쪽도 같은 status·from·to·q 를 함께 보낸다).
        itemCount 는 주문행 수량 합.
        0.17.0(2026-11-20 BR-68): 한 줄에 앞 주문행 `lines`(최대 5개, 주문 당시 사본)·센터 이름 `mfcName`.
        0.12.0(2026-11-18): 기간 `from`·`to` 는 Asia/Seoul 달력 날짜(확정 시각 기준, 둘 다 그 날을 포함). **둘 다 없으면 최근 3개월** — 오늘(Asia/Seoul)에서 3개월 전 날짜 0시부터 지금까지.
        하나만 주면 그쪽만 자른다(from 만 → 그날부터 지금까지, to 만 → 처음부터 그날까지). from > to 는 400.
        `q` 는 어느 주문행이든 주문 당시 상품명 사본(productName)에 부분 일치(대소문자 무시, 앞뒤 공백 제거 — 비면 무시, 100자 상한). 상품명 사본이 없는 행(2026-11-02 이전)은 검색되지 않는다.
        숨긴 주문(`POST /orders/{orderId}/hides`)은 나오지 않는다.
      operationId: listOrders
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - $ref: '_common.yaml#/components/parameters/PageSize'
        - $ref: '_common.yaml#/components/parameters/PageCursor'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: from, in: query, required: false, schema: { type: string, format: date }, description: '이 날(Asia/Seoul)부터 — 포함(0.12.0). from·to 둘 다 없으면 최근 3개월', x-added-in: '2026-11-18' }
        - { name: to, in: query, required: false, schema: { type: string, format: date }, description: '이 날(Asia/Seoul)까지 — 포함(0.12.0)', x-added-in: '2026-11-18' }
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 100 }, description: '상품명 사본 부분 일치(대소문자 무시, 0.12.0)', x-added-in: '2026-11-18' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/OrderSummary' } }
                  page: { $ref: '_common.yaml#/components/schemas/Page' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /orders/{orderId}:
    get:
      tags: [orders]
      summary: 주문 상세 (스냅샷 + 소유 시스템 확정 결과의 조합, 원천별 asOf 표시)
      description: |
        고객 토큰만(그 밖 403). 남의 주문·확정 전 주문 ID 는 404(존재를 드러내지 않음).
        현재(결제 확정 단계)는 order 원장만 조합한다: 확정 스냅샷(품목·배송·견적 금액)·주문행 수량(originalQty = unfulfilledQty = 주문 수량, 나머지 0)·
        payment{paymentAttemptId, state=APPROVED}. shipments·claims 는 빈 배열, sources 는 order-service 하나(CURRENT).
        quote.firstPurchaseBenefit 는 첫 구매 무료를 실제 적용했으면 CONFIRMED, 아니면 NOT_ELIGIBLE. productName·optionLabel 은 초안 때 뜬 주문 당시 사본(BR-35, 2026-11-02 이전 주문은 비어 있음).
      operationId: getOrder
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /orders/{orderId}/hides:
    post:
      tags: [orders]
      summary: 주문 내역에서 숨기기(고객의 "삭제") — 0.12.0
      description: |
        0.12.0(2026-11-18, 고객 앱 주문 내역 삭제 — 사용자 "A해줘"): 주문을 지우지 않고 **본인 목록에서만 숨긴다**. 고객 토큰만(그 밖 403), 본인 주문(아니면 404 ORDER_NOT_FOUND).
        끝난 주문만(COMPLETED·CANCELLED·EXPIRED) — 진행 중이면 409 ORDER_NOT_FINISHED. 이미 숨겼으면 그대로 200 APPLIED(처음 숨긴 시각 유지). 되돌리기(다시 보이기)는 없다.
        숨긴 주문은 `GET /orders` 에서 빠지고, 상세 `GET /orders/{orderId}` 는 그대로 된다(클레임·환불 화면이 가리킨다). 주문 상태·버전은 바뀌지 않고 사건도 없다.
        200 APPLIED, resultId = orderId, version = 주문 버전(그대로). 같은 Idempotency-Key 는 저장 결과 재생.
      operationId: hideOrder
      x-pmart-user-types: [CUSTOMER]
      x-added-in: '2026-11-18'
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: ORDER_NOT_FINISHED (진행 중인 주문 — 끝난 뒤 숨길 수 있음) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders/{orderId}/reservation-time-changes:
    post:
      tags: [orders]
      summary: 예약배달 시간 변경 (상품준비 진입 전만) → S4
      description: |
        0.10.0(2026-11-16, CP-1 2부 — 결정 2026-11-15 "고객이 원하면 다른 시간대로", 규칙 OMS §4·Commerce §9.4): 본인 주문(아니면 404), 예약배달(아니면 422 NOT_SCHEDULED),
        주문 CONFIRMED(상품준비 시작 뒤면 409 INVALID_STATE), 지금과 다른 시간대(같으면 422 SAME_SLOT), 진행 중인 변경 없음(409 TIME_CHANGE_IN_PROGRESS)이면
        요청을 PENDING 으로 남기고 orchestration S4 사가를 시작한다 → 202(resultId = requestId). **202 는 접수**이지 변경 성공이 아니다 — 결과는 GET …/{requestId}.
        사가가 새 슬롯·작업 여력·LOT 기한을 확인하고 MFC 준비 시작과 경합을 판정한다. 성공하면 주문의 도착 시간대·버전이 바뀌고 `ReservationTimeChanged`,
        실패하면 기존 약속 그대로(REJECTED, reason = 원인 코드 — SLOT 정원 CAPACITY_EXCEEDED·SLOT_NOT_SELECTABLE·LOT_EXPIRY_NOT_MET·PREPARATION_STARTED 등). 새 결제·주소 변경 없음.
      operationId: requestReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newArrivalWindow]
              properties:
                newArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (이미 상품준비 진입) / VERSION_CONFLICT / TIME_CHANGE_IN_PROGRESS
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422': { $ref: '_common.yaml#/components/responses/UnprocessableConfig' }

  /orders/{orderId}/reservation-time-changes/{requestId}:
    get:
      tags: [orders]
      summary: 시간 변경 요청 결과 조회 (PENDING/CONFIRMED/REJECTED/UNKNOWN)
      description: 본인 주문의 요청만(아니면 404). CONFIRMED 면 주문의 도착 시간대가 newArrivalWindow 로 바뀌었다. REJECTED 면 기존 시간 그대로(reason).
      operationId: getReservationTimeChange
      x-pmart-user-types: [CUSTOMER]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  state: { type: string, enum: [PENDING, CONFIRMED, REJECTED, UNKNOWN] }
                  reason: { type: string }
                  previousArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
                  newArrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
                  requestedAt: { type: string, format: date-time }
                  decidedAt: { type: string, format: date-time }
                  newVersion: { type: integer }

  /orders/lookups:
    get:
      tags: [order-lookups]
      summary: 직원용 주문 검색 (0.3.0 — 백오피스 고객센터·라이더 운영)
      x-added-in: '2026-11-15'
      description: |
        2026-11-15 사용자 결정: 직원 백오피스(고객센터·라이더 운영 메뉴)의 주문 찾기는 order-service 가 직접 준다(backoffice-bff 아님).
        직원 토큰(OPERATOR)의 역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 만(그 밖 403). 고객 토큰도 403. order 원장만 읽는다(다른 서비스 호출 없음).
        확정 주문만 나온다(결제 진입 전·확정 전 주문은 없음). 최근 확정 순(confirmedAt 내림차순, 같은 시각은 orderId 내림차순).
        **기간 상한**: orderId·customerId 가 없으면 createdFrom·createdTo 둘 다 필요하고 간격은 31일 이하(아니면 400 VALIDATION_FAILED) — 전체 훑기 방지.
        createdFrom 포함·createdTo 미포함, 기준은 주문 확정 시각. 둘 다 주면 createdFrom < createdTo.
        **receiverPhone** 은 주문 당시 배송지 사본(BR-37)의 수령인 연락처와 숫자만 비교한 **완전 일치**(하이픈 무시). 부분 일치·이름·주소 검색은 없다.
        사본이 없는 주문(2026-11-02 이전)은 연락처로 찾을 수 없다.
        목록의 연락처는 가린다(receiverPhoneMasked, 예 010-****-1234). 전체 값은 상세에서만. 검색 조건(연락처)은 로그에 남기지 않는다.
      operationId: searchOrdersForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: query, schema: { type: string, maxLength: 64 }, description: 주문 ID 완전 일치 }
        - { name: orderNumber, in: query, schema: { type: string, maxLength: 12 }, description: '화면용 주문번호(숫자 8자리, 공백·하이픈 무시) 완전 일치 — 기간 없이 된다(2026-11-16). 8자리가 아니면 400', x-added-in: '2026-11-16' }
        - { name: customerId, in: query, schema: { type: string, maxLength: 64 }, description: 고객 계정 ID(accountId) 완전 일치 }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: mfcId, in: query, schema: { type: string, maxLength: 40 } }
        - { name: receiverPhone, in: query, schema: { type: string, maxLength: 20 }, description: '수령인 연락처 완전 일치(숫자 9~11자리, 하이픈 무시)' }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time }, description: 확정 시각 하한(포함) }
        - { name: createdTo, in: query, schema: { type: string, format: date-time }, description: 확정 시각 상한(미포함) }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 1000, default: 0 }, description: 0부터 }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrderSearchResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /orders/lookups/{orderId}:
    get:
      tags: [order-lookups]
      summary: 직원용 주문 상세 (0.3.0; 0.4.0 부터 배송지 가림 — 원문은 pii-reveals)
      x-added-in: '2026-11-15'
      description: |
        역할 OPERATOR_ADMIN·CS_AGENT·RIDER_OPS 만(그 밖·고객 403).
        **0.4.0(2026-11-15 사용자 "기록 남긴다")**: 주문 당시 배송지 사본은 **가려서** 싣는다(shippingAddressMasked=true, 가림 규칙은 StaffOrderDetail.shippingAddress).
        원문이 필요하면 `POST /orders/lookups/{orderId}/pii-reveals` 에 사유를 적어 요청한다 — 열람 기록(audit-service)이 남은 뒤에만 원문을 준다. 이 조회 자체는 기록하지 않는다.
        order 가 가진 것만: 주문행 수량 누계·금액 구성·결제 시도 ID·이행 확인 필요 기록. 상태 이력·클레임 목록은 order 에 저장돼 있지 않아 싣지 않는다
        (클레임은 claim-service GET /claims?orderId=, 배송은 delivery 쪽 화면에서). 확정 전 주문 ID 는 404.
      operationId: getOrderForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffOrderDetail' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
  /orders/lookups/{orderId}/pii-reveals:
    post:
      tags: [order-lookups]
      summary: 직원용 주문 배송지 원문 열람 — 사유 필수, 열람 기록 남김 (0.4.0)
      x-added-in: '2026-11-15'
      description: |
        2026-11-15 사용자 결정("기록 남긴다", BO-25): 직원 상세의 가린 배송지 원문은 이 요청으로만 본다. 역할은 상세와 같다(OPERATOR_ADMIN·CS_AGENT·RIDER_OPS, 그 밖·고객 403).
        처리: 권한 → 주문·배송지 사본 확인(주문 없음 404 ORDER_NOT_FOUND, 사본 없는 옛 주문 404 SHIPPING_COPY_NOT_FOUND — 기록하지 않음)
        → audit-service `POST /internal/pii-access-logs` 에 **동기로** 기록(행위자·역할·고객 accountId·caseRef ORDER:<orderId>·항목·사유)
        → 기록이 된 뒤에만 원문을 돌려준다. **audit-service 에 닿지 않거나 결과를 모르면 503(DEPENDENCY_UNAVAILABLE·UNKNOWN_RESULT), 원문 없음**(BO-25 §3).
        UNKNOWN_RESULT 는 기록이 됐을 수도 있다 — 같은 Idempotency-Key 로 다시 보내면 같은 기록으로 이어진다.
        멱등: 같은 직원·같은 주문·같은 Idempotency-Key·같은 본문이면 같은 열람 기록(piiAccessLogId)으로 원문을 다시 준다. 같은 키에 다른 사유·항목이면 409 IDEMPOTENCY_CONFLICT.
        원문 응답은 저장·재생하지 않는다(매번 원장에서 읽음). 사유·원문은 로그에 남기지 않는다. 가린 상세 조회(GET)는 기록하지 않는다.
      operationId: revealOrderPiiForStaff
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffPiiRevealRequest' }
      responses:
        '200':
          description: 기록됨 — 요청한 항목만 원문, 나머지는 가린 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffPiiReveal' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '503':
          description: 열람 기록을 남기지 못함(audit-service 미응답·결과 불명) — 원문을 주지 않는다
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /orders/metrics/summary:
    get:
      tags: [order-metrics]
      summary: 기간 주문 요약 — 상태별 주문 수·결제 승인 금액 합 (0.13.0, 대시보드 D2)
      x-added-in: '2026-11-18'
      description: |
        2026-11-18 사용자 결정(O-8, 매출 정의 Q-19 전 대시보드 기준): 직원 토큰(OPERATOR)의 역할 **OPERATOR_ADMIN 만**(그 밖 직원·고객·라이더 403).
        **기준 날짜 = 주문 확정 시각(confirmedAt)의 한국 날짜(Asia/Seoul)** — from 00:00(KST) 이상, to 다음 날 00:00(KST) 미만. from·to 필수, 둘 다 포함.
        from > to 이면 400, 기간이 93일(포함)을 넘으면 400 VALIDATION_FAILED. mfcId 를 주면 그 센터 주문만.
        확정 주문만 센다(확정 전 초안·결제 진입 전은 없음). 상태는 **지금 상태**(확정 뒤 취소된 주문은 CANCELLED 로 센다).
        approvedAmount = 그 주문들의 결제 승인 금액(`approved_amount`) 합(정수 KRW), approvedOrderCount = 그 주문 수 — 지금 상태와 관계없이 확정 때 승인된 금액이다.
        **환불은 빼지 않는다** — 환불 금액은 claim-service `GET /claims/metrics/refunds` 가 따로 준다(순매출을 만들지 않음). order 원장만 읽는다(다른 서비스 호출 없음). 개인정보 없음.
      operationId: getOrderMetricsSummary
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - { name: mfcId, in: query, schema: { type: string, maxLength: 40 }, description: '센터 하나만(없으면 모든 센터)' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderMetricsSummary' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
  /orders/metrics/top-products:
    get:
      tags: [order-metrics]
      summary: 기간 상품(SKU)별 판매 집계 상위 N (0.13.0, 대시보드 D3)
      x-added-in: '2026-11-18'
      description: |
        2026-11-18 사용자 결정(O-8): 권한·기간·기준 날짜·mfcId 는 `/orders/metrics/summary` 와 같다(OPERATOR_ADMIN 만, confirmedAt 한국 날짜, from·to 포함, 93일 이하).
        SKU마다 qty = Σ(주문 수량 − 출고 전 취소 수량), amount = Σ 행마다 (줄 금액 − 할인 분담) × (주문 수량 − 출고 전 취소 수량) ÷ 주문 수량(원 미만 버림, 정수 KRW).
        **"주문 확정 기준"** — 반품·환불은 빼지 않는다. 지금 상태와 관계없이 그 기간에 확정된 주문의 행을 센다(출고 전 취소 수량만 뺀다). qty 가 0 인 SKU(전부 출고 전 취소)는 나오지 않는다.
        amount 내림차순(같으면 qty 내림차순, sku 오름차순), 상위 limit 개(기본 10, 최대 50). productId 는 그 SKU 행의 상품 ID(옛 행에 없으면 null).
      operationId: getTopProductMetrics
      x-pmart-user-types: [OPERATOR]
      parameters:
        - $ref: '#/components/parameters/MetricsFrom'
        - $ref: '#/components/parameters/MetricsTo'
        - { name: mfcId, in: query, schema: { type: string, maxLength: 40 }, description: '센터 하나만(없으면 모든 센터)' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderTopProductMetrics' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }

  # ---------- internal (서비스 토큰) ----------
  /internal/orders/{orderId}/confirmation:
    post:
      tags: [internal]
      summary: '[orchestration→order] 주문 확정 (PG 승인 대사 일치 + 자원 확정 후)'
      operationId: confirmOrder
      description: |
        서비스 토큰만. orderId 는 결제 진입(checkouts) 때 초안에 발급한 ID. 초안 스냅샷(품목·배송·동결 견적)을 주문 원장으로 옮겨 status=CONFIRMED, version=1 로 만들고
        같은 트랜잭션에서 OrderConfirmed(토픽 order.order.v1)를 Outbox 에 쓴다. 주문행 ID 는 `<orderId>-L<n>`(초안 품목 순서, 사가 시작 때 보낸 값과 같음).
        - 200 APPLIED, resultId = orderId, version = 주문 버전. 같은 Idempotency-Key 는 저장 결과 재생. 이미 확정된 주문은 다른 키로 와도 200(사건은 다시 내지 않음).
        - 404 ORDER_NOT_FOUND: 이 orderId 를 가진 초안이 없음(다른 결제 진입으로 바뀐 옛 orderId 포함).
        - 422 AMOUNT_MISMATCH: approvedAmount ≠ 초안 quote.totalAmount. 확정하지 않는다(사가가 대사 대상으로 넘긴다). 기록하지 않으므로 같은 키 재시도도 다시 판정.
        - 409 INVALID_STATE: 같은 초안이 이미 다른 orderId 로 확정됨 / SKU 구성 수를 확인하지 못함. VERSION_CONFLICT: X-Expected-Version ≠ 초안 버전.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentAttemptId, pgTransactionId, approvedAmount, reservationId]
              properties:
                paymentAttemptId: { type: string }
                pgTransactionId: { type: string }
                approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
                reservationId: { type: string }
                capacityHoldId: { type: string }
                slotHoldId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: AMOUNT_MISMATCH → 확정 차단, 대사 대상
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/orders/{orderId}:
    get:
      tags: [internal]
      summary: '[claim→order] 주문 원장 조회 (서비스 토큰) — 클레임 심사·환불 근거'
      description: |
        서비스 토큰만. 고객 조회와 달리 소유자(accountId)·결제 시도·승인액·행별 수량 누계를 돌려준다. 확정 전 주문 ID 는 404.
      operationId: getInternalOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalOrder' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/delivery-destination:
    get:
      tags: [internal]
      summary: '[delivery-dispatch→order] 배송지 (토큰 없는 내부 호출) — 배차 좌표·배송 방식'
      description: |
        배차가 고객 배송지 좌표(MFC → 고객 도로 거리·예상 배달료)와 배송 방식(한집·알뜰·예약)을 읽는다(2026-11-13, delivery DD-1 — 요청 O-4).
        주문 당시 사본(BR-37)의 도로명주소와 지도 핀만 준다 — 수령인·연락처·출입 정보는 주지 않는다(배차에 필요 없음). 도로명주소는 받는 쪽이 좌표로 바꾸는 데만 쓰고 저장·로그하지 않는다.
        사본이 없는 주문(2026-11-02 이전)은 roadAddress null. 확정 전 주문 ID 는 404.
        2026-11-14 고침(0.2.4): 구현이 사본을 읽지 않아 roadAddress 가 늘 null 이던 것.
      x-added-in: '2026-11-13'
      operationId: getOrderDeliveryDestination
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryDestination' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/drop-info:
    get:
      tags: [internal]
      summary: '[delivery-execution→order] 라이더용 전달지 (내부 호출) — 주소·상세·수령인·연락처·출입·요청사항'
      description: |
        픽업한 라이더에게 보여 줄 전달지(클라이언트 BR-24, 요청 O-5 — 2026-11-14 delivery PC 5 가 넣음). 공개 범위(픽업 뒤 ~ 전달 완료 전, 배정된 라이더 본인)는 delivery-execution 이 판정한다 — 이 경로는 게이트웨이에 열지 않는다.
        연락처는 고객 전화번호 그대로(안심번호 없음 — 사용자 결정 2026-11-14). 개인정보 — 받는 쪽은 저장·로그하지 않는다.
        사본이 없는 주문(2026-11-02 이전)·확정 전 주문 ID 는 404.
      x-added-in: '2026-11-14'
      operationId: getOrderDropInfo
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DropInfo' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/line-quantity-changes:
    post:
      tags: [internal]
      summary: '[orchestration/claim→order] 주문행 수량 변경 (결품·출고 전 취소·인계 누계·반품 수량 반영)'
      description: |
        구현 범위는 reason=CANCEL_BEFORE_SHIP(출고 전 취소, 2026-10-31)·SHORTAGE(결품 — 품절 상품만 취소, 2026-11-07 ADR-0045, 같은 수량 규칙·주문 상태 유지) 만. 그 밖의 사유는 422 UNSUPPORTED_ACTION.
        행마다 unfulfilledQty −= qty, cancelledBeforeShipQty += qty(qty > unfulfilledQty 면 409 INVALID_STATE, 아무것도 바꾸지 않음).
        모든 행의 unfulfilledQty·handedOverQty 가 0 이 되면 주문 status=CANCELLED. 같은 트랜잭션에서 행마다 OrderLineQuantityChanged,
        주문에 OrderCancelled(scope FULL/PARTIAL, claimId) 를 Outbox 에 쓴다(토픽 order.order.v1). 같은 Idempotency-Key 는 저장 결과 재생.
      operationId: applyLineQuantityChange
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/ExpectedVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [changes]
              properties:
                reason: { type: string, enum: [SHORTAGE, CANCEL_BEFORE_SHIP, HANDOVER, RETURN, EXCHANGE, RESHIPMENT], description: 'RESHIPMENT(0.9.0, 2026-11-16) — 오배송 재발송: 행마다 미이행 +q·재발송 +q(보낼 수량이 늘어난다, 상태는 그대로). 한도 = 원수량 − 출고 전 취소 − 이미 재발송' }
                sourceRef: { type: string, description: stopRequestId / handoverId / claimId }
                claimId: { type: string, description: 취소·반품 클레임(사건 OrderLineQuantityChanged·OrderCancelled 에 싣는다) }
                cancelReason: { type: string, maxLength: 40, description: '0.14.2 — 클레임 취소 사유(ClaimReason). 있으면 OrderCancelled.cancelReason 에 그대로' }
                changes:
                  type: array
                  items:
                    type: object
                    required: [orderLineId, qty]
                    properties:
                      orderLineId: { type: string }
                      qty: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '409':
          description: 불변식 위반 (원수량 ≠ 미이행 + 인계 누계 + 출고 전 취소 누계)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/accounts/{accountId}/withdrawal-eligibility:
    get:
      tags: [internal]
      summary: '[customer→order] 탈퇴 가능 여부 (미결 주문·불명 결제) — 0.16.0 구현'
      description: |
        (0.16.0, ADR-0077) 그 고객의 주문 중 끝 상태(취소·배송 완료·구매 확정 등 더 바뀌지 않는 상태)가 아닌 것은 ORDER_IN_PROGRESS(ref = orderId),
        결제 결과를 모르는 것은 PAYMENT_UNKNOWN(ref = orderId). 둘 다 없으면 eligible=true. 환불·반품·분쟁은 claim-service 같은 이름의 API 가 본다.
        주문 초안(결제 전, 만료되는 것)은 의무가 아니다. 주문이 없는 고객도 eligible=true.
      operationId: getWithdrawalEligibility
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  eligible: { type: boolean }
                  openObligations:
                    type: array
                    items: { type: object, properties: { kind: { type: string }, ref: { type: string } } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }

  /internal/order-lines/{orderLineId}/delivery-facts:
    get:
      tags: [internal]
      summary: '[review/claim→order] 품목별 실제 배송완료 시각·수량 (리뷰 14일·반품 기한 근거)'
      operationId: getOrderLineDeliveryFacts
      parameters:
        - { name: orderLineId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderLineId: { type: string }
                  deliveredQty: { type: integer }
                  deliveredAt: { type: string, format: date-time }
                  deliveryId: { type: string }
                  evidenceRef: { type: string }

  /internal/customer-commitments:
    get:
      tags: [internal]
      summary: '[replenishment→order] 확정 미이행 고객 약속 C (센터·SKU·기간)'
      operationId: listCustomerCommitments
      parameters:
        - { name: mfcId, in: query, required: true, schema: { type: string } }
        - { name: sku, in: query, schema: { type: string } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        orderId: { type: string }
                        orderLineId: { type: string }
                        sku: { type: string }
                        committedQty: { type: integer }
                        dueAt: { type: string, format: date-time }
                        state: { type: string, enum: [VALID, BLOCKED] }
                        version: { type: integer }

  /orders/lookups/{orderId}/redelivery-destinations:
    post:
      tags: [order-lookups]
      summary: 오배송 다시 배송할 실제 집 주소 기록 (상담원·지원센터, ADR-0065)
      x-added-in: '2026-11-16'
      description: |
        ADR-0065(2026-11-16 사용자 — "상담원이 주소 기록, 시스템이 거리 계산"): 귀책이 고객(주소 오입력 등)이고 고객이 다시 배송을 원할 때만, 상담원이 고객에게 받은 실제 집 주소를 기록한다.
        **일반 주소 변경이 아니다**(BO-20 — 주문 배송지 사본은 그대로). 역할은 직원 주문 상세와 같다(OPERATOR_ADMIN·CS_AGENT·RIDER_OPS, 그 밖 403). 주문 없음 404.
        기록자·사유·시각을 함께 남긴다(입력 기록 — audit-service 는 열람 기록만이라 이 서비스 표에). 주소·사유는 로그에 남기지 않는다.
        돌려준 destinationId 를 case 오배송 기록(misdelivery.redeliveryDestinationId)에 넣는다. 같은 직원·같은 Idempotency-Key 는 같은 ID.
      operationId: recordRedeliveryDestination
      x-pmart-user-types: [OPERATOR]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeliveryDestinationRequest' }
      responses:
        '201':
          description: 기록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeliveryDestination' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/redelivery-destinations/{destinationId}:
    get:
      tags: [internal]
      summary: '[dispatch·execution→order] 다시 배송 실제 집 주소 (ADR-0065)'
      x-added-in: '2026-11-16'
      description: dispatch 가 좌표·200m 판정에, execution 이 다시 배송 라이더 전달지에 쓴다. 주소만(수령인·연락처는 주문 사본 drop-info). 없거나 다른 주문이면 404 REDELIVERY_DESTINATION_NOT_FOUND. 로그 금지.
      operationId: getRedeliveryDestination
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: destinationId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeliveryDestination' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/reservation-time-changes/{requestId}/results:
    post:
      tags: [internal]
      summary: '[orchestration S4→order] 예약 시간 변경 결과 (0.10.0)'
      x-added-in: '2026-11-16'
      description: |
        S4 사가가 끝나면 부른다. CONFIRMED 면 주문 도착 시간대·버전을 바꾸고 `ReservationTimeChanged`(order.order.v1), REJECTED 면 요청만 REJECTED(reason).
        이미 결정된 요청이면 같은 결과(멱등). 주문 행을 먼저 잠근다(고객 요청 트랜잭션이 커밋된 뒤 반영).
      operationId: recordReservationTimeChangeResult
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [CONFIRMED, REJECTED] }
                reason: { type: string, maxLength: 64 }
                sagaId: { type: string }
      responses:
        '200': { $ref: '_common.yaml#/components/responses/Accepted' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/orders/{orderId}/rider-summary:
    get:
      tags: [internal]
      summary: '[delivery→order] 라이더용 주문 요약 — 품목·금액·배송 요청사항 (라이더 앱 요청 §1)'
      x-added-in: '2026-11-16'
      description: |
        delivery-dispatch(제안)·delivery-execution(배송 조회)이 라이더에게 보이려고 읽는다. 사용자 결정 2026-11-16: 품목·수량·금액·요청사항을 수락 전부터.
        고객 이름·연락처·주소·출입 정보는 주지 않는다(그것은 픽업 뒤 drop-info). 없는 주문 404.
      operationId: getRiderOrderSummary
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiderOrderSummary' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  parameters:
    MetricsFrom: { name: from, in: query, required: true, schema: { type: string, format: date }, description: '시작 날짜(Asia/Seoul, 포함) — 주문 확정 시각의 한국 날짜 기준' }
    MetricsTo: { name: to, in: query, required: true, schema: { type: string, format: date }, description: '끝 날짜(Asia/Seoul, 포함). from 이상, from 부터 93일(포함) 이하' }
  schemas:
    RiderOrderSummary:
      type: object
      x-added-in: '2026-11-16'
      description: '라이더에게 보일 주문 요약(라이더 앱 요청 §1 — 사용자 결정 2026-11-16 "앱 요청대로 전부 수락 전부터"). 고객 이름·연락처·주소는 없다'
      required: [orderId, items]
      properties:
        orderNumber: { type: [string, 'null'], pattern: '^[1-9][0-9]{7}$', description: '화면용 주문번호(숫자 8자리, 2026-11-16 — all 요청) — 고객·라이더·MFC·상담원이 같은 번호를 본다. 표시·검색용(시스템 키는 orderId). 전체에서 겹치지 않는 무작위 번호, 다시 쓰지 않는다', x-added-in: '2026-11-16' }
        orderId: { type: string }
        items:
          type: array
          items:
            type: object
            required: [name, qty]
            properties:
              orderLineId: { type: string, description: '(0.11.1) 주문 줄 — 회수 줄(returnLines.orderLineId)과 짝짓기(라이더 앱 2026-11-17)', x-added-in: '2026-11-17' }
              name: { type: string, description: 상품명(주문 당시 사본, 없으면 sku) }
              optionLabel: { type: [string, 'null'] }
              qty: { type: integer, description: 보낼 수량(원수량 − 출고 전 취소 + 재발송) }
              lineAmount: { type: integer, description: 단가 × 보낼 수량(원) }
        itemAmount: { type: integer, description: 상품 금액 합계(원) }
        deliveryNote: { type: [string, 'null'], description: 고객 배송 요청사항 }
    FulfillmentIssue:
      type: object
      properties:
        issueId: { type: string }
        orderId: { type: string }
        mfcId: { type: string }
        reservationId: { type: string }
        sku: { type: string }
        lotId: { type: [string, 'null'] }
        blockedQty: { type: integer }
        reason: { type: string, description: 'mfc-inventory ReservationBlocked 사유 그대로(0.13.1 값 목록 — 클라이언트 code-names C4, 2026-11-18). QUALITY_HOLD 품질 격리(검수·보관 중 이상으로 묶임) · COUNT_LOSS 실사 손실(재고 조사에서 모자람) · SHORT 피킹 결품(선반에 없음) · DAMAGED 피킹 중 파손 · BLOCKED 피킹 차단(선반에서 꺼낼 수 없음). 사건에 사유가 없으면 UNKNOWN. 목록 밖 값이 오면 코드 그대로 보인다' }
        state: { type: string, enum: [OPEN, ACKNOWLEDGED, RESOLVED], description: 'RESOLVED = 피킹 시작 전에 MFC 가 보류분을 다시 잡음(자동, 2026-11-08). 피킹 시작 뒤 남은 보류는 결품 사가가 고객 사전 선택대로 처리' }
        note: { type: [string, 'null'] }
        acknowledgedBy: { type: [string, 'null'] }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        blockedAt: { type: string, format: date-time }
    DeliveryDestination:
      type: object
      description: 배차용 배송지(개인정보 최소 — 수령인·연락처·출입 정보 없음)
      required: [orderId, mfcId, status, deliveryMode, confirmedAt]
      properties:
        orderId: { type: string }
        mfcId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED], description: 한집 / 알뜰 / 예약 }
        confirmedAt: { type: string, format: date-time, description: '주문 확정 시각 — 배송 약속(한집·알뜰 = 확정 + 50분, 사용자 2026-11-13) 계산', x-added-in: '2026-11-13' }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        roadAddress: { type: [string, 'null'], description: 주문 당시 도로명주소 — 좌표 변환에만 쓴다(저장·로그 금지) }
        geo:
          type: [object, 'null']
          description: 고객이 지도 핀으로 맞춘 위치(참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
    DropInfo:
      type: object
      x-added-in: '2026-11-14'
      description: 라이더용 전달지(주문 당시 사본 BR-37 + 배송 요청사항). 개인정보 — 저장·로그 금지
      required: [orderId, roadAddress, detailAddress, receiverPhone]
      properties:
        orderId: { type: string }
        roadAddress: { type: string }
        detailAddress: { type: string }
        postalCode: { type: [string, 'null'] }
        receiverName: { type: [string, 'null'], description: '0.14.0 — 없을 수 있다(고객 프로필 이름도 없을 때)' }
        receiverPhone: { type: string, description: 고객 전화번호(안심번호 아님 — 사용자 결정 2026-11-14) }
        entranceMethod: { type: [string, 'null'], enum: [FREE, PASSWORD, CALL, OTHER, null] }
        entranceNote: { type: [string, 'null'], description: 출입 비밀번호일 수 있다 — 로그 금지 }
        deliveryNote: { type: [string, 'null'], description: 배송 요청사항(주문 때 입력) }
        geo:
          type: [object, 'null']
          description: 전달지 지도 핀(주문 당시 사본 — 라이더 길 안내 참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
    InternalOrder:
      type: object
      description: 서비스 간 주문 원장 사본(claim 심사·환불 근거). 금액은 주문 당시 동결 견적, 승인액은 PG 승인 사실.
      required: [orderId, accountId, status, version, mfcId, paymentAttemptId, approvedAmount, totalAmount, lines, confirmedAt]
      properties:
        orderNumber: { type: [string, 'null'], pattern: '^[1-9][0-9]{7}$', description: '화면용 주문번호(숫자 8자리, 2026-11-16 — all 요청) — 고객·라이더·MFC·상담원이 같은 번호를 본다. 표시·검색용(시스템 키는 orderId). 전체에서 겹치지 않는 무작위 번호, 다시 쓰지 않는다', x-added-in: '2026-11-16' }
        orderId: { type: string }
        accountId: { type: string }
        status: { $ref: '#/components/schemas/OrderStatus' }
        version: { type: integer }
        mfcId: { type: string }
        paymentAttemptId: { type: string }
        approvedAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money' }
        couponDiscount: { $ref: '_common.yaml#/components/schemas/Money', x-added-in: '2026-11-21', description: '0.18.0 — 쿠폰 할인(itemAmount 에 들어 있음 — 결제액 = itemAmount − couponDiscount + deliveryTip + bagFee)' }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        firstPurchase: { type: boolean }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED], description: '0.14.1 — 한집 / 알뜰 / 예약' }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow', description: '0.14.1 — 예약배달 도착 시간대(Asia/Seoul). 없으면 없음' }
        confirmedAt: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            required: [orderLineId, sku, quantity, unitPrice, lineAmount, originalQty, unfulfilledQty, handedOverQty, cancelledBeforeShipQty]
            properties:
              orderLineId: { type: string }
              sku: { type: string }
              quantity: { type: integer }
              unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
              lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
              discountShare: { $ref: '_common.yaml#/components/schemas/Money' }
              originalQty: { type: integer }
              unfulfilledQty: { type: integer }
              handedOverQty: { type: integer }
              cancelledBeforeShipQty: { type: integer }
              productId: { type: [string, 'null'], description: 0.7.0 — 리뷰 자격(review-service) }
              productName: { type: [string, 'null'], description: 0.7.0 — 주문 당시 상품명 사본 }
              deliveredQty: { type: integer, description: '0.7.0 — 전달 완료 수량. 0.7.1(2026-11-16, O-1) DeliveryCompleted 반영으로 채워진다' }
              returnedQty: { type: integer, description: '0.7.0 — 반품 완료 수량. 0.11.2(2026-11-17, O-7) claim 반품 종결(검수·환불 끝 — 받은 만큼만 끝내기 포함)로 채워진다. review 가 "받은 수량 전부 반품" 판정에 쓴다' }
              reshippedQty: { type: integer, description: '0.9.0(2026-11-16) — 오배송 재발송 수량 누계. 불변식 원수량 + 재발송 = 미이행 + 인계 + 출고 전 취소, 보낼 수량 = 원수량 − 출고 전 취소 + 재발송' }
    OrderStatus:
      type: string
      enum: [DRAFT, RESOURCE_PENDING, PAYMENT_PENDING, PAYMENT_UNKNOWN, CONFIRMED, PREPARING, PARTIALLY_HANDED_OVER, IN_DELIVERY, PARTIALLY_DELIVERED, COMPLETED, CANCELLED, EXPIRED]
    ArrivalWindow:
      type: object
      required: [date, start, end]
      properties:
        date: { type: string, format: date, description: Asia/Seoul }
        start: { type: string, example: '13:00' }
        end: { type: string, example: '14:00' }
    CreateDraftRequest:
      type: object
      required: [purchaseIntentId, items, shoppingAddressId, deliveryMode, outOfStockPreference]
      properties:
        purchaseIntentId: { type: string, description: 동일 주문 의도 식별 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [cartItemId, sku, quantity]
            properties:
              cartItemId: { type: string }
              sku: { $ref: '_common.yaml#/components/schemas/Sku' }
              quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        shoppingAddressId: { type: string }
        expectedMfcId: { $ref: '_common.yaml#/components/schemas/CenterId' }
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        outOfStockPreference: { type: string, enum: [CANCEL_OOS_ONLY, CANCEL_ALL] }
        contact: { type: object, deprecated: true, description: '쓰지 않는다(BR-37) — 수령인·연락처는 shoppingAddressId 배송지의 값을 초안 때 사본으로 고정한다', properties: { phoneRef: { type: string } } }
        deliveryNote: { type: string, maxLength: 200 }
        bagOptOut: { type: boolean, description: 봉투 미사용 선택이어도 봉투값 100원은 청구 }
        couponId: { type: string, maxLength: 64, x-added-in: '2026-11-21', description: '0.18.0 — 장바구니 쿠폰 1장(promotion GET /me/coupons 의 AVAILABLE). 바꾸려면 주문서를 다시 만든다' }
    Quote:
      type: object
      properties:
        quoteVersion: { type: integer }
        quoteExpiresAt: { type: string, format: date-time, description: 초안 생성 + 10분 }
        priceVersion: { type: integer }
        itemAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 오퍼·프로모션 후, 쿠폰 전 상품액 }
        baseItemAmount: { $ref: '_common.yaml#/components/schemas/Money', x-added-in: '2026-11-21', description: '0.18.0 — 정가 상품액(기간 할인 전)' }
        promotionDiscount: { $ref: '_common.yaml#/components/schemas/Money', x-added-in: '2026-11-21', description: '0.18.0 — 기간 할인 합' }
        couponDiscount: { $ref: '_common.yaml#/components/schemas/Money', x-added-in: '2026-11-21', description: '0.18.0 — 쿠폰 할인(totalAmount 에서 뺌)' }
        coupon:
          x-added-in: '2026-11-21'
          description: '0.18.0 — 고른 쿠폰 결과(고르지 않았으면 null). 주문 조회는 couponId·applicable 만'
          oneOf:
            - type: 'null'
            - type: object
              required: [couponId, applicable]
              properties:
                couponId: { type: string }
                applicable: { type: boolean }
                reason: { type: [string, 'null'], description: 'NOT_FOUND·NOT_OWNER·EXPIRED·HELD·USED·MIN_ORDER_NOT_MET' }
                name: { type: [string, 'null'] }
        deliveryTip: { $ref: '_common.yaml#/components/schemas/Money' }
        deliveryTipReason: { type: string, enum: [STANDARD, OVER_30000, FIRST_PURCHASE, NONE] }
        bagFee: { $ref: '_common.yaml#/components/schemas/Money', example: 100 }
        totalAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        minOrderSatisfied:
          type: boolean
          description: 최소 주문금액 15000원은 쿠폰 전 상품액 기준
        weightG: { type: integer }
        plannedShipments:
          type: integer
          description: 총 상품중량 10000g 초과 시 2 이상
        minOrderAmount: { $ref: '_common.yaml#/components/schemas/Money', description: 최소 주문 상품액(15,000). 배달팁·봉투값 제외 }
        minOrderShortfall: { $ref: '_common.yaml#/components/schemas/Money', description: '부족액 = max(0, minOrderAmount − itemAmount). "N원 더 담기" 표시용 (BR-14)' }
        deliveryTipBase: { $ref: '_common.yaml#/components/schemas/Money', description: 무료 사유 적용 전 방식별 배달팁(한집 4,000·알뜰/예약 3,000) }
        firstPurchaseBenefit:
          type: string
          enum: [EXPECTED, CHECKING_OTHER_ORDER, CONFIRMED, NOT_ELIGIBLE]
          description: '첫 구매 무료배달 상태(Commerce 8.8, BR-14). 초안 단계는 EXPECTED 까지 — 자격 확보(CONFIRMED)는 결제 진입 때 order 가 한다. 30,000원 이상 무료면 사유는 OVER_30000 이고 이 값은 참고용'
    DraftLine:
      type: object
      description: 서버가 받아들인 품목 (BR-21)
      properties:
        cartItemId: { type: string }
        sku: { $ref: '_common.yaml#/components/schemas/Sku' }
        productId: { type: string }
        productName: { type: [string, 'null'], description: 고객용 상품명 사본(BR-35). 조회 실패면 null }
        optionLabel: { type: [string, 'null'], description: 옵션 라벨 사본. 단일 옵션 상품은 null 일 수 있다 }
        quantity: { $ref: '_common.yaml#/components/schemas/Quantity' }
        discountShare: { $ref: '_common.yaml#/components/schemas/Money', x-added-in: '2026-11-21', description: '0.18.0 — 기간 할인 + 쿠폰 안분' }
        unitPrice: { $ref: '_common.yaml#/components/schemas/Money' }
        lineAmount: { $ref: '_common.yaml#/components/schemas/Money' }
        weightG: { type: integer }
    ShippingAddress:
      type: [object, 'null']
      description: |
        주문 당시 배송지·수령 연락처 사본(BR-37, OMS 153행·Commerce 3294·3351행). 초안을 만들 때 customer-service 의 배송지를 복사해 고정하고,
        주문 확정 때 주문으로 옮긴다. 이후 주소록을 고치거나 지워도 바뀌지 않는다. 본인 주문 조회에만 싣는다(개인정보 — 이벤트·로그에 넣지 않는다).
        2026-11-02 이전에 만든 초안·주문은 사본이 없어 null 이다.
      properties:
        roadAddress: { type: string }
        detailAddress: { type: string }
        postalCode: { type: [string, 'null'] }
        receiverName: { type: [string, 'null'], description: '0.14.0 — 없을 수 있다' }
        receiverPhone: { type: string, description: 본인 조회라 가리지 않는다(주소록 조회와 같음) }
        entranceMethod: { type: [string, 'null'], enum: [FREE, PASSWORD, CALL, OTHER, null] }
        entranceNote: { type: [string, 'null'], description: 출입 비밀번호일 수 있다 — 로그 금지 }
        geo:
          type: [object, 'null']
          description: 고객이 지도 핀으로 맞춘 배달 위치(참고, ADR-0023)
          properties:
            lat: { type: number }
            lng: { type: number }
        capturedAt: { type: string, format: date-time, description: 사본을 뜬 시각(초안 생성) }
    DraftDelivery:
      type: object
      description: 서버가 받아들인 배송 조건 (BR-21). 배송지·수령 연락처는 초안을 만들 때 사본으로 고정하고(shippingAddress) 주문 확정 때 그대로 옮긴다(BR-37)
      properties:
        deliveryMode: { type: string, enum: [SINGLE, BUNDLED, SCHEDULED] }
        arrivalWindow: { $ref: '#/components/schemas/ArrivalWindow' }
        shoppingAddressId: { type: string }
