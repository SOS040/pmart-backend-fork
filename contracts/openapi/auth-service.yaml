openapi: 3.1.0
info:
  title: auth-service
  version: 0.3.0
  description: |
    고객 소셜 로그인(Google ID 토큰 검증, ADR-0019·0055)·인증 상태(AUTH_GUEST→PENDING→(CONSENT)→MEMBER, AUTH_UNKNOWN, AUTH_RESTRICTED 15분 5회→10분), 
    토큰/세션, 유효 RoleGrant·Delegation(교집합, 원권한보다 넓게 불가)·긴급권한, 행위 시점 검증, 보안 기록 90일의 정본. (docs/architecture/service-map.md §8)
    비정본: 권한 부여 승인 흐름(approval BO-01/02), 고객 프로필·동의(customer).
    발행: CustomerAuthenticated, GrantApplied, DelegationStarted/Ended. 구독: ApprovalDecided(BO-01/02), CustomerWithdrawalCompleted(세션·소셜 연결 삭제).
    운영자(직원) 로그인·계정 관리(/auth/operator-logins·/auth/password-changes·/operator-accounts)는 2026-11-13 없앴다 — 직원 토큰은
    employee-auth-service(ADR-0056 7단계). 아래 /internal 권한 경로(grant·행위 시점 검증)는 구현 전(501)이고 정본은 employee-auth-service 로 옮긴다.
    제공자 계정 인증 성공과 회원 생성·구매 자격은 다른 사실이다. 쿠키/CSRF 방식은 [팀 확인 필요].
    0.2.0(2026-11-17, CU-1·BR-20): 필수 약관 동의 단계(AUTH_CONSENT) — 필요한 동의는 customer-service 가 현행 버전으로 판단하고, 토큰이 없는
    고객은 동의를 completions 본문(providerToken + consents)으로 보낸다. auth 가 customer 내부 경로로 넘긴 뒤 토큰을 준다.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - { name: logins, description: 소셜 로그인·원인증 결과 조회 }
  - { name: tokens, description: 토큰 갱신·로그아웃·세션 }
  - { name: internal, description: "행위 시점 검증·grant 반영/조회 (서비스 간, 토큰 없음 — ADR-0026)" }
  - { name: dev, description: "[LAN 시험 전용] 개발용 고객 토큰(0.3.0 — MFC 시뮬레이터 R-21, 설정을 켠 환경에만 경로가 생긴다)" }
  - { name: keys, description: "JWKS 공개키 — 사용자 토큰 검증용 (클러스터 내부 전용, ADR-0011·0026)" }

paths:
  /internal/dev-customer-tokens:
    post:
      tags: [dev]
      summary: '[LAN 시험 전용] 허용 목록의 기존 고객 토큰 (0.3.0 — MFC 시뮬레이터 R-21 실제 주문 넣기)'
      description: |
        2026-11-19 사용자 "응 먼저 회신남기고 제안대로해줘". `pmart.auth.dev-customer-token.enabled=true` 일 때만 경로가 생긴다(운영 설정에는 없다 → 404).
        게이트웨이에 없다 — LAN 포트로 직접(직원 `employee-auth /internal/dev-token-exchange` 와 같은 방식). 새 계정을 만들지 않고
        **허용 목록(`pmart.auth.dev-customer-token.allowed-accounts`)의 기존 고객**에만 잇는다 — 목록 밖 403 `DEV_CUSTOMER_NOT_ALLOWED`,
        auth 에 없는 계정 404 `ACCOUNT_NOT_FOUND`, ACTIVE 가 아니면 403 `ACCOUNT_NOT_AVAILABLE`.
        Idempotency-Key 는 공통 규칙상 받지만 기록하지 않는다(부를 때마다 새 토큰). 짧은 세션(설정 ttl, 기본 15분)을 열고 access token 만 준다(refresh 없음 — 다시 받는다). 세션 행이 발급 기록이다(계정·기기·X-Source-System·시각). 토큰은 로그 금지.
      operationId: issueDevCustomerToken
      security: []
      x-added-in: '2026-11-19'
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId]
              properties:
                accountId: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 발급
          content:
            application/json:
              schema:
                type: object
                required: [accountId, accessToken, accessTokenExpiresAt, sessionId]
                properties:
                  accountId: { type: string }
                  accessToken: { type: string, description: 'typ=CUSTOMER — 로그 금지' }
                  accessTokenExpiresAt: { type: string, format: date-time }
                  sessionId: { type: string }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /auth/guest-sessions:
    post:
      tags: [logins]
      summary: 비회원 세션 시작 (비회원 장바구니용 토큰, typ=GUEST)
      description: |
        기기마다 새 비회원 주체(GST-…)와 토큰 쌍을 발급한다. 개인정보를 받지 않는다. 갱신은 POST /auth/tokens(같은 X-Device-Id),
        종료는 POST /auth/logouts. 비회원 토큰은 장바구니처럼 비회원을 허용한 API 에서만 쓰인다(그 밖은 403).
        토큰을 잃으면 새 세션을 시작한다(이전 비회원 장바구니는 되찾지 않는다). 로그인 후 이관은 cart 병합(X-Guest-Token).
        같은 Idempotency-Key 재전송은 같은 비회원 주체로 새 토큰을 준다.
      operationId: startGuestSession
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '201':
          description: 발급
          content:
            application/json:
              schema:
                type: object
                required: [guestId, tokens]
                properties:
                  guestId: { type: string, description: 비회원 주체(토큰 sub) }
                  tokens: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }

  /auth/social-logins:
    post:
      tags: [logins]
      summary: 소셜 로그인 (제공자 토큰 검증 → 내부 계정 연결/생성 → 상태 판정)
      description: |
        같은 Idempotency-Key 재전송은 원인증 결과를 반환하며 같은 제공자 응답으로 새 계정을 반복 생성하지 않는다. 동일 이메일만으로 계정을 병합하지 않는다.
        필수 동의(0.2.0, 서버 설정 require-consent 가 켜졌을 때 — LAN 은 고객 앱 반영 전까지 꺼짐): 신규 가입이거나, 기존 회원이 필수 약관의 현행 버전에 동의하지 않았으면(약관 버전이 바뀐 뒤 첫 로그인 포함) state=AUTH_CONSENT,
        토큰 없음, `requiredConsents`(반드시 동의)·`optionalConsents`(골라도 되는 항목)를 준다. 고객이 동의 화면에서 고른 뒤
        POST /auth/social-logins/{authRequestId}/completions 로 보내면 AUTH_MEMBER 와 토큰을 준다. 동의 판단에 customer-service 가 응답하지 않으면
        503 DEPENDENCY_UNAVAILABLE(실패 횟수 미가산, 다시 시도).
        사용자 취소·제공자 장애는 실패 횟수에서 제외한다.
      operationId: socialLogin
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, providerToken]
              properties:
                provider: { $ref: '#/components/schemas/Provider' }
                providerToken: { type: string, description: "Google ID 토큰(JWT, aud = 고객용 웹 클라이언트 ID — 고객 앱 serverClientId). 인가 코드는 받지 않는다(ADR-0055). 로그 금지" }
                purpose: { type: string, enum: [GENERAL, CHECKOUT], default: GENERAL, description: 'CHECKOUT이면 장바구니 병합 확인 흐름으로 복귀 — 서버 응답은 GENERAL 과 같고(CART_MERGE_CONFIRM 을 보내지 않음, 0.2.1), 병합 확인은 앱이 한다' }
      responses:
        '200':
          description: 인증 결과 (state별 nextAction 참조. AUTH_MEMBER일 때만 tokens 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401':
          description: PROVIDER_REJECTED (제공자 검증 명확 실패. 실패 횟수 가산)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403':
          description: |
            ACCOUNT_NOT_AVAILABLE — 제공자 인증은 맞지만 연결된 PMart 계정으로 로그인할 수 없음(내부 제한·탈퇴 완료). 토큰을 주지 않는다.
            구매만 막히는 상태(ACCOUNT_NOT_PURCHASABLE, 탈퇴 대기 등)는 로그인은 되고 주문 단계에서 따로 판정한다(BR-27).
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '501':
          description: UNSUPPORTED_ACTION — 아직 지원하지 않는 제공자(지금은 GOOGLE 만). 결과 불명이 아니라 확정 거절
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '423':
          description: AUTH_RESTRICTED (15분 내 5회 실패 → 10분 제한. retryAfterSeconds 포함)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RestrictedError' }
        '503':
          description: PROVIDER_UNAVAILABLE / DEPENDENCY_UNAVAILABLE(동의 확인 불가) / UNKNOWN_RESULT (GET /auth/social-logins/{authRequestId}로 해소. 실패 횟수 미가산)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /auth/social-logins/{authRequestId}:
    get:
      tags: [logins]
      summary: 원인증 결과 조회 (AUTH_UNKNOWN 해소. 같은 기기만)
      operationId: getSocialLogin
      security: []
      parameters:
        - { name: authRequestId, in: path, required: true, schema: { type: string } }
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '403': { $ref: '_common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /auth/social-logins/{authRequestId}/completions:
    post:
      tags: [logins]
      summary: 필수 동의 완료 후 인증 완료 (AUTH_CONSENT → AUTH_MEMBER, CustomerAuthenticated 발행)
      description: |
        AUTH_CONSENT 응답을 받은 같은 기기가 동의 화면에서 고른 값을 보낸다(0.2.0, BR-20 — 토큰이 없으므로 customer `/me/consent-changes` 가 아니라 여기).
        - `providerToken`: 로그인 때 보낸 것과 같은 계정의 Google ID 토큰(같은 것을 다시 보내도 되고 새로 받아도 된다 — 만료되면 401 이니 새로 받는다).
          auth 가 다시 검증해 로그인한 그 계정인지 확인하고, Google 프로필은 동의를 받은 뒤에만 customer-service 로 넘긴다(동의 전에는 저장하지 않는다).
        - `consents`: `requiredConsents` 의 항목은 모두 agreed=true 로, `optionalConsents` 의 항목은 고객이 고른 값(true/false)으로.
          항목 문자열 `TYPE:version` 을 `consentType`·`version` 으로 나눠 보낸다.
        auth 가 customer-service 에 동의를 기록한 뒤 필수 항목이 다 찼으면 AUTH_MEMBER·토큰. 같은 Idempotency-Key 재전송(응답 유실)은 새 토큰을 준다.
        고객이 동의하지 않고 나가면 아무것도 보내지 않는다 — 신규 가입은 계정이 회원이 되지 않은 채 남고, 다음 로그인 때 다시 묻는다.
      operationId: completeSocialLogin
      security: []
      parameters:
        - { name: authRequestId, in: path, required: true, schema: { type: string } }
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [providerToken, consents]
              properties:
                providerToken: { type: string, description: "로그인한 그 계정의 Google ID 토큰(검증·프로필 전달용). 로그 금지" }
                consents:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [consentType, version, agreed]
                    properties:
                      consentType: { type: string, maxLength: 40, description: "customer-service ConsentType(예 TERMS_OF_SERVICE)" }
                      version: { type: string, maxLength: 32 }
                      agreed: { type: boolean }
      responses:
        '200':
          description: AUTH_MEMBER·토큰
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '401':
          description: PROVIDER_REJECTED (Google ID 토큰 검증 실패·만료 — 새로 받아 다시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '403':
          description: FORBIDDEN(다른 기기·로그인한 계정과 다른 Google 계정) / ACCOUNT_NOT_AVAILABLE
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE (AUTH_CONSENT 아님 — 이미 다른 키로 완료 등) / IDEMPOTENCY_CONFLICT
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '422':
          description: |
            REQUIRED_CONSENT_MISSING(필수 항목이 빠졌거나 agreed=false — details 에 빠진 항목) /
            CONSENT_VERSION_OUTDATED(그 사이 약관 버전이 바뀜 — 로그인을 처음부터 다시)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }
        '423':
          description: AUTH_RESTRICTED (이 기기가 제한 중)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/RestrictedError' }
        '503':
          description: PROVIDER_UNAVAILABLE / DEPENDENCY_UNAVAILABLE(customer-service) / UNKNOWN_RESULT — 같은 Idempotency-Key 로 다시
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /auth/tokens:
    post:
      tags: [tokens]
      summary: 토큰 갱신 (refresh token 회전. 재사용 감지 시 세션 폐기)
      operationId: refreshTokens
      security: []
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - { name: X-Device-Id, in: header, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: TOKEN_INVALID / TOKEN_REUSED (세션 폐기됨, 재로그인)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /auth/logouts:
    post:
      tags: [tokens]
      summary: 로그아웃 (세션 종료. 주문·결제는 취소하지 않음, 이관하지 않은 비회원 목록만 복원 대상)
      operationId: logout
      x-pmart-user-types: [CUSTOMER, GUEST, OPERATOR]
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                allDevices: { type: boolean, default: false }
      responses:
        '204': { description: 종료됨 (이미 종료여도 멱등 성공) }

  /auth/sessions/current:
    get:
      tags: [tokens]
      summary: 현재 세션·신원·유효 역할 조회 (토큰 claim의 원천)
      operationId: getCurrentSession
      x-pmart-user-types: [CUSTOMER, GUEST, OPERATOR]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401':
          description: TOKEN_INVALID / SESSION_EXPIRED
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  # ---------- keys (JWKS — 사용자 토큰 검증, ADR-0011). /internal 아래라 게이트웨이로 노출되지 않는다 ----------
  /internal/jwks:
    get:
      tags: [keys]
      summary: "[전 서비스·게이트웨이→auth] 토큰 검증 공개키 (JWK Set, RFC 7517)"
      description: |
        활성 서명키와 교체 중인 이전 키의 공개키를 모두 싣는다. 검증 측은 토큰 헤더 kid 로 키를 고른다.
        리소스 서버 설정 spring.security.oauth2.resourceserver.jwt.jwk-set-uri 가 이 주소를 가리킨다.
      operationId: getJwks
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JwkSet' }

  # ---------- internal (서비스 간, 토큰 없음 — ADR-0026) ----------
  /internal/authorizations:
    post:
      tags: [internal]
      summary: '[전 서비스→auth] 행위 시점 검증 authorize(actor, action, target, centerScope)'
      description: |
        변경 명령마다 호출한다. 역할·센터 범위·대행 기간(Delegation 교집합)·대상 소유권·자기승인 분리를 검증하고 결정을 보안 기록(90일)에 남긴다.
        상태를 바꾸지 않지만 결정은 decisionId로 보존되어 감사·재조회가 가능하다. DENY는 200으로 응답하며 호출 서비스가 403 FORBIDDEN으로 변환한다.
        조회성 API에서는 호출하지 않아도 된다(게이트웨이 토큰 검증으로 충분).
      operationId: authorize
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
        - $ref: '_common.yaml#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationRequest' }
      responses:
        '200':
          description: 결정 (ALLOW / DENY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationDecision' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '503':
          description: DEPENDENCY_UNAVAILABLE (판정 불가. 호출자는 허용으로 해석하지 않는다)
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/authorizations/{decisionId}:
    get:
      tags: [internal]
      summary: '[audit/bff→auth] 행위 검증 결정 재조회'
      operationId: getAuthorizationDecision
      parameters:
        - { name: decisionId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthorizationDecision' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/grant-applications:
    post:
      tags: [internal]
      summary: '[approval→auth] 권한 grant·위임·긴급권한 반영 (BO-01/02 승인 결과 참조)'
      description: |
        승인 단위(approvalId)와 요청 범위가 일치해야 한다. 위임은 원권한보다 넓을 수 없다(DELEGATION_EXCEEDS_GRANTOR). 반영 시 GrantApplied(수신 확인 Receipt) 발행.
      operationId: applyGrant
      parameters:
        - $ref: '_common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_common.yaml#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantApplicationRequest' }
      responses:
        '202': { $ref: '_common.yaml#/components/responses/Accepted' }
        '400': { $ref: '_common.yaml#/components/responses/BadRequest' }
        '409': { $ref: '_common.yaml#/components/responses/Conflict' }
        '422':
          description: APPROVAL_REQUIRED / APPROVAL_SCOPE_MISMATCH / DELEGATION_EXCEEDS_GRANTOR / PRINCIPAL_NOT_FOUND
          content:
            application/problem+json:
              schema: { $ref: '_common.yaml#/components/schemas/ErrorResponse' }

  /internal/grant-applications/{requestId}:
    get:
      tags: [internal]
      summary: grant 반영 결과 조회
      operationId: getGrantApplication
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { $ref: '_common.yaml#/components/schemas/CommandStatus' }
                  grantId: { type: string }
                  approvalId: { type: string }
                  appliedAt: { type: string, format: date-time }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

  /internal/principals/{principalId}/grants:
    get:
      tags: [internal]
      summary: '[approval/bff→auth] 유효 grant·위임 목록 (교집합 계산 전 원본)'
      operationId: listGrants
      parameters:
        - { name: principalId, in: path, required: true, schema: { type: string } }
        - { name: at, in: query, description: 기준 시각. 생략 시 현재, schema: { type: string, format: date-time } }
        - { name: includeExpired, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  principalId: { type: string }
                  grants: { type: array, items: { $ref: '#/components/schemas/Grant' } }
                  delegations: { type: array, items: { $ref: '#/components/schemas/Delegation' } }
                  asOf: { $ref: '_common.yaml#/components/schemas/AsOf' }
        '404': { $ref: '_common.yaml#/components/responses/NotFound' }

components:
  schemas:
    JwkSet:
      type: object
      required: [keys]
      description: RFC 7517 JWK Set. 공개키만(RSA n/e, kid, alg=RS256, use=sig).
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    Provider:
      type: string
      enum: [KAKAO, NAVER, APPLE, GOOGLE]
    AuthState:
      type: string
      description: AUTH_GUEST 비회원 · AUTH_PENDING 제공자 인증 중 · AUTH_CONSENT 필수 동의 대기 · AUTH_MEMBER 이용 가능 · AUTH_RESTRICTED 내부 제한 · AUTH_UNKNOWN 원인증 결과 확인 중
      enum: [AUTH_GUEST, AUTH_PENDING, AUTH_CONSENT, AUTH_MEMBER, AUTH_RESTRICTED, AUTH_UNKNOWN]
    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshTokenExpiresAt: { type: string, format: date-time }
        sessionId: { type: string }
    AuthResult:
      type: object
      required: [authRequestId, state]
      properties:
        authRequestId: { type: string }
        state: { $ref: '#/components/schemas/AuthState' }
        accountId: { type: [string, 'null'], description: 내부 계정. AUTH_MEMBER/AUTH_CONSENT일 때 }
        newAccount: { type: boolean, description: '가입 — 이번 인증으로 계정이 생성됨, 또는 전에 동의 단계에서 나가 아직 회원이 된 적 없는 계정(0.2.0). AUTH_CONSENT 이면서 false 면 기존 회원의 재동의' }
        tokens: { $ref: '#/components/schemas/TokenPair' }
        requiredConsents:
          type: array
          items: { type: string }
          description: 'AUTH_CONSENT일 때 반드시 동의할 항목 `TYPE:version`(예 `TERMS_OF_SERVICE:2026-11-17`, 0.2.0 형식 확정 — BR-20)'
        optionalConsents:
          type: array
          items: { type: string }
          description: 'AUTH_CONSENT일 때 함께 보여 줄 선택 항목 `TYPE:version`(예 `MARKETING:2026-11-17`). 고르지 않아도 된다(0.2.0)'
        nextAction:
          type: string
          enum: [NONE, COMPLETE_CONSENT, QUERY_RESULT, RETRY_AFTER, CART_MERGE_CONFIRM]
          description: |
            (0.2.1, 2026-11-19 — 클라이언트 BR-50) **CART_MERGE_CONFIRM 은 서버가 보내지 않는다** — 로그인 요청에 비회원 정보가 없어 서버는 비회원 장바구니가 있는지 모른다.
            purpose=CHECKOUT 로그인이 끝나면(NONE — 동의가 필요하면 동의를 마친 뒤) **앱이** 로그인 전에 쓰던 비회원 장바구니에 품목이 있는지 보고, 있으면 고객 확인을 받아
            cart-service `POST /carts/{회원 cartId}/merges` 를 부른다. 값은 하위 호환으로 남겨 둔다.
        retryAfterSeconds: { type: integer }
        occurredAt: { type: string, format: date-time }
    RestrictedError:
      allOf:
        - $ref: '_common.yaml#/components/schemas/ErrorResponse'
        - type: object
          properties:
            retryAfterSeconds: { type: integer }
            restrictedUntil: { type: string, format: date-time }
    Session:
      type: object
      properties:
        sessionId: { type: string }
        principalId: { type: string }
        principalType: { type: string, enum: [CUSTOMER, RIDER, OPERATOR, SERVICE, GUEST] }
        accountId: { type: string }
        roles: { type: array, items: { type: string } }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        activeDelegationIds: { type: array, items: { type: string } }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    AuthorizationRequest:
      type: object
      required: [actor, action, target]
      properties:
        actor:
          type: object
          required: [principalId]
          properties:
            principalId: { type: string }
            sessionId: { type: string }
            onBehalfOf: { type: string, description: 대행(Delegation) 사용 시 원권한자 }
        action:
          type: string
          maxLength: 64
          description: 행위 코드. 예 ORDER_CANCEL · PRICE_APPLY · INVENTORY_ADJUST
        target:
          type: object
          required: [type]
          properties:
            type:
              type: string
              description: 대상 종류. 예 ORDER · PRODUCT · APPROVAL
            id: { type: string }
            ownerPrincipalId: { type: string, description: 대상 소유권 검증용 }
            requesterPrincipalId: { type: string, description: 자기승인 분리 검증용 (승인 대상의 발의자) }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        at: { type: string, format: date-time, description: 행위 시점. 생략 시 현재 }
    AuthorizationDecision:
      type: object
      required: [decisionId, decision]
      properties:
        decisionId: { type: string }
        decision: { type: string, enum: [ALLOW, DENY] }
        reasons:
          type: array
          description: DENY 사유 코드
          items: { type: string, enum: [NO_ROLE, OUT_OF_CENTER_SCOPE, DELEGATION_EXPIRED, DELEGATION_SCOPE_EXCEEDED, NOT_OWNER, SELF_APPROVAL, PRINCIPAL_RESTRICTED, SESSION_INVALID] }
        effectiveGrantIds: { type: array, items: { type: string } }
        delegationId: { type: [string, 'null'] }
        decidedAt: { type: string, format: date-time }
        recordId: { type: string, description: 보안 기록 ID (90일 보존) }
    Grant:
      type: object
      properties:
        grantId: { type: string }
        principalId: { type: string }
        role: { type: string }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        actions: { type: array, items: { type: string } }
        kind: { type: string, enum: [ROLE_GRANT, EMERGENCY] }
        approvalId: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        state: { type: string, enum: [ACTIVE, SCHEDULED, EXPIRED, REVOKED] }
    Delegation:
      type: object
      description: 유효 권한 = 위임자 grant ∩ 위임 범위. 원권한보다 넓게 불가.
      properties:
        delegationId: { type: string }
        grantorPrincipalId: { type: string }
        delegatePrincipalId: { type: string }
        grantIds: { type: array, items: { type: string } }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        actions: { type: array, items: { type: string } }
        approvalId: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        state: { type: string, enum: [ACTIVE, SCHEDULED, ENDED] }
    GrantApplicationRequest:
      type: object
      required: [approvalId, kind, principalId]
      properties:
        approvalId: { type: string }
        changeRequestId: { type: string }
        kind: { type: string, enum: [ROLE_GRANT, ROLE_REVOKE, DELEGATION_START, DELEGATION_END, EMERGENCY_GRANT] }
        principalId: { type: string }
        role: { type: string }
        centerScope: { type: array, items: { $ref: '_common.yaml#/components/schemas/CenterId' } }
        actions: { type: array, items: { type: string } }
        grantorPrincipalId: { type: string, description: DELEGATION_*일 때 위임자 }
        targetGrantId: { type: string, description: ROLE_REVOKE / DELEGATION_END 대상 }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
  securitySchemes:
    bearerAuth:
      $ref: '_common.yaml#/components/securitySchemes/bearerAuth'
