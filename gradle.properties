# Gradle 실행 설정 (프로젝트 공통). 비밀정보 금지.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:HeapBaseMinAddress=4g -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8
# HeapBaseMinAddress: Windows JDK 21에서 힙이 4GB 아래(unscaled compressed oops)에 놓이면 C2 컴파일러의 네이티브 malloc이 실패해 데몬이 죽는 문제 회피 (hs_err: arena.cpp Out of Memory)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
# Java Toolchain: 로컬에 JDK 21이 없을 때만 foojay로 다운로드 허용
org.gradle.java.installations.auto-download=true
