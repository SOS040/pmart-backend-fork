<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="100%" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>PMart RAG 고객앱 경로 구성도(계획) — 2026-11-07</title>
  <style>
    .t  { fill: #1f2933; font-size: 13px; }
    .tb { fill: #1f2933; font-size: 14px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 16px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .w  { fill: #a33a3a; font-size: 11.5px; font-weight: 700; }
    .ln { stroke: #52606d; stroke-width: 1.6; fill: none; }
    .dl { stroke: #52606d; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ah { fill: #52606d; }
    .wrap { fill: #2f9e8f; fill-opacity: 0.05; stroke: #2f9e8f; stroke-width: 1.5; }
    .ing  { fill: #c58a32; fill-opacity: 0.07; stroke: #c58a32; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .c  { fill: #ddf3ef; stroke: #2f9e8f; }
    .cd { fill: #ddf3ef; stroke: #2f9e8f; stroke-dasharray: 6 4; }
    .g  { fill: #e3f3e8; stroke: #4c9a68; }
    .p  { fill: #efe7fa; stroke: #8a63c0; }
    .pd { fill: #efe7fa; stroke: #8a63c0; stroke-dasharray: 6 4; }
    .od { fill: #fcefdc; stroke: #c58a32; stroke-dasharray: 6 4; }
    .rd { fill: #fde8e8; stroke: #c25454; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .t, .tb, .th { fill: #e6e9ee; }
      .m  { fill: #a9b4c0; }
      .w  { fill: #f08c8c; }
      .ln, .dl { stroke: #a9b4c0; }
      .ah { fill: #a9b4c0; }
      .wrap { stroke: #5cc4b4; fill: #5cc4b4; }
      .ing  { stroke: #e0a85a; fill: #e0a85a; }
      .c, .cd { fill: #173a35; stroke: #5cc4b4; }
      .g  { fill: #1b3527; stroke: #6cc08c; }
      .p, .pd { fill: #2e2442; stroke: #ab8ae0; }
      .od { fill: #3a2c17; stroke: #e0a85a; }
      .rd { fill: #3d1f1f; stroke: #e07a7a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <text class="tb" x="20" y="26">고객앱 경로 — 계획</text>
  <text class="m" x="20" y="44">실선 = 운영자 경로에서 그대로 쓰는 것</text>
  <text class="m" x="20" y="60">점선 = 새로 만들 것 · 결정 대기</text>
  <text class="m" x="640" y="26">운영자(백오피스) 경로는</text>
  <text class="m" x="640" y="42">2026-11-07-rag-architecture-backoffice.svg</text>

  <!-- 클라이언트·게이트웨이 -->
  <rect class="cd" x="320" y="14" width="260" height="50" rx="9"/>
  <text class="tb" x="450" y="36" text-anchor="middle">고객앱 (Flutter · Android)</text>
  <text class="m" x="450" y="54" text-anchor="middle">고객 토큰 · 비회원 허용 여부 결정 대기</text>
  <path class="ln" d="M450 64V92" marker-end="url(#a)"/>
  <rect class="c" x="320" y="94" width="260" height="50" rx="9"/>
  <text class="tb" x="450" y="116" text-anchor="middle">API Gateway</text>
  <text class="m" x="450" y="134" text-anchor="middle">고객 JWT 검증 · 고객별 요청 제한(수치 결정 대기)</text>
  <path class="ln" d="M450 144V200" marker-end="url(#a)"/>

  <!-- 서비스 -->
  <rect class="wrap" x="20" y="170" width="860" height="560" rx="14"/>
  <text class="th" x="40" y="196">ai-assistant-service — 고객 질문 경로</text>

  <rect class="cd" x="300" y="202" width="300" height="54" rx="8"/>
  <text class="tb" x="450" y="224" text-anchor="middle">고객 질문 API (새 계약)</text>
  <text class="m" x="450" y="243" text-anchor="middle">본인 질문·답변만 조회 · 운영자 API 와 분리</text>
  <text class="m" x="612" y="224">저장 답변을 돌려줄 때마다</text>
  <text class="m" x="612" y="240">본인·권한 재검사(운영자와 같음)</text>
  <path class="ln" d="M380 256V286" marker-end="url(#a)"/>

  <!-- 처리 순서 -->
  <rect class="c" x="40" y="288" width="370" height="420" rx="10"/>
  <text class="tb" x="56" y="312">처리 순서 (운영자와 같은 틀)</text>
  <text class="t" x="56" y="344">① 선점: 요청 해시 · lease</text>
  <text class="t" x="56" y="380">② 의도 분류 — 고객 질문용 규칙</text>
  <text class="m" x="76" y="398">· 정책 질문(반품·배송비·취소 가능 여부) → 검색</text>
  <text class="m" x="76" y="414">· 내 주문·배송·재고 → 실시간 경로</text>
  <text class="m" x="76" y="430">· 범위 밖 → 거절</text>
  <text class="t" x="56" y="462">③ 활성 스냅숏 고정</text>
  <text class="tb" x="56" y="498">④ 검색 — 고객 공개 문서만</text>
  <text class="tb" x="56" y="540">⑤ 생성 — 근거 안에서만 답</text>
  <text class="t" x="56" y="582">⑥ 인용 검사 → 근거 없으면 NO_GROUNDING</text>
  <text class="m" x="76" y="600">고객에게 보일 안내 문구 결정 대기</text>
  <text class="t" x="56" y="634">⑦ 완료 저장</text>
  <text class="m" x="76" y="652">고객 질문 원문 = 개인정보일 수 있음</text>
  <text class="m" x="76" y="668">저장 여부·보존 기간 결정 대기</text>
  <text class="w" x="56" y="696">내부 문서는 SQL 에서 빼고, 프롬프트 지시로 막지 않는다</text>

  <!-- ④ 검색 -->
  <path class="ln" d="M262 493H448" marker-end="url(#a)"/>
  <rect class="c" x="450" y="290" width="410" height="210" rx="10"/>
  <text class="tb" x="466" y="314">Retriever (운영자와 같은 코드)</text>
  <rect class="g" x="466" y="328" width="170" height="74" rx="7"/>
  <text class="tb" x="551" y="352" text-anchor="middle">EmbeddingModel</text>
  <text class="m" x="551" y="370" text-anchor="middle">운영자와 같은 모델</text>
  <text class="m" x="551" y="387" text-anchor="middle">(비교 평가 D3)</text>
  <rect class="g" x="660" y="328" width="184" height="74" rx="7"/>
  <text class="tb" x="752" y="352" text-anchor="middle">pgvector SQL</text>
  <text class="m" x="752" y="370" text-anchor="middle">WHERE 접근 범위 = 고객 공개</text>
  <text class="m" x="752" y="387" text-anchor="middle">+ 현행 문서만</text>
  <path class="ln" d="M551 402V416H752V404" marker-end="url(#a)"/>
  <text class="m" x="560" y="432">벡터를 넣어 한 쿼리로 검색</text>
  <text class="m" x="466" y="460">결과 = 고객 공개 근거 청크만</text>
  <text class="m" x="466" y="478">(운영 매뉴얼·원가·내부 절차는 후보에도 안 들어옴)</text>

  <!-- 검색 결과 → 생성 -->
  <path class="ln" d="M655 500V518" marker-end="url(#a)"/>
  <text class="m" x="664" y="513">근거 청크 + 질문 + 고객용 지침</text>

  <!-- ⑤ 생성 -->
  <path class="ln" d="M262 535H340V572H448" marker-end="url(#a)"/>
  <rect class="c" x="450" y="520" width="410" height="104" rx="10"/>
  <text class="tb" x="466" y="542">AnswerGenerator</text>
  <rect class="pd" x="466" y="552" width="200" height="62" rx="7"/>
  <text class="tb" x="566" y="574" text-anchor="middle">Generative → ChatModel</text>
  <text class="m" x="566" y="592" text-anchor="middle">고객용 모델 결정 대기 (D2)</text>
  <text class="m" x="566" y="606" text-anchor="middle">짧고 쉬운 말투 지침</text>
  <rect class="g" x="680" y="552" width="164" height="62" rx="7"/>
  <text class="tb" x="762" y="574" text-anchor="middle">Extractive</text>
  <text class="m" x="762" y="592" text-anchor="middle">모델 전 기준선</text>
  <text class="m" x="762" y="606" text-anchor="middle">(발췌, 지금 코드)</text>

  <!-- 실시간 경로 -->
  <path class="dl" d="M285 414H430V676H448" marker-end="url(#a)"/>
  <rect class="rd" x="450" y="636" width="410" height="80" rx="10"/>
  <text class="tb" x="466" y="658">실시간 질문 (내 주문·배송·재고)</text>
  <text class="m" x="466" y="678">지금: 문서로 답하지 않고 거절 + 앱 화면 안내(주문 상세)</text>
  <text class="m" x="466" y="696">나중(결정 대기): Tool Calling — 고객 본인 토큰으로</text>
  <text class="m" x="466" y="710">order·delivery API 읽기만. 권한 판단은 그 서비스가 한다</text>

  <!-- DB -->
  <rect class="g" x="200" y="756" width="660" height="78" rx="10"/>
  <text class="tb" x="530" y="780" text-anchor="middle">PostgreSQL + pgvector (운영자와 같은 DB)</text>
  <text class="t" x="530" y="802" text-anchor="middle">doc_chunk — 청크마다 접근 범위(고객 공개 / 내부) · index_snapshot · embedding_cache</text>
  <text class="t" x="530" y="822" text-anchor="middle">policy_answer — 질문자 유형(고객·운영자) 구분 · 고객 질문 보존 기간 결정 대기</text>
  <path class="ln" d="M844 365H870V795H862" marker-end="url(#a)"/>
  <path class="ln" d="M225 708V754" marker-end="url(#a)"/>
  <text class="m" x="234" y="746">①⑦ 답변 기록</text>

  <!-- 적재 -->
  <rect class="ing" x="20" y="860" width="860" height="140" rx="14"/>
  <text class="th" x="40" y="886">고객 공개 문서 적재 — 새로 만들 것</text>
  <rect class="od" x="36" y="900" width="150" height="72" rx="7"/>
  <text class="tb" x="111" y="922" text-anchor="middle">고객 공개 정책 문서</text>
  <text class="m" x="111" y="940" text-anchor="middle">지금 없음 · 누가 쓰고</text>
  <text class="m" x="111" y="956" text-anchor="middle">승인하는지 결정 대기</text>
  <path class="ln" d="M186 936H204" marker-end="url(#a)"/>
  <rect class="od" x="206" y="900" width="150" height="72" rx="7"/>
  <text class="tb" x="281" y="922" text-anchor="middle">manifest 등록</text>
  <text class="m" x="281" y="940" text-anchor="middle">문서마다 접근 범위</text>
  <text class="m" x="281" y="956" text-anchor="middle">"고객 공개" 명시</text>
  <path class="ln" d="M356 936H374" marker-end="url(#a)"/>
  <rect class="od" x="376" y="900" width="150" height="72" rx="7"/>
  <text class="tb" x="451" y="922" text-anchor="middle">청크 + 메타데이터</text>
  <text class="m" x="451" y="940" text-anchor="middle">지위·생애·접근 범위</text>
  <text class="m" x="451" y="956" text-anchor="middle">(운영자와 같은 코드)</text>
  <path class="ln" d="M526 936H544" marker-end="url(#a)"/>
  <rect class="g" x="546" y="900" width="150" height="72" rx="7"/>
  <text class="tb" x="621" y="922" text-anchor="middle">EmbeddingModel</text>
  <text class="m" x="621" y="940" text-anchor="middle">검색과 같은 모델</text>
  <text class="m" x="621" y="956" text-anchor="middle">EmbeddingSpec 기록</text>
  <path class="ln" d="M696 936H714" marker-end="url(#a)"/>
  <rect class="od" x="716" y="900" width="150" height="72" rx="7"/>
  <text class="tb" x="791" y="922" text-anchor="middle">스냅숏</text>
  <text class="m" x="791" y="940" text-anchor="middle">운영자 문서와 함께 /</text>
  <text class="m" x="791" y="956" text-anchor="middle">따로 — 결정 대기</text>
  <path class="ln" d="M791 900V836" marker-end="url(#a)"/>
  <text class="m" x="36" y="990">고객 공개 문서는 고객이 읽어도 되는 문장만 담는다. 업무 원문(내부 규칙·원가·운영 절차)을 그대로 고객 공개로 넣지 않는다.</text>
</svg>
