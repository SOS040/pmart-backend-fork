<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" width="100%" font-family="'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', system-ui, sans-serif">
  <title>PMart RAG backoffice (operator) path — 2026-11-07</title>
  <style>
    .t  { fill: #1f2933; font-size: 13px; }
    .tb { fill: #1f2933; font-size: 14px; font-weight: 700; }
    .th { fill: #1f2933; font-size: 16px; font-weight: 700; }
    .m  { fill: #52606d; font-size: 11.5px; }
    .ln { stroke: #52606d; stroke-width: 1.6; fill: none; }
    .dl { stroke: #52606d; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .ah { fill: #52606d; }
    .wrap { fill: #4a7fc1; fill-opacity: 0.05; stroke: #4a7fc1; stroke-width: 1.5; }
    .ing  { fill: #c58a32; fill-opacity: 0.07; stroke: #c58a32; stroke-width: 1.5; }
    .b  { fill: #e3eefb; stroke: #4a7fc1; }
    .g  { fill: #e3f3e8; stroke: #4c9a68; }
    .p  { fill: #efe7fa; stroke: #8a63c0; }
    .o  { fill: #fcefdc; stroke: #c58a32; }
    .r  { fill: #fde8e8; stroke: #c25454; }
    .pd { fill: #efe7fa; stroke: #8a63c0; stroke-dasharray: 6 4; }
    @media (prefers-color-scheme: dark) {
      .t, .tb, .th { fill: #e6e9ee; }
      .m  { fill: #a9b4c0; }
      .ln, .dl { stroke: #a9b4c0; }
      .ah { fill: #a9b4c0; }
      .wrap { stroke: #6ea1db; fill: #6ea1db; }
      .ing  { stroke: #e0a85a; fill: #e0a85a; }
      .b  { fill: #1d2f45; stroke: #6ea1db; }
      .g  { fill: #1b3527; stroke: #6cc08c; }
      .p, .pd { fill: #2e2442; stroke: #ab8ae0; }
      .o  { fill: #3a2c17; stroke: #e0a85a; }
      .r  { fill: #3d1f1f; stroke: #e07a7a; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="ah" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- 범례 -->
  <text class="m" x="20" y="26">Solid = implemented now · dashed = decision pending</text>
  <text class="m" x="20" y="44">Green boxes = EmbeddingModel</text>

  <!-- 클라이언트·게이트웨이 -->
  <rect class="b" x="320" y="14" width="260" height="50" rx="9"/>
  <text class="tb" x="450" y="36" text-anchor="middle">Backoffice web (operators)</text>
  <text class="m" x="450" y="54" text-anchor="middle">Operator path · customer app: -customer.en.svg</text>
  <path class="ln" d="M450 64V92" marker-end="url(#a)"/>
  <rect class="b" x="320" y="94" width="260" height="50" rx="9"/>
  <text class="tb" x="450" y="116" text-anchor="middle">API Gateway</text>
  <text class="m" x="450" y="134" text-anchor="middle">Operator JWT check · /api/v1/assistant/**</text>
  <path class="ln" d="M450 144V200" marker-end="url(#a)"/>

  <!-- 서비스 -->
  <rect class="wrap" x="20" y="170" width="860" height="480" rx="14"/>
  <text class="th" x="40" y="196">ai-assistant-service (Spring Boot + Spring AI 2.0.2)</text>

  <rect class="b" x="300" y="202" width="300" height="54" rx="8"/>
  <text class="tb" x="450" y="224" text-anchor="middle">AssistantController</text>
  <text class="m" x="450" y="243" text-anchor="middle">POST·GET /assistant/policy-questions · question-history</text>
  <text class="m" x="612" y="224">Every stored answer returned</text>
  <text class="m" x="612" y="240">re-checks current access (stored)</text>
  <path class="ln" d="M380 256V286" marker-end="url(#a)"/>

  <!-- 처리 순서 -->
  <rect class="b" x="40" y="288" width="370" height="330" rx="10"/>
  <text class="tb" x="56" y="312">PolicyQuestionService.ask — steps</text>
  <text class="t" x="56" y="344">① Claim: request hash · lease (PROCESSING)</text>
  <text class="t" x="56" y="382">② Classify → reject realtime / out of scope</text>
  <text class="m" x="76" y="398">REALTIME_DATA_REQUIRED · OUT_OF_SCOPE</text>
  <text class="t" x="56" y="428">③ Pin active snapshot (shared lock)</text>
  <text class="tb" x="56" y="466">④ Retrieve — Retriever</text>
  <text class="tb" x="56" y="512">⑤ Generate — AnswerGenerator</text>
  <text class="t" x="56" y="552">⑥ Verify citations → else NO_GROUNDING</text>
  <text class="t" x="56" y="590">⑦ Complete (only if attempt &amp; PROCESSING)</text>
  <text class="m" x="56" y="608">④⑤ model calls run outside DB transactions</text>

  <!-- ④ 검색 -->
  <path class="ln" d="M232 461H448" marker-end="url(#a)"/>
  <rect class="b" x="450" y="290" width="410" height="200" rx="10"/>
  <text class="tb" x="466" y="314">Retriever (one question → evidence chunks)</text>
  <rect class="g" x="466" y="328" width="170" height="74" rx="7"/>
  <text class="tb" x="551" y="352" text-anchor="middle">EmbeddingModel</text>
  <text class="m" x="551" y="370" text-anchor="middle">question → vector</text>
  <text class="m" x="551" y="387" text-anchor="middle">now: hash, 384 dims</text>
  <rect class="g" x="660" y="328" width="184" height="74" rx="7"/>
  <text class="tb" x="752" y="352" text-anchor="middle">pgvector SQL</text>
  <text class="m" x="752" y="370" text-anchor="middle">WHERE scope &amp; lifecycle first</text>
  <text class="m" x="752" y="387" text-anchor="middle">vector 0.6 + keyword 0.4</text>
  <path class="ln" d="M551 402V416H752V404" marker-end="url(#a)"/>
  <text class="m" x="560" y="432">vector passed into one query</text>
  <text class="m" x="466" y="458">40 candidates → top 5, drop score &lt; 0.18</text>
  <text class="m" x="466" y="476">→ evidence D1..Dn (source, section, scope)</text>

  <!-- 검색 결과 → 생성 -->
  <path class="ln" d="M655 490V518" marker-end="url(#a)"/>
  <text class="m" x="664" y="509">evidence + question + instructions</text>

  <!-- ⑤ 생성 -->
  <path class="ln" d="M286 507H340V560H448" marker-end="url(#a)"/>
  <rect class="b" x="450" y="520" width="410" height="112" rx="10"/>
  <text class="tb" x="466" y="542">AnswerGenerator (one enabled)</text>
  <rect class="g" x="466" y="552" width="170" height="68" rx="7"/>
  <text class="tb" x="551" y="574" text-anchor="middle">Extractive</text>
  <text class="m" x="551" y="592" text-anchor="middle">quotes evidence</text>
  <text class="m" x="551" y="608" text-anchor="middle">now (provider local)</text>
  <rect class="pd" x="660" y="552" width="184" height="68" rx="7"/>
  <text class="tb" x="752" y="574" text-anchor="middle">Generative → ChatModel</text>
  <text class="m" x="752" y="592" text-anchor="middle">model server (Ollama?)</text>
  <text class="m" x="752" y="608" text-anchor="middle">pending D2 · tests: fake</text>

  <!-- DB -->
  <rect class="g" x="200" y="676" width="660" height="78" rx="10"/>
  <text class="tb" x="530" y="700" text-anchor="middle">PostgreSQL + pgvector (LAN host pending)</text>
  <text class="t" x="530" y="722" text-anchor="middle">index_snapshot · index_source_file · doc_chunk(vector · pg_trgm) · embedding_cache</text>
  <text class="t" x="530" y="742" text-anchor="middle">policy_answer (claim · result · citations · per-chunk scope)</text>
  <path class="ln" d="M844 365H870V715H862" marker-end="url(#a)"/>
  <path class="ln" d="M225 618V674" marker-end="url(#a)"/>
  <text class="m" x="234" y="668">①⑦ answer record</text>

  <!-- 적재 -->
  <rect class="ing" x="20" y="790" width="860" height="156" rx="14"/>
  <text class="th" x="40" y="816">Ingestion — ingestKnowledge (manual run, ingest lock)</text>
  <rect class="o" x="36" y="834" width="150" height="80" rx="7"/>
  <text class="tb" x="111" y="858" text-anchor="middle">manifest.yml</text>
  <text class="m" x="111" y="876" text-anchor="middle">listed docs only</text>
  <text class="m" x="111" y="892" text-anchor="middle">(ADRs, business specs)</text>
  <path class="ln" d="M186 874H204" marker-end="url(#a)"/>
  <rect class="o" x="206" y="834" width="150" height="80" rx="7"/>
  <text class="tb" x="281" y="858" text-anchor="middle">Authority/lifecycle</text>
  <text class="m" x="281" y="876" text-anchor="middle">ADR status · supersession</text>
  <text class="m" x="281" y="892" text-anchor="middle">SupersessionResolver</text>
  <path class="ln" d="M356 874H374" marker-end="url(#a)"/>
  <rect class="o" x="376" y="834" width="150" height="80" rx="7"/>
  <text class="tb" x="451" y="858" text-anchor="middle">Chunks + metadata</text>
  <text class="m" x="451" y="876" text-anchor="middle">section · access scope</text>
  <text class="m" x="451" y="892" text-anchor="middle">MarkdownChunker</text>
  <path class="ln" d="M526 874H544" marker-end="url(#a)"/>
  <rect class="g" x="546" y="834" width="150" height="80" rx="7"/>
  <text class="tb" x="621" y="858" text-anchor="middle">EmbeddingModel</text>
  <text class="m" x="621" y="876" text-anchor="middle">same model as retrieval</text>
  <text class="m" x="621" y="892" text-anchor="middle">EmbeddingSpec · cache</text>
  <path class="ln" d="M696 874H714" marker-end="url(#a)"/>
  <rect class="o" x="716" y="834" width="150" height="80" rx="7"/>
  <text class="tb" x="791" y="858" text-anchor="middle">New snapshot</text>
  <text class="m" x="791" y="876" text-anchor="middle">BUILDING → ACTIVE</text>
  <text class="m" x="791" y="892" text-anchor="middle">old → RETIRED (prune)</text>
  <path class="ln" d="M791 834V756" marker-end="url(#a)"/>
  <text class="m" x="36" y="936">A model change means re-ingesting into a new snapshot (migrate first if dimensions change). Vectors of different models never mix.</text>
</svg>
