  <text x="40" y="52" font-size="28" font-weight="700" fill="#111827">PMart MSA Observability 아키텍처</text>
  <text x="40" y="82" class="s">LAN(pc2·pc3·pc4 docker compose) 기준 · ADR-0030·0031 · 지표 / 추적 / 로그 세 갈래를 traceId 하나로 잇는다 · 2026-11-03</text>

  <text x="62" y="142" class="h">Spring Boot 앱 35개 (pc2·pc3·pc4)</text>
  <text x="62" y="164" class="s">업무 서비스 32 + api-gateway · config-server · eureka-server</text>
  <text x="62" y="183" class="s">공통 설정은 libraries/common-observability 한 곳</text>

  <rect x="62" y="200" width="436" height="78" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="78" y="226" class="t" font-weight="700">api-gateway (외부 요청의 첫 span)</text>
  <text x="78" y="248" class="s">traceId 시작 또는 traceparent 이어 받기 · X-Request-Id</text>
  <text x="78" y="268" class="s">오류 응답(RFC 9457 Problem)에 traceId·requestId</text>

  <rect x="62" y="300" width="436" height="120" rx="10" fill="#fff7ed" stroke="#d97706"/>
  <text x="78" y="326" class="t" font-weight="700" fill="#b45309">지표 — Micrometer</text>
  <text x="78" y="350" class="s">/actuator/prometheus (노출: health·info·prometheus·metrics)</text>
  <text x="78" y="372" class="s">HTTP·JVM·Hikari·Kafka observation, application 태그</text>
  <text x="78" y="394" class="s">liveness·readiness probe</text>

  <rect x="62" y="440" width="436" height="130" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="78" y="466" class="t" font-weight="700" fill="#6d28d9">추적 — Micrometer Tracing + OTel bridge</text>
  <text x="78" y="490" class="s">W3C traceparent 전파 (HTTP · Kafka), 샘플링 100%</text>
  <text x="78" y="512" class="s">baggage: correlationId · X-Source-System</text>
  <text x="78" y="534" class="s">RestClient·Gateway 가 다음 서비스로 자식 span 전파</text>
  <text x="78" y="556" class="s">OTel Zipkin exporter</text>

  <rect x="62" y="590" width="436" height="150" rx="10" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="78" y="616" class="t" font-weight="700" fill="#0f766e">로그 — SLF4J + Logback (pmart-logback.xml)</text>
  <text x="78" y="640" class="s">logstash-logback-encoder: JSON 한 줄 → stdout</text>
  <text x="78" y="662" class="s">MDC 자동: traceId · spanId · correlationId · service</text>
  <text x="78" y="684" class="s">마스킹: 전화·이메일·카드번호, password/token/secret 키</text>
  <text x="78" y="706" class="s">local 프로필만 평문</text>
  <text x="78" y="728" class="s">파일로 쓰지 않는다 (Docker 가 json-file 로 남김)</text>

  <rect x="62" y="760" width="436" height="150" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="78" y="786" class="t" font-weight="700" fill="#334155">이벤트 — Outbox · Inbox</text>
  <text x="78" y="810" class="s">업무 변경 + outbox_event 를 한 트랜잭션에</text>
  <text x="78" y="832" class="s">Debezium 이 Kafka 헤더에 traceId · correlationId</text>
  <text x="78" y="854" class="s">→ 구독 서비스에서 같은 trace 로 이어진다</text>
  <text x="78" y="876" class="s">처리 실패 메시지: 서비스별 dead_letter 표 + 재처리 API</text>
  <text x="78" y="898" class="s">(ADR-0030 결정 3)</text>

  <!-- ===== traceId 연결 ===== -->
  <rect x="40" y="960" width="1720" height="170" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="62" y="992" class="h">traceId 하나로 잇기</text>
  <text x="62" y="1022" class="t">① 클라이언트가 받은 오류 응답의 traceId (gateway Problem)  →  ② Kibana 에서 traceId 로 모든 서비스 로그  →  ③ Zipkin 에서 같은 traceId 의 서비스 간 경로·지연</text>
  <text x="62" y="1050" class="t">→  ④ Kafka 를 건너도 헤더로 이어짐 (Outbox → Debezium → 구독 서비스)  →  ⑤ Grafana 에서 그 시각의 오류율·지연·DB 풀 지표</text>
  <text x="62" y="1084" class="s">배치: pc4 = Prometheus · Grafana · Alertmanager · Zipkin · Logstash · Elasticsearch · Kibana · log-janitor   |   모든 PC = Filebeat · node-exporter   |   pc3 = Debezium Connect   |   pc2 = Kafka</text>
  <text x="62" y="1108" class="s">Loki·Fluent Bit·OpenSearch 는 쓰지 않는다 (ADR-0030 의 로그 결정은 ADR-0031 Elastic Stack 으로 대체). 운영(Kubernetes)은 별도 결정.</text>
